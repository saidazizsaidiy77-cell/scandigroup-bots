<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bugungi harakatlar · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Bugungi harakatlar</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div class="card">
  <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
    <div><label>Sanadan</label><input id="fFrom" type="date" onchange="load()"></div>
    <div><label>Sanagacha</label><input id="fTo" type="date" onchange="load()"></div>
    <div style="flex:1;min-width:150px"><label>Tsex</label>
      <select id="fShop" onchange="load()"></select></div>
    <div style="flex:1;min-width:150px"><label>Xodim</label>
      <select id="fWorker" onchange="load()"></select></div>
    <div style="flex:1;min-width:140px"><label>Konveyer &#8470;</label>
      <input id="fConv" placeholder="K26-0041" oninput="deb()"></div>
    <button onclick="today()">Bugun</button>
    <button onclick="exportCsv()" id="btnCsv">Excelga yuklash</button>
  </div>
</div>

<div class="grid g3" id="kpis" style="margin-top:16px"></div>
<div id="body" style="margin-top:16px"></div>

<script>
// ============================================================================
//  NAZORAT LENTASI
//
//  Admin xodimlar kiritgan ma'lumotni shu yerdan ko'radi. 500 qatorli
//  jurnalni har kuni ko'zdan kechirib nazorat qilib bo'lmaydi — takrorlanadigan
//  ish arzon bo'lsagina bajariladi. Bu yerda kun xronologik lenta bo'lib
//  turadi va anomaliya ko'zga tashlanadi: kim umuman kiritmagan, kim o'ttizta
//  birlikni bir daqiqada "o'tkazgan", kim ko'p qaytargan.
//
//  Bo'lim boshlig'i ham kira oladi — lekin unga faqat o'z tsexi ko'rinadi
//  (server: scope_shop_id).
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

let timer = null;
const deb = () => { clearTimeout(timer); timer = setTimeout(load, 350); };

function params() {
  const p = new URLSearchParams();
  if ($('fFrom').value) p.set('from', $('fFrom').value);
  if ($('fTo').value)   p.set('to',   $('fTo').value);
  if ($('fShop').value) p.set('shop_id', $('fShop').value);
  if ($('fWorker').value) p.set('worker_id', $('fWorker').value);
  if ($('fConv').value.trim()) p.set('conveyor_no', $('fConv').value.trim());
  return p.toString();
}

function today() {
  $('fFrom').value = $('fTo').value = isoDay(new Date());
  load();
}

// Vaqt serverdan ISO bo'lib keladi; ko'rsatishda faqat soat:daqiqa kerak.
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const WD = ['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
const MO = ['yanvar','fevral','mart','aprel','may','iyun',
            'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function dayTitle(iso) {
  const d = new Date(iso);
  const t = isoDay(new Date());
  if (isoDay(d) === t) return 'Bugun, ' + d.getDate() + '-' + MO[d.getMonth()];
  return `${d.getDate()}-${MO[d.getMonth()]}, ${WD[d.getDay()]}`;
}

// Bitta qatorning ma'nosi: o'tkazishmi, qabul qilishmi yoki yangi yozuvmi.
// Uchalasi bitta jadvalda yozilgani uchun farqni shu yerda ajratamiz.
function what(m) {
  if (!m.from_section)
    return `<span class="tag">${m.is_opening ? "boshlang'ich qoldiq" : 'yangi konver'}</span>
            <span class="arw">→</span> ${esc(m.section)}`;
  const crossed = m.from_shop_id && m.from_shop_id !== m.shop_id;
  return `${esc(m.from_section)} <span class="arw">→</span> ${esc(m.section)}` +
    (crossed ? ` <span class="tag ok">qabul qildi · ${esc(m.from_shop)}dan</span>` : '');
}

function draw(d) {
  const days = [...new Set(d.moves.map(m => String(m.moved_on).slice(0, 10)))];

  const people = new Map();
  d.moves.forEach(m => people.set(m.worker, (people.get(m.worker) || 0) + 1));
  const defects = d.moves.reduce((n, m) => n + (m.qty_defect || 0), 0);

  $('kpis').innerHTML = `
    <div class="card"><h2>Harakatlar</h2><div class="kpi">${d.moves.length}</div></div>
    <div class="card"><h2>Kiritgan xodimlar</h2><div class="kpi">${people.size}</div></div>
    <div class="card"><h2>Brak</h2><div class="kpi">${defects}<small> dona</small></div></div>`;

  if (!d.moves.length) {
    $('body').innerHTML = `<div class="card"><h2>Yozuv yo'q</h2>
      <p class="muted" style="margin-top:8px">Tanlangan kunda hech kim ma'lumot kiritmagan.</p></div>`;
    return;
  }

  $('body').innerHTML = days.map(day => {
    const rows = d.moves.filter(m => String(m.moved_on).slice(0, 10) === day);
    return `<div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">${esc(dayTitle(day))}</h2>
        <span class="muted" style="font-size:13px">${rows.length} ta yozuv</span>
      </div>
      <table class="feed"><tbody>${rows.map(m => `
        <tr>
          <td>${hhmm(m.moved_at)}</td>
          <td class="who">${esc(m.worker)}<div class="muted"
              style="font-size:12px;font-weight:400">${esc(m.shop)}</div></td>
          <td><b>${esc(m.conveyor_no)}</b>
              <div class="muted" style="font-size:12px">${esc(m.product)}${
                m.qty > 1 ? ' · ' + m.qty + ' dona' : ''}</div></td>
          <td>${what(m)}${m.qty_defect
              ? ` <span class="tag bad">brak ${m.qty_defect}${
                  m.defect_reason ? ' · ' + esc(m.defect_reason) : ''}</span>` : ''}</td>
        </tr>`).join('')}</tbody></table>
    </div>`;
  }).join('');
}

async function load() {
  const d = await App.api('/api/units/feed?' + params());
  const shop = $('fShop'), worker = $('fWorker');
  if (!shop.options.length) {
    shop.innerHTML = `<option value="">Hammasi</option>` +
      d.shops.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    worker.innerHTML = `<option value="">Hammasi</option>` +
      d.workers.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
  }
  draw(d);
}

const exportCsv = () =>
  App.download('/api/units/feed/export?' + params(),
               `harakatlar-${$('fFrom').value || isoDay(new Date())}.csv`);

App.start(async () => {
  $('fFrom').value = $('fTo').value = isoDay(new Date());
  await load();
}, 'production.view');
</script>
</body>
</html>
