<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ishlab chiqarish jurnali · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body class="wide">

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Ishlab chiqarish jurnali</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div class="card">
  <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
    <div style="flex:1;min-width:160px"><label>Zakaz raqami</label>
      <input id="fOrder" placeholder="Z-1024" oninput="deb()"></div>
    <div style="flex:1;min-width:160px"><label>Maxsulot nomi</label>
      <select id="fFason" onchange="load()"></select></div>
    <div style="flex:1;min-width:160px"><label>Tsex</label>
      <select id="fShop" onchange="load()"></select></div>
    <div style="flex:1;min-width:170px"><label>Mijoz nomi</label>
      <select id="fCust" onchange="load()"></select></div>
    <button onclick="clearFilters()">Filtrni tozalash</button>
  </div>
  <div style="margin-top:16px">
    <label>Maxsulot guruhi <span class="muted" style="text-transform:none;
      letter-spacing:0">— keraksizini bosib o'chiring</span></label>
    <div class="row" id="fGroups" style="gap:8px;flex-wrap:wrap"></div>
  </div>
</div>

<div class="grid g3" id="kpis" style="margin-top:16px"></div>

<div class="card" style="margin-top:16px">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="row" style="gap:12px">
      <h2 style="margin:0">Jurnal</h2>
      <span class="muted" id="rowCount" style="font-size:13px"></span>
    </div>
    <div class="row" id="bulkBar"></div>
    <div class="row">
      <button class="primary" id="btnNew" onclick="newUnit()">+ Yangi birlik</button>
      <button onclick="exportCsv()" id="btnCsv">Excelga yuklash</button>
    </div>
  </div>
  <div style="overflow:auto;max-height:72vh">
    <table id="tbl" class="log">
      <thead><tr>
        <th class="k"><input type="checkbox" id="chAll" style="width:auto" onchange="checkAll()">
          <span data-sort="conveyor_no">K&#8470;</span></th>
        <th data-sort="started_on">Bosh sana</th><th data-sort="order_no">Z&#8470;</th>
        <th class="sep" data-sort="product">Maxsulot nomi</th>
        <th data-sort="product_type">Guruhi</th>
        <th data-sort="color">Rang</th><th data-sort="fabric">Mato</th>
        <th class="num" data-sort="qty">Soni</th>
        <th class="sep" data-sort="section">Qayerda</th>
        <th class="sep" data-sort="lak_on">Lak tsehi</th>
        <th data-sort="pack_on">Qadoqlash tsehi</th>
        <th data-sort="fg_on">T/M ombor</th>
        <th class="sep" data-sort="customer_name">Mijoz nomi</th>
        <th class="num" data-sort="unit_price">Narx, $</th>
        <th class="num" data-sort="total_amount">Summa, $</th>
        <th class="sep"></th>
      </tr></thead>
      <tbody id="tB"></tbody>
      <tfoot id="tF"></tfoot>
    </table>
  </div>
</div>

<datalist id="dlColor"></datalist>
<datalist id="dlFabric"></datalist>
<div id="modalRoot"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v) => {
  const x = Number(v) || 0;
  const [i, f] = (Math.abs(x) < 1e15 ? x.toFixed(2) : String(x)).split('.');
  const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return f && f !== '00' ? `${grouped}.${f}` : grouped;
};
const money = v => v == null ? '—' : nf(v);
const MON = ['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const d8 = s => { if (!s) return '—'; const d = new Date(s);
  return d.getDate() + '-' + MON[d.getMonth()]; };
// Sana uch manbadan keladi: fakt (tizim yozgan), reja (tsex boshlig'i
// qo'ygan) va taxmin (marshrut va quvvatdan). Qaysi ekani ko'rinib tursin —
// rejaga va'da beriladi, taxminga esa ehtiyot bo'lib qaraladi.
const dateWithSrc = (s, src, late) => !s ? '<span class="muted">—</span>' :
  `<span class="${late ? 'late' : ''}">${d8(s)}</span>
   <span class="src ${late ? 'late' : src === 'fakt' ? 'fakt' : ''}"
     >${late ? 'kechikdi' : (src || '')}</span>`;
const STATUS = { production:['warn','ishlab chiqarishda'], fg:['ok','T/M omborda'],
                 shipped:['','jo\'natilgan'], cancelled:['bad','bekor'] };

let ref = null, rows = [], customers = [], timer = null;
// Saralash serverda bajariladi: ro'yxat 500 qator bilan cheklangan, faqat
// ko'rinib turganini saralash noto'g'ri javob beradi.
let sort = { col: 'started_on', dir: 'desc' };
const deb = () => { clearTimeout(timer); timer = setTimeout(load, 350); };

async function boot(){
  const [r, c, sg] = await Promise.all([App.api('/api/ref'),
    App.api('/api/units/customers'), App.api('/api/units/suggest')]);
  document.getElementById('dlColor').innerHTML =
    sg.colors.map(v => `<option value="${esc(v)}">`).join('');
  document.getElementById('dlFabric').innerHTML =
    sg.fabrics.map(v => `<option value="${esc(v)}">`).join('');
  ref = r; customers = c.customers;
  // Birlik yaratish huquqi yo'q xodimga tugma ko'rsatilmaydi
  if (!App.can('production.units', 'production.manage')) $('btnNew').remove();
  $('fShop').innerHTML = '<option value="">Barchasi</option>' +
    ref.shops.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('fCust').innerHTML = '<option value="">Barchasi</option>' +
    customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  // Guruh va mahsulot nomi ro'yxati katalogdan chiqadi — jurnalda faqat
  // haqiqatan mavjud bo'lganlari tanlanadi.
  allGroups = [...new Map(ref.products.map(p =>
    [p.group_id, p.group_name])).entries()];
  drawGroups();
  const fasons = [...new Map(ref.products.filter(p => p.fason_id)
    .map(p => [p.fason_id, p.name])).entries()]
    .sort((a, b) => a[1].localeCompare(b[1]));
  $('fFason').innerHTML = '<option value="">Barchasi</option>' +
    fasons.map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('');

  // Sarlavhaga bosilsa o'sha ustun bo'yicha saralanadi, ikkinchi bosishda
  // teskari tartibda.
  for (const th of document.querySelectorAll('#tbl thead [data-sort]')){
    th.classList.add('sortable');
    th.onclick = () => {
      const col = th.dataset.sort;
      sort = { col, dir: sort.col === col && sort.dir === 'desc' ? 'asc' : 'desc' };
      load();
    };
  }
  load();
}

// Filtr va saralash bitta joyda yig'iladi: jurnal ham, Excel fayli ham
// aynan shu so'rovdan chiqadi.
// Zakaz raqami, mahsulot nomi, guruh, tsex va mijoz — zavod jurnalni shu
// besh kesimda qidiradi. API boshqa kesimlarni ham qabul qiladi (holat,
// sana oralig'i, erkin qidiruv), lekin ular sahifada ko'rsatilmaydi: kunda
// ishlatilmaydigan katak faqat panelni og'irlashtiradi.
const FILTERS = ['fOrder', 'fFason', 'fShop', 'fCust'];

// Guruhlar ochilma ro'yxat emas, yoqib-o'chiriladigan tugma: "stuldan
// tashqari hammasi" degan savolga bittalik tanlov javob bermaydi.
// Bo'sh to'plam — hech qanday cheklov yo'q, ya'ni hammasi ko'rinadi.
let allGroups = [], groupSel = new Set();

function drawGroups(){
  $('fGroups').innerHTML = allGroups.map(([id, name]) => {
    const on = !groupSel.size || groupSel.has(id);
    return `<button class="chip${on ? ' on' : ''}" onclick="toggleGroup(${id})"
      >${esc(name)}</button>`;
  }).join('');
}

function toggleGroup(id){
  // "Hammasi" holatidan birinchi bosishda aniq ro'yxatga o'tamiz, shunda
  // bosilgan guruh ro'yxatdan chiqadi — odam aynan shuni kutadi.
  if (!groupSel.size) allGroups.forEach(([g]) => groupSel.add(g));
  if (groupSel.has(id)){
    // Oxirgi guruhni ham o'chirib bo'lmaydi: bo'sh jadval hech kimga
    // kerak emas, va bo'sh to'plam "hammasi" degani.
    if (groupSel.size === 1) return;
    groupSel.delete(id);
  } else {
    groupSel.add(id);
  }
  if (groupSel.size === allGroups.length) groupSel.clear();
  drawGroups();
  load();
}

function params(){
  const p = new URLSearchParams();
  if ($('fOrder').value.trim())  p.set('order_no', $('fOrder').value.trim());
  if ($('fFason').value)         p.set('fason_id', $('fFason').value);
  if (groupSel.size)             p.set('group_ids', [...groupSel].join(','));
  if ($('fShop').value)          p.set('shop_id', $('fShop').value);
  if ($('fCust').value)          p.set('customer_id', $('fCust').value);
  p.set('sort', sort.col);
  p.set('dir', sort.dir);
  return p;
}

function clearFilters(){
  for (const id of FILTERS) $(id).value = '';
  groupSel.clear();
  drawGroups();
  load();
}

async function exportCsv(){
  $('btnCsv').disabled = true;
  try{
    await App.download('/api/units/export?' + params(),
      `jurnal-${new Date().toISOString().slice(0, 10)}.csv`);
  }catch(e){ alert(e.message); }
  finally{ $('btnCsv').disabled = false; }
}

async function load(){
  rows = await App.api('/api/units?' + params());
  // Qaysi ustun bo'yicha saralanganini sarlavhada ko'rsatamiz
  for (const th of document.querySelectorAll('#tbl thead [data-sort]')){
    th.classList.toggle('on', th.dataset.sort === sort.col);
    th.dataset.dir = th.dataset.sort === sort.col ? sort.dir : '';
  }
  render();
}

function render(){
  const inProd = rows.filter(r => r.status === 'production').length;
  const inFg   = rows.filter(r => r.status === 'fg').length;
  const amount = rows.reduce((s, r) => s + Number(r.total_amount || 0), 0);
  const qty    = rows.reduce((s, r) => s + Number(r.qty || 0), 0);
  $('kpis').innerHTML = [
    ['Jami birlik', rows.length, qty + ' dona'],
    ['Ishlab chiqarishda', inProd, 'konveyerda'],
    ['T/M omborda', inFg, 'tayyor'],
    ['Jami summa', '$' + money(amount), 'USD'],
  ].map(([t, v, s]) => `<div class="card"><h2>${t}</h2><div class="kpi">${v}</div>
      <div class="muted" style="font-size:13px">${s}</div></div>`).join('');

  $('tB').innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td class="k">${r.status === 'production'
        ? `<input type="checkbox" class="sel" value="${r.id}" style="width:auto" onchange="bulk()">`
        : '<span class="pad"></span>'}<strong>${esc(r.conveyor_no)}</strong></td>
      <td class="muted">${d8(r.started_on)}</td>
      <td>${r.order_no ? esc(r.order_no) : '<span class="muted">—</span>'}</td>
      <td class="sep">${esc(r.product)}${r.size_label
        ? ` <span class="muted">${esc(r.size_label)}</span>` : ''}</td>
      <td class="muted">${esc(r.product_type)}</td>
      <td>${r.color ? esc(r.color) : '<span class="muted">—</span>'}</td>
      <td>${r.fabric ? esc(r.fabric) : '<span class="muted">—</span>'}</td>
      <td class="num">${r.qty}</td>
      <td class="sep">${r.section
        ? `${esc(r.section)}<div class="muted" style="font-size:11.5px">${esc(r.shop || '')}</div>`
        : '<span class="muted">boshlanmagan</span>'}</td>
      <td class="sep">${dateWithSrc(r.lak_on,  r.lak_src,  r.lak_late)}</td>
      <td>${dateWithSrc(r.pack_on, r.pack_src, r.pack_late)}</td>
      <td>${dateWithSrc(r.fg_on,   r.fg_src,   r.fg_late)}</td>
      <td class="sep">${r.customer_id ? esc(r.customer_name)
            : '<span class="muted">T/M ombor</span>'}</td>
      <td class="num muted">${money(r.unit_price)}</td>
      <td class="num">${r.unit_price == null
        ? '<span class="muted">—</span>'
        : `<strong>${money(r.total_amount)}</strong>`}</td>
      <td class="act sep">
        ${r.status === 'production'
          ? `<button onclick="move(${r.id})">O'tkazish</button>` : ''}
        ${r.section && r.status !== 'shipped'
          ? `<button class="ic" onclick="undo(${r.id})"
               title="Oxirgi o'tkazishni qaytarish">↩</button>` : ''}
        <button class="ic" onclick="edit(${r.id})" title="Tahrirlash">✎</button>
        ${r.status !== 'cancelled'
          ? `<button class="ic" onclick="cancel_(${r.id})" title="Bekor qilish">×</button>` : ''}</td>
    </tr>`).join('')
    : '<tr><td class="muted" colspan="16">Jurnal bo\'sh. Boshlang\'ich qoldiqni kiriting.</td></tr>';

  $('rowCount').textContent = rows.length
    ? (rows.length >= 500
        ? '500 qator ko\'rsatildi — Excel faylida hammasi bor'
        : rows.length + ' qator')
    : '';

  $('tF').innerHTML = rows.length ? `<tr>
    <td colspan="7"></td><td class="num"><strong>${qty}</strong></td>
    <td colspan="6"></td><td class="num"><strong>${money(amount)}</strong></td>
    <td></td></tr>` : '';
  bulk();
}

function checkAll(){
  document.querySelectorAll('.sel').forEach(c => c.checked = $('chAll').checked);
  bulk();
}
function selected(){ return [...document.querySelectorAll('.sel:checked')].map(c => +c.value); }
function bulk(){
  const n = selected().length;
  $('bulkBar').innerHTML = n
    ? `<span class="muted">${n} ta tanlandi</span>
       <button class="primary" onclick="move()">Keyingi bo'limga o'tkazish</button>` : '';
}

// Keyingi bo'limga o'tkazish — marshrutdagi keyingisi avtomatik topiladi
async function move(id){
  const ids = id ? [id] : selected();
  if (!ids.length) return;
  const on = prompt("O'tkazish sanasi (bo'sh qoldirilsa bugun):",
                    new Date().toISOString().slice(0, 10));
  if (on === null) return;
  try{
    const r = await App.api('/api/units/move', { method:'POST', body: JSON.stringify({
      items: ids.map(unit_id => ({ unit_id, moved_on: on || null })) })});
    const toFg = r.moved.filter(m => m.is_exit).length;
    await load();
    alert(`${r.moved.length} ta birlik o'tkazildi` +
      (toFg ? `, shundan ${toFg} tasi T/M omboriga kirdi.` : '.'));
  }catch(e){ alert(e.message); }
}

// ─────────────────────────────────────────────────────────── YANGI BIRLIK
//
//  Kundalik ish: yangi mahsulot konveyerga chiqdi. Ilgari birlik faqat
//  "Boshlang'ich qoldiq" sahifasidan yaratilardi, u esa bir martalik ish
//  uchun — tizim ishga tushgan kundagi holatni kiritish uchun yozilgan.
//
//  Bo'lim majburiy emas: hali konveyerga qo'yilmagan birlik "boshlanmagan"
//  holatda yotadi va o'z vaqtida "O'tkazish" bilan liniyaga chiqadi.
async function newUnit(){
  let no = '';
  try { no = (await App.api('/api/units/next-no')).conveyor_no || ''; } catch {}
  const today = new Date().toISOString().slice(0, 10);
  const fasons = [...new Set(ref.products.filter(p => p.route_template_id).map(p => p.name))];

  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal" style="max-width:560px">
        <div class="row" style="justify-content:space-between;margin-bottom:18px">
          <h1>Yangi birlik</h1><button onclick="close_()">Yopish</button></div>
        <div class="stack">
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Bosh sana</label>
              <input id="nStart" type="date" value="${today}"></div>
            <div style="flex:1"><label>Konveyer raqami</label>
              <input id="nNo" value="${esc(no)}"></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Maxsulot nomi</label>
              <select id="nFason" onchange="nFillGroup()">
                <option value="">— tanlang —</option>
                ${fasons.map(f => `<option>${esc(f)}</option>`).join('')}
              </select></div>
            <div style="flex:1"><label>Maxsulot guruhi</label>
              <select id="nGroup" onchange="nFillSize()"></select></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>O'lcham</label>
              <select id="nSize"></select></div>
            <div style="flex:1"><label>Soni</label>
              <input id="nQty" type="number" min="1" value="1"></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Rang</label>
              <input id="nColor" list="dlColor" placeholder="—"></div>
            <div style="flex:1"><label>Mato</label>
              <input id="nFabric" list="dlFabric" placeholder="—"></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Zakaz raqami</label>
              <input id="nOrder" placeholder="zakaz tushganda"></div>
            <div style="flex:1"><label>Mijoz</label>
              <select id="nCust"><option value="">T/M ombor</option>
                ${customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
              </select></div>
          </div>
          <div><label>Mahsulot narxi, $</label>
            <input id="nPrice" type="number" min="0" placeholder="keyin ham qo'yiladi"></div>
          <p class="muted" style="font-size:13px">Birlik <strong>boshlanmagan</strong>
            holatda yaratiladi. Konveyerga chiqqanda jurnaldan
            "O'tkazish" bilan birinchi bo'limga o'tkaziladi.</p>
          <button class="primary" onclick="saveNew()">Saqlash</button>
        </div>
      </div></div>`;
  nFillGroup();
}

// Guruh bir marta chiqadi, uzunlik esa alohida ustunda — qoldiq
// sahifasidagi bilan bir xil mantiq.
function nFillGroup(){
  const list = ref.products.filter(p => p.route_template_id && p.name === $('nFason').value);
  const groups = [...new Map(list.map(p => [p.group_id, p.group_name])).entries()];
  $('nGroup').innerHTML = groups.length
    ? groups.map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('')
    : '<option value="">—</option>';
  nFillSize();
}

function nFillSize(){
  const list = ref.products.filter(p => p.route_template_id
    && p.name === $('nFason').value && p.group_id === +$('nGroup').value);
  $('nSize').innerHTML = list.length
    ? list.map(p => `<option value="${p.id}">${
        p.size_label ? esc(p.size_label) : '—'}</option>`).join('')
    : '<option value="">—</option>';
  $('nSize').disabled = !list.some(p => p.size_label);
}

async function saveNew(){
  const body = {
    conveyor_no: $('nNo').value.trim(),
    product_id:  +$('nSize').value,
    qty:         Number($('nQty').value) || 1,
    started_on:  $('nStart').value || null,
    order_no:    $('nOrder').value.trim() || null,
    customer_id: $('nCust').value || null,
    unit_price:  $('nPrice').value === '' ? null : $('nPrice').value,
    color:       $('nColor').value.trim() || null,
    fabric:      $('nFabric').value.trim() || null,
  };
  if (!body.product_id) return alert('Mahsulot tanlanmagan');
  try{
    await App.api('/api/units', { method:'POST', body: JSON.stringify(body) });
    close_(); load();
  }catch(e){ alert(e.message); }
}

// Oxirgi o'tkazishni qaytarish — "O'tkazish" bexosdan bosilganda.
// Bekor qilish bunga yaramaydi: u birlikni jurnaldan butunlay chiqaradi.
async function undo(id){
  const r = rows.find(x => x.id === id);
  const joy = r.section ? `${r.section} (${r.shop})` : 'boshlanmagan';
  if (!confirm(`${r.conveyor_no} — oxirgi o'tkazish qaytarilsinmi?\n\n` +
    `Hozir: ${joy}\nQaytarilgach avvalgi bo'limga tushadi.` +
    (r.status === 'fg' ? '\n\nT/M ombor qoldig\'idan ham ayriladi.' : ''))) return;
  try{
    const d = await App.api('/api/units/undo',
      { method:'POST', body: JSON.stringify({ unit_id: id }) });
    await load();
    const u = d.undone[0];
    alert(`${u.conveyor_no} qaytarildi.`);
  }catch(e){ alert(e.message); }
}

// Xato kiritilgan birlikni bekor qilish. O'chirilmaydi — tarix saqlanadi,
// lekin jurnal va hisobotlardan chiqib ketadi.
async function cancel_(id){
  const r = rows.find(x => x.id === id);
  if (!confirm(`${r.conveyor_no} bekor qilinsinmi? Jurnaldan chiqadi, tarix saqlanadi.`)) return;
  try{
    await App.api('/api/units/' + id, { method:'PATCH', body: JSON.stringify({ status:'cancelled' }) });
    load();
  }catch(e){ alert(e.message); }
}

// Zakaz raqami, mijoz, narx, chiqish sanasi — savdo qo'yadi
async function edit(id){
  const r = rows.find(x => x.id === id);
  const hist = await App.api(`/api/units/${id}/history`);
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <h1>${esc(r.conveyor_no)}</h1><button onclick="close_()">Yopish</button></div>
        <p class="muted" style="margin-bottom:20px">${esc(r.product)} · ${esc(r.product_type)} ·
          ${r.qty} dona · <span class="tag ${STATUS[r.status][0]}">${STATUS[r.status][1]}</span></p>
        <div class="stack">
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Zakaz raqami</label>
              <input id="eOrder" value="${esc(r.order_no || '')}" placeholder="zakaz tushganda"></div>
            <div style="flex:1"><label>Mijoz</label>
              <select id="eCust"><option value="">T/M ombor</option>
                ${customers.map(c => `<option value="${c.id}"
                  ${c.id === r.customer_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
              </select></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Yangi mijoz qo'shish</label>
              <input id="eNewCust" placeholder="ism / tashkilot"></div>
            <div style="flex:1"><label>Mahsulot narxi</label>
              <input id="ePrice" type="number" min="0" value="${r.unit_price ?? ''}"></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Rang</label>
              <input id="eColor" list="dlColor" value="${esc(r.color || '')}"></div>
            <div style="flex:1"><label>Mato</label>
              <input id="eFabric" list="dlFabric" value="${esc(r.fabric || '')}"></div>
          </div>
          <!-- Reja sanalari: tsex boshlig'i qo'yadi, topshirish shunga qarab
               nazorat qilinadi. Fakt tizim tomonidan yoziladi va bu yerda
               tahrirlanmaydi — shuning uchun faqat reja ko'rsatiladi. -->
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Lak tsehiga (reja)</label>
              <input id="eLak" type="date" value="${r.lak_planned_on || ''}"
                ${r.lak_src === 'fakt' ? 'disabled' : ''}>
              ${r.lak_src === 'fakt'
                ? `<p class="muted" style="font-size:12px;margin-top:6px">Kirgan: ${d8(r.lak_on)}</p>` : ''}</div>
            <div style="flex:1"><label>Qadoqlash tsehiga (reja)</label>
              <input id="ePack" type="date" value="${r.pack_planned_on || ''}"
                ${r.pack_src === 'fakt' ? 'disabled' : ''}>
              ${r.pack_src === 'fakt'
                ? `<p class="muted" style="font-size:12px;margin-top:6px">Kirgan: ${d8(r.pack_on)}</p>` : ''}</div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>T/M omborga (reja)</label>
              <input id="eFg" type="date" value="${r.fg_planned_on || ''}"
                ${r.fg_src === 'fakt' ? 'disabled' : ''}>
              ${r.fg_src === 'fakt'
                ? `<p class="muted" style="font-size:12px;margin-top:6px">Kirgan: ${d8(r.fg_on)}</p>` : ''}</div>
            <div style="flex:1"><label>Keyingi tsexga o'tkazish rejasi</label>
              <input id="eNext" type="date" value="${r.next_shop_src === 'reja' ? r.next_shop_on : ''}"></div>
          </div>
          <div><label>Mijozga chiqadigan sana</label>
            <input id="eShip" type="date" value="${r.ship_on || ''}"></div>
          <div><label>Izoh</label><input id="eNote" value="${esc(r.note || '')}"></div>
          <button class="primary" onclick="saveEdit(${id})">Saqlash</button>
        </div>

        <h2 style="margin-top:26px">Harakat tarixi</h2>
        ${hist.length ? `<div class="track">${hist.map(h => `
          <div class="node done">
            <div class="row" style="justify-content:space-between">
              <div><strong>${esc(h.section)}</strong>
                <div class="muted" style="font-size:12px">${esc(h.shop)}</div></div>
              <div style="text-align:right"><div>${d8(h.moved_on)}</div>
                <div class="muted" style="font-size:12px">${esc(h.worker || '')}${
                  h.qty_defect > 0 ? ` · ${h.qty_defect} brak` : ''}</div></div>
            </div></div>`).join('')}</div>`
          : '<p class="muted">Harakat yozilmagan</p>'}
      </div></div>`;
}
const close_ = () => { $('modalRoot').innerHTML = ''; };

async function saveEdit(id){
  try{
    let customer_id = $('eCust').value || null;
    const nw = $('eNewCust').value.trim();
    if (nw){
      const c = await App.api('/api/units/customers',
        { method:'POST', body: JSON.stringify({ name: nw }) });
      customer_id = c.id;
      customers = (await App.api('/api/units/customers')).customers;
    }
    await App.api('/api/units/' + id, { method:'PATCH', body: JSON.stringify({
      order_no: $('eOrder').value.trim() || null,
      customer_id,
      unit_price: $('ePrice').value === '' ? null : $('ePrice').value,
      next_shop_planned_on: $('eNext').value || null,
      ship_on: $('eShip').value || null,
      note: $('eNote').value.trim() || null,
      color:  $('eColor').value.trim() || null,
      fabric: $('eFabric').value.trim() || null,
      // Fakt tushgan sana maydoni disabled — qiymat yuborilmaydi
      lak_planned_on:  $('eLak').disabled  ? null : ($('eLak').value  || null),
      pack_planned_on: $('ePack').disabled ? null : ($('ePack').value || null),
      fg_planned_on:   $('eFg').disabled   ? null : ($('eFg').value   || null),
    })});
    close_(); load();
  }catch(e){ alert(e.message); }
}

App.start(boot, 'production.view');
</script>
</body>
</html>
