<style>
/*  Buyurtma oynasi — TO'LIQ EKRAN. Ilgari tor modal edi: qatorlar
    jadvali sig'masdi va maydonlar bir-birining ostiga tushib ketardi.
    Nomi `order-view`: `sheet` style.css da BAND (jadval-kiritish uslubi,
    u yerda kataklar shaffof) va nomi to'qnashsa maydonlar ko'rinmay
    qolardi. */
.order-view{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto}
.order-in{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.order-top{position:sticky;top:0;z-index:2;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:24px}
/*  Maydonlar bir xil kenglikdagi ustunlarda: har katak o'z qatoridan
    boshlanadi va yonidagi bilan TEKIS turadi. Ilgari flex edi va
    mijoz ostidagi balans qatori qo'shnisini pastga surib yuborardi. */
.fields{display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(215px,1fr));align-items:start}
.fields > div{min-width:0}
/*  Katak ostidagi izoh joyi oldindan ajratilgan — matn chiqqanda
    qo'shni maydon sakramaydi. */
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:17px}
/*  Hujjat ko'rinishidagi qiymat: katak emas, matn. Balandligi maydon
    bilan bir xil — qatorlar tekis tursin. */
.val{padding:11px 0;font-size:15px;line-height:1.35}

/*  Qog'ozga: ro'yxat ham, tugmalar ham chiqmaydi — faqat hujjat.
    Hujjatning o'z uslubi `yukxati.css` da: uni ombor mudirining
    sahifasi ham o'qiydi. */
@media print{
  body{padding:0}
  #listCard,.order-top{display:none!important}
  .order-view{position:static;overflow:visible;background:#fff}
  .order-in{max-width:none;padding:0}
}
/*  Bo'limlar kartochkada: fon ustida maydonning o'z foni deyarli
    ko'rinmaydi va katak qayerda tugashi bilinmaydi. */
.order-view .card{margin-bottom:16px}
</style>
<script src="/app.js"></script>
<script src="/yukxati.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Buyurtmalar</h1></div>
  <div class="row"><span id="btnNew"></span><span class="row" id="erpUser"></span></div>
</div>

<div class="card" id="listCard">
  <!-- Telefonda ikkalasi bir qatorga sig'maydi: chiplar surilib ketadi,
       qidiruv esa pastga tushadi. -->
  <div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap;
       margin-bottom:12px">
    <div class="row" id="chips" style="gap:6px;overflow-x:auto;max-width:100%"></div>
    <div class="row" style="gap:8px">
      <!--  ★ MENEJER FILTRI — SAVDO BOSHLIG'I UCHUN. Uning birinchi
            savoli «kim nima yozdi»: menejer ustuni bor edi, lekin uni
            SARALAB bo'lmasdi — o'ttizta qatordan bittasining ishini
            ko'z bilan terib olish kerak edi.
            Faqat o'zinikini ko'radigan xodimda ro'yxat CHIZILMAYDI:
            u yerda baribir bitta ism turardi (izoh: `ownOf`). -->
      <select id="fMgr" onchange="load()" style="max-width:200px" hidden></select>
      <input id="fQ" placeholder="Z№ yoki mijoz" style="max-width:240px" oninput="load()">
      <!--  ★ «CHEGIRMA KUTMOQDA» FILTRI (zavod qarori, 2026-10).
            Menyuda «3 ta buyurtma chegirma tasdig'ini kutmoqda» deb
            turardi, lekin o'sha uchtasini TOPADIGAN yo'l yo'q edi:
            chegirma holat EMAS, ya'ni tab bo'lib turmaydi va
            direktor yuzlab qator orasidan ko'z bilan terib olishi
            kerak bo'lardi — belgi ishni ko'rsatar, lekin unga olib
            bormasdi.
            Tab emas, KATAKCHA: tab bo'lsa qator o'z tabidan boshqa
            nom bilan ko'rinardi (ombor qoldig'idagi «Faqat fakt»
            bilan bir xil idiom).
            Filtr SERVERDA va yig'indiga ham ta'sir qiladi (mijoz va
            menejer filtri bilan bir xil sabab).
            HAMMAGA chiziladi: direktor tasdiqlaydi, menejer esa
            «mening qaysi buyurtmam kutmoqda» degan savolga javob
            oladi — u ham mijozga narx ayta olmay turadi. -->
      <label class="row" style="gap:6px;font-size:13px;white-space:nowrap">
        <input type="checkbox" id="fCheg" onchange="load()"> Chegirma kutmoqda</label>
      <!--  ★ TO'DALAB CHIQARISHGA BERISH. Tugma faqat qator
            BELGILANGANDA chiqadi: doim turgan «0 tasini chiqarishga
            berish» savol qoldirardi. Joyi — belgilash qilinadigan
            jadvalning ustida, ya'ni javob ko'z tushadigan yerda. -->
      <span id="relBar" class="row" style="gap:8px"></span>
      <!--  ★ ESKI XATONI TIZIM O'ZI TOPADI (zavod qarori, 2026-10).
            Qulf bundan KEYINGISINI to'xtatadi, o'tmishda yozilgani
            esa joyida qoladi: qator o'zgargan, bronlar eski
            mahsulotda qolgan. Zavodda yuzlab buyurtma bor va qo'lda
            ko'zdan kechirish ish emas.
            Tugma faqat TUZATADIGAN odamda (`sales.fix`). -->
      <span id="texBar"></span>
    </div>
  </div>
  <!--  Jadval O'Z qutisida aylanadi (`max-height`): sticky faqat SCROLL
        KONTEYNER ichida ishlaydi va sahifaning o'z aylanishida sarlavha
        baribir yuqoriga chiqib ketardi. Qoldiq va Xodimlar ro'yxati
        bilan BIR XIL yechim. -->
  <div class="tbox"><table class="orders">
    <!--  «Bron» ustuni yo'q: u qator sonini takrorlardi va «bron» degan
          ichki tushunchani ro'yxatga olib chiqardi. Buyurtma qay ahvolda
          ekani HOLAT ustunida turadi. -->
    <!--  ★ BELGILASH USTUNI faqat ruxsat beradigan odamga chiziladi
          (izoh: sql/sales.sql). Qolganlarda u bo'sh katak bo'lib
          turardi va nima uchun ekanini hech narsa aytmasdi. -->
    <!--  ★ CHIQQAN KUN — FAKT, raqamning CHAP tarafida (zavod qarori,
          2026-09). Ro'yxatda ikkita sana bor edi va ikkalasi ham
          VA'DA: «Yozilgan» buyurtma qachon olingani, «Muddat» esa
          mijozga aytilgan kun. Mahsulot HAQIQATDA qachon chiqqani
          faqat buyurtmani ochib ko'rilardi — «Chiqib ketdi» tabi esa
          aynan shu savol bilan ochiladi.

          Eng chapda turadi, chunki o'sha tab kunlar bo'yicha
          o'qiladi: qog'oz daftardagidek, avval sana, keyin nima
          chiqqani.

          ★ FAQAT «Chiqib ketdi» TABIDA (zavod qarori, 2026-09).
          Boshlanmagan, ishlab chiqarilmoqda va tayyor buyurtmada bu
          sana YO'Q va bo'lishi ham mumkin emas — mahsulot hali
          zavodda. Ustun hamma tabda tursa uchta tabda butunlay bo'sh
          bo'lib qolardi va «nega to'ldirilmagan» degan savol
          berardi: bo'sh katak javob emas, savol.

          Sarlavha ham, katak ham BITTA shartdan chiqadi (`chiqqan`):
          ikki joyda yozilsa biri ko'rinib, ikkinchisi yo'qolib
          ustunlar siljib ketardi.

          Ko'rinishi yonidagi ikki sana bilan BIR XIL: bitta qatorda
          uchta sana turadi va biri boshqacha yozilsa u xato bo'lib
          o'qilardi. -->
    <!--  ★ SARLAVHA BOSILSA SARALANADI, va saralash SERVERDA: ro'yxat
          500 qator bilan cheklangan, ya'ni klientda tartiblash faqat
          ko'rinib turganini saralardi va «eng katta summa» degan
          savolga 501-buyurtmani hisobga olmagan javob berardi.
          Ombor qoldig'ida teskari va sababi ham teskari — u yerda
          LIMIT yo'q.

          «Qayerda» saralanmaydi: u qator EMAS, bir nechta joyning
          ro'yxati va nimaga qarab tartiblashi noaniq bo'lardi. -->
    <thead><tr><th id="thSel"></th>
      <th id="thShip" hidden data-s="shipped_on">Chiqqan</th>
      <th data-s="order_no">Z&#8470;</th>
      <th data-s="customer_name">Mijoz</th>
      <th data-s="manager_name">Menejer</th>
      <th data-s="ordered_on">Yozilgan</th>
      <th data-s="due_on">Muddat</th>
      <th class="num" data-s="lines">Qator</th>
      <th class="num" data-s="qty">Soni</th>
      <th class="num" data-s="amount">Summa, $</th>
      <!--  «Qayerda» — biriktirilgan konverlar hozir turgan joyi.
            Savdo xodimidan kun bo'yi «mahsulotim qayerda» deb
            so'rashadi; ilgari javob har buyurtmani ochib ko'rilardi. -->
      <th>Qayerda</th><th data-s="holat">Holat</th><th></th></tr></thead>
    <tbody id="tB"></tbody>
  </table></div>
</div>

<div id="modalRoot"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d8 = v => !v ? '—' : (x => `${x.slice(8,10)}.${x.slice(5,7)}.${x.slice(2,4)}`)(String(v).slice(0,10));
const money = (v) => {
  const x = Number(v) || 0;
  const [i, f] = (Math.abs(x) < 1e15 ? x.toFixed(2) : String(x)).split('.');
  const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return f && f !== '00' ? `${g}.${f}` : g;
};

//  ★ HOLATNI SERVER HISOBLAYDI (`holat` ustuni, `modules/sales.js`
//  dagi `HOLAT`). Sahifa faqat NOMINI qo'yadi — tab ham, qatordagi
//  yozuv ham aynan shu bitta ustundan chiqadi.
//
//  Ilgari hisob IKKI joyda edi: sahifa yozuvni o'zi chiqarardi, tab
//  esa serverdagi boshqa shartdan kelardi. Shartlar bir-birining
//  ustiga tushardi va qator o'zi turgan tabdan BOSHQA nom bilan
//  ko'rinardi — «Omborda» tabida «Chernovik» va «Kutmoqda» yozuvli
//  qatorlar aralashib yotardi.
//
//  Holat nomlarida «bron» so'zi yo'q: u ichki mexanizm (konverni
//  qatorga biriktirish), menejer esa buyurtma qay ahvolda ekanini
//  o'qiydi.
const STATUS = {
  //  ★ IKKI HOL, BITTA JAVOB (zavod qarori, 2026-09): konver umuman
  //  biriktirilmagan YOKI biriktirilgan-u tsex uni yo'lga
  //  chiqarmagan. Ikkalasida ham chiqish kuni NOMA'LUM — sana
  //  konverning boshlangan kunidan sanaladi — ya'ni menejer mijozga
  //  sana aytib qo'ymasligi kerak, va savol bitta. Alohida «Yangi»
  //  tab shu sababdan qilinmadi. Ilgari «Chernovik» deb turardi va
  //  noto'g'ri o'qilardi: buyurtma emas, KONVER boshlanmagan.
  draft:     'Boshlanmagan',
  waiting:   'Ishlab chiqarilmoqda',
  reserved:  'Tayyor',
  //  ★ «OMBORGA YUBORILDI» EMAS, «MIJOZGA CHIQARILSIN» (zavod
  //  qarori, 2026-09). Nom OMBORNI emas, MIJOZNI ko'rsatishi kerak:
  //  savdo mahsulot tayyor bo'lgach mijoz bilan gaplashadi, kunini
  //  kelishadi va shundan KEYIN chiqarishga ruxsat beradi. «Omborga
  //  yuborildi» esa ichki ko'chirishdek o'qilardi — go'yo mahsulot
  //  boshqa javonga o'tgandek, holbuki bu MIJOZGA berilishi haqidagi
  //  qaror.
  //
  //  T/M ombor mudiri FAQAT shu holatdagi buyurtmani ko'radi
  //  (`modules/sales.js`, `/ship-list`): qolganlari hali savdoning
  //  qo'lida va ularni chiqarish yolg'on bo'lardi.
  to_ship:   'Mijozga chiqarilsin',
  shipped:   'Chiqib ketdi',
  cancelled: 'Bekor qilingan',
};
//  Tab ro'yxati SHU nomlardan quriladi: ikkinchi ro'yxat yozilsa bir
//  kun birinchisidan ajralib ketardi.
//  Tartib — ISHNING ketma-ketligi bo'yicha: «Tayyor» buyurtma
//  menejerning qo'lida turadi (mijoz bilan kunini kelishmoqda),
//  «Mijozga chiqarilsin» esa undan KEYIN keladi va mudirning ishi
//  bo'lib qoladi. Ilgari teskari edi — «Omborga yuborildi» oldinda
//  turardi, chunki u ombor kunini tuzadigan ro'yxat edi; nom
//  o'zgargach tartib menejer o'qiydigan yo'l bilan bir xil bo'ldi.
const FILTERS = [['', 'Hammasi'], ...['draft', 'waiting', 'reserved',
  'to_ship', 'shipped', 'cancelled'].map(k => [k, STATUS[k]])];

const statusOf = (o) => STATUS[o.holat] || o.holat || o.status;

//  ★ CHEGIRMA — HOLAT EMAS, ikkinchi savol. Buyurtma boshqa hamma
//  jihatdan tayyor bo'lsa ham, direktor qaror qilmaguncha mijozga
//  chiqarilmaydi. Ilgari u holatning O'RNIGA yozilardi va qator o'zi
//  turgan tabdan boshqa nom bilan ko'rinardi; endi yonida alohida
//  belgi bo'lib turadi, ya'ni ikkala javob ham bir vaqtda o'qiladi.
const chegirmaKutmoqda = (o) => o.discount_status === 'pending'
  && o.holat !== 'shipped' && o.holat !== 'cancelled';

//  ★ YUBORILGAN, LEKIN HALI TAYYOR EMAS — bu XATO EMAS, odatiy hol:
//  savdo mudirga OLDINDAN aytadi («bu ketadi, qolganini kutyapmiz»),
//  mudir esa kunini shunga qarab tuzadi. Mahsulot baribir chiqmaydi —
//  to'siq `/ship` da, chiqarishda.
//
//  «Mijozga chiqarilsin» tabida faqat haqiqatan javonda turganlari
//  qoladi (zavod qarori), ya'ni bunday buyurtma o'z joyida —
//  «Boshlanmagan» yoki «Ishlab chiqarilmoqda» da — ko'rinadi.
//  Belgisiz qolsa menejer uni bermaganman deb o'ylardi va ikkinchi
//  marta berishga urinardi. Belgi OGOHLANTIRISH emas, oddiy yozuv.
//
//  ★ BELGI HOLAT NOMI BILAN BIR XIL ATALMAYDI (zavod qarori,
//  2026-09). Ilgari «Mijozga chiqarilsin» deb turardi va «Ishlab
//  chiqarilmoqda» tabidagi qatorda AYNAN holat nomi ko'rinardi —
//  menejer uni buyurtma allaqachon o'sha holatda deb o'qirdi,
//  holbuki mahsulotning bir qismi hali tsexda. Endi belgi ODAM
//  bosgan tugmaning izi bo'lib turadi («Chiqarishga berilgan»),
//  holat esa o'z ustunida qoladi — ikkala javob aralashmaydi.
const yuborilgan = (o) => o.status === 'to_ship' && o.holat !== 'to_ship';

let rows = [], customers = [], managers = [], products = [], dests = [];
//  T/M ombor qoldig'i: turi · mahsulot · rang · mato · bo'sh soni.
//  Qator kataklari shundan quriladi — katalogdan emas.
let stock = [];
//  Zavodda ishlatilgan rang va matolar — zahiraga tanlash uchun.
let palette = { colors: [], fabrics: [] };
let status = '', canWrite = false, canFix = false;
// Ochiq buyurtma: sarlavha, qatorlar va biriktirilgan konverlar.
let cur = null;

async function boot(){
  canWrite = App.can('sales.manage');
  //  ★ CHIQIB KETGANNI FAQAT ADMINISTRATOR TUZATADI (izoh:
  //  modules/sales.js, `fixShipped`). Huquq boshqa hech kimda yo'q,
  //  ya'ni qolganlar uchun yopilgan buyurtma hujjat bo'lib qolaveradi.
  //  Bu KO'RINISH: tekshiruv baribir serverda.
  canFix = App.can('sales.fix');
  //  Tekshiruv TUZATADIGAN odamda: ro'yxat butun zavodning
  //  buyurtmasini ochadi va u administratorniki (`sales.fix`).
  $('texBar').innerHTML = canFix
    ? `<button onclick="texshir()" style="white-space:nowrap"
         title="Qator bilan unga biriktirilgan konver mos kelmaydigan
         buyurtmalarni topadi">\u26a0 Nomuvofiqlar</button>` : '';
  $('btnNew').innerHTML = canWrite
    ? `<button class="primary" onclick="openOrder(null)">Yangi buyurtma</button>` : '';
  const [c, p, d, sg, st] = await Promise.all([
    App.api('/api/units/customers'), App.api('/api/sales/products'),
    App.api('/api/sales/destinations'), App.api('/api/sales/suggest'),
    App.api('/api/sales/stock')]);
  customers = c.customers; managers = c.managers; products = p.rows;
  dests = d.rows; stock = st.rows;
  //  Zavodda umuman yo'q mahsulot ham ro'yxatga tushadi (izoh: SRC).
  //  Qatori SUN'IY: rangi ham, matosi ham yo'q — ular mijoz aytganda
  //  ma'lum bo'ladi va rang ro'yxati bosh() orqali o'zi ochiladi.
  const bor = new Set(stock.map((r) => r.product_id));
  for (const x of products)
    if (!bor.has(x.id))
      stock.push({ product_id: x.id, product: x.name, product_type: x.product_type,
                   color: null, fabric: null, free: 0, src: 'yoq' });
  //  Ro'yxatda faqat savdo xodimlari: filtr «kim yozdi» degan savolga
  //  javob beradi, zavodning hamma xodimi esa unga javob emas.
  if (!App.me()?.scope_own) {
    const savdochi = managers.filter((m) => m.is_sales);
    $('fMgr').hidden = !savdochi.length;
    $('fMgr').innerHTML = '<option value="">Barcha menejer</option>'
      + savdochi.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  }
  //  Zavodda ishlatilgan rang va matolar. Faqat ZAHIRA qatorida
  //  ishlatiladi: uning rangi hali yo'q, mijoz aytgani bo'yicha
  //  bo'yaladi. Qolgan hamma joyda rang konverning o'zidan keladi.
  palette = { colors: sg.colors, fabrics: sg.fabrics };
  //  ★ FILTR MANZILDAN HAM QO'YILADI (`?discount=pending`). Menyudagi
  //  havola buni OLMAYDI va olishi ham kerak emas: u butun
  //  buyurtmalar sahifasi va navbat belgisi unga ilinadi
  //  (`data-page`, `navbatTick`) — havolaga filtr yozilsa menyu
  //  qatori har safar qisqargan ro'yxatni ochardi. Manzil esa
  //  yozib yuboriladi: «mana shu uchtasi» degan havola.
  if (new URLSearchParams(location.search).get('discount') === 'pending')
    $('fCheg').checked = true;
  drawChips();
  await load();
}

//  ★ TAB YONIDA JAMI SUMMA (zavod qarori, 2026-09). Qatorda summa
//  ilgari ham bor edi, lekin menejerning savoli boshqa: «bu tabda
//  jami qancha pul turibdi» — o'ttizta qatorni ko'z bilan qo'shib
//  bo'lmaydi.
//
//  Raqam HAR tabda turadi, faqat tanlanganida emas: aks holda
//  «chiqib ketganida qancha» degan savolga javob olish uchun tabni
//  bosib ko'rish kerak bo'lardi. «Hammasi» — qolganlarining
//  yig'indisi.
//
//  Nol ham YOZILADI: bo'sh raqam «hisoblanmadi» degan savol
//  qoldirardi, nol esa javob — bu tabda buyurtma yo'q.
//  ★ «HAMMASI» DAGI SUMMA — FAQAT ZAVODDA TURGANI (zavod qarori,
//  2026-09): boshlanmagan + ishlab chiqarilmoqda + tayyor + mijozga
//  chiqarilsin. Ilgari u HAMMA holatni qo'shardi va javob ma'nosini
//  yo'qotardi — chiqib ketgani o'tgan savdo (uning puli allaqachon
//  mijozning qarzida), bekor qilingani esa umuman yo'q. Ikkalasi
//  qo'shilgach raqam har oy o'sib borardi va «hozir qancha pullik
//  buyurtma turibdi» degan savolga hech qachon javob bermasdi.
//
//  Ikkala tab ham o'z summasi bilan JOYIDA qoladi: «chiqib ketganida
//  qancha» ham savol, faqat boshqa savol.
const FAOL = ['draft', 'waiting', 'reserved', 'to_ship'];
let jami = [];
const tabSumma = (k) => (k ? [k] : FAOL)
  .reduce((a, x) => a + Number((jami.find((j) => j.holat === x) || {}).amount || 0), 0);

function drawChips(){
  $('chips').innerHTML = FILTERS.map(([k, name]) =>
    `<button class="${k === status ? 'primary' : ''}" onclick="setStatus('${k}')"
      style="text-align:left;line-height:1.25"
      ><div>${esc(name)}</div><div style="font-size:11px;opacity:.7"
        >${money(tabSumma(k))} $${k ? '' : ' · zavodda'}</div></button>`)
    .join('');
}
function setStatus(k){ status = k; drawChips(); load(); }

//  Ro'yxatdagi «Qayerda»: konverlar joyi bo'yicha guruhlangan holda
//  serverdan keladi (`places`), omborda turgani birinchi. Tsex nomi
//  ikkinchi qatorda — ro'yxat tor va bo'lim bilan tsex bitta qatorga
//  sig'masdi.
//
//  Ikkitadan ko'p joy bo'lsa qolgani «+N» bo'lib yig'iladi: buyurtma
//  ochilganda hammasi ko'rinadi («Konverlar qayerda»).
//
//  Konver biriktirilmagan bo'lsa katak BO'SH qoladi: «Yangi» holati buni
//  allaqachon aytadi va ikkinchi marta yozish ustunni shovqinga
//  to'ldirardi.
//  ★ «BOSHLANMAGAN» HAR DOIM KO'RINADI. Ustunga ikkita joy sig'adi,
//  qolgani «+N» bo'lib yig'iladi — va aynan boshlanmagan qator o'sha
//  «+N» ichida qolib ketardi: buyurtma «Boshlanmagan» tabida turar,
//  lekin ustunda T/M ombor va tsexdagi bo'lim ko'rinib, SABABI
//  ko'rinmasdi («hammasi boshlangan-ku, nega bu yerda?»).
//
//  Server uni omborning orqasidan saralaydi, ya'ni odatda o'zi
//  ikkitalikka tushadi; bu yerda esa KAFOLAT — omborlar ko'p bo'lsa
//  ham u ikkinchi o'ringa ko'chiriladi. Rangi ham boshqa: u javob,
//  oddiy joy emas.
function joylar(o) {
  const list = o.places || [];
  if (!list.length) return '';
  let ko = list.slice(0, 2);
  const bosh = list.find((x) => x.boshlanmagan);
  if (bosh && !ko.includes(bosh)) ko = [ko[0], bosh];
  const chiz = ko.map((x) => `<div><span class="tag${
    x.omborda ? ' ok' : x.boshlanmagan ? ' warn' : ''}" style="font-size:11px">${esc(
      x.warehouse_code === 'TM' ? 'T/M ombor' : x.joy)}</span>
    <span class="muted" style="font-size:11px">${x.qty} ta</span>${x.shop
      ? `<div class="muted" style="font-size:11px">${esc(x.shop)}</div>` : ''}</div>`);
  if (list.length > ko.length)
    chiz.push(`<div class="muted" style="font-size:11px">+${list.length - ko.length}</div>`);
  return chiz.join('');
}

//  ★ YO'NALISHNI USTUNNING TURI HAL QILADI (ombor qoldig'i bilan bir
//  xil qoida): RAQAM va SANADA birinchi bosish kattadan kichikka —
//  savol «qaysi biri ko'p» yoki «oxirgi qaysi kuni», va eng kichik
//  qatorni tepaga chiqarish javobni ikkinchi bosishga surardi;
//  MATNDA A→Z. Ikkinchi bosish teskariga o'giradi.
const MATN = ['order_no', 'customer_name', 'manager_name', 'holat'];
let sort = '', sortDir = '';

function sortBos(ust) {
  if (!ust) return;
  sortDir = sort === ust
    ? (sortDir === 'asc' ? 'desc' : 'asc')
    : (MATN.includes(ust) ? 'asc' : 'desc');
  sort = ust;
  load();
}

//  Belgi FAQAT tanlangan ustunda: har sarlavhada strelka tursa
//  qaysi biri bo'yicha saralanganini topish uchun ko'z bilan qidirish
//  kerak bo'lardi.
//  Hodisa BITTA joyda — `thead` da: har sarlavhaga alohida
//  `onclick` yozilsa qayta chizilgandan keyin eskilari osilib
//  qolardi (panel grafiklaridagi bilan bir xil qoida).
let sortUlangan = false;
function sortUla() {
  if (sortUlangan) return;
  const head = $('tB')?.closest('table')?.querySelector('thead');
  if (!head) return;
  head.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-s]');
    if (th) sortBos(th.dataset.s);
  });
  sortUlangan = true;
}

function sortChiz() {
  document.querySelectorAll('#tB')[0]?.closest('table')
    ?.querySelectorAll('thead th[data-s]').forEach((th) => {
      th.style.cursor = 'pointer';
      th.title = 'Saralash';
      const ok = th.dataset.s === sort;
      th.innerHTML = th.innerHTML.replace(/\s*[\u2191\u2193]$/, '')
        + (ok ? (sortDir === 'asc' ? ' \u2191' : ' \u2193') : '');
    });
}

async function load(){
  const q = new URLSearchParams();
  if (status) q.set('status', status);
  if (sort) { q.set('sort', sort); q.set('dir', sortDir); }
  if ($('fQ').value.trim()) q.set('q', $('fQ').value.trim());
  if ($('fMgr') && $('fMgr').value) q.set('manager_id', $('fMgr').value);
  if ($('fCheg') && $('fCheg').checked) q.set('discount', 'pending');
  const javob = await App.api('/api/sales/orders?' + q);
  rows = javob.rows;
  //  Jami SERVERDAN keladi (izoh: modules/sales.js): ro'yxat 500
  //  qator bilan cheklangan, ya'ni bu yerda qo'shilsa yig'indi
  //  501-buyurtmadan keyin jimgina kamayib borardi.
  jami = javob.jami || [];
  drawChips();

  //  Sarlavhadagi bo'sh katak ham faqat ruxsatlida: qolganlarda u
  //  nima uchun turgani tushunarsiz bo'lardi.
  if ($('thSel')) $('thSel').hidden = !relOk();
  //  ★ «Chiqqan» ustuni FAQAT «Chiqib ketdi» tabida (izoh: yuqorida).
  //  Sarlavha ham, katak ham SHU o'zgaruvchidan chiqadi.
  const chiqqan = status === 'shipped';
  if ($('thShip')) $('thShip').hidden = !chiqqan;
  //  Sarlavhalar har chizilganda qayta ulanadi: `innerHTML` bilan
  //  strelka qo'yilgach eski hodisa yo'qoladi.
  sortUla();
  sortChiz();
  $('tB').innerHTML = rows.length ? rows.map(o => {
    // Muddat o'tgan va hali yopilmagan buyurtma qizarib turadi.
    const late = o.days_left != null && o.days_left < 0
      && o.status !== 'shipped' && o.status !== 'cancelled';
    //  Qatorning O'ZI bosiladi: buyurtmani ochish uchun kichkina
    //  qalamchani nishonga olish shart emas.
    const yopiq = (o.status === 'shipped' ? !canFix : o.status === 'cancelled')
               || o.status === 'to_ship' || !canWrite;
    //  ★ ERTALABKI TO'DA: «Tayyor» buyurtmani ochmasdan chiqarishga
    //  berish. Ruxsat beradigan odam ertalab o'nta buyurtmani ko'zdan
    //  kechiradi — har birini ochib, tugmani bosib, yopib chiqish
    //  o'ttiz bosish bo'lardi.
    //
    //  Katakcha ham, tugma ham FAQAT «Tayyor» qatorda: boshqa
    //  holatdagi buyurtmani chiqarishga berib bo'lmaydi va bo'sh
    //  tugma nima uchun ishlamasligini aytmasdi.
    const berish = relOk() && o.holat === 'reserved';
    return `<tr onclick="openOrder(${o.id})" style="cursor:pointer">
      <td class="c-sel" onclick="event.stopPropagation()">${berish
        ? `<input type="checkbox" style="width:auto" ${
            tanlangan.has(o.id) ? 'checked' : ''}
           onchange="tanla(${o.id}, this.checked)">` : ''}</td>
      ${chiqqan
        ? `<td class="muted">${(o.shipped_on || '').slice(0, 10)}</td>` : ''}
      <td><strong>${esc(o.order_no)}</strong></td>
      <td>${esc(o.customer_name)}${o.region
        ? `<div class="muted" style="font-size:12px">${esc(o.region)}</div>` : ''}</td>
      <td class="muted">${o.manager_name ? esc(o.manager_name) : '—'}</td>
      <td class="muted">${(o.ordered_on || '').slice(0, 10)}</td>
      <td class="muted">${o.due_on
        ? (late ? `<span class="tag bad">${(o.due_on).slice(0, 10)}</span>`
                : (o.due_on).slice(0, 10))
        : '—'}</td>
      <td class="num">${o.lines}</td><td class="num">${o.qty}</td>
      <td class="num">${money(o.amount)}</td>
      <td>${joylar(o)}</td>
      <!--  Holat va chegirma IKKI belgi bo'lib turadi: biri
            buyurtma qayerda ekanini, ikkinchisi direktorning javobini
            kutayotganini aytadi. Bittasi ikkinchisining o'rniga
            yozilsa qator o'zi turgan tabdan boshqa nom bilan
            ko'rinardi. -->
      <td><span class="tag${o.holat === 'cancelled' ? ' warn' : ''}"
        >${esc(statusOf(o))}</span>${chegirmaKutmoqda(o)
          ? ` <span class="tag warn">Chegirma kutmoqda</span>` : ''}${
          yuborilgan(o) ? ` <span class="tag">Chiqarishga berilgan</span>` : ''}</td>
      <!--  Yopilgan buyurtma tahrirlanmaydi — tugmasi ham boshqa:
            «ko'rish». Ochilganda u hujjat bo'lib chiqadi. -->
      <td class="num" onclick="event.stopPropagation()">${berish
        ? `<button class="primary" style="padding:6px 10px;font-size:12px"
             onclick="berQator(${o.id})">Chiqarishga</button> ` : ''}<button
        onclick="openOrder(${o.id})"
        title="${yopiq ? 'Ko\'rish' : 'Tahrirlash'}">${yopiq ? '👁' : '✎'}</button></td>
    </tr>`;
  }).join('') : `<tr><td class="muted" colspan="${chiqqan ? 13 : 12}"
      >Buyurtma yo'q</td></tr>`;
  chizTanlov();
}

//  ─── CHIQARISHGA BERISH: BITTA VA TO'DALAB ────────────────────────────
//
//  Ikki yo'l ham BITTA server funksiyasidan o'tadi (`sendOne`,
//  modules/sales.js): chegirma, «qayerga» va ruxsat tekshiruvlari ikki
//  nusxada bo'lsa to'dalab yuborilgani bitta-bitta yuborilganidan
//  boshqa qoidaga bo'ysunardi.
const relOk = () => !!App.me()?.can_release;
const tanlangan = new Set();

function tanla(id, on) {
  on ? tanlangan.add(id) : tanlangan.delete(id);
  chizTanlov();
}

//  Tugma faqat BELGILANGANDA chiqadi: doim turgan «0 tasini
//  chiqarishga berish» tugmasi savol qoldirardi.
function chizTanlov() {
  const el = $('relBar');
  if (!el) return;
  //  Ro'yxat yangilanganda ko'rinmay qolgan qatorning belgisi ham
  //  tushadi: ekranda yo'q buyurtmani yuborib qo'yish yolg'on bo'lardi.
  for (const id of [...tanlangan]) if (!rows.some(r => r.id === id)) tanlangan.delete(id);
  el.innerHTML = tanlangan.size
    ? `<button class="primary" onclick="berTanlangan()">${
        tanlangan.size} tasini mijozga chiqarish</button>
       <button onclick="tanlovniTozala()">Bekor qilish</button>` : '';
}

function tanlovniTozala() { tanlangan.clear(); load(); }

async function berQator(id) {
  try {
    await App.api(`/api/sales/orders/${id}/send`, { method: 'POST' });
    await load();
  } catch (e) { alert(e.message); }
}

//  ★ BITTASI YIQILSA QOLGANI O'TAVERADI (izoh: modules/sales.js), va
//  yiqilgani NOMI bilan aytiladi: «bittasi o'tmadi» degan xabar qaysi
//  biri ekanini aytmasdi va odam ro'yxatni qaytadan ko'zdan kechirardi.
async function berTanlangan() {
  const ids = [...tanlangan];
  try {
    const r = await App.api('/api/sales/orders/send', {
      method: 'POST', body: JSON.stringify({ ids }) });
    tanlangan.clear();
    //  Yiqilgani NOMI va SABABI bilan aytiladi: «bittasi o'tmadi»
    //  degan xabar qaysi biri ekanini aytmasdi va odam ro'yxatni
    //  qaytadan ko'zdan kechirardi.
    if (r.errors?.length) {
      alert(`${r.saved} ta berildi.\n\nO'tmadi:\n`
        + r.errors.map(x => `${x.order_no} — ${x.error}`).join('\n'));
    }
    await load();
  } catch (e) { alert(e.message); }
}

// ─────────────────────────────────────────────────────── BUYURTMA TAHRIRI
//
//  Yangi buyurtma avval saqlanadi, keyin konver biriktiriladi: konver
//  buyurtmaning QATORIGA biriktiriladi va qator saqlanmaguncha mavjud
//  emas. Shuning uchun saqlangandan keyin oyna shu buyurtma bilan
//  qaytadan ochiladi.
async function openOrder(id){
  if (id) {
    cur = await App.api('/api/sales/orders/' + id);
  } else {
    cur = { order: { status: 'new', ordered_on: new Date().toISOString().slice(0, 10) },
            items: [], units: [] };
  }
  draw();
}

//  ── «QAYERDA» O'ZI YANGILANADI ────────────────────────────────────────
//
//  Konver bo'limdan bo'limga o'tganda savdo xodimi buni ko'rishi kerak —
//  sahifani qayta ochib o'tirmasin. Shuning uchun ochiq buyurtma har
//  daqiqada bir marta qayta o'qiladi.
//
//  BITTA zanjir: har chizishda eski taymer o'chiriladi. Taymer ichida
//  ham tekshiriladi — boshqa buyurtma ochilgan yoki bron oynasi
//  ustiga chiqqan bo'lsa chizilmaydi. (Jurnaldagi cheksiz so'rov
//  shundan kelib chiqqandi: ikki funksiya bir-birini chaqirardi.)
let tick = null;
const stopTick = () => { if (tick) { clearTimeout(tick); tick = null; } };

function planTick() {
  stopTick();
  const id = cur?.order?.id;
  //  Faqat kutilayotgan buyurtma: hammasi omborda bo'lsa o'zgaradigan
  //  narsa yo'q va bekorga so'rov yuborilmaydi.
  if (!id || !(cur.units || []).some(u => u.status === 'production')) return;
  tick = setTimeout(async () => {
    tick = null;
    if (cur?.order?.id !== id || !document.querySelector('.order-view')) return;
    try {
      cur = await App.api('/api/sales/orders/' + id);
      draw();
    } catch { /* aloqa uzilgan bo'lsa keyingi ochilishda ko'rinadi */ }
  }, 60000);
}

//  ── YOPILGAN BUYURTMA: YUK XATI ───────────────────────────────────────
//
//  Mijozga chiqarishga berilgan, chiqib ketgan yoki bekor qilingan buyurtma
//  TAHRIRLANMAYDI, shuning uchun uni kiritish shaklida ko'rsatish
//  noto'g'ri: o'chirilgan ochilma ro'yxatlar «buzilgan forma» bo'lib
//  ko'rinadi. Bu yerda u qog'ozdagi YUK XATI kabi o'qiladi.
//
//  Hujjatning o'zi `yukxati.js` da — uni ombor mudirining sahifasi
//  (`yukxati.html`) ham chizadi va qog'ozda ikkalasi bir xil chiqishi
//  kerak. Shu sababdan bu yerda matn ham, tartib ham takrorlanmaydi.
//
//  Balans faqat SHU ekranda: menejer hujjatni ochganda mijozning qarzini
//  ko'rib turadi, qog'ozga esa chiqmaydi (`yukxati.js`, `.no-print`).
function docHtml(o) {
  const c = customers.find(x => x.id === o.customer_id);
  return Waybill.html({ order: { ...o, customer_name: o.customer_name || c?.name },
                        items: cur.items, keeper: cur.keeper,
                        balance: c?.balance });
}

//  ── KONVERLAR QAYERDA (faqat EKRANDA) ─────────────────────────────────
//
//  Buyurtma chiqarishga berilgan yoki hali kutilayotgan bo'lsa, savdo
//  xodimi «mahsulotim qayerda» degan savolga shu yerdan javob beradi.
//  Ilgari buning uchun ombor sahifasiga kirish kerak edi — u yerda esa
//  faqat T/M omborga TUSHGANI ko'rinadi: hali tsexda yurgan konver
//  ombor qoldig'ida yo'q va savdo uni topa olmasdi.
//
//  Tahrir ko'rinishida bu «Qayerda» ustuni (`qayerda`), hujjat
//  ko'rinishida esa ustun qo'shib bo'lmaydi: yuk xati qog'ozga chiqadi
//  va unda ichki ish yozuvi turmaydi. Shuning uchun alohida kartochka
//  va `.no-print` — balans bilan bir xil sababdan.
//
//  Omborga tushgach bo'lim yozilmaydi, «T/M ombor» deb turadi: konver
//  endi tsexda emas, javonda. Sanasi ham shunda «turibdi» bo'ladi.
//
//  Chiqib ketgan va bekor qilingan buyurtmada ko'rsatilmaydi: mahsulot
//  zavodda yo'q, «qayerda» degan savol ham qolmaydi.
// ═══════════════════════════════════════ CHEGIRMA TASDIG'I
//
//  ★ Narxdan past yozilgan buyurtma DIREKTOR tasdiqlagunicha omborga
//  o'tmaydi (zavod qarori, 2026-09). Buyurtma yozilishini to'xtatish
//  yomon bo'lardi — menejer mijoz bilan gaplashib turibdi; chiqarishni
//  to'xtatish esa to'g'ri: qaror qilinmaguncha qog'oz ham, qarz ham
//  yozilmaydi.
//
//  Kartochka `.no-print`: bu ish quroli, hujjatning o'zi emas — mijoz
//  qo'liga beriladigan yuk xatiga korxonaning ichki qarori chiqmaydi.
function chegirmaCard(o) {
  if (!o.discount_status) return '';
  const ruxsat = App.can('sales.discount');
  const H = { pending: ['warn', 'Chegirma tasdiq kutmoqda'],
              approved: ['ok', 'Chegirma tasdiqlandi'],
              rejected: ['bad', 'Chegirma rad etildi'] };
  const [cls, matn] = H[o.discount_status] || ['', o.discount_status];
  return `<div class="card no-print" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <span class="tag ${cls}">${matn}</span>
        <div class="muted" style="font-size:12px;margin-top:6px">
          ${o.discount_status === 'pending'
            ? 'Narxdan past yozilgan \u2014 direktor tasdiqlagunicha chiqarilmaydi.'
            : `${esc(o.discount_by_name || '')}${o.discount_note
                ? ' · ' + esc(o.discount_note) : ''}`}</div>
      </div>
      ${o.discount_status === 'pending' && ruxsat ? `<div class="row" style="gap:8px">
        <button class="primary" onclick="chegirma(true)">Tasdiqlash</button>
        <button onclick="chegirma(false)">Rad etish</button></div>` : ''}
    </div></div>`;
}

async function chegirma(ok) {
  //  Rad etishda SABAB majburiy: menejer nega bo'lmaganini bilmasa,
  //  o'sha narxni ertaga yana yozardi (konver so'rovi bilan bir xil).
  let note = null;
  if (!ok) {
    note = prompt('Rad etish sababi?');
    if (note == null || !note.trim()) return;
  }
  const id = cur.order.id;
  try {
    await App.api(`/api/sales/orders/${id}/discount`, { method: 'POST',
      body: JSON.stringify({ approve: ok, note }) });
    await openOrder(id);
    await load();
  } catch (e) { alert(e.message); }
}

//  ★ OSILIB QOLGAN BRON — OGOHLANTIRISH, hujjat emas (zavod qarori,
//  2026-10). Chiqib ketgan buyurtmada tirik bron bo'lmasligi kerak:
//  chiqarishda u o'chiriladi. Bo'lib qolsa — konver tsexda BAND
//  bo'lib turadi va boshqa mijozga taklif qilinmaydi.
//
//  Kartochkaga qo'shilmaydi: u «qaysi konver chiqdi» degan savolning
//  javobi va hujjat bo'lib o'qiladi — tsexda qolgan konverni unga
//  qo'shish ikkala javobni ham buzardi. Shuning uchun alohida, qizil
//  va qog'ozga chiqmaydi (`.no-print`).
function osilganCard() {
  const r = cur.osilgan || [];
  if (!r.length) return '';
  return `<div class="card no-print" style="margin-bottom:12px">
    <b class="late">Konver hali shu buyurtmada band</b>
    <p class="muted" style="margin:6px 0 10px">Buyurtma chiqib ketgan,
      lekin quyidagi konver(lar) hali biriktirilgan holda turibdi —
      ya'ni boshqa mijozga taklif qilinmaydi. Qatordagi
      <b>«Konver»</b> tugmasini bosib qaytaring.</p>
    ${r.map((u) => `<div class="muted" style="font-size:13px">
      <b>${esc(u.conveyor_no || '')}</b> · ${esc(u.product || '')}${
        u.section ? ' · ' + esc(u.section) : ''}${
        u.shop ? ' · ' + esc(u.shop) : ''} \u2014 ${u.qty} ta</div>`).join('')}
  </div>`;
}

function trackCard(o) {
  const list = cur.units || [];
  if (!list.length || o.status === 'cancelled') return '';
  //  ★ CHIQIB KETGANDA SAVOL BOSHQA: «qayerda» emas, «QAYSI konver
  //  ketdi». Mahsulot zavodda yo'q, ya'ni joyini ko'rsatish ma'nosiz
  //  — lekin RAQAM kerak bo'lib qolaveradi: mijoz shikoyat qilsa,
  //  brak chiqsa yoki «qaysi partiyadan edi» deb so'ralsa javob shu
  //  raqamda. Ilgari kartochka umuman chizilmasdi va raqamni bilish
  //  uchun ombor tarixini ochib qidirish kerak edi — savdo xodimida
  //  esa o'sha sahifa yo'q.
  const chiqqan = o.status === 'shipped';
  //  Qatorning O'ZI olinadi, faqat nomi emas: zavodda bitta nom bir
  //  nechta guruhda uchraydi — «Zero» ham penal, ham kamod, ham stul
  //  bo'ladi va faqat nomi yozilsa uchta qator bir xil ko'rinardi
  //  («Zero · Orex» uch marta). Yuk xatining QATORLARIDA turi
  //  allaqachon yozilib turadi (yukxati.js) — bu kartochka undan
  //  orqada qolgandi.
  const qat = (id) => cur.items.find(x => x.id === id) || {};
  return `<div class="card no-print">
    <h2>${chiqqan ? 'Qaysi konver chiqdi' : 'Konverlar qayerda'}</h2>
    <p class="muted" style="font-size:12px;margin:-6px 0 14px">
      ish uchun \u2014 yuk xatiga chiqmaydi${chiqqan
        ? ' \u00b7 raqam bosilsa konverning butun tarixi ochiladi'
        : ' \u00b7 o\'zi yangilanib turadi'}</p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>K&#8470;</th><th>Mahsulot</th>
        <th>${chiqqan ? 'Kim chiqargan' : 'Qayerda'}</th>
        <th class="num">Soni</th>
        <th>${chiqqan ? 'Chiqqan kun' : 'Omborga'}</th></tr></thead>
      <tbody>${list.map(u => `<tr>
        <td><a href="/konver.html?no=${encodeURIComponent(u.conveyor_no)}"
          target="_blank"><strong>${esc(u.conveyor_no)}</strong></a></td>
        <td>${(() => {
          //  Chiqib ketganda qator bog'lanishi yo'q (bron o'chgan),
          //  shuning uchun nom KONVERNING o'zidan keladi — server
          //  o'sha ustunlarni ham beradi.
          const it = u.product ? u : qat(u.order_item_id);
          return `${esc(it.product || '')}${it.product_type
              ? ` <span class="muted">\u00b7 ${esc(it.product_type)}</span>` : ''}${
            u.color ? `<div class="muted" style="font-size:11px">${esc(u.color)}${
              u.fabric ? ' \u00b7 ' + esc(u.fabric) : ''}</div>` : ''}`; })()}</td>
        <td>${chiqqan
          ? (u.ship_by_name ? esc(u.ship_by_name)
                            : '<span class="muted">\u2014</span>')
          : u.status === 'fg'
          ? `<span class="tag ok">${esc(joyOf(u))}</span>`
          : `<span class="tag">${esc(joyOf(u))}</span>${u.is_stock
              ? ' <span class="tag">zahira</span>' : ''}`}</td>
        <td class="num"><b>${u.qty}</b></td>
        <td>${chiqqan ? d8(u.ship_on) || '<span class="muted">\u2014</span>'
          : u.status === 'fg' ? '<span class="tag ok">turibdi</span>'
          : u.eta ? `${d8(u.eta)}${u.eta_src && u.eta_src !== 'fakt'
              ? `<div class="muted" style="font-size:11px">${esc(u.eta_src)}</div>` : ''}`
          : '<span class="muted">\u2014</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
}

//  Manzil faqat kerak bo'lgan yo'lda ko'rinadi (`order_destinations.needs_address`).

//  ── QATOR KATAKLARI ────────────────────────────────────────────────────
//
//  Mahsulot → Rangi → Matosi. Birinchi MAHSULOT tanlanadi (turi uning
//  yonida yozilib turadi) — menejer mijozdan «Milano penal» deb eshitadi,
//  «penal» deb emas. Hammasi ro'yxatdan: qo'lda yozish yo'q, chunki
//  ro'yxatda bo'lmagan rang hech qachon konver topmasdi.
//
//  Uch manba, shu tartibda:
//    · T/M omborda    — darrov beriladi;
//    · Zahirada       — kutish bo'limida buyurtma kutmoqda, RANGI HALI
//                       YO'Q: mijoz aytgan rangga bo'yaladi, shuning
//                       uchun zahiraga ISTALGAN rang buyurtma qilinadi;
//    · Ishlab chiqarishda — yo'lda, rangi allaqachon ma'lum.
//
//  Vitrina yo'q: do'kondagi mahsulot ko'rgazmada turadi, sotuv T/M
//  ombordan ketadi.
//  ★ TO'RTINCHI GURUH: ZAVODDA YO'Q (zavod qarori, 2026-09).
//
//  Ro'yxat faqat MAVJUD konverlardan tuzilardi va zavodda umuman yo'q
//  mahsulotni qatorga yozib bo'lmasdi — menejer buyurtmani tashlab
//  yuborardi. Holbuki stol va stulga endi ishlab chiqarishga so'rov
//  yoziladi, lekin uning tugmasi QATOR ichida turadi: qator yozilmasa
//  tugmaga ham yetib bo'lmasdi.
//
//  Endi hamma mahsulot ro'yxatda, eng oxirgi guruhda. Nomi rostini
//  aytadi: bu «bor» emas, «so'rov yoziladi» — menejer buni tanlashdan
//  OLDIN ko'radi.
const SRC = [['fg', 'T/M omborda'], ['stock', 'Zahirada'],
             ['production', 'Ishlab chiqarishda'], ['yoq', "Zavodda yo'q"]];

//  ★ RANGI YO'Q KONVER HAR QANDAY RANGGA YARAYDI (zavod qarori).
//
//  Ishlab chiqarishdagi konver rangsiz tug'iladi — zahira ham,
//  bo'limsiz kiritilgan «boshlanmagan» konver ham: rang mijoz aytganda
//  ma'lum bo'ladi va o'shanda bo'yaladi. Shuning uchun menejer rang
//  tanlagan zahoti ular ro'yxatdan TUSHIB KETMAYDI.
//
//  Ilgari tushib ketardi va menejer «bu rangda konver yo'q» degan
//  javobni olardi, holbuki zavodda o'sha mahsulotning bo'yalmagan
//  partiyasi turgan bo'lardi — buyurtma bekorga rad etilardi.
//
//  T/M OMBORDAGI rangsiz konverga bu tegishli EMAS: u tayyor turibdi
//  va rangi allaqachon bor, shunchaki yozilmagan. Uni «istalgan rangga
//  yaraydi» deb ko'rsatish yolg'on va'da bo'lardi.
const bosh = (r) => !r.color && r.src !== 'fg';

//  Shu qatorga tegishli qoldiq satrlari
const rowsFor = (it, level) => stock.filter(r =>
  (level < 2 || r.product_id === Number(it.product_id))
  && (level < 3 || bosh(r) || (r.color || '') === (it.color || '')));

//  Rangi tanlanadigan konver shu mahsulotda bormi — rang ro'yxati
//  shunga qarab ochiladi.
//
//  ★ SO'RALADIGAN MAHSULOTDA RO'YXAT HAR DOIM OCHIQ (zavod qarori,
//  2026-09). Ilgari shart faqat MAVJUD konverga qarardi: bo'yalmagan
//  partiya bo'lsa rang tanlanardi, bo'lmasa katak BO'SH qolardi.
//  Stulda esa zavodda uch xil rang turgan bo'lib, mijoz to'rtinchi
//  rangni so'rasa menejer uni yoza olmasdi — holbuki savdo stulni
//  ishlab chiqarishga SO'RAY oladi va so'ralgan konver hali
//  yasalmagan: u mijoz aytgan rangda bo'yaladi.
//
//  Shuning uchun ikkinchi shart — GURUHNING belgisi
//  (product_groups.sales_can_request, stol va stul). Penal va
//  kamodda ro'yxat eskicha: ularga so'rov yozilmaydi, ya'ni bor
//  konverning rangidan boshqasini va'da qilish yolg'on bo'lardi.
const soraladi = (it) => !!(products.find((p) => p.id === Number(it.product_id))
  || {}).can_request;
const rangTanlanadi = (it) => !!it.product_id
  && (soraladi(it) || rowsFor(it, 2).some((r) => r.src === 'stock' || bosh(r)));

//  Qator QAYERDAN yopiladi — HAMMA manbasi bilan. Ilgari bittasi
//  yozilardi va omborda bori ko'rinib, ishlab chiqarishdagisi
//  yashirinib qolardi: menejer «T/M omborda bor» ni o'qib, yo'ldagi
//  konverni olishni taklif qilinmagan deb o'ylardi. Holbuki u ham
//  biriktiriladi — «Konver» oynasida omborga eng yaqini tepada turadi.
//
//  Rang HALI TANLANMAGAN bo'lsa mahsulotning hamma satri qaraladi:
//  aks holda rangsiz satrlar bilan solishtirilib, to'la ombor ustida
//  «omborda yo'q» deb yozilardi.
const SRC_HINT = { fg: 'T/M omborda bor', stock: 'zahirada',
                   production: 'ishlab chiqarishda',
                   yoq: "zavodda yo'q — ishlab chiqarishga so'rov yoziladi" };
function srcHint(it) {
  if (!it.product_id) return '';
  const rows = rowsFor(it, it.color ? 3 : 2);
  const bor = SRC.map(([s]) => s).filter(s => rows.some(r => r.src === s))
    .map((s) => {
      //  «Bor» bilan «bo'yab beramiz» bir xil javob emas: manbada
      //  faqat rangsiz konver bo'lsa menejer buni bilishi kerak.
      //  «Zavodda yo'q» da rang haqida gap yuritilmaydi: u yerda
      //  mahsulotning o'zi yo'q, rangi esa so'rov yozilganda tanlanadi.
      if (s === 'yoq') return SRC_HINT[s];
      const g = rows.filter(r => r.src === s);
      return g.every(bosh) ? SRC_HINT[s] + ' \u2014 rangi tanlanadi' : SRC_HINT[s];
    });
  return bor.length ? bor.join(' \u00b7 ') : 'Bu rangda konver yo\'q';
}

//  Ro'yxat: qiymat birinchi uchragan manbada qoladi — omborda bori
//  «T/M omborda» guruhida turadi va quyida takrorlanmaydi.
function listOf(rows, key) {
  const out = [];
  for (const [src] of SRC)
    for (const r of rows.filter(x => x.src === src)) {
      const v = r[key] ?? '';
      const e = out.find(x => String(x.v) === String(v));
      if (e) { if (e.src === src) e.free += r.free; }
      else out.push({ src, v, free: r.free,
                      name: key === 'product_id' ? `${r.product} · ${r.product_type}` : '' });
    }
  return out;
}

//  Bo'sh qiymat ham ma'noli: konverda rang yoki mato yozilmagan bo'ladi.
const nameOf = (x, key) => key === 'product_id' ? x.name
  : x.v !== '' ? x.v
  : (key === 'color' ? '— rangsiz —' : '— matosiz —');

//  Katak. Saqlangan qiymat ro'yxatda bo'lmasa (konver sotilib ketgan,
//  eski buyurtma ochilgan) u oxirgi guruhda turadi — qator o'z
//  qiymatini yo'qotmasin.
function cell(i, key, rows, val, dis, tanlov) {
  const list = listOf(rows, key);
  const sel = (v) => String(v) === String(val ?? '') ? ' selected' : '';
  const grp = ([src, label]) => {
    const g = list.filter(x => x.src === src);
    return g.length ? `<optgroup label="${label}">${g.map(x =>
      `<option value="${esc(x.v)}"${sel(x.v)}>${esc(nameOf(x, key))}</option>`)
      .join('')}</optgroup>` : '';
  };
  //  RANGI HALI YO'Q KONVERGA RANG TANLANADI (zahira ham, ishlab
  //  chiqarishdagi bo'yalmagan partiya ham): mijoz aytgan rangga
  //  bo'yaladi. Shuning uchun bu yerda zavodda ishlatilgan ranglarning
  //  hammasi taklif qilinadi — qo'lda yozish baribir yo'q va YANGI
  //  rang bu yerdan kirmaydi (tekshiruv serverda, `modules/sales.js`).
  const pal = tanlov && key !== 'product_id'
    ? (key === 'color' ? palette.colors : palette.fabrics)
        .filter(v => !list.some(x => String(x.v) === v)) : [];
  const has = list.some(x => String(x.v) === String(val ?? '')) || pal.includes(val);
  //  ★ BO'SH RO'YXAT SABABINI AYTADI (zavod qarori, 2026-09). Rang va
  //  mato faqat BORIDAN tanlanadi — yangisi jurnal orqali kiritiladi
  //  (`production.units`). Zavodda hali birorta konverga mato
  //  yozilmagan bo'lsa katak ochilar, lekin ichi bo'sh bo'lardi va
  //  menejer nima qilishini bilmay qolardi: tanlay olmaydi, yoza ham
  //  olmaydi. Bo'sh katak bu yerda javob emas, savol.
  const bosh_royxat = !list.length && !pal.length && !val;
  return `<select ${dis} onchange="setPick(${i},'${key}',this.value)" style="width:100%">
    <option value=""${val == null || val === '' ? ' selected' : ''}>— tanlang —</option>
    ${bosh_royxat && key !== 'product_id' ? `<option value="" disabled
      >— ro'yxat bo'sh: ${key === 'color' ? 'rang' : 'mato'} jurnaldan kiritiladi —</option>`
      : ''}
    ${SRC.map(grp).join('')}
    ${pal.length ? `<optgroup label="${key === 'color' ? 'Rangi' : 'Matosi'} tanlanadi">${pal.map(v =>
        `<option value="${esc(v)}"${sel(v)}>${esc(v)}</option>`).join('')}</optgroup>` : ''}
    ${!has && val ? `<optgroup label="Ro'yxatda yo'q"><option value="${esc(val)}" selected
        >${esc(key === 'product_id'
            ? (products.find(x => x.id === Number(val)) || {}).name || val
            : val)}</option></optgroup>` : ''}
  </select>`;
}

//  Qator qaysi konverlarga biriktirilgan va ular QAYERDA turibdi.
//  Bitta qatorda bir nechta konver bo'lishi mumkin, shuning uchun
//  joylar guruhlanadi: «4 ta · T/M ombor», «2 ta · Arra (Korpus tsexi)».
//  T/M ombor qisqa yoziladi: to'liq nomi («Tayyor mahsulot ombori»)
//  tor katakda uch qatorga bo'linib ketardi.
const joyOf = (u) => u.status === 'fg'
  ? (u.warehouse_code === 'TM' || !u.warehouse ? 'T/M ombor' : u.warehouse)
  : `${u.section || 'boshlanmagan'}${u.shop ? ` \u00b7 ${u.shop}` : ''}`;

//  ★ QATOR BILAN KONVER MOS KELADIMI (zavod qarori, 2026-10).
//  Ilgari ustun faqat JOYNI ko'rsatardi — qatorda «stul» turgani
//  bilan unga «stol» konveri biriktirilganini hech narsa aytmasdi va
//  farq faqat mashina ortilayotganda ko'rinardi.
//
//  ★ RANG VA MATO FAQAT IKKALA TOMONDA HAM YOZILGANDA solishtiriladi
//  (zavod qarori, 2026-10). Ishlab chiqarishdagi konver RANGSIZ
//  tug'iladi — rang mijoz aytganda ma'lum bo'ladi va o'shanda
//  bo'yaladi; buyurtma qatorida esa rang bo'sh qoldirilishi mumkin.
//  Bo'sh katakni «boshqa rang» deb o'qisak har qatorda qizil belgi
//  turardi va HAQIQIY farq o'sha to'da orasida ko'rinmay ketardi.
//
//  Mahsulotda bunday yumshatish YO'Q: u hech qachon bo'sh bo'lmaydi.
//
//  Shart SERVERDAGI `/mismatch` bilan AYNAN bir xil — ikki joyda
//  boshqacha yozilsa hisobotda turgan buyurtma o'z ichida toza
//  ko'rinardi.
const bir = (a, b) => String(a || '').trim().toLowerCase()
                   === String(b || '').trim().toLowerCase();
const ikki = (a, b) => String(a || '').trim() && String(b || '').trim();
function nomuvofiq(it, u) {
  const f = [];
  if (Number(u.unit_product_id) !== Number(it.product_id)) f.push('mahsulot');
  if (ikki(u.color,  it.color)  && !bir(u.color,  it.color))  f.push('rang');
  if (ikki(u.fabric, it.fabric) && !bir(u.fabric, it.fabric)) f.push('mato');
  return f;
}

function qayerda(itemId) {
  if (!itemId) return '';
  const list = (cur.units || []).filter(u => u.order_item_id === itemId);
  if (!list.length) return '<span class="muted">konver biriktirilmagan</span>';
  //  ★ FARQ BO'LSA JOYNING O'RNIGA EMAS, USTIGA yoziladi: mudirga
  //  konver qayerdaligi baribir kerak, lekin xato birinchi
  //  o'qilishi kerak.
  const it = (cur.items || []).find((x) => x.id === itemId);
  const xato = it ? list.map((u) => ({ u, f: nomuvofiq(it, u) }))
    .filter((x) => x.f.length) : [];
  const ogoh = xato.length ? xato.map(({ u, f }) =>
    `<div class="tag bad" style="font-size:11px;white-space:normal">
       ${esc(u.conveyor_no)} — ${esc(u.unit_product || '')}${
       u.color ? ' · ' + esc(u.color) : ''}: ${f.join(', ')} boshqa</div>`)
    .join('') : '';
  const jam = new Map();
  for (const u of list) {
    const k = joyOf(u);
    jam.set(k, (jam.get(k) || 0) + Number(u.qty || 0));
  }
  return ogoh + [...jam].map(([joy, n]) => {
    const omborda = joy.toLowerCase().includes('ombor');
    return `<div><span class="tag${omborda ? ' ok' : ''}"
      style="font-size:11px">${esc(joy)}</span> <span class="muted">${n} ta</span></div>`;
  }).join('');
}

function drawItems(){
  //  Yopilgan buyurtmada jadval YO'Q — uning o'rnida yuk xati turadi
  //  (`docHtml`), qatorlari ham o'sha yerda chiziladi.
  if (!$('tI')) return;
  //  ★ TUZATISH KO'RINISHIDA FAQAT NARX OCHIQ (izoh: draw). Mahsulot,
  //  rangi, matosi va soni QOTIB turadi: qog'ozdagi dona haqiqatda
  //  ketgani va yangi qator ortida chiqib ketgan mahsulot yo'q.
  //  Tekshiruv baribir serverda — katakni yopish himoya emas.
  //  ★ QULF: konver biriktirilgach qatorlar butunlay qotadi — narx
  //  ham. Tuzatish ko'rinishida esa faqat narx ochiq qoladi: ular
  //  boshqa ikki hol va shuning uchun ikki belgi.
  const dis = (cur.tuzat || cur.qulf) ? 'disabled' : '';
  $('tI').innerHTML = cur.items.length ? cur.items.map((it, i) => {
    const p = products.find(x => x.id === Number(it.product_id));
    const z = rangTanlanadi(it);
    //  Mahsulot QAYERDAN keladi — soni emas. Bo'sh dona soni tanlash
    //  paytida chalg'itadi: menejer mijoz so'ragan miqdorni yozadi,
    //  konverdagi qolgan dona esa boshqa mijozniki. Aniq soni bron
    //  oynasida, har konverning yonida turadi.
    const summa = (Number(it.qty) || 0) * (Number(it.unit_price) || 0);

    return `<tr data-i="${i}">
      <td>${cell(i, 'product_id', stock, it.product_id, dis, false)}
        ${it.product_id ? `<div class="muted" style="font-size:11px">${
          esc(srcHint(it))}</div>` : ''}</td>
      <td>${cell(i, 'color',  rowsFor(it, 2), it.color, dis, z)}</td>
      <td>${cell(i, 'fabric', rowsFor(it, 3), it.fabric, dis, z)}</td>
      <td class="num"><input type="number" min="1" value="${it.qty ?? 1}" ${dis}
            style="text-align:right" oninput="setField(${i},'qty',this.value)">
        ${p ? `<div class="muted" style="font-size:11px">${esc(p.uom || '')}</div>` : ''}</td>
      <td class="num"><input type="number" step="0.01" value="${it.unit_price ?? ''}"
            style="text-align:right${past(it) ? ';border-color:var(--bad)' : ''}"
            oninput="narxYoz(${i}, this)">
        <div class="hint" style="font-size:11px${
          past(it) ? ';color:var(--bad)' : ''}">${chegara(it)}</div></td>
      <td class="num">${summa ? `<b>${money(summa)}</b>`
        : '<span class="muted">—</span>'}</td>
      <td style="font-size:12px">${qayerda(it.id)}</td>
      <!--  Tugmalar ikki qatorga tushishi mumkin: tor ekranda ham
            jadvaldan chiqib ketmasin. -->
      <td class="num"><div class="row" style="gap:6px;justify-content:flex-end;
           flex-wrap:wrap">${(cur.tuzat || cur.qulf)
          ? (it.id ? `<button onclick="openPick(${it.id})">Konver</button>${
              //  ★ CHIQMAGAN QATOR HUJJATDAN OLIB TASHLANADI (izoh:
              //  modules/sales.js). Tugma faqat administratorda va
              //  faqat chiqib ketgan buyurtmada; chegarani SERVER
              //  qo'yadi — shu mahsulotdan bittasi ham chiqqan
              //  bo'lsa rad etadi va sababini yozadi.
              cur.tuzat
                ? ` <button onclick="itemRemove(${it.id})">\u2715</button>` : ''}`
            : '')
          : `<button onclick="konverOch(${i})">Konver</button>
        <button onclick="delItem(${i})">✕</button>`}</div></td>
    </tr>`;
  }).join('') : `<tr><td class="muted" colspan="8">Qator qo\'shilmagan</td></tr>`;

  //  Jami summa: yuk xatida mijoz shu raqamni ko'radi. Hisob BITTA
  //  joyda (`jamiYoz`) — narx yozilganda ham shu chaqiriladi.
  jamiYoz();
}

//  Katak tanlanganda undan KEYINGILARI tozalanadi: eski rang yangi
//  mahsulotga to'g'ri kelmaydi va jimgina noto'g'ri qator bo'lib qolardi.
function setPick(i, key, v){
  const it = cur.items[i];
  if (key === 'product_id') Object.assign(it, { product_id: v || null, color: '', fabric: '' });
  else if (key === 'color') Object.assign(it, { color: v, fabric: '' });
  else it.fabric = v;
  drawItems();
}

//  Konver qayerda turibdi — bitta joyda yoziladi, uni ikkita ro'yxat
//  ham ishlatadi (bron qilinganlar va nomzodlar).
function where(u) {
  if (u.status === 'fg')
    return `<span class="tag ok">${esc(u.warehouse || 'T/M ombor')}</span>`;
  return `<span class="tag">${esc(u.section || 'boshlanmagan')}</span>${
    u.is_stock ? ' <span class="tag">zahira</span>'
               : ' <span class="muted" style="font-size:11px">ishlanmoqda</span>'}`;
}

// ═══════════════════════════════════════════════ NARX CHEGARASI
//
//  ★ ZAVOD QARORI (2026-09): narxdan PAST sotilmaydi, faqat direktor
//  ruxsati bilan. Menejer qator yozganda narx O'ZI to'ladi — uning
//  narx turidan (ulgurji yoki chakana, `worker_roles.price_kind`).
//  Ekranda BITTA raqam turadi: ulgurji menejer chakana narxni
//  ko'rmaydi va aksincha.
//
//  Chegara SERVERDAN keladi (`/api/sales/products` dagi `price`) —
//  ro'yxat klientda quriladi, ya'ni bu yerdagisi faqat KO'RINISH.
//  Tekshiruv baribir serverda: qo'lda yuborilgan past narx o'sha
//  yerda tutiladi va buyurtma tasdiq kutadi.
const narxi = (pid) => {
  const p = products.find((x) => x.id === Number(pid));
  return p && p.price != null ? Number(p.price) : null;
};

//  Qator yozilgan PAYTDAGI chegara ustun turadi: narxlar keyin
//  o'zgarsa allaqachon tasdiqlangan qator qaytadan «past» bo'lib
//  qolmasligi kerak (serverdagi `price_floor` bilan bir xil qoida).
const chegarasi = (it) =>
  it.price_floor != null ? Number(it.price_floor) : narxi(it.product_id);

const past = (it) => {
  const f = chegarasi(it), v = Number(it.unit_price);
  return f != null && it.unit_price !== '' && it.unit_price != null && v < f;
};

//  Chegara raqamning OSTIDA yoziladi: menejer nega qizil ekanini
//  o'ylab o'tirmasin. Narxi qo'yilmagan mahsulotda chegara yo'q va
//  katak ham jim turadi — bo'lmagan raqamni majburlab bo'lmaydi.
const chegara = (it) => {
  const f = chegarasi(it);
  return f == null ? '' : `eng kami ${money(f)}`;
};

//  ★ NARX YOZILGANDA JADVAL QAYTA CHIZILMAYDI: har harfda chizilsa
//  kursor katakdan uchib ketardi. Faqat o'sha katakning belgisi va
//  «Jami» yangilanadi.
function narxYoz(i, el) {
  cur.items[i].unit_price = el.value;
  const it = cur.items[i];
  el.style.borderColor = past(it) ? 'var(--bad)' : '';
  const hint = el.nextElementSibling;
  if (hint) {
    hint.textContent = chegara(it);
    hint.style.color = past(it) ? 'var(--bad)' : '';
  }
  //  Qator summasi va «Jami» ham darrov yangilanadi: menejer
  //  mijozga aytadigan raqam shu.
  const td = el.closest('td')?.nextElementSibling;
  const summa = (Number(it.qty) || 0) * (Number(it.unit_price) || 0);
  if (td) td.innerHTML = summa ? `<b>${money(summa)}</b>`
    : '<span class="muted">&mdash;</span>';
  jamiYoz();
}

function jamiYoz() {
  const jami = cur.items.reduce((a, it) =>
    a + (Number(it.qty) || 0) * (Number(it.unit_price) || 0), 0);
  if ($('tIf')) $('tIf').innerHTML = jami ? `<tr>
    <td colspan="5"><b>Jami</b></td>
    <td class="num"><b>${money(jami)}</b></td><td></td><td></td></tr>` : '';
}

function setField(i, k, v){
  cur.items[i][k] = v;
  //  Mahsulot tanlanganda narx O'ZI to'ladi: menejer uni prays-listdan
  //  qidirib o'tirmasin. Qo'lda yozilgani almashtirilmaydi — kelishilgan
  //  narx bo'lishi mumkin.
  if (k === 'product_id') {
    const f = narxi(v);
    if (f != null && !cur.items[i].unit_price) cur.items[i].unit_price = f;
    cur.items[i].price_floor = f;
    drawItems();
  }
}
function addItem(){ cur.items.push({ qty: 1 }); drawItems(); }
function delItem(i){
  if (Number(cur.items[i].assigned_qty) > 0)
    return alert("Avval konverni ajrating");
  cur.items.splice(i, 1); drawItems();
}

const close_ = () => { stopTick(); $('modalRoot').innerHTML = ''; cur = null; };

//  ★ QULFNI OCHISH — SABAB BILAN (zavod qarori, 2026-10). Yo'l
//  berkitilmaydi: xato bo'lganda buyurtmani tuzatish kerak va yagona
//  chora bazaga qo'lda kirish bo'lib qolardi. Lekin u ataylab ikki
//  bosqich — administrator ochadi, menejer tuzatadi.
//  ★ CHIQMAGAN QATORNI HUJJATDAN OLIB TASHLASH. Sabab MAJBURIY —
//  «nega hujjatdan tushdi» degan savol oy oxirida beriladi.
//  Tekshiruvning O'ZI serverda: shu mahsulotdan bittasi ham chiqqan
//  bo'lsa rad etiladi.
async function itemRemove(itemId){
  const it = cur.items.find(x => x.id === itemId);
  const nom = it?.product || '';
  //  ★ RAQAM OLDIN AYTILADI, keyin o'zgaradi (zavod qarori, 2026-10).
  //  Ilgari oyna faqat «chiqqan donaga tenglashtiriladi» deb turardi va
  //  o'sha dona NECHTA ekanini aytmasdi: 40 talik qator bosilgan zahoti
  //  6 ta bo'lib qoldi — odam 29 ni kutgandi va qaytaradigan yo'q edi.
  //  Hisob SERVERNIKI, ekran esa o'sha raqamni AYNAN shu manbadan
  //  o'qiydi (`cur.units` — chiqib ketgan konverlar): ikki joyda
  //  yozilgan shart bir kun ajralib ketardi.
  const chiqdi = (cur.units || [])
    .filter(u => u.product_id === it?.product_id)
    .reduce((s, u) => s + Number(u.qty || 0), 0);
  if (it && chiqdi === Number(it.qty))
    return toast('Zavoddan ' + chiqdi + ' ta chiqqan, qatorda ham '
      + it.qty + ' ta \u2014 tuzatadigan farq yo\'q', true);
  const sabab = prompt(nom + ': zavoddan ' + chiqdi + ' ta chiqqan.\n'
    + (chiqdi
        ? 'Qator ' + (it ? it.qty : '?') + ' \u2192 ' + chiqdi + ' bo\'ladi.'
        : 'Qator butunlay olib tashlanadi.')
    + '\n\nSababi:');
  if (sabab === null) return;
  if (!sabab.trim()) return toast('Sabab yozilmagan', true);
  try {
    const r = await App.api(
      `/api/sales/orders/${cur.order.id}/items/${itemId}/remove`,
      { method: 'POST', body: { note: sabab.trim() } });
    toast(r && r.chiqdi
      ? `Soni ${r.edi} \u2192 ${r.chiqdi}` : 'Qator olib tashlandi');
    await openOrder(cur.order.id);
  } catch (e) { toast(e.message, true); }
}

async function unlock(){
  const sabab = prompt('Nega ochilmoqda?');
  if (!sabab) return;
  try {
    await App.api(`/api/sales/orders/${cur.order.id}/unlock`,
      { method: 'POST', body: JSON.stringify({ note: sabab }) });
    toast('Qulf ochildi');
    await openOrder(cur.order.id);
  } catch (e) { toast(e.message, true); }
}

//  ★ NOMUVOFIQ BUYURTMALAR RO'YXATI. Uchta farqni topadi: qatorda
//  bir mahsulot, konverda boshqasi; rangi yoki matosi boshqa;
//  biriktirilgani so'ralgandan ko'p (soni keyin kamaytirilgan).
//  Hisob SERVERDA — ro'yxat 500 qator bilan cheklangan va klientda
//  tekshirish buzilganlarning yarmini ko'rsatmasdi.
async function texshir(){
  let d;
  try { d = await App.api('/api/sales/mismatch'); }
  catch (e) { return toast(e.message, true); }
  const kam = d.kam || [];
  const jami = d.rows.length + d.kop.length + kam.length;
  const qator = (x) => `<tr style="cursor:pointer"
      onclick="openOrder(${x.id})">
      <td><b>${esc(x.order_no)}</b><div class="muted" style="font-size:12px"
        >${esc(statusOf(x))}</div></td>
      <td>${esc(x.customer || '')}<div class="muted" style="font-size:12px"
        >${esc(x.manager || '')}</div></td>
      <td>${esc(x.item_product)}${x.item_color
        ? ' · ' + esc(x.item_color) : ''}${x.item_fabric
        ? ' · ' + esc(x.item_fabric) : ''}</td>
      <td>${x.conveyor_no ? `<b>${esc(x.conveyor_no)}</b> ` : ''}${
        esc(x.unit_product || '')}${x.unit_color
        ? ' · ' + esc(x.unit_color) : ''}${x.unit_fabric
        ? ' · ' + esc(x.unit_fabric) : ''}</td>
      <td><span class="tag bad">${esc(x.farq || '')}</span></td></tr>`;
  const kopQator = (x) => `<tr style="cursor:pointer"
      onclick="openOrder(${x.id})">
      <td><b>${esc(x.order_no)}</b><div class="muted" style="font-size:12px"
        >${esc(statusOf(x))}</div></td>
      <td>${esc(x.customer || '')}</td>
      <td>${esc(x.item_product)}</td>
      <td>so'raldi <b>${x.item_qty}</b>, biriktirilgan <b>${x.bron}</b></td>
      <td><span class="tag bad">soni</span></td></tr>`;
  //  ★ CHIQIB KETGANDA: yuk xatida nechta, konverlar bo'yicha nechta.
  //  Hujjat qatorlardan bosiladi, mijozning qarzi esa konverdan
  //  hisoblanadi — farq o'sha ikkisini ajratadi.
  const kamQator = (x) => `<tr style="cursor:pointer"
      onclick="openOrder(${x.id})">
      <td><b>${esc(x.order_no)}</b><div class="muted" style="font-size:12px"
        >Chiqib ketdi</div></td>
      <td>${esc(x.customer || '')}<div class="muted" style="font-size:12px"
        >${esc(x.manager || '')}</div></td>
      <td>${esc(x.item_product)}</td>
      <td>yuk xatida <b>${x.item_qty}</b>, konver bo'yicha chiqqani
        <b>${x.chiqdi}</b></td>
      <td><span class="tag bad">kam chiqqan</span></td></tr>`;
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:1000px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Nomuvofiq buyurtmalar</h1>
          <button onclick="yop()">Yopish</button></div>
        ${jami ? `<p class="muted" style="margin-bottom:12px">
          Qator bilan unga biriktirilgan konver mos kelmaydi. Bu eski
          yozuvlar: endi bunday o'zgartirish umuman qabul qilinmaydi.
          Qatorni bossangiz buyurtma ochiladi.</p>
        <p class="muted" style="margin-bottom:12px">
          «Kam chiqqan» — chiqib ketgan buyurtma: yuk xatining qatorida
          bir son, zavoddan chiqqan konverlarda boshqa son. Hujjat
          qatorlardan bosiladi, mijozning qarzi esa konverdan
          hisoblanadi — ya'ni mijoz imzolagan qog'oz balansdan farq
          qiladi. Bu tuzatilmaydi (mahsulot mijozda), lekin shikoyat
          kelganda javob shu yerda.</p>
        <div style="overflow-x:auto;max-height:60vh"><table>
          <thead><tr><th>Buyurtma</th><th>Mijoz</th>
            <th>Qatorda</th><th>Konverda</th><th>Farq</th></tr></thead>
          <tbody>${d.rows.map(qator).join('')}${d.kop.map(kopQator).join('')}${
            kam.map(kamQator).join('')}</tbody>
        </table></div>`
        : `<p class="muted">Nomuvofiq buyurtma topilmadi — hammasi joyida.</p>`}
      </div></div>`;
}
const yop = () => { $('modalRoot').innerHTML = ''; };

//  ★ KONVER SAQLASHDAN OLDIN HAM BIRIKTIRILADI (zavod qarori,
//  2026-10). Bron QATORGA ilinadi, qatorning id si esa faqat
//  saqlangandan keyin paydo bo'ladi — shuning uchun ilgari menejer
//  avval «Saqlash» ni bosishi, keyin konver biriktirishi kerak edi.
//  Zavodda tartib boshqa: butun buyurtma shakllantiriladi, har
//  qatorga konver topiladi va BITTA marta saqlanadi.
//
//  Shuning uchun buyurtmaning O'ZI shu yerda jimgina saqlanadi.
//  Menejerdan ikkinchi tugmani bosishni so'rash bitta ishni ikki
//  marta qildirardi — «Saqlash» esa endi BOSHQA ishni qiladi: u
//  hujjatni YOPADI.
//
//  Qator INDEKS bo'yicha topiladi: saqlashda qatorlar o'chirilib
//  qayta yoziladi, ya'ni id lar yangi bo'ladi. Tartib `sort` bilan
//  saqlanadi (serverda `ORDER BY i.sort, i.id`), lekin ehtiyot uchun
//  mahsuloti ham solishtiriladi — mos kelmasa oyna ochilmaydi va
//  menejer begona qatorga konver biriktirib qo'ymaydi.
async function konverOch(i) {
  const it = cur.items[i];
  if (!it) return;
  if (it.id) return openPick(it.id);
  if (!it.product_id) return alert('Avval qatorda mahsulotni tanlang');
  const kutgan = Number(it.product_id);
  if (!await saqla({ qulfla: false })) return;
  const yangi = cur.items[i];
  if (!yangi || !yangi.id || Number(yangi.product_id) !== kutgan)
    return alert('Qator saqlandi — «Konver» ni qaytadan bosing');
  openPick(yangi.id);
}

//  ★ «SAQLASH» HUJJATNI YOPADI (zavod qarori, 2026-10). Menejer
//  buyurtmani shakllantiradi, konverlarni biriktiradi va shundan
//  keyin bir marta saqlaydi — o'sha bosish qulfni tushiradi.
//
//  `qulfla` bilan ikki yo'l ham BITTA funksiyadan o'tadi: jimgina
//  saqlash (konver oynasini ochish uchun) va yakuniy saqlash. Ikki
//  nusxada yozilsa biri ertaga ikkinchisidan ajralib ketardi —
//  masalan «Qayerga» tekshiruvi bittasida qolib ketardi.
async function saqla({ qulfla }) {
  const body = {
    order_no: $('oNo').value.trim() || null,
    customer_id: Number($('oCust').value) || null,
    manager_id: Number($('oMgr').value) || null,
    ordered_on: $('oOn').value || null,
    due_on: $('oDue').value || null,
    note: $('oNote').value.trim() || null,
    ship_to: $('oDest').value || null,
    address: $('oAddr').value.trim() || null,
    receiver_phone: $('oPhone').value.trim() || null,
    items: cur.items.map(it => ({ id: it.id, product_id: Number(it.product_id) || null,
      qty: Number(it.qty) || 1, color: it.color || null, fabric: it.fabric || null,
      unit_price: it.unit_price === '' || it.unit_price == null ? null : Number(it.unit_price),
      note: it.note || null })),
  };
  if (!body.customer_id) { alert('Mijoz tanlanmagan'); return false; }
  if (!body.items.length) { alert('Qator qo\'shilmagan'); return false; }
  if (body.items.some(i => !i.product_id)) {
    alert('Qatorda mahsulot tanlanmagan'); return false; }
  try{
    let id = cur.order.id;
    if (id) {
      await App.api('/api/sales/orders/' + id,
        { method: 'PATCH', body: JSON.stringify(body) });
    } else {
      id = (await App.api('/api/sales/orders',
        { method: 'POST', body: JSON.stringify(body) })).id;
    }
    //  Qulf SAQLANGANDAN KEYIN tushadi: qatorlar yozilmagan bo'lsa
    //  server uni baribir rad etardi va buyurtma yarim saqlangan
    //  holda qolardi.
    if (qulfla) await App.api(`/api/sales/orders/${id}/lock`, { method: 'POST' });
    await openOrder(id);
    load();
    return true;
  }catch(e){ alert(e.message); return false; }
}

//  Yakuniy saqlash. Ogohlantirish MAJBURIY: menejer tugmani
//  «o'zgarishlarim yozilsin» deb bosardi va hujjat yopilib qolgani
//  uni hayron qoldirardi.
async function save(){
  if (!cur.order.id || !cur.order.locked_at) {
    if (!confirm('Buyurtma saqlanadi va YOPILADI.\n\n'
      + 'Shundan keyin mahsulot, rangi, matosi, soni va narxi '
      + 'o\'zgarmaydi \u2014 qulfni faqat administrator ochadi.\n\n'
      + 'Yetkazib berish ma\'lumotlari ochiq qolaveradi.')) return;
  }
  await saqla({ qulfla: true });
}

//  Buyurtmani ombor mudiriga topshirish. Shundan keyin mahsulotni
//  zavoddan chiqarish uning ishi: u ko'zi bilan ko'rib tasdiqlaydi.
async function savePayment(){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/payment`, { method: 'PATCH',
      body: JSON.stringify({ payment_on: $('oPay').value || null }) });
    cur.order.payment_on = $('oPay').value || null;
    alert($('oPay').value ? 'Pul kirim sanasi saqlandi' : 'Sana tozalandi');
    load();
  }catch(e){ alert(e.message); }
}

async function sendToWh(){
  if (!confirm('Buyurtma ombor mudiriga yuborilsinmi?\n\n' +
    'Shundan keyin u tahrirlanmaydi — kerak bo\'lsa qaytarib olasiz.')) return;
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/send`, { method: 'POST' });
    await openOrder(cur.order.id);
    load();
  }catch(e){ alert(e.message); }
}

async function unsendWh(){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/unsend`, { method: 'POST' });
    await openOrder(cur.order.id);
    load();
  }catch(e){ alert(e.message); }
}

async function cancelOrder(){
  if (!confirm('Buyurtma bekor qilinsinmi?')) return;
  try{
    await App.api('/api/sales/orders/' + cur.order.id,
      { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
    close_(); load();
  }catch(e){ alert(e.message); }
}

// ──────────────────────────────────────────────── KONVER BIRIKTIRISH OYNASI
//
//  Ro'yxatda faqat bo'sh konver turadi: boshqa buyurtmada bandi server
//  javobiga umuman tushmaydi. Rang va matosi mos kelgani tepada.
let pick = null;

async function openPick(itemId){
  pick = await App.api(`/api/sales/orders/${cur.order.id}/candidates?item_id=${itemId}`);
  const it = cur.items.find(x => x.id === itemId);
  const left = Math.max(0, (Number(it?.qty) || 0) - (Number(it?.assigned_qty) || 0));
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closePick()">
      <!--  ★ OYNA KENG: sakkizta ustun 760px ga sig'masdi va eng
            oxirgisi — TUGMA ustuni — ekrandan chiqib ketardi. Jadval
            overflow-x bilan surilardi, lekin odam uni ko'rmasdi:
            «Qaytarish tugmasi yo'q» degan savol aynan shundan
            chiqdi. Javob ko'rinib turishi kerak, surib topiladigan
            bo'lmasligi kerak. -->
      <div class="modal" style="max-width:1020px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <h1 style="margin:0">Konver biriktirish</h1>
          <button onclick="closePick()">Orqaga</button></div>
        <p class="muted" style="margin-bottom:16px">${esc(it?.product || '')}${
          it?.color ? ' · ' + esc(it.color) : ''}${it?.fabric ? ' · ' + esc(it.fabric) : ''}
          · yopilmagani: <b>${left}</b> ${esc(it?.uom || '')}</p>
        <!--  Tartib: avval T/M omborda turgani, keyin OMBORGA ENG YAQINI.
              Mijoz tezroq oladigan konver tepada tursin. -->
        <div style="overflow-x:auto"><table>
          <thead><tr><th>K&#8470;</th><th>Qayerda</th><th>Omborga</th>
            <th>Rang</th><th>Mato</th>
            <th class="num">Bo'sh</th><th class="num" style="width:90px">Olinadi</th>
            <th></th></tr></thead>
          <!--  ★ NOMUVOFIQ KONVER QIZIL BO'LIB TURADI. Ro'yxat qatorning
                MAHSULOTI bo'yicha yig'iladi, ya'ni deyarli hamma qatorda
                mahsulot bir xil va uni yozib o'tirish ortiqcha. Eski
                nomuvofiq bronda esa u BOSHQA bo'ladi — va aynan o'shanda
                menejer nimani qaytarayotganini bilishi kerak. -->
          <tbody>${pick.rows.length ? pick.rows.map(u => `<tr>
            <td><strong>${esc(u.conveyor_no)}</strong>${
              Number(u.unit_product_id) !== Number(pick.item.product_id)
              ? `<div class="tag bad" style="font-size:11px;white-space:normal;
                   margin-top:4px">${esc(u.unit_product || '')} \u2014
                   mahsulot boshqa</div>` : ''}</td>
            <td>${where(u)}</td>
            <!--  ★ KECH KELADIGAN KONVER QIZIL BO'LIB TURADI. Server
                  bunday bronni qabul qilmaydi (modules/sales.js,
                  assertMuddat), lekin menejer buni BOSISHDAN oldin
                  ko'rishi kerak — aks holda u ro'yxat bo'ylab yurib,
                  har birida bitta xabarni o'qib chiqardi. Ro'yxatdan
                  olib tashlanmadi: chiqish sanasini keyinga surish ham
                  yo'l va u menejerning qaroriga qoladi. -->
            <td>${u.status === 'fg' ? '<span class="tag ok">turibdi</span>'
              : u.eta ? `<span class="${u.late ? 'tag bad' : ''}">${d8(u.eta)}</span>${
                  u.late ? `<div class="muted" style="font-size:11px">chiqish
                    sanasidan keyin</div>`
                  : u.eta_src && u.eta_src !== 'fakt'
                  ? `<div class="muted" style="font-size:11px">${esc(u.eta_src)}</div>` : ''}`
              : '<span class="muted">—</span>'}</td>
            <td class="${u.color_ok ? '' : 'muted'}">${u.color ? esc(u.color) : '—'}</td>
            <td class="${u.fabric_ok ? '' : 'muted'}">${u.fabric ? esc(u.fabric) : '—'}</td>
            <!-- Konverda nechta bo'sh dona qolgani -->
            <td class="num"><b>${u.free_qty}</b></td>
            <!--  Shu qatorga allaqachon olingan bo'lsa u yuqorida turadi
                  va shu yerdan qaytariladi: buyurtma ekranida alohida
                  «bron qilingan konverlar» ro'yxati yo'q. -->
            <td class="num">${u.mine
              ? `<b>${u.mine}</b> <span class="muted" style="font-size:11px">olingan</span>`
              : `<input id="q${u.id}" type="number" min="1" max="${u.free_qty}"
                   value="${Math.max(1, Math.min(u.free_qty, left || u.free_qty))}"
                   style="max-width:80px;text-align:right">`}</td>
            <!--  ★ CHIQIB KETGAN BUYURTMAGA YANGI KONVER OLINMAYDI
                  (server ham rad etadi: «Buyurtma jo'natilgan»).
                  Tugma chizilsa menejer uni bosib, sababini faqat
                  xato xabaridan bilardi. Qaytarish esa OCHIQ
                  qolaveradi — osilib qolgan bron aynan shu yerdan
                  bo'shatiladi. -->
            <td class="num" style="white-space:nowrap">${u.mine
              ? `<button onclick="unassign(${u.id})">Qaytarish</button>`
              : (cur.order.status === 'shipped'
                ? `<span class="muted" style="font-size:12px">chiqib ketgan</span>`
                : `<button class="primary" onclick="assign(${u.id})">Olish</button>`)}</td>
          </tr>`).join('')
            : `<tr><td class="muted" colspan="8">Bo'sh konver yo'q —
                 T/M omborda ham, zahirada ham, ishlab chiqarishda ham.
                 ${pick.item.can_request
                   ? "Pastdagi «So'rov yuborish» bilan ishlab chiqarishdan so'raladi."
                   : ''}</td></tr>`}</tbody>
        </table></div>
        <!--  ★ ISHLAB CHIQARISHGA SO'ROV (zavod qarori, 2026-09).
              Mijoz so'ragan stol yoki stul zavodda umuman bo'lmasligi
              mumkin va ilgari javob bitta edi — rad etish. Endi
              menejer so'rov yozadi: konver BU YERDA ochilmaydi,
              so'rov rahbariyat navbatiga tushadi va tasdiqlangach
              konver O'ZI shu qatorga biriktiriladi.

              Tugma faqat qator YOPILMAGANDA chiqadi: hammasi
              biriktirilgan bo'lsa so'raladigan narsa qolmaydi.
              Sp, penal va kamodda umuman chizilmaydi (belgi guruhda,
              server ham tekshiradi). -->
        ${pick.item.can_request && left > 0 ? `
        <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
          <div class="row" style="justify-content:space-between;gap:12px;
               flex-wrap:wrap;align-items:center">
            <div>
              <b>Zavodda yo'qmi?</b>
              <div class="muted" style="font-size:12px;margin-top:2px">
                Ishlab chiqarishga so'rov yuboriladi — rahbariyat
                tasdiqlagach konver shu qatorga biriktiriladi</div>
            </div>
            <div class="row" style="gap:8px">
              <input id="soQty" type="number" min="1" value="${left}"
                     style="max-width:90px;text-align:right">
              <button class="primary" onclick="soravYubor()">So'rov yuborish</button>
            </div>
          </div>
        </div>` : ''}
      </div></div>`;
}

const closePick = () => { pick = null; draw(); };

//  So'rov yuborildi — konver HALI ochilmadi: u rahbariyat navbatida
//  turadi. Menejerga aynan shu aytiladi, aks holda u qatorni tayyor
//  deb o'ylab, mijozga sana aytib qo'yardi.
async function soravYubor() {
  const n = Number($('soQty')?.value) || null;
  try {
    const r = await App.api(`/api/sales/orders/${cur.order.id}/request-unit`,
      { method: 'POST', body: JSON.stringify({ item_id: pick.item.id, qty: n }) });
    closePick();
    alert(`So'rov yuborildi: ${r.conveyor_no} · ${r.qty} ta.\n`
      + `Rahbariyat tasdiqlagach konver shu qatorga biriktiriladi.`);
    load();
  } catch (e) { alert(e.message); }
}

async function assign(unitId){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/assign`, { method: 'POST',
      body: JSON.stringify({ item_id: pick.item.id, unit_id: unitId,
                             qty: Number($('q' + unitId).value) || null }) });
    cur = await App.api('/api/sales/orders/' + cur.order.id);
    await openPick(pick.item.id);
    load();
  }catch(e){ alert(e.message); }
}

//  Bronni qaytarish — bron oynasining o'zidan. Oyna yopilmaydi:
//  menejer odatda birini qaytarib, boshqasini oladi.
async function unassign(unitId){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/unassign`, { method: 'POST',
      body: JSON.stringify({ item_id: pick?.item?.id || null, unit_id: unitId }) });
    cur = await App.api('/api/sales/orders/' + cur.order.id);
    if (pick?.item?.id) await openPick(pick.item.id);
    else draw();
    load();
  }catch(e){ alert(e.message); }
}

App.start(boot, 'sales.view', 'sales.manage');
</script>
</body>
</html>
