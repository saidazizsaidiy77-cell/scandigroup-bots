<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buyurtmalar · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/yukxati.css">
<style>
/*  Buyurtma oynasi — TO'LIQ EKRAN. Ilgari tor modal edi: qatorlar
    jadvali sig'masdi va maydonlar bir-birining ostiga tushib ketardi.
    Nomi `order-view`: `sheet` style.css da BAND (jadval-kiritish uslubi,
    u yerda kataklar shaffof) va nomi to'qnashsa maydonlar ko'rinmay
    qolardi. */
.order-view{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto}
.order-in{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.order-top{position:sticky;top:0;z-index:2;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:24px}
/*  Maydonlar bir xil kenglikdagi ustunlarda: har katak o'z qatoridan
    boshlanadi va yonidagi bilan TEKIS turadi. Ilgari flex edi va
    mijoz ostidagi balans qatori qo'shnisini pastga surib yuborardi. */
.fields{display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(215px,1fr));align-items:start}
.fields > div{min-width:0}
/*  Katak ostidagi izoh joyi oldindan ajratilgan — matn chiqqanda
    qo'shni maydon sakramaydi. */
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:17px}
/*  Hujjat ko'rinishidagi qiymat: katak emas, matn. Balandligi maydon
    bilan bir xil — qatorlar tekis tursin. */
.val{padding:11px 0;font-size:15px;line-height:1.35}

/*  Qog'ozga: ro'yxat ham, tugmalar ham chiqmaydi — faqat hujjat.
    Hujjatning o'z uslubi `yukxati.css` da: uni ombor mudirining
    sahifasi ham o'qiydi. */
@media print{
  body{padding:0}
  #listCard,.order-top{display:none!important}
  .order-view{position:static;overflow:visible;background:#fff}
  .order-in{max-width:none;padding:0}
}
/*  Bo'limlar kartochkada: fon ustida maydonning o'z foni deyarli
    ko'rinmaydi va katak qayerda tugashi bilinmaydi. */
.order-view .card{margin-bottom:16px}
</style>
<script src="/app.js"></script>
<script src="/yukxati.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Buyurtmalar</h1></div>
  <div class="row"><span id="btnNew"></span><span class="row" id="erpUser"></span></div>
</div>

<div class="card" id="listCard">
  <!-- Telefonda ikkalasi bir qatorga sig'maydi: chiplar surilib ketadi,
       qidiruv esa pastga tushadi. -->
  <div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap;
       margin-bottom:12px">
    <div class="row" id="chips" style="gap:6px;overflow-x:auto;max-width:100%"></div>
    <div class="row" style="gap:8px">
      <!--  ★ MENEJER FILTRI — SAVDO BOSHLIG'I UCHUN. Uning birinchi
            savoli «kim nima yozdi»: menejer ustuni bor edi, lekin uni
            SARALAB bo'lmasdi — o'ttizta qatordan bittasining ishini
            ko'z bilan terib olish kerak edi.
            Faqat o'zinikini ko'radigan xodimda ro'yxat CHIZILMAYDI:
            u yerda baribir bitta ism turardi (izoh: `ownOf`). -->
      <select id="fMgr" onchange="load()" style="max-width:200px" hidden></select>
      <input id="fQ" placeholder="Z№ yoki mijoz" style="max-width:240px" oninput="load()">
    </div>
  </div>
  <div style="overflow-x:auto"><table>
    <!--  «Bron» ustuni yo'q: u qator sonini takrorlardi va «bron» degan
          ichki tushunchani ro'yxatga olib chiqardi. Buyurtma qay ahvolda
          ekani HOLAT ustunida turadi. -->
    <thead><tr><th>Z&#8470;</th><th>Mijoz</th><th>Menejer</th><th>Yozilgan</th>
      <th>Muddat</th><th class="num">Qator</th><th class="num">Soni</th>
      <th class="num">Summa, $</th>
      <!--  «Qayerda» — biriktirilgan konverlar hozir turgan joyi.
            Savdo xodimidan kun bo'yi «mahsulotim qayerda» deb
            so'rashadi; ilgari javob har buyurtmani ochib ko'rilardi. -->
      <th>Qayerda</th><th>Holat</th><th></th></tr></thead>
    <tbody id="tB"></tbody>
  </table></div>
</div>

<div id="modalRoot"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d8 = v => !v ? '—' : (x => `${x.slice(8,10)}.${x.slice(5,7)}.${x.slice(2,4)}`)(String(v).slice(0,10));
const money = (v) => {
  const x = Number(v) || 0;
  const [i, f] = (Math.abs(x) < 1e15 ? x.toFixed(2) : String(x)).split('.');
  const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return f && f !== '00' ? `${g}.${f}` : g;
};

// Holat nomlari bitta joyda: jadval ham, tahrir oynasi ham shundan oladi.
//  Holat nomlarida «bron» so'zi yo'q: u ichki mexanizm (konverni
//  qatorga biriktirish), menejer esa buyurtma qay ahvolda ekanini
//  o'qiydi — «tayyor» yoki «kutmoqda».
//  «Chiqib ketdi» — ombor mudiri tasdiqlagandan keyin: mahsulot
//  zavoddan jismonan chiqdi, mijoz balansiga qo'shildi.
const STATUS = { new: 'Yangi', reserved: 'Tayyor',
                 to_ship: 'Omborda', shipped: 'Chiqib ketdi',
                 cancelled: 'Bekor qilingan' };
//  «Kutmoqda» — alohida holat emas, hisoblanadi: bron qo'yilgan, lekin
//  bir qismi hali ishlab chiqarishda (server: `status=waiting`).
const FILTERS = [['', 'Hammasi'], ['new', 'Yangi'], ['draft', 'Chernovik'],
                 ['waiting', 'Kutmoqda'],
                 ['reserved', 'Tayyor'], ['to_ship', 'Omborda'],
                 ['shipped', 'Chiqib ketdi'], ['cancelled', 'Bekor']];

//  Buyurtma holati EKRANDA: bronning bir qismi hali omborga kelmagan
//  bo'lsa «Kutmoqda» deb ko'rsatiladi — mijozga aytiladigan gap shu.
//
//  ★ CHERNOVIK — eng ustun holat: biriktirilgan konverning bir qismi
//  hali YO'LGA CHIQMAGAN (tsexning «Boshlanmagan» ro'yxatida turibdi).
//  Tsex boshlig'i uni ishga tushirmaguncha T/M omborga tushish kunini
//  tizim hisoblay olmaydi — sana konverning BOSHLANGAN kunidan
//  sanaladi — ya'ni mijozga aytiladigan chiqish sanasi ham noma'lum.
//  «Kutmoqda» buni yashirardi: menejer konver yo'lda deb o'ylab,
//  mijozga sana aytib qo'yardi.
const statusOf = (o) =>
  //  ★ Chegirma tasdig'i eng tepada: buyurtma boshqa hamma jihatdan
  //  tayyor bo'lsa ham, direktor qaror qilmaguncha omborga o'tmaydi.
  o.discount_status === 'pending' && o.status !== 'shipped'
    && o.status !== 'cancelled' ? 'Chegirma kutmoqda' :
  Number(o.not_started_qty) > 0 && o.status !== 'shipped'
    && o.status !== 'cancelled' ? 'Chernovik'
  : (o.status === 'reserved' || o.status === 'to_ship')
  && Number(o.assigned_qty) > Number(o.in_warehouse_qty)
    ? 'Kutmoqda' : (STATUS[o.status] || o.status);

let rows = [], customers = [], managers = [], products = [], dests = [];
//  T/M ombor qoldig'i: turi · mahsulot · rang · mato · bo'sh soni.
//  Qator kataklari shundan quriladi — katalogdan emas.
let stock = [];
//  Zavodda ishlatilgan rang va matolar — zahiraga tanlash uchun.
let palette = { colors: [], fabrics: [] };
let status = '', canWrite = false;
// Ochiq buyurtma: sarlavha, qatorlar va biriktirilgan konverlar.
let cur = null;

async function boot(){
  canWrite = App.can('sales.manage');
  $('btnNew').innerHTML = canWrite
    ? `<button class="primary" onclick="openOrder(null)">Yangi buyurtma</button>` : '';
  const [c, p, d, sg, st] = await Promise.all([
    App.api('/api/units/customers'), App.api('/api/sales/products'),
    App.api('/api/sales/destinations'), App.api('/api/sales/suggest'),
    App.api('/api/sales/stock')]);
  customers = c.customers; managers = c.managers; products = p.rows;
  dests = d.rows; stock = st.rows;
  //  Zavodda umuman yo'q mahsulot ham ro'yxatga tushadi (izoh: SRC).
  //  Qatori SUN'IY: rangi ham, matosi ham yo'q — ular mijoz aytganda
  //  ma'lum bo'ladi va rang ro'yxati bosh() orqali o'zi ochiladi.
  const bor = new Set(stock.map((r) => r.product_id));
  for (const x of products)
    if (!bor.has(x.id))
      stock.push({ product_id: x.id, product: x.name, product_type: x.product_type,
                   color: null, fabric: null, free: 0, src: 'yoq' });
  //  Ro'yxatda faqat savdo xodimlari: filtr «kim yozdi» degan savolga
  //  javob beradi, zavodning hamma xodimi esa unga javob emas.
  if (!App.me()?.scope_own) {
    const savdochi = managers.filter((m) => m.is_sales);
    $('fMgr').hidden = !savdochi.length;
    $('fMgr').innerHTML = '<option value="">Barcha menejer</option>'
      + savdochi.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  }
  //  Zavodda ishlatilgan rang va matolar. Faqat ZAHIRA qatorida
  //  ishlatiladi: uning rangi hali yo'q, mijoz aytgani bo'yicha
  //  bo'yaladi. Qolgan hamma joyda rang konverning o'zidan keladi.
  palette = { colors: sg.colors, fabrics: sg.fabrics };
  drawChips();
  await load();
}

function drawChips(){
  $('chips').innerHTML = FILTERS.map(([k, name]) =>
    `<button class="${k === status ? 'primary' : ''}" onclick="setStatus('${k}')"
      >${esc(name)}</button>`).join('');
}
function setStatus(k){ status = k; drawChips(); load(); }

//  Ro'yxatdagi «Qayerda»: konverlar joyi bo'yicha guruhlangan holda
//  serverdan keladi (`places`), omborda turgani birinchi. Tsex nomi
//  ikkinchi qatorda — ro'yxat tor va bo'lim bilan tsex bitta qatorga
//  sig'masdi.
//
//  Ikkitadan ko'p joy bo'lsa qolgani «+N» bo'lib yig'iladi: buyurtma
//  ochilganda hammasi ko'rinadi («Konverlar qayerda»).
//
//  Konver biriktirilmagan bo'lsa katak BO'SH qoladi: «Yangi» holati buni
//  allaqachon aytadi va ikkinchi marta yozish ustunni shovqinga
//  to'ldirardi.
function joylar(o) {
  const list = o.places || [];
  if (!list.length) return '';
  const ko = list.slice(0, 2).map((x) => `<div><span class="tag${
    x.omborda ? ' ok' : ''}" style="font-size:11px">${esc(
      x.warehouse_code === 'TM' ? 'T/M ombor' : x.joy)}</span>
    <span class="muted" style="font-size:11px">${x.qty} ta</span>${x.shop
      ? `<div class="muted" style="font-size:11px">${esc(x.shop)}</div>` : ''}</div>`);
  if (list.length > 2)
    ko.push(`<div class="muted" style="font-size:11px">+${list.length - 2}</div>`);
  return ko.join('');
}

async function load(){
  const q = new URLSearchParams();
  if (status) q.set('status', status);
  if ($('fQ').value.trim()) q.set('q', $('fQ').value.trim());
  if ($('fMgr') && $('fMgr').value) q.set('manager_id', $('fMgr').value);
  rows = (await App.api('/api/sales/orders?' + q)).rows;

  $('tB').innerHTML = rows.length ? rows.map(o => {
    // Muddat o'tgan va hali yopilmagan buyurtma qizarib turadi.
    const late = o.days_left != null && o.days_left < 0
      && o.status !== 'shipped' && o.status !== 'cancelled';
    //  Qatorning O'ZI bosiladi: buyurtmani ochish uchun kichkina
    //  qalamchani nishonga olish shart emas.
    const yopiq = o.status === 'shipped' || o.status === 'cancelled'
               || o.status === 'to_ship' || !canWrite;
    return `<tr onclick="openOrder(${o.id})" style="cursor:pointer">
      <td><strong>${esc(o.order_no)}</strong></td>
      <td>${esc(o.customer_name)}${o.region
        ? `<div class="muted" style="font-size:12px">${esc(o.region)}</div>` : ''}</td>
      <td class="muted">${o.manager_name ? esc(o.manager_name) : '—'}</td>
      <td class="muted">${(o.ordered_on || '').slice(0, 10)}</td>
      <td class="muted">${o.due_on
        ? (late ? `<span class="tag bad">${(o.due_on).slice(0, 10)}</span>`
                : (o.due_on).slice(0, 10))
        : '—'}</td>
      <td class="num">${o.lines}</td><td class="num">${o.qty}</td>
      <td class="num">${money(o.amount)}</td>
      <td>${joylar(o)}</td>
      <td><span class="tag${o.status === 'cancelled' ? ' warn' : ''}"
        >${esc(statusOf(o))}</span></td>
      <!--  Yopilgan buyurtma tahrirlanmaydi — tugmasi ham boshqa:
            «ko'rish». Ochilganda u hujjat bo'lib chiqadi. -->
      <td class="num"><button onclick="openOrder(${o.id})"
        title="${yopiq ? 'Ko\'rish' : 'Tahrirlash'}">${yopiq ? '👁' : '✎'}</button></td>
    </tr>`;
  }).join('') : '<tr><td class="muted" colspan="11">Buyurtma yo\'q</td></tr>';
}

// ─────────────────────────────────────────────────────── BUYURTMA TAHRIRI
//
//  Yangi buyurtma avval saqlanadi, keyin konver biriktiriladi: konver
//  buyurtmaning QATORIGA biriktiriladi va qator saqlanmaguncha mavjud
//  emas. Shuning uchun saqlangandan keyin oyna shu buyurtma bilan
//  qaytadan ochiladi.
async function openOrder(id){
  if (id) {
    cur = await App.api('/api/sales/orders/' + id);
  } else {
    cur = { order: { status: 'new', ordered_on: new Date().toISOString().slice(0, 10) },
            items: [], units: [] };
  }
  draw();
}

//  ── «QAYERDA» O'ZI YANGILANADI ────────────────────────────────────────
//
//  Konver bo'limdan bo'limga o'tganda savdo xodimi buni ko'rishi kerak —
//  sahifani qayta ochib o'tirmasin. Shuning uchun ochiq buyurtma har
//  daqiqada bir marta qayta o'qiladi.
//
//  BITTA zanjir: har chizishda eski taymer o'chiriladi. Taymer ichida
//  ham tekshiriladi — boshqa buyurtma ochilgan yoki bron oynasi
//  ustiga chiqqan bo'lsa chizilmaydi. (Jurnaldagi cheksiz so'rov
//  shundan kelib chiqqandi: ikki funksiya bir-birini chaqirardi.)
let tick = null;
const stopTick = () => { if (tick) { clearTimeout(tick); tick = null; } };

function planTick() {
  stopTick();
  const id = cur?.order?.id;
  //  Faqat kutilayotgan buyurtma: hammasi omborda bo'lsa o'zgaradigan
  //  narsa yo'q va bekorga so'rov yuborilmaydi.
  if (!id || !(cur.units || []).some(u => u.status === 'production')) return;
  tick = setTimeout(async () => {
    tick = null;
    if (cur?.order?.id !== id || !document.querySelector('.order-view')) return;
    try {
      cur = await App.api('/api/sales/orders/' + id);
      draw();
    } catch { /* aloqa uzilgan bo'lsa keyingi ochilishda ko'rinadi */ }
  }, 60000);
}

//  ── YOPILGAN BUYURTMA: YUK XATI ───────────────────────────────────────
//
//  Omborga yuborilgan, chiqib ketgan yoki bekor qilingan buyurtma
//  TAHRIRLANMAYDI, shuning uchun uni kiritish shaklida ko'rsatish
//  noto'g'ri: o'chirilgan ochilma ro'yxatlar «buzilgan forma» bo'lib
//  ko'rinadi. Bu yerda u qog'ozdagi YUK XATI kabi o'qiladi.
//
//  Hujjatning o'zi `yukxati.js` da — uni ombor mudirining sahifasi
//  (`yukxati.html`) ham chizadi va qog'ozda ikkalasi bir xil chiqishi
//  kerak. Shu sababdan bu yerda matn ham, tartib ham takrorlanmaydi.
//
//  Balans faqat SHU ekranda: menejer hujjatni ochganda mijozning qarzini
//  ko'rib turadi, qog'ozga esa chiqmaydi (`yukxati.js`, `.no-print`).
function docHtml(o) {
  const c = customers.find(x => x.id === o.customer_id);
  return Waybill.html({ order: { ...o, customer_name: o.customer_name || c?.name },
                        items: cur.items, keeper: cur.keeper,
                        balance: c?.balance });
}

//  ── KONVERLAR QAYERDA (faqat EKRANDA) ─────────────────────────────────
//
//  Buyurtma omborga yuborilgan yoki hali kutilayotgan bo'lsa, savdo
//  xodimi «mahsulotim qayerda» degan savolga shu yerdan javob beradi.
//  Ilgari buning uchun ombor sahifasiga kirish kerak edi — u yerda esa
//  faqat T/M omborga TUSHGANI ko'rinadi: hali tsexda yurgan konver
//  ombor qoldig'ida yo'q va savdo uni topa olmasdi.
//
//  Tahrir ko'rinishida bu «Qayerda» ustuni (`qayerda`), hujjat
//  ko'rinishida esa ustun qo'shib bo'lmaydi: yuk xati qog'ozga chiqadi
//  va unda ichki ish yozuvi turmaydi. Shuning uchun alohida kartochka
//  va `.no-print` — balans bilan bir xil sababdan.
//
//  Omborga tushgach bo'lim yozilmaydi, «T/M ombor» deb turadi: konver
//  endi tsexda emas, javonda. Sanasi ham shunda «turibdi» bo'ladi.
//
//  Chiqib ketgan va bekor qilingan buyurtmada ko'rsatilmaydi: mahsulot
//  zavodda yo'q, «qayerda» degan savol ham qolmaydi.
// ═══════════════════════════════════════ CHEGIRMA TASDIG'I
//
//  ★ Narxdan past yozilgan buyurtma DIREKTOR tasdiqlagunicha omborga
//  o'tmaydi (zavod qarori, 2026-09). Buyurtma yozilishini to'xtatish
//  yomon bo'lardi — menejer mijoz bilan gaplashib turibdi; chiqarishni
//  to'xtatish esa to'g'ri: qaror qilinmaguncha qog'oz ham, qarz ham
//  yozilmaydi.
//
//  Kartochka `.no-print`: bu ish quroli, hujjatning o'zi emas — mijoz
//  qo'liga beriladigan yuk xatiga korxonaning ichki qarori chiqmaydi.
function chegirmaCard(o) {
  if (!o.discount_status) return '';
  const ruxsat = App.can('sales.discount');
  const H = { pending: ['warn', 'Chegirma tasdiq kutmoqda'],
              approved: ['ok', 'Chegirma tasdiqlandi'],
              rejected: ['bad', 'Chegirma rad etildi'] };
  const [cls, matn] = H[o.discount_status] || ['', o.discount_status];
  return `<div class="card no-print" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <span class="tag ${cls}">${matn}</span>
        <div class="muted" style="font-size:12px;margin-top:6px">
          ${o.discount_status === 'pending'
            ? 'Narxdan past yozilgan — direktor tasdiqlagunicha omborga yuborilmaydi.'
            : `${esc(o.discount_by_name || '')}${o.discount_note
                ? ' · ' + esc(o.discount_note) : ''}`}</div>
      </div>
      ${o.discount_status === 'pending' && ruxsat ? `<div class="row" style="gap:8px">
        <button class="primary" onclick="chegirma(true)">Tasdiqlash</button>
        <button onclick="chegirma(false)">Rad etish</button></div>` : ''}
    </div></div>`;
}

async function chegirma(ok) {
  //  Rad etishda SABAB majburiy: menejer nega bo'lmaganini bilmasa,
  //  o'sha narxni ertaga yana yozardi (konver so'rovi bilan bir xil).
  let note = null;
  if (!ok) {
    note = prompt('Rad etish sababi?');
    if (note == null || !note.trim()) return;
  }
  const id = cur.order.id;
  try {
    await App.api(`/api/sales/orders/${id}/discount`, { method: 'POST',
      body: JSON.stringify({ approve: ok, note }) });
    await openOrder(id);
    await load();
  } catch (e) { alert(e.message); }
}

function trackCard(o) {
  const list = cur.units || [];
  if (!list.length || o.status === 'shipped' || o.status === 'cancelled') return '';
  //  Qatorning O'ZI olinadi, faqat nomi emas: zavodda bitta nom bir
  //  nechta guruhda uchraydi — «Zero» ham penal, ham kamod, ham stul
  //  bo'ladi va faqat nomi yozilsa uchta qator bir xil ko'rinardi
  //  («Zero · Orex» uch marta). Yuk xatining QATORLARIDA turi
  //  allaqachon yozilib turadi (yukxati.js) — bu kartochka undan
  //  orqada qolgandi.
  const qat = (id) => cur.items.find(x => x.id === id) || {};
  return `<div class="card no-print">
    <h2>Konverlar qayerda</h2>
    <p class="muted" style="font-size:12px;margin:-6px 0 14px">
      ish uchun \u2014 yuk xatiga chiqmaydi \u00b7 o'zi yangilanib turadi</p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>K&#8470;</th><th>Mahsulot</th><th>Qayerda</th>

//  Mijoz tanlanganda balansi ostida chiqadi. Zavod qoidasi: qarzga
//  faqat CHIQIB KETGAN mahsulot qo'shiladi — buyurtma yozilgani ham,
//  bron qo'yilgani ham hali qarz emas.
function drawBalance() {
  const el = $('oBal'); if (!el) return;
  const c = customers.find(x => String(x.id) === $('oCust').value);
  if (!c) { el.innerHTML = ''; return; }
  const bal = Number(c.balance) || 0;
  el.innerHTML = `Balans: <b class="${bal > 0 ? 'tag bad' : ''}"
      style="font-size:12px">${bal > 0 ? money(bal) + ' $ qarz' : 'qarz yo\'q'}</b>${
    Number(c.opening_debt) ? ` \u00b7 boshlang'ich ${money(c.opening_debt)}` : ''}${
    c.phone ? ` \u00b7 ${esc(c.phone)}` : ''}`;
}

//  Manzil faqat kerak bo'lgan yo'lda ko'rinadi (`order_destinations.needs_address`).
function drawAddr() {
  const box = $('oAddrBox'); if (!box) return;
  const d = dests.find(x => x.code === $('oDest').value);
  box.hidden = !d || !d.needs_address;
  const inp = $('oAddr');
  if (inp) inp.classList.toggle('need', !!(d && d.needs_address && !inp.value.trim()));
}

//  ── QATOR KATAKLARI ────────────────────────────────────────────────────
//
//  Mahsulot → Rangi → Matosi. Birinchi MAHSULOT tanlanadi (turi uning
//  yonida yozilib turadi) — menejer mijozdan «Milano penal» deb eshitadi,
//  «penal» deb emas. Hammasi ro'yxatdan: qo'lda yozish yo'q, chunki
//  ro'yxatda bo'lmagan rang hech qachon konver topmasdi.
//
//  Uch manba, shu tartibda:
//    · T/M omborda    — darrov beriladi;
//    · Zahirada       — kutish bo'limida buyurtma kutmoqda, RANGI HALI
//                       YO'Q: mijoz aytgan rangga bo'yaladi, shuning
//                       uchun zahiraga ISTALGAN rang buyurtma qilinadi;
//    · Ishlab chiqarishda — yo'lda, rangi allaqachon ma'lum.
//
//  Vitrina yo'q: do'kondagi mahsulot ko'rgazmada turadi, sotuv T/M
//  ombordan ketadi.
//  ★ TO'RTINCHI GURUH: ZAVODDA YO'Q (zavod qarori, 2026-09).
//
//  Ro'yxat faqat MAVJUD konverlardan tuzilardi va zavodda umuman yo'q
//  mahsulotni qatorga yozib bo'lmasdi — menejer buyurtmani tashlab
//  yuborardi. Holbuki stol va stulga endi ishlab chiqarishga so'rov
//  yoziladi, lekin uning tugmasi QATOR ichida turadi: qator yozilmasa
//  tugmaga ham yetib bo'lmasdi.
//
//  Endi hamma mahsulot ro'yxatda, eng oxirgi guruhda. Nomi rostini
//  aytadi: bu «bor» emas, «so'rov yoziladi» — menejer buni tanlashdan
//  OLDIN ko'radi.
const SRC = [['fg', 'T/M omborda'], ['stock', 'Zahirada'],
             ['production', 'Ishlab chiqarishda'], ['yoq', "Zavodda yo'q"]];

//  ★ RANGI YO'Q KONVER HAR QANDAY RANGGA YARAYDI (zavod qarori).
//
//  Ishlab chiqarishdagi konver rangsiz tug'iladi — zahira ham,
//  bo'limsiz kiritilgan «boshlanmagan» konver ham: rang mijoz aytganda
//  ma'lum bo'ladi va o'shanda bo'yaladi. Shuning uchun menejer rang
//  tanlagan zahoti ular ro'yxatdan TUSHIB KETMAYDI.
//
//  Ilgari tushib ketardi va menejer «bu rangda konver yo'q» degan
//  javobni olardi, holbuki zavodda o'sha mahsulotning bo'yalmagan
//  partiyasi turgan bo'lardi — buyurtma bekorga rad etilardi.
//
//  T/M OMBORDAGI rangsiz konverga bu tegishli EMAS: u tayyor turibdi
//  va rangi allaqachon bor, shunchaki yozilmagan. Uni «istalgan rangga
//  yaraydi» deb ko'rsatish yolg'on va'da bo'lardi.
const bosh = (r) => !r.color && r.src !== 'fg';

//  Shu qatorga tegishli qoldiq satrlari
const rowsFor = (it, level) => stock.filter(r =>
  (level < 2 || r.product_id === Number(it.product_id))
  && (level < 3 || bosh(r) || (r.color || '') === (it.color || '')));

//  Rangi tanlanadigan konver shu mahsulotda bormi — rang ro'yxati
//  shunga qarab ochiladi.
const rangTanlanadi = (it) => it.product_id
  && rowsFor(it, 2).some((r) => r.src === 'stock' || bosh(r));

//  Qator QAYERDAN yopiladi — HAMMA manbasi bilan. Ilgari bittasi
//  yozilardi va omborda bori ko'rinib, ishlab chiqarishdagisi
//  yashirinib qolardi: menejer «T/M omborda bor» ni o'qib, yo'ldagi
//  konverni olishni taklif qilinmagan deb o'ylardi. Holbuki u ham
//  biriktiriladi — «Konver» oynasida omborga eng yaqini tepada turadi.
//
//  Rang HALI TANLANMAGAN bo'lsa mahsulotning hamma satri qaraladi:
//  aks holda rangsiz satrlar bilan solishtirilib, to'la ombor ustida
//  «omborda yo'q» deb yozilardi.
const SRC_HINT = { fg: 'T/M omborda bor', stock: 'zahirada',
                   production: 'ishlab chiqarishda',
                   yoq: "zavodda yo'q — ishlab chiqarishga so'rov yoziladi" };
function srcHint(it) {
  if (!it.product_id) return '';
  const rows = rowsFor(it, it.color ? 3 : 2);
  const bor = SRC.map(([s]) => s).filter(s => rows.some(r => r.src === s))
    .map((s) => {
      //  «Bor» bilan «bo'yab beramiz» bir xil javob emas: manbada
      //  faqat rangsiz konver bo'lsa menejer buni bilishi kerak.
      //  «Zavodda yo'q» da rang haqida gap yuritilmaydi: u yerda
      //  mahsulotning o'zi yo'q, rangi esa so'rov yozilganda tanlanadi.
      if (s === 'yoq') return SRC_HINT[s];
      const g = rows.filter(r => r.src === s);
      return g.every(bosh) ? SRC_HINT[s] + ' \u2014 rangi tanlanadi' : SRC_HINT[s];
    });
  return bor.length ? bor.join(' \u00b7 ') : 'Bu rangda konver yo\'q';
}

//  Ro'yxat: qiymat birinchi uchragan manbada qoladi — omborda bori
//  «T/M omborda» guruhida turadi va quyida takrorlanmaydi.
function listOf(rows, key) {
  const out = [];
  for (const [src] of SRC)
    for (const r of rows.filter(x => x.src === src)) {
      const v = r[key] ?? '';
      const e = out.find(x => String(x.v) === String(v));
      if (e) { if (e.src === src) e.free += r.free; }
      else out.push({ src, v, free: r.free,
                      name: key === 'product_id' ? `${r.product} · ${r.product_type}` : '' });
    }
  return out;
}

//  Bo'sh qiymat ham ma'noli: konverda rang yoki mato yozilmagan bo'ladi.
const nameOf = (x, key) => key === 'product_id' ? x.name
  : x.v !== '' ? x.v
  : (key === 'color' ? '— rangsiz —' : '— matosiz —');

//  Katak. Saqlangan qiymat ro'yxatda bo'lmasa (konver sotilib ketgan,
//  eski buyurtma ochilgan) u oxirgi guruhda turadi — qator o'z
//  qiymatini yo'qotmasin.
function cell(i, key, rows, val, dis, tanlov) {
  const list = listOf(rows, key);
  const sel = (v) => String(v) === String(val ?? '') ? ' selected' : '';
  const grp = ([src, label]) => {
    const g = list.filter(x => x.src === src);
    return g.length ? `<optgroup label="${label}">${g.map(x =>
      `<option value="${esc(x.v)}"${sel(x.v)}>${esc(nameOf(x, key))}</option>`)
      .join('')}</optgroup>` : '';
  };
  //  RANGI HALI YO'Q KONVERGA RANG TANLANADI (zahira ham, ishlab
  //  chiqarishdagi bo'yalmagan partiya ham): mijoz aytgan rangga
  //  bo'yaladi. Shuning uchun bu yerda zavodda ishlatilgan ranglarning
  //  hammasi taklif qilinadi — qo'lda yozish baribir yo'q va YANGI
  //  rang bu yerdan kirmaydi (tekshiruv serverda, `modules/sales.js`).
  const pal = tanlov && key !== 'product_id'
    ? (key === 'color' ? palette.colors : palette.fabrics)
        .filter(v => !list.some(x => String(x.v) === v)) : [];
  const has = list.some(x => String(x.v) === String(val ?? '')) || pal.includes(val);
  return `<select ${dis} onchange="setPick(${i},'${key}',this.value)" style="width:100%">
    <option value=""${val == null || val === '' ? ' selected' : ''}>— tanlang —</option>
    ${SRC.map(grp).join('')}
    ${pal.length ? `<optgroup label="${key === 'color' ? 'Rangi' : 'Matosi'} tanlanadi">${pal.map(v =>
        `<option value="${esc(v)}"${sel(v)}>${esc(v)}</option>`).join('')}</optgroup>` : ''}
    ${!has && val ? `<optgroup label="Ro'yxatda yo'q"><option value="${esc(val)}" selected
        >${esc(key === 'product_id'
            ? (products.find(x => x.id === Number(val)) || {}).name || val
            : val)}</option></optgroup>` : ''}
  </select>`;
}

//  Qator qaysi konverlarga biriktirilgan va ular QAYERDA turibdi.
//  Bitta qatorda bir nechta konver bo'lishi mumkin, shuning uchun
//  joylar guruhlanadi: «4 ta · T/M ombor», «2 ta · Arra (Korpus tsexi)».
//  T/M ombor qisqa yoziladi: to'liq nomi («Tayyor mahsulot ombori»)
//  tor katakda uch qatorga bo'linib ketardi.
const joyOf = (u) => u.status === 'fg'
  ? (u.warehouse_code === 'TM' || !u.warehouse ? 'T/M ombor' : u.warehouse)
  : `${u.section || 'boshlanmagan'}${u.shop ? ` \u00b7 ${u.shop}` : ''}`;

function qayerda(itemId) {
  if (!itemId) return '';
  const list = (cur.units || []).filter(u => u.order_item_id === itemId);
  if (!list.length) return '<span class="muted">konver biriktirilmagan</span>';
  const jam = new Map();
  for (const u of list) {
    const k = joyOf(u);
    jam.set(k, (jam.get(k) || 0) + Number(u.qty || 0));
  }
  return [...jam].map(([joy, n]) => {
    const omborda = joy.toLowerCase().includes('ombor');
    return `<div><span class="tag${omborda ? ' ok' : ''}"
      style="font-size:11px">${esc(joy)}</span> <span class="muted">${n} ta</span></div>`;
  }).join('');
}

function drawItems(){
  //  Yopilgan buyurtmada jadval YO'Q — uning o'rnida yuk xati turadi
  //  (`docHtml`), qatorlari ham o'sha yerda chiziladi.
  if (!$('tI')) return;
  const dis = '';
  $('tI').innerHTML = cur.items.length ? cur.items.map((it, i) => {
    const p = products.find(x => x.id === Number(it.product_id));
    const z = rangTanlanadi(it);
    //  Mahsulot QAYERDAN keladi — soni emas. Bo'sh dona soni tanlash
    //  paytida chalg'itadi: menejer mijoz so'ragan miqdorni yozadi,
    //  konverdagi qolgan dona esa boshqa mijozniki. Aniq soni bron
    //  oynasida, har konverning yonida turadi.
    const summa = (Number(it.qty) || 0) * (Number(it.unit_price) || 0);

    return `<tr data-i="${i}">
      <td>${cell(i, 'product_id', stock, it.product_id, dis, false)}
        ${it.product_id ? `<div class="muted" style="font-size:11px">${
          esc(srcHint(it))}</div>` : ''}</td>
      <td>${cell(i, 'color',  rowsFor(it, 2), it.color, dis, z)}</td>
      <td>${cell(i, 'fabric', rowsFor(it, 3), it.fabric, dis, z)}</td>
      <td class="num"><input type="number" min="1" value="${it.qty ?? 1}"
            style="text-align:right" oninput="setField(${i},'qty',this.value)">
        ${p ? `<div class="muted" style="font-size:11px">${esc(p.uom || '')}</div>` : ''}</td>
      <td class="num"><input type="number" step="0.01" value="${it.unit_price ?? ''}"
            style="text-align:right${past(it) ? ';border-color:var(--bad)' : ''}"
            oninput="narxYoz(${i}, this)">
        <div class="hint" style="font-size:11px${
          past(it) ? ';color:var(--bad)' : ''}">${chegara(it)}</div></td>
      <td class="num">${summa ? `<b>${money(summa)}</b>`
        : '<span class="muted">—</span>'}</td>
      <td style="font-size:12px">${qayerda(it.id)}</td>
      <!--  Tugmalar ikki qatorga tushishi mumkin: tor ekranda ham
            jadvaldan chiqib ketmasin. -->
      <td class="num"><div class="row" style="gap:6px;justify-content:flex-end;
           flex-wrap:wrap">${it.id
          ? `<button onclick="openPick(${it.id})">Konver</button>` : ''}
        <button onclick="delItem(${i})">✕</button></div></td>
    </tr>`;
  }).join('') : `<tr><td class="muted" colspan="8">Qator qo\'shilmagan</td></tr>`;

  //  Jami summa: yuk xatida mijoz shu raqamni ko'radi. Hisob BITTA
  //  joyda (`jamiYoz`) — narx yozilganda ham shu chaqiriladi.
  jamiYoz();
}

//  Katak tanlanganda undan KEYINGILARI tozalanadi: eski rang yangi
//  mahsulotga to'g'ri kelmaydi va jimgina noto'g'ri qator bo'lib qolardi.
function setPick(i, key, v){
  const it = cur.items[i];
  if (key === 'product_id') Object.assign(it, { product_id: v || null, color: '', fabric: '' });
  else if (key === 'color') Object.assign(it, { color: v, fabric: '' });
  else it.fabric = v;
  drawItems();
}

//  Konver qayerda turibdi — bitta joyda yoziladi, uni ikkita ro'yxat
//  ham ishlatadi (bron qilinganlar va nomzodlar).
function where(u) {
  if (u.status === 'fg')
    return `<span class="tag ok">${esc(u.warehouse || 'T/M ombor')}</span>`;
  return `<span class="tag">${esc(u.section || 'boshlanmagan')}</span>${
    u.is_stock ? ' <span class="tag">zahira</span>'
               : ' <span class="muted" style="font-size:11px">ishlanmoqda</span>'}`;
}

// ═══════════════════════════════════════════════ NARX CHEGARASI
//
//  ★ ZAVOD QARORI (2026-09): narxdan PAST sotilmaydi, faqat direktor
//  ruxsati bilan. Menejer qator yozganda narx O'ZI to'ladi — uning
//  narx turidan (ulgurji yoki chakana, `worker_roles.price_kind`).
//  Ekranda BITTA raqam turadi: ulgurji menejer chakana narxni
//  ko'rmaydi va aksincha.
//
//  Chegara SERVERDAN keladi (`/api/sales/products` dagi `price`) —
//  ro'yxat klientda quriladi, ya'ni bu yerdagisi faqat KO'RINISH.
//  Tekshiruv baribir serverda: qo'lda yuborilgan past narx o'sha
//  yerda tutiladi va buyurtma tasdiq kutadi.
const narxi = (pid) => {
  const p = products.find((x) => x.id === Number(pid));
  return p && p.price != null ? Number(p.price) : null;
};

//  Qator yozilgan PAYTDAGI chegara ustun turadi: narxlar keyin
//  o'zgarsa allaqachon tasdiqlangan qator qaytadan «past» bo'lib
//  qolmasligi kerak (serverdagi `price_floor` bilan bir xil qoida).
const chegarasi = (it) =>
  it.price_floor != null ? Number(it.price_floor) : narxi(it.product_id);

const past = (it) => {
  const f = chegarasi(it), v = Number(it.unit_price);
  return f != null && it.unit_price !== '' && it.unit_price != null && v < f;
};

//  Chegara raqamning OSTIDA yoziladi: menejer nega qizil ekanini
//  o'ylab o'tirmasin. Narxi qo'yilmagan mahsulotda chegara yo'q va
//  katak ham jim turadi — bo'lmagan raqamni majburlab bo'lmaydi.
const chegara = (it) => {
  const f = chegarasi(it);
  return f == null ? '' : `eng kami ${money(f)}`;
};

//  ★ NARX YOZILGANDA JADVAL QAYTA CHIZILMAYDI: har harfda chizilsa
//  kursor katakdan uchib ketardi. Faqat o'sha katakning belgisi va
//  «Jami» yangilanadi.
function narxYoz(i, el) {
  cur.items[i].unit_price = el.value;
  const it = cur.items[i];
  el.style.borderColor = past(it) ? 'var(--bad)' : '';
  const hint = el.nextElementSibling;
  if (hint) {
    hint.textContent = chegara(it);
    hint.style.color = past(it) ? 'var(--bad)' : '';
  }
  //  Qator summasi va «Jami» ham darrov yangilanadi: menejer
  //  mijozga aytadigan raqam shu.
  const td = el.closest('td')?.nextElementSibling;
  const summa = (Number(it.qty) || 0) * (Number(it.unit_price) || 0);
  if (td) td.innerHTML = summa ? `<b>${money(summa)}</b>`
    : '<span class="muted">&mdash;</span>';
  jamiYoz();
}

function jamiYoz() {
  const jami = cur.items.reduce((a, it) =>
    a + (Number(it.qty) || 0) * (Number(it.unit_price) || 0), 0);
  if ($('tIf')) $('tIf').innerHTML = jami ? `<tr>
    <td colspan="5"><b>Jami</b></td>
    <td class="num"><b>${money(jami)}</b></td><td></td><td></td></tr>` : '';
}

function setField(i, k, v){
  cur.items[i][k] = v;
  //  Mahsulot tanlanganda narx O'ZI to'ladi: menejer uni prays-listdan
  //  qidirib o'tirmasin. Qo'lda yozilgani almashtirilmaydi — kelishilgan
  //  narx bo'lishi mumkin.
  if (k === 'product_id') {
    const f = narxi(v);
    if (f != null && !cur.items[i].unit_price) cur.items[i].unit_price = f;
    cur.items[i].price_floor = f;
    drawItems();
  }
}
function addItem(){ cur.items.push({ qty: 1 }); drawItems(); }
function delItem(i){
  if (Number(cur.items[i].assigned_qty) > 0)
    return alert("Avval konverni ajrating");
  cur.items.splice(i, 1); drawItems();
}

const close_ = () => { stopTick(); $('modalRoot').innerHTML = ''; cur = null; };

async function save(){
  const body = {
    order_no: $('oNo').value.trim() || null,
    customer_id: Number($('oCust').value) || null,
    manager_id: Number($('oMgr').value) || null,
    ordered_on: $('oOn').value || null,
    due_on: $('oDue').value || null,
    note: $('oNote').value.trim() || null,
    ship_to: $('oDest').value || null,
    address: $('oAddr').value.trim() || null,
    receiver_phone: $('oPhone').value.trim() || null,
    items: cur.items.map(it => ({ id: it.id, product_id: Number(it.product_id) || null,
      qty: Number(it.qty) || 1, color: it.color || null, fabric: it.fabric || null,
      unit_price: it.unit_price === '' || it.unit_price == null ? null : Number(it.unit_price),
      note: it.note || null })),
  };
  if (!body.customer_id) return alert('Mijoz tanlanmagan');
  if (body.items.some(i => !i.product_id)) return alert('Qatorda mahsulot tanlanmagan');
  try{
    if (cur.order.id) {
      await App.api('/api/sales/orders/' + cur.order.id,
        { method: 'PATCH', body: JSON.stringify(body) });
      await openOrder(cur.order.id);
    } else {
      const o = await App.api('/api/sales/orders',
        { method: 'POST', body: JSON.stringify(body) });
      await openOrder(o.id);
    }
    load();
  }catch(e){ alert(e.message); }
}

//  Buyurtmani ombor mudiriga topshirish. Shundan keyin mahsulotni
//  zavoddan chiqarish uning ishi: u ko'zi bilan ko'rib tasdiqlaydi.
async function savePayment(){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/payment`, { method: 'PATCH',
      body: JSON.stringify({ payment_on: $('oPay').value || null }) });
    cur.order.payment_on = $('oPay').value || null;
    alert($('oPay').value ? 'Pul kirim sanasi saqlandi' : 'Sana tozalandi');
    load();
  }catch(e){ alert(e.message); }
}

async function sendToWh(){
  if (!confirm('Buyurtma ombor mudiriga yuborilsinmi?\n\n' +
    'Shundan keyin u tahrirlanmaydi — kerak bo\'lsa qaytarib olasiz.')) return;
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/send`, { method: 'POST' });
    await openOrder(cur.order.id);
    load();
  }catch(e){ alert(e.message); }
}

async function unsendWh(){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/unsend`, { method: 'POST' });
    await openOrder(cur.order.id);
    load();
  }catch(e){ alert(e.message); }
}

async function cancelOrder(){
  if (!confirm('Buyurtma bekor qilinsinmi?')) return;
  try{
    await App.api('/api/sales/orders/' + cur.order.id,
      { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
    close_(); load();
  }catch(e){ alert(e.message); }
}

// ──────────────────────────────────────────────── KONVER BIRIKTIRISH OYNASI
//
//  Ro'yxatda faqat bo'sh konver turadi: boshqa buyurtmada bandi server
//  javobiga umuman tushmaydi. Rang va matosi mos kelgani tepada.
let pick = null;

async function openPick(itemId){
  pick = await App.api(`/api/sales/orders/${cur.order.id}/candidates?item_id=${itemId}`);
  const it = cur.items.find(x => x.id === itemId);
  const left = Math.max(0, (Number(it?.qty) || 0) - (Number(it?.assigned_qty) || 0));
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closePick()">
      <div class="modal" style="max-width:760px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <h1 style="margin:0">Konver biriktirish</h1>
          <button onclick="closePick()">Orqaga</button></div>
        <p class="muted" style="margin-bottom:16px">${esc(it?.product || '')}${
          it?.color ? ' · ' + esc(it.color) : ''}${it?.fabric ? ' · ' + esc(it.fabric) : ''}
          · yopilmagani: <b>${left}</b> ${esc(it?.uom || '')}</p>
        <!--  Tartib: avval T/M omborda turgani, keyin OMBORGA ENG YAQINI.
              Mijoz tezroq oladigan konver tepada tursin. -->
        <div style="overflow-x:auto"><table>
          <thead><tr><th>K&#8470;</th><th>Qayerda</th><th>Omborga</th>
            <th>Rang</th><th>Mato</th>
            <th class="num">Bo'sh</th><th class="num" style="width:90px">Olinadi</th>
            <th></th></tr></thead>
          <tbody>${pick.rows.length ? pick.rows.map(u => `<tr>
            <td><strong>${esc(u.conveyor_no)}</strong></td>
            <td>${where(u)}</td>
            <!--  ★ KECH KELADIGAN KONVER QIZIL BO'LIB TURADI. Server
                  bunday bronni qabul qilmaydi (modules/sales.js,
                  assertMuddat), lekin menejer buni BOSISHDAN oldin
                  ko'rishi kerak — aks holda u ro'yxat bo'ylab yurib,
                  har birida bitta xabarni o'qib chiqardi. Ro'yxatdan
                  olib tashlanmadi: chiqish sanasini keyinga surish ham
                  yo'l va u menejerning qaroriga qoladi. -->
            <td>${u.status === 'fg' ? '<span class="tag ok">turibdi</span>'
              : u.eta ? `<span class="${u.late ? 'tag bad' : ''}">${d8(u.eta)}</span>${
                  u.late ? `<div class="muted" style="font-size:11px">chiqish
                    sanasidan keyin</div>`
                  : u.eta_src && u.eta_src !== 'fakt'
                  ? `<div class="muted" style="font-size:11px">${esc(u.eta_src)}</div>` : ''}`
              : '<span class="muted">—</span>'}</td>
            <td class="${u.color_ok ? '' : 'muted'}">${u.color ? esc(u.color) : '—'}</td>
            <td class="${u.fabric_ok ? '' : 'muted'}">${u.fabric ? esc(u.fabric) : '—'}</td>
            <!-- Konverda nechta bo'sh dona qolgani -->
            <td class="num"><b>${u.free_qty}</b></td>
            <!--  Shu qatorga allaqachon olingan bo'lsa u yuqorida turadi
                  va shu yerdan qaytariladi: buyurtma ekranida alohida
                  «bron qilingan konverlar» ro'yxati yo'q. -->
            <td class="num">${u.mine
              ? `<b>${u.mine}</b> <span class="muted" style="font-size:11px">olingan</span>`
              : `<input id="q${u.id}" type="number" min="1" max="${u.free_qty}"
                   value="${Math.max(1, Math.min(u.free_qty, left || u.free_qty))}"
                   style="max-width:80px;text-align:right">`}</td>
            <td class="num" style="white-space:nowrap">${u.mine
              ? `<button onclick="unassign(${u.id})">Qaytarish</button>`
              : `<button class="primary" onclick="assign(${u.id})">Olish</button>`}</td>
          </tr>`).join('')
            : `<tr><td class="muted" colspan="8">Bo'sh konver yo'q —
                 T/M omborda ham, zahirada ham, ishlab chiqarishda ham</td></tr>`}</tbody>
        </table></div>
        <!--  ★ ISHLAB CHIQARISHGA SO'ROV (zavod qarori, 2026-09).
              Mijoz so'ragan stol yoki stul zavodda umuman bo'lmasligi
              mumkin va ilgari javob bitta edi — rad etish. Endi
              menejer so'rov yozadi: konver BU YERDA ochilmaydi,
              so'rov rahbariyat navbatiga tushadi va tasdiqlangach
              konver O'ZI shu qatorga biriktiriladi.

              Tugma faqat qator YOPILMAGANDA chiqadi: hammasi
              biriktirilgan bo'lsa so'raladigan narsa qolmaydi.
              Sp, penal va kamodda umuman chizilmaydi (belgi guruhda,
              server ham tekshiradi). -->
        ${pick.item.can_request && left > 0 ? `
        <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
          <div class="row" style="justify-content:space-between;gap:12px;
               flex-wrap:wrap;align-items:center">
            <div>
              <b>Zavodda yo'qmi?</b>
              <div class="muted" style="font-size:12px;margin-top:2px">
                Ishlab chiqarishga so'rov yuboriladi — rahbariyat
                tasdiqlagach konver shu qatorga biriktiriladi</div>
            </div>
            <div class="row" style="gap:8px">
              <input id="soQty" type="number" min="1" value="${left}"
                     style="max-width:90px;text-align:right">
              <button class="primary" onclick="soravYubor()">So'rov yuborish</button>
            </div>
          </div>
        </div>` : ''}
      </div></div>`;
}

const closePick = () => { pick = null; draw(); };

//  So'rov yuborildi — konver HALI ochilmadi: u rahbariyat navbatida
//  turadi. Menejerga aynan shu aytiladi, aks holda u qatorni tayyor
//  deb o'ylab, mijozga sana aytib qo'yardi.
async function soravYubor() {
  const n = Number($('soQty')?.value) || null;
  try {
    const r = await App.api(`/api/sales/orders/${cur.order.id}/request-unit`,
      { method: 'POST', body: JSON.stringify({ item_id: pick.item.id, qty: n }) });
    closePick();
    alert(`So'rov yuborildi: ${r.conveyor_no} · ${r.qty} ta.\n`
      + `Rahbariyat tasdiqlagach konver shu qatorga biriktiriladi.`);
    load();
  } catch (e) { alert(e.message); }
}

async function assign(unitId){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/assign`, { method: 'POST',
      body: JSON.stringify({ item_id: pick.item.id, unit_id: unitId,
                             qty: Number($('q' + unitId).value) || null }) });
    cur = await App.api('/api/sales/orders/' + cur.order.id);
    await openPick(pick.item.id);
    load();
  }catch(e){ alert(e.message); }
}

//  Bronni qaytarish — bron oynasining o'zidan. Oyna yopilmaydi:
//  menejer odatda birini qaytarib, boshqasini oladi.
async function unassign(unitId){
  try{
    await App.api(`/api/sales/orders/${cur.order.id}/unassign`, { method: 'POST',
      body: JSON.stringify({ item_id: pick?.item?.id || null, unit_id: unitId }) });
    cur = await App.api('/api/sales/orders/' + cur.order.id);
    if (pick?.item?.id) await openPick(pick.item.id);
    else draw();
    load();
  }catch(e){ alert(e.message); }
}

App.start(boot, 'sales.view', 'sales.manage');
</script>
