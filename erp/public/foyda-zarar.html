<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foyda-zarar · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Foyda-zarar</h1></div>
  <div class="row"><span class="row" id="erpUser"></span></div>
</div>

<div class="card">
  <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
    <div><label>Oydan</label><input id="fFrom" type="month" onchange="load()"></div>
    <div><label>Oygacha</label><input id="fTo" type="month" onchange="load()"></div>
    <button onclick="davr(0)">Shu yil</button>
    <button onclick="davr(-1)">O'tgan yil</button>
    <button onclick="exportCsv()">Excelga yuklash</button>
  </div>
</div>

<div class="grid g3" style="margin-top:16px">
  <div class="card"><h2>Savdo</h2><div class="kpi" id="kIn">—<small> $</small></div>
    <p class="muted" style="margin-top:6px;font-size:12px">Chiqib ketgan mahsulot</p></div>
  <div class="card"><h2>Tannarx + harajat</h2><div class="kpi" id="kOut">—<small> $</small></div>
    <p class="muted" style="margin-top:6px;font-size:12px">Hisobot oyi bo'yicha</p></div>
  <div class="card"><h2>Foyda</h2><div class="kpi" id="kPr">—<small> $</small></div>
    <p class="muted" style="margin-top:6px;font-size:12px" id="kPrIz">Savdo &minus; tannarx &minus; harajat</p></div>
</div>

<div class="card" style="margin-top:16px">
  <div id="body"><p class="muted">Yuklanmoqda…</p></div>
</div>

<script>
//  FOYDA-ZARAR — oy bo'yicha ustunlar, ko'rsatkichlar qator.
//
//  Ustun OY bo'lgani muhim: direktorning savoli «qaysi oyda nima
//  bo'ldi» — bitta yig'indi raqam unga javob bermaydi, oylar yonma-yon
//  turgandagina o'sish ham, sakrash ham ko'rinadi.
//
//  Guruh qatori bosilsa ostidan moddalari chiqadi: ekranda to'qqizta
//  qator turadi, tafsilot esa kerak bo'lganda ochiladi.
//
//  Tannarx yo'q (xom ashyo hisobi hali yozilmagan) — shuning uchun bu
//  «yalpi foyda» emas, savdodan zavodning pul harajatlari ayirilgani.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const usd = v => (Number(v) || 0).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const OY = ['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
const oyNom = (m) => OY[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(2, 4);

const son = (v) => !v ? '<span class="muted">&mdash;</span>'
  : v < 0 ? `<span style="color:var(--bad)">${usd(v)}</span>` : usd(v);

let d = { rows: [], from: '', to: '' }, ochiq = new Set();

function davr(n) {
  const y = new Date().getFullYear() + n;
  $('fFrom').value = y + '-01';
  $('fTo').value   = y + '-12';
  load();
}

//  Oylar ro'yxati oraliqdan chiqadi, ma'lumotdan emas: harajati yo'q oy
//  ham ustun bo'lib tursin — bo'sh ustun «u oyda hech narsa bo'lmagan»
//  degan javob, yo'q ustun esa savol.
function oylar() {
  const [y1, m1] = d.from.split('-').map(Number);
  const [y2, m2] = d.to.split('-').map(Number);
  const out = [];
  for (let y = y1, m = m1; y < y2 || (y === y2 && m <= m2); m++) {
    if (m > 12) { m = 1; y++; if (y > y2) break; }
    out.push(`${y}-${String(m).padStart(2, '0')}`);
    if (out.length > 36) break;
  }
  return out;
}

const key = (r) => r.pl_month.slice(0, 7);

function yig(filter) {
  const m = {};
  d.rows.filter(filter).forEach(r => {
    m[key(r)] = (m[key(r)] || 0) + Number(r.amount_usd);
  });
  return m;
}

function draw() {
  const ms = oylar();
  const inc = yig(r => r.kind === 'income');
  const exp = yig(r => r.kind === 'expense');
  const jami = (m) => Object.values(m).reduce((a, b) => a + b, 0);
  //  ★ TANNARX (zavod qarori, 2026-11): chiqib ketgan mahsulotning
  //  materiali, savdo bilan bir xil o'qda. «Harajat» kartochkasi ikkalasini
  //  qo'shib turadi — foyda = savdo − (tannarx + harajat).
  const cogs = yig(r => r.kind === 'cogs');
  $('kIn').innerHTML  = usd(jami(inc)) + '<small> $</small>';
  $('kOut').innerHTML = usd(jami(exp) + jami(cogs)) + '<small> $</small>';
  $('kPr').innerHTML  = usd(jami(inc) - jami(exp) - jami(cogs)) + '<small> $</small>';
  //  ★ MARJA = (savdo − tannarx) ÷ savdo (zavod qarori, 2026-11): savdo
  //  yaxshi oyda tannarx ham katta bo'ladi — dollardagi raqam o'zgarishni
  //  ko'rsatmaydi, ulush esa ko'rsatadi. Boshqa foiz chizilmaydi.
  $('kPrIz').textContent = 'yalpi marja ' + (jami(inc)
    ? ((jami(inc) - jami(cogs)) / jami(inc) * 100).toFixed(1).replace('.', ',') + '%' : '—');

  //  ★ SAVDO TURKUMLARGA BO'LINADI (zavod qarori, 2026-10):
  //  mehmonxona to'plami · yotoqxona to'plami · stol · stul.
  //  Direktorning savoli «qancha sotdik» emas, «NIMADAN qancha» —
  //  bitta yig'indi raqam unga javob bermaydi.
  //
  //  Ilgari server qatorlarni ALLAQACHON bo'lib berardi
  //  (`v_pl_month`, `sales_categories`), sahifa esa ularni
  //  qo'shib yuborardi — ya'ni javob bor edi-yu, ekranga chiqmasdi.
  //
  //  Tartib SERVERNIKI (`item_sort`): mehmonxona → yotoqxona → stol
  //  → stul, turkumsizi oxirida. Sahifada qayta saralanmaydi — ikki
  //  joyda yozilgan tartib bir kun ajralib ketardi.
  const tur = [];
  d.rows.filter(r => r.kind === 'income').forEach(r => {
    let i = tur.find(x => x.name === r.item_name);
    if (!i) tur.push(i = { name: r.item_name, by: {} });
    i.by[key(r)] = (i.by[key(r)] || 0) + Number(r.amount_usd);
  });

  //  Guruhlar — harajat qatorlari; tartibi server bergan `group_sort` da
  const guruh = [];
  d.rows.filter(r => r.kind === 'expense').forEach(r => {
    let g = guruh.find(x => x.code === r.group_code);
    if (!g) guruh.push(g = { code: r.group_code, name: r.group_name, items: [] });
    let i = g.items.find(x => x.id === r.item_id);
    if (!i) g.items.push(i = { id: r.item_id, name: r.item_name, by: {} });
    i.by[key(r)] = (i.by[key(r)] || 0) + Number(r.amount_usd);
  });

  //  Foiz qatori — har oy o'z savdosiga, «Jami» esa yig'indilar nisbati
  //  (oylik foizlarning o'rtachasi EMAS: kichik oy katta oy bilan teng
  //  og'irlik olardi).
  const fz = (x, y) => y ? (x / y * 100).toFixed(1).replace('.', ',') + '%'
                          : '<span class="muted">&mdash;</span>';
  //  `by` — marja (savdo − tannarx), `den` — o'sha savdo.
  //  Ko'rinishi `qator` bilan BIR XIL (zavod qarori, 2026-11): marja
  //  savdo va tannarx bilan bir qatorda o'qiladi, mayda izoh emas.
  const foiz = (nom, by, den, bosh) => {
    const t = ms.reduce((a, m) => a + (by[m] || 0), 0);
    const ti = ms.reduce((a, m) => a + (den[m] || 0), 0);
    const td = (x, y, b) => `<td class="num">${b ? '<b>' : ''}${y && x < 0
      ? `<span style="color:var(--bad)">${fz(x, y)}</span>` : fz(x, y)}${b ? '</b>' : ''}</td>`;
    return `<tr${bosh || ''}><td>${nom}</td>
      ${ms.map(m => td(by[m] || 0, den[m] || 0)).join('')}${td(t, ti, true)}</tr>`;
  };
  //  ★ BOSILSA TURI BO'YICHA: savdo va tannarx ikkalasi ham savdo
  //  turkumi bo'yicha keladi (`v_pl_month`), ya'ni turkumning marjasi
  //  o'sha turkumning o'z savdosiga.
  //  Yalpi foyda ham TURI bo'yicha: turkum savdosi − o'sha turkum tannarxi.
  const turYalpi = () => tur.map(t => {
    const tc = (tan.find(x => x.name === t.name) || { by: {} }).by;
    const by = {};
    ms.forEach(m => by[m] = (t.by[m] || 0) - (tc[m] || 0));
    return qator(`<span style="padding-left:22px" class="muted">${esc(t.name)}</span>`, by);
  }).join('');
  const turMarja = () => tur.map(t => {
    const tc = (tan.find(x => x.name === t.name) || { by: {} }).by;
    const by = {};
    ms.forEach(m => by[m] = (t.by[m] || 0) - (tc[m] || 0));
    return foiz(`<span style="padding-left:22px" class="muted">${esc(t.name)}</span>`, by, t.by);
  }).join('');

  const qator = (nom, by, cls, bosh) => {
    const t = ms.reduce((a, m) => a + (by[m] || 0), 0);
    return `<tr class="${cls || ''}"${bosh || ''}>
      <td>${nom}</td>
      ${ms.map(m => `<td class="num">${son(by[m])}</td>`).join('')}
      <td class="num"><b>${t < 0 ? `<span style="color:var(--bad)">${usd(t)}</span>` : usd(t)}</b></td></tr>`;
  };

  //  Tannarx qatorlari — savdo TURKUMI bo'yicha (server tartibida):
  //  furnitura alohida qator emas, mahsulotning o'z tannarxida.
  const tan = [];
  d.rows.filter(r => r.kind === 'cogs').forEach(r => {
    let i = tan.find(x => x.name === r.item_name);
    if (!i) tan.push(i = { name: r.item_name, by: {} });
    i.by[key(r)] = (i.by[key(r)] || 0) + Number(r.amount_usd);
  });
  const yalpi = {};
  ms.forEach(m => yalpi[m] = (inc[m] || 0) - (cogs[m] || 0));
  const foyda = {};
  ms.forEach(m => foyda[m] = (yalpi[m] || 0) - (exp[m] || 0));
  //  ★ DIVIDENT FOYDADAN KEYIN (zavod qarori, 2026-11): harajat emas,
  //  foydani taqsimlash. Qolgani — «Qoldiq» (ta'sischi bitta, ya'ni taqsimlanmagan foyda degan qatlam yo'q).
  const div = yig(r => r.kind === 'dividend');
  const qoldi = {};
  ms.forEach(m => qoldi[m] = (foyda[m] || 0) - (div[m] || 0));

  $('body').innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Ko'rsatkich</th>
      ${ms.map(m => `<th class="num">${oyNom(m)}</th>`).join('')}
      <th class="num">Jami</th></tr></thead>
    <tbody>
      <!--  ★ «TUSHUM» EMAS, «SAVDO» (zavod qarori, 2026-10): qator
            chiqib ketgan MAHSULOTdan hisoblanadi, kassaga kirgan
            puldan emas — «tushum» esa zavodda pulni anglatadi va
            pul oqimi hisoboti bilan chalkashtirardi. Savdo KPI
            sidagi «Tushum» ko'rsatkichiga tegilmaydi: u AYNAN pul
            va shuning uchun boshqa nom bilan qolishi kerak.

            Qator harajat guruhlari bilan BIR XIL ishlaydi:
            bosilsa turkumlari ochiladi. Ikki xil bo'lsa odam
            birinchisini bosib ko'rib, ikkinchisini ochilmaydi deb
            o'ylardi. -->
      ${qator(`<span class="muted" style="margin-right:6px">${
          ochiq.has('SOTUV') ? '&minus;' : '+'}</span><b>Savdo</b> — chiqib ketgan mahsulot`,
        inc, '', ` onclick="toggle('SOTUV')" style="cursor:pointer"`)}
      ${ochiq.has('SOTUV') ? tur.map(t =>
        qator(`<span style="padding-left:22px" class="muted">${esc(t.name)}</span>`,
              t.by)).join('') : ''}
      <!--  ★ AVVAL JAMI, KEYIN TAFSILOTI — pul oqimi bilan bir xil.
            Direktorning savoli «qancha harajat bo'ldi», keyin esa
            «nimaga». Ilgari guruhlar yuqorida turib, «Jami harajat»
            ularning ostida qolardi: ko'z o'nta qatorni o'qib chiqib,
            javobni eng oxirida topardi — guruh ochilganda esa u yanada
            pastga surilardi. Endi jami qatorning O'ZIDA, tafsiloti esa
            uning ostida: savdo · harajat · foyda uchtasi ham bir xil
            o'qiladi. -->
      ${qator(`<span class="muted" style="margin-right:6px">${
          ochiq.has('TANNARX') ? '&minus;' : '+'}</span><b>Tannarx</b> — chiqqan mahsulotning materiali va furniturasi`,
        cogs, '', ` onclick="toggle('TANNARX')" style="cursor:pointer"`)}
      ${ochiq.has('TANNARX') ? tan.map(t =>
        qator(`<span style="padding-left:22px" class="muted">${esc(t.name)}</span>`,
              t.by)).join('') : ''}
      ${qator(`<span class="muted" style="margin-right:6px">${
          ochiq.has('YALPI') ? '&minus;' : '+'}</span><b>Yalpi foyda</b>`,
        yalpi, '', ` onclick="toggle('YALPI')" style="cursor:pointer"`)}
      ${ochiq.has('YALPI') ? turYalpi() : ''}
      ${foiz(`<span class="muted" style="margin-right:6px">${
          ochiq.has('MARJA') ? '&minus;' : '+'}</span><b>Yalpi marja, %</b> — (savdo − tannarx) ÷ savdo`,
        yalpi, inc, ` onclick="toggle('MARJA')" style="cursor:pointer"`)}
      ${ochiq.has('MARJA') ? turMarja() : ''}
      ${qator('<b>Jami harajat</b>', exp)}
      ${guruh.map((g, i) => {
        const by = {};
        g.items.forEach(it => ms.forEach(m => {
          if (it.by[m]) by[m] = (by[m] || 0) + it.by[m];
        }));
        return qator(`<span class="muted" style="margin-right:6px">${
            ochiq.has(g.code) ? '&minus;' : '+'}</span>${esc(g.name)}`,
          by, '', ` onclick="toggle('${g.code}')" style="cursor:pointer"`)
          + (ochiq.has(g.code) ? g.items.map(it =>
              qator(`<span style="padding-left:22px" class="muted">${esc(it.name)}</span>`,
                    it.by)).join('') : '');
      }).join('')}
      ${qator('<b>FOYDA</b>', foyda)}
      ${qator('<span class="muted">− Divident</span>', div)}
      ${qator('<b>Qoldiq</b>', qoldi)}
    </tbody></table></div>
    <p class="muted" style="font-size:12px;margin-top:12px">
      Savdo va tannarx chiqib ketgan mahsulotdan, harajat hisobot oyi bo'yicha.
      Tannarx — konverga yozilgan xom ashyo sarfi, yuk xatiga berilgan
      furnitura va sotib olingan mahsulot narxi, mahsulotning turkumi
      bo'yicha; ish haqi harajatda. Ta'minotchiga to'lov bu
      yerda emas: material tannarx bo'lib kiradi.</p>`;
}

function toggle(code) {
  ochiq.has(code) ? ochiq.delete(code) : ochiq.add(code);
  draw();
}

function exportCsv() {
  const ms = oylar();
  const inc = yig(r => r.kind === 'income');
  const exp = yig(r => r.kind === 'expense');
  const qat = [["Ko'rsatkich", ...ms, 'Jami']];
  const push = (nom, by) => qat.push([nom, ...ms.map(m => (by[m] || 0).toFixed(2)),
    ms.reduce((a, m) => a + (by[m] || 0), 0).toFixed(2)]);
  push('Savdo', inc);
  //  Turkumlar Excelda ham qatorlar bo'lib chiqadi: ekranda
  //  ko'rinadigan narsa faylda ham bo'lishi kerak.
  const t = {};
  d.rows.filter(r => r.kind === 'income').forEach(r => {
    (t[r.item_name] = t[r.item_name] || {})[key(r)] =
      (t[r.item_name][key(r)] || 0) + Number(r.amount_usd);
  });
  Object.entries(t).forEach(([k, by]) => push('  ' + k, by));
  const cg = yig(r => r.kind === 'cogs');
  push('Tannarx', cg);
  const tt = {};
  d.rows.filter(r => r.kind === 'cogs').forEach(r => {
    (tt[r.item_name] = tt[r.item_name] || {})[key(r)] =
      (tt[r.item_name][key(r)] || 0) + Number(r.amount_usd);
  });
  Object.entries(tt).forEach(([k, by]) => push('  ' + k, by));
  const yf = {}; ms.forEach(m => yf[m] = (inc[m] || 0) - (cg[m] || 0));
  const pf = (nom, by) => qat.push([nom, ...ms.map(m => inc[m] ? (by[m] / inc[m] * 100 || 0).toFixed(1) : ''),
    (() => { const a = ms.reduce((s, m) => s + (by[m] || 0), 0), b = ms.reduce((s, m) => s + (inc[m] || 0), 0);
      return b ? (a / b * 100).toFixed(1) : ''; })()]);
  push('Yalpi foyda', yf);
  Object.entries(t).forEach(([k, by]) => {
    const c = tt[k] || {}, o = {};
    ms.forEach(m => o[m] = (by[m] || 0) - (c[m] || 0));
    push('  ' + k, o);
  });
  pf('Yalpi marja, %', yf);
  Object.entries(t).forEach(([k, by]) => {
    const c = tt[k] || {};
    const pc = (x, y) => y ? (x / y * 100).toFixed(1) : '';
    const sum = (o) => ms.reduce((a, m) => a + (o[m] || 0), 0);
    qat.push(['  ' + k + ', %', ...ms.map(m => pc((by[m] || 0) - (c[m] || 0), by[m] || 0)),
      pc(sum(by) - sum(c), sum(by))]);
  });
  const g = {};
  d.rows.filter(r => r.kind === 'expense').forEach(r => {
    const k = r.group_name + ' · ' + r.item_name;
    (g[k] = g[k] || {})[key(r)] = (g[k][key(r)] || 0) + Number(r.amount_usd);
  });
  Object.entries(g).forEach(([k, by]) => push(k, by));
  push('Jami harajat', exp);
  const f = {}; ms.forEach(m => f[m] = (yf[m] || 0) - (exp[m] || 0));
  push('FOYDA', f);
  const dv = yig(r => r.kind === 'dividend');
  push('Divident', dv);
  const q = {}; ms.forEach(m => q[m] = (f[m] || 0) - (dv[m] || 0));
  push('Qoldiq', q);
  const csv = '﻿' + qat.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`)
    .join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `foyda-zarar-${d.from}_${d.to}.csv`;
  a.click();
}

async function load() {
  const q = new URLSearchParams();
  if ($('fFrom').value) q.set('from', $('fFrom').value);
  if ($('fTo').value)   q.set('to', $('fTo').value);
  d = await App.api('/api/cash/pl?' + q);
  $('fFrom').value = d.from; $('fTo').value = d.to;
  draw();
}

App.start(load, 'cash.view', 'cash.manage');
</script>
</body>
</html>
