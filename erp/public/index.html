<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZELTA ERP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app.js"></script>
<script src="/panel.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>ZELTA ERP</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div id="kun"></div>

<!--  ★ PANEL BOSH SAHIFADA, HAR KIMGA O'ZINIKI (zavod qarori,
      2026-09). Xodim saytga kirganda birinchi ko'radigan narsa
      modullar ro'yxati edi — u «qayerga borsam» degan savolga
      javob beradi, «hozir ahvol qanday» degan savolga esa yo'q.
      Endi tepada o'z bo'limining raqamlari turadi.

      Faqat KARTOCHKALAR: grafiklar o'z panelida qoladi. Bosh
      sahifa tez ochilishi kerak va bu yerda savol bitta — «nima
      diqqat talab qiladi». Har guruh sarlavhasi o'z paneliga
      olib boradi. -->
<div id="panel"></div>

<div id="pages"></div>

<div class="card" style="margin-top:16px">
  <h2>Modullar</h2>
  <div id="modules" class="grid g3"></div>
</div>

<script>
const $ = id => document.getElementById(id);


//  ★ KUNNING JO'NATMASI BOSH SAHIFADA (zavod qarori, 2026-09).
//  «Bugun nechtasi chiqdi» degan savolni direktor mudirga telefon qilib
//  so'rardi. Raqam SERVERDAN keladi va ombor sahifasidagi bilan AYNAN
//  bir xil: shart ikki joyda yozilsa bir kun bir-biridan ajralib
//  ketardi. Huquqi yo'q xodimda kartochka umuman chizilmaydi — xato
//  yozuvi ham chiqmaydi, u bosh sahifada ortiqcha bo'lardi.
async function kunHisobi() {
  let k;
  try { k = await App.api('/api/sales/day'); } catch (e) { return; }
  if (!k || !k.olindi) return;
  document.getElementById('kun').innerHTML = `
    <div class="card" style="margin-bottom:22px">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div><h2 style="margin:0">Bugun chiqadi</h2>
          <div class="muted" style="font-size:13px;margin-top:4px">${
            k.qoldi ? `${k.qoldi} ta buyurtma hali chiqmadi` : 'hammasi chiqib ketdi'}${
            k.kech ? ` · ${k.kech} tasi oldingi kundan qolgan` : ''}</div></div>
        <div class="row" style="gap:28px">
          <div><div class="kpi">${k.olindi}</div>
            <div class="muted" style="font-size:12px">olindi</div></div>
          <div><div class="kpi mny-in">${k.chiqdi}</div>
            <div class="muted" style="font-size:12px">chiqdi</div></div>
          <div><div class="kpi${k.qoldi ? ' mny-out' : ''}">${k.qoldi}</div>
            <div class="muted" style="font-size:12px">qoldi</div></div>
        </div>
      </div>
    </div>`;
}

//  ★ FAQAT HUQUQI BOR YO'L SO'RALADI. 403 ni kutib, keyin blokni
//  yashirish ham bo'lardi, lekin o'shanda tsex ustasi bosh sahifani
//  ochganda beshta rad javobi ketardi — telefonda bu sezilarli
//  kechikish.
//
//  Har guruh ALOHIDA so'raladi: birining huquqi yo'qligi
//  ikkinchisini yiqitmasin (`Promise.all` birinchi rad javobida
//  to'xtardi).
const BLOK = [
  { href: '/savdo-panel.html', nom: 'Savdo',
    perm: ['sales.view', 'sales.manage'],
    yol: () => '/api/sales/dashboard?from=' + oyBoshi(),
    kart: (d) => [
      { name: 'Shu oy chiqdi', value: Panel.pul(d.kpi.chiqdi),
        hint: Panel.son(d.kpi.chiqdi_soni) + ' ta buyurtma' },
      { name: 'Zavodda turibdi', value: Panel.pul(d.kpi.zavodda),
        hint: Panel.son(d.kpi.zavodda_soni) + ' ta buyurtma' },
      { name: 'Mijozlar qarzi', value: Panel.pul(d.kpi.qarz) },
      { name: 'Kechikkan', value: Panel.son(d.kpi.kechikkan) + ' ta',
        tone: Number(d.kpi.kechikkan) ? 'bad' : '' },
    ] },
  { href: '/ishlab-panel.html', nom: 'Ishlab chiqarish',
    perm: ['production.reports', 'production.manage'],
    yol: () => '/api/units/dashboard?from=' + oyBoshi(),
    kart: (d) => [
      { name: 'Shu oy chiqarildi',
        value: Panel.son(d.oylar.reduce((a, r) => a + (Number(r.qty) || 0), 0))
               + ' dona' },
      { name: 'Yo\'lda', value: Panel.son(d.wip.yolda) + ' dona',
        hint: Panel.son(d.wip.yolda_konver) + ' ta konver' },
      { name: 'Boshlanmagan', value: Panel.son(d.wip.boshlanmagan_konver) + ' ta',
        tone: Number(d.wip.boshlanmagan_konver) ? 'warn' : '' },
      { name: 'Kechikkan', value: Panel.son(d.kech.konver) + ' ta',
        tone: Number(d.kech.konver) ? 'bad' : '' },
    ] },
  { href: '/moliya-panel.html', nom: 'Moliya',
    perm: ['cash.view', 'cash.manage'],
    yol: () => '/api/cash/dashboard',
    kart: (d) => {
      const oy = d.oylar[d.oylar.length - 1] || {};
      const kassa = d.kassa.reduce((a, r) => a + (Number(r.total_usd) || 0), 0);
      return [
        { name: 'Shu oy foyda', value: Panel.pul(oy.foyda),
          tone: Number(oy.foyda) < 0 ? 'bad' : Number(oy.foyda) > 0 ? 'ok' : '',
          hint: 'tannarxsiz' },
        { name: 'Kassa va bank', value: Panel.pul(kassa),
          tone: kassa < 0 ? 'bad' : '' },
        { name: 'Xodimlar qo\'lida', value: Panel.pul(d.qolda) },
        { name: 'Ta\'minotchilarga qarz', value: Panel.pul(d.taminot_qarzi),
          tone: Number(d.taminot_qarzi) > 0 ? 'warn' : '' },
      ];
    } },
  { href: '/ombor-panel.html', nom: 'Ombor',
    perm: ['warehouse.view', 'warehouse.manage'],
    yol: () => '/api/warehouse/dashboard',
    kart: (d) => [
      //  Yig'indi o'lchov birligi bo'yicha: stul DONA, penal
      //  KOMPLEKT — qo'shib bo'lmaydi.
      ...d.qoldiq.map((r) => ({ name: 'Qoldiq · ' + r.uom,
        value: Panel.son(r.bosh) + ' ' + r.uom,
        hint: 'javonda ' + Panel.son(r.jami) })),
      { name: 'Chiqarishni kutmoqda', value: Panel.son(d.kutmoqda) + ' ta',
        tone: Number(d.kutmoqda) ? 'warn' : '' },
    ] },
  { href: '/ombor-panel.html', nom: 'Xom ashyo',
    perm: ['materials.view', 'materials.manage'],
    yol: () => '/api/materials/dashboard',
    kart: (d) => [
      { name: 'Omborda', value: Panel.son(d.nom) + ' nom',
        hint: Panel.pul(d.usd) },
      { name: 'Minusga tushgan', value: Panel.son(d.minus) + ' ta',
        tone: Number(d.minus) ? 'bad' : '', hint: 'kirim yozilmagan' },
      { name: 'Xarid zayavkasi', value: Panel.son(d.zayavka.yangi) + ' ta',
        tone: Number(d.zayavka.yangi) ? 'warn' : '' },
      { name: 'Talabnoma', value: Panel.son(d.talab.yangi) + ' ta',
        tone: Number(d.talab.yangi) ? 'warn' : '' },
    ] },
];

//  Oy boshi — «shu oy» degan savol bosh sahifada eng ko'p
//  beriladigani. Sanani matn qilib kesish soat mintaqasi bilan bir
//  kun surilib ketardi, shuning uchun mahalliy qismlardan yig'iladi.
function oyBoshi() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
}

async function panelChiz() {
  const mos = BLOK.filter((b) => App.can(...b.perm));
  if (!mos.length) return;

  //  So'rovlar YONMA-YON ketadi: ketma-ket yuborilsa besh blokli
  //  ekran besh marta kutardi. `allSettled` — rad javobi qolganini
  //  yiqitmasin (huquqi yo'q blok shunchaki chizilmaydi).
  const javob = await Promise.allSettled(mos.map((b) => App.api(b.yol())));
  const bor = mos
    .map((b, i) => ({ b, d: javob[i].status === 'fulfilled' ? javob[i].value : null }))
    .filter((x) => x.d);
  if (!bor.length) return;

  $('panel').innerHTML = bor.map(({ b }) => `
    <section style="margin-bottom:22px">
      <a href="${b.href}" style="text-decoration:none;color:inherit">
        <h2 style="margin-bottom:10px">${b.nom} \u2192</h2></a>
      <div class="grid g3" data-k="${b.nom}"></div>
    </section>`).join('');

  //  Kartochkalar DOM qo'yilgandan KEYIN chiziladi: `Panel.kpi`
  //  mavjud elementga yozadi.
  for (const { b, d } of bor) {
    const el = $('panel').querySelector(`[data-k="${b.nom}"]`);
    if (el) try { Panel.kpi(el, b.kart(d)); } catch { el.remove(); }
  }
}

App.start(async () => {
  kunHisobi();
  panelChiz();
  // Bosh sahifa bo'limlar bo'yicha guruhlanadi — yuqoridagi qator bilan
  // bir xil tartibda, shunda xodim qayerda nima turishini bir marta eslab
  // qoladi. Faqat o'ziga ochiq bo'lim va sahifalar chiqadi.
  const open = App.pages().filter(p => p.title);
  const groups = App.modules()
    .map(m => ({ m, list: open.filter(p => App.inMod(p, m.code)) }))
    .filter(g => g.list.length);

  $('pages').innerHTML = groups.map(g => `
    <section style="margin-bottom:26px">
      <h2>${g.m.name}</h2>
      <div class="grid g3">${g.list.map(p => `
        <a class="card" href="${App.hrefFor(p, g.m.code)}" style="text-decoration:none;color:inherit">
          <h2>${p.title}</h2>
          <p style="font-size:18px;font-weight:500">${p.lead}</p>
          <p class="muted" style="margin-top:8px">${p.text}</p></a>`).join('')}</div>
    </section>`).join('');

  // Modul ro'yxati app.js dan olinadi — nom bitta joyda yozilgan.
  // Ro'yxat huquq bo'yicha allaqachon filtrlangan, "Bosh sahifa" esa
  // modul emas, shuning uchun kartochkalar orasida ko'rsatilmaydi.
  $('modules').innerHTML = App.modules().filter(m => m.code !== 'main').map(m => `
    <div class="card" style="background:var(--surface-2)">
      <div class="row" style="justify-content:space-between">
        <strong>${m.name}</strong>
        <span class="tag ${m.ready ? 'ok' : ''}">${m.ready ? 'ishlayapti' : 'rejada'}</span>
      </div>
    </div>`).join('') || '<p class="muted">Ochiq modul yo\'q</p>';
});
</script>
</body>
</html>
