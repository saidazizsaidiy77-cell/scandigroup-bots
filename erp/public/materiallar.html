<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xom ashyo · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Xom ashyo</h1></div>
  <div class="row"><span class="row" id="erpUser"></span></div>
</div>

<div class="row" id="tabs" style="gap:8px;margin-bottom:16px"></div>

<div class="card" id="cardRef">
  <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px;
    align-items:flex-end">
    <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div style="min-width:220px"><label>Qidiruv</label>
        <input id="fQ" placeholder="nomi yoki kodi" oninput="deb()"></div>
      <div style="min-width:180px"><label>Turkum</label>
        <select id="fCat" onchange="load()"></select></div>
      <!--  ★ «SHU BO'LIM QAYSI MATERIALNI ISHLATADI» (zavod qarori,
            2026-09). Arra boshlig'iga to'qqiz yuz material kerak
            emas — javob o'z omborining ichida. Ro'yxat E'LON
            QILINMAYDI, o'zi to'ladi: ombor mudiri Arraga LDSP
            berdi — o'sha zahoti shu yerda turadi. -->
      <div style="min-width:220px"><label>Ishlatadigan ombor</label>
        <select id="fWh" onchange="load()"></select></div>
      <label class="row" style="gap:8px;align-items:center;text-transform:none;
        font-size:14px;cursor:pointer">
        <input type="checkbox" id="fOff" style="width:auto" onchange="load()">
        <span>Faolsizi ham</span></label>
    </div>
    <div class="row" style="gap:8px" id="tools"></div>
  </div>
</div>

<div class="card" id="cardStock" hidden>
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div style="min-width:200px"><label>Ombor</label>
      <select id="sWh" onchange="load()"></select></div>
    <div style="min-width:200px"><label>Qidiruv</label>
      <input id="sQ" placeholder="material nomi" oninput="deb()"></div>
    <!--  ★ MINUSGA TUSHGANLARNI BIR JOYDA KO'RISH (zavod qarori,
          2026-09). Manfiy qator ALLAQACHON qizil bo'lib turadi,
          lekin faqat O'SHA omborning ichida: zavodda o'n to'rtta
          ombor va uch yuzdan ortiq nom bor, ya'ni o'ttizta qizil
          qatorni topish uchun har omborni birma-bir ochish kerak
          edi. Paneldagi «Minusga tushgan» kartochkasi ham shu
          yerga olib keladi (`?minus=1`) — raqam bosilganda javob
          chiqsin, qidiruv boshlanmasin. -->
    <div><label>&nbsp;</label>
      <label class="tag" style="cursor:pointer;display:inline-flex;
        align-items:center;gap:6px;padding:8px 10px">
        <input type="checkbox" id="sMinus" style="width:auto" onchange="load()">
        Faqat minusga tushgan</label></div>
    <div class="row" style="gap:8px" id="stockTools"></div>
  </div>
  <!--  ★ QISQARGAN RO'YXAT SABABINI AYTADI (izoh:
        modules/materials.js): doirasi bor xodimga faqat o'z
        tsexining ombori keladi va bu to'g'ri, lekin ekran buni
        aytmasa «tsex omborlari ko'rinmayapti» degan savol
        tug'ilardi — javobi esa Xodimlar sahifasida. -->
  <p class="muted" style="margin-top:10px;font-size:12px" id="sDoira" hidden></p>
  </div>
</div>

<!--  ★ KIRIM HUJJATI: mol ta'minotchidan keldi. Filtrlar SERVERDA —
      oraliq katta bo'lsa qatorlar chegarasiga yetib, klientda yarmi
      yo'qolardi (ombor tarixi bilan bir xil sabab). -->
<!--  ★ TALABNOMA (izoh: sql/materials.sql va modules/materials.js).
      Tsex boshlig'i xom ashyoni OG'ZAKI so'ramaydi — hujjat yozadi.
      Filtr holat bo'yicha: tayyorlaydigan odamning savoli «nima
      kutmoqda», yozgan odamniki esa «meniki qayerda». -->
<div class="card" id="cardTalab" hidden>
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div style="min-width:170px"><label>Holat</label>
      <select id="tStatus" onchange="load()">
        <option value="">Hammasi</option>
        <option value="new">Yozilgan</option>
        <option value="ready">Tayyorlangan</option>
        <option value="done">Chiqarilgan</option>
        <option value="rejected">Rad etilgan</option>
        <option value="cancelled">Bekor qilingan</option>
      </select></div>
    <div style="min-width:170px"><label>Turi</label>
      <select id="tKind" onchange="load()">
        <option value="">Hammasi</option>
        <option value="issue">Talabnoma</option>
        <option value="return">Qaytarish</option>
      </select></div>
    <div class="row" style="gap:8px" id="talabTools"></div>
  </div>
</div>

<div class="card" id="cardZay" hidden>
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div style="min-width:170px"><label>Holat</label>
      <select id="zStatus" onchange="load()">
        <option value="">Hammasi</option>
        <option value="new">Yozilgan</option>
        <option value="ordered">Buyurtma berilgan</option>
        <option value="done">Keldi</option>
        <option value="cancelled">Bekor qilingan</option>
      </select></div>
  </div>
</div>

<div class="card" id="cardKirim" hidden>
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div style="min-width:190px"><label>Ta'minotchi</label>
      <select id="kSup" onchange="load()"></select></div>
    <div style="min-width:190px"><label>Ombor</label>
      <select id="kWh" onchange="load()"></select></div>
    <div><label>Sana (dan)</label>
      <input id="kFrom" type="date" onchange="load()"></div>
    <div><label>gacha</label>
      <input id="kTo" type="date" onchange="load()"></div>
    <div style="min-width:180px"><label>Qidiruv</label>
      <input id="kQ" placeholder="hujjat yoki ta'minotchi" oninput="deb()"></div>
    <div class="row" style="gap:8px" id="kirimTools"></div>
  </div>
</div>

<div class="card" style="margin-top:16px">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <h2 style="margin:0" id="h2">Materiallar</h2>
    <span class="muted" id="cnt" style="font-size:13px"></span>
  </div>
  <div id="body"><p class="muted">Yuklanmoqda…</p></div>
</div>

<div id="modalRoot"></div>

<script>
//  XOM ASHYO SPRAVOCHNIGI.
//
//  ★ HAR RANG ALOHIDA MATERIAL (zavod qarori): «LDSP 16mm oq» va
//  «LDSP 16mm venge» — ikkita qator, har birining o'z qoldig'i va o'z
//  narxi. Rang ustun EMAS: ustun bo'lsa qoldiq material bo'yicha
//  yig'ilib, «oq LDSP tugadi» degan savolga javob bo'lmasdi.
//
//  Ro'yxat FAYLDAN yuklanadi — zavodda yuzlab material bor va ularni
//  qo'lda terib chiqish bir kunlik ish va o'nlab xato bo'lardi.
//  Mijozlar va ta'minotchilar bilan bir xil yo'l: avval TEKSHIRIB
//  ko'rsatiladi, xato qator bo'lsa hech narsa saqlanmaydi.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let ref = { categories: [], uoms: [], warehouses: [] };
//  ★ JAVOBGAR TSEX yoziladi, turgan joyi emas: «Lak karkas ombori»
//  stul tsexida turadi, lekin uni LAK tsexi boshlig'i yuritadi
//  (izoh: sql/materials.sql) — ishlab chiqarishdagi javobgar tsex
//  bilan aynan bir xil qoida. Xodim o'z ro'yxatida O'ZI javobgar
//  bo'lgan omborni ko'rishi kerak.
const tsexi = (w) => w.owner_shop || w.shop || '';
let rows = [], picked = null, tab = 'ref';
const boshqara = () => App.can('materials.manage', 'production.manage');

//  Ikki savol, ikki tab: «qanday materiallar bor» (spravochnik) va
//  «qaysi omborda nechta turibdi» (qoldiq). Alohida sahifa qilinmadi —
//  ikkalasi bitta narsa haqida va xodim ular orasida kun bo'yi yuradi.
const TABS = [['ref', 'Spravochnik'], ['stock', 'Qoldiq'],
              ['kirim', 'Kirim'], ['talab', 'Talabnoma'],
              ['zay', 'Zayavka'], ['moves', 'Harakat']];

function drawTabs() {
  $('tabs').innerHTML = TABS.map(([k, t]) =>
    `<button ${k === tab ? 'class="primary"' : ''} onclick="go('${k}')"
      >${t}</button>`).join('');
  $('cardRef').hidden   = tab !== 'ref';
  $('cardStock').hidden = tab !== 'stock';
  $('cardKirim').hidden = tab !== 'kirim';
  $('cardTalab').hidden = tab !== 'talab';
  $('cardZay').hidden   = tab !== 'zay';
  $('h2').textContent = tab === 'ref' ? 'Materiallar'
    : tab === 'stock' ? 'Ombor qoldig\'i'
    : tab === 'kirim' ? 'Kirim hujjatlari'
    : tab === 'talab' ? 'Talabnomalar'
    : tab === 'zay'   ? 'Xarid zayavkalari' : 'Harakat';
}

function go(k) {
  tab = k; drawTabs();
  $('body').innerHTML = '<p class="muted">Yuklanmoqda…</p>';
  load();
}

//  ★ JAVOB TUGMANING O'ZIDA VA UNING OSTIDA (zavod qarori, 2026-09).
//  Toast ekranning pastida chiqadi va besh soniyada yo'qoladi: xodim
//  ko'zi oynaning ichida, endi bosgan tugmasida bo'ladi va xabarni
//  ko'rmay qolardi; ustiga qatorni tuzatayotganda sabab allaqachon
//  o'chib ketgan bo'lardi — «nega saqlanmadi» degan savol qaytadan
//  tug'ilardi. Shuning uchun sabab OYNADA, tugmaning ostida qoladi va
//  keyingi bosishgacha turaveradi.
//
//  Tugma bosilganda «Saqlanmoqda…» bo'lib o'chadi: so'rov sekin
//  bo'lsa xodim uni ikkinchi marta bosardi va ikkita hujjat yozilardi.
function saqlanmoqda(id) {
  const b = $(id); if (!b) return;
  b.dataset.matn = b.dataset.matn || b.textContent;
  b.disabled = true; b.textContent = 'Saqlanmoqda…';
  if ($(id + 'Msg')) $(id + 'Msg').innerHTML = '';
}

function saqlanmadi(id, e) {
  const b = $(id);
  if (b) { b.disabled = false; b.textContent = b.dataset.matn || 'Saqlash'; }
  if ($(id + 'Msg'))
    $(id + 'Msg').innerHTML = `<div class="tag bad" style="margin-top:10px;
      display:inline-block;white-space:normal">${esc(e.message)}</div>`;
  toast(e.message, true);
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

let t1 = null;
const deb = () => { clearTimeout(t1); t1 = setTimeout(load, 350); };

async function boot() {
  ref = await App.api('/api/materials/ref');
  $('fCat').innerHTML = '<option value="">Barcha turkum</option>'
    + ref.categories.map((c) => `<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');
  $('tools').innerHTML = boshqara()
    ? `<button onclick="yangi()">+ Material</button>
       <button class="primary" onclick="yuklash()">Fayldan yuklash</button>`
    : '';
  //  ★ JAVOBGAR TSEX yoziladi, turgan joyi emas: «Lak karkas ombori»
  //  stul tsexida turadi, lekin uni LAK tsexi boshlig'i yuritadi
  //  (izoh: sql/materials.sql). Xodim o'z ro'yxatida o'zi
  //  javobgar bo'lgan omborni ko'rishi kerak.
  //  Ombor nomi yonida QAYSI BO'LIMNIKI ekani turadi — bo'sh bo'lsa
  //  tsexi (izoh: sql/materials.sql). «Arra ombori · Arra» degan
  //  qator ikki marta bir xil so'zni takrorlamaydi, shuning uchun
  //  bo'lim nomi ombor nomida bo'lsa qo'shilmaydi.
  $('sWh').innerHTML = '<option value="">Barcha ombor</option>' + omborlar();
  if ($('sDoira')) {
    const d = ref.scope_shops || [];
    $('sDoira').hidden = !d.length;
    $('sDoira').innerHTML = d.length
      ? `Ro'yxat <b>${d.map(esc).join(', ')}</b> doirasi bilan qisqargan —
         boshqa tsexning va zavod omborlari ko'rsatilmaydi. Hammasi kerak
         bo'lsa Xodimlar sahifasida rol yonidagi tsex «Barcha tsex»
         qilinadi.`
      : '';
  }
  //  Spravochnikdagi filtr: «Barcha material» — cheklov yo'q.
  $('fWh').innerHTML = '<option value="">Barcha material</option>' + omborlar();

  //  ★ OMBORLAR RO'YXATIDAN KIRIB KELINADI (`?w=KOD`): boshlang'ich
  //  qoldiq omborning ICHIDA kiritiladi — mudir «Arra ombori»
  //  kartochkasini bosadi va o'sha zahoti o'sha omborning qoldig'ida
  //  turadi. Ombor tanlash uchun ikkinchi bosish so'ralmaydi.
  const qs = new URLSearchParams(location.search);
  const kod = qs.get('w');
  const kirdi = kod && ref.warehouses.find((w) => w.code === kod);
  if (kirdi) { tab = 'stock'; $('sWh').value = kirdi.id; }
  //  ★ PANELDAGI «MINUSGA TUSHGAN» KARTOCHKASI SHU YERGA OLIB KELADI.
  //  Ombor TANLANMAYDI: savol butun zavod bo'yicha va minusga tushgan
  //  qator qaysi omborda ekanini odam oldindan bilmaydi.
  if (qs.get('minus') === '1') { tab = 'stock'; $('sMinus').checked = true; }

  $('kSup').innerHTML = "<option value=''>Barcha ta'minotchi</option>"
    + (ref.suppliers || []).map((x) =>
        `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  //  ★ KIRIM FAQAT ZAVOD OMBORIGA (zavod qarori, 2026-09): Xom ashyo,
  //  MDF va Furnitura — ular tsexga biriktirilmagan. Mol
  //  ta'minotchidan zavodga keladi, tsexga esa undan TALABNOMA bilan
  //  beriladi. Shuning uchun ro'yxatda ham, yozish oynasida ham
  //  o'n to'rtta ombor emas, uchtasi turadi — qolgan o'ntasi
  //  javobi bo'lmagan savol bo'lardi.
  //
  //  Bu QULAYLIK, himoya emas: tekshiruv serverda (`modules/materials.js`).
  $('kWh').innerHTML = '<option value="">Barcha ombor</option>' + omborlar(zavodniki);
  $('kirimTools').innerHTML = boshqara()
    ? '<button class="primary" onclick="kirimOch()">+ Kirim</button>' : '';

  $('stockTools').innerHTML = boshqara()
    ? `<button onclick="boshlangich(${kirdi ? kirdi.id : 'null'})">
         ✎ Boshlang'ich qoldiq</button>` : '';
  //  Boshlang'ich qoldiq va TALABNOMA oynalaridagi ro'yxat uchun:
  //  qo'lda yozish yo'q. Tsex boshlig'ida `materials.manage` yo'q,
  //  lekin talabnomani AYNAN u yozadi — ro'yxatsiz oyna bo'sh
  //  qolardi va qidiruv hech narsa topmasdi.
  if (boshqara() || yozadi()) barcha = (await App.api('/api/materials')).rows;
  drawTabs();
  await load();
}

//  Ombor nomi yonida QAYSI BO'LIMNIKI ekani turadi — bo'sh bo'lsa
//  tsexi (izoh: sql/materials.sql). «Arra ombori · Arra» degan qator
//  ikki marta bir xil so'zni takrorlamaydi, shuning uchun bo'lim nomi
//  ombor nomida bo'lsa qo'shilmaydi.
//
//  ★ JAVOBGAR TSEX yoziladi, turgan joyi emas: «Lak karkas ombori»
//  stul tsexida turadi, lekin uni LAK tsexi boshlig'i yuritadi. Xodim
//  o'z ro'yxatida o'zi javobgar bo'lgan omborni ko'rishi kerak.
//
//  Ikkalasi ham `boot()` dan TASHQARIDA: boshlang'ich qoldiq oynasi
//  ham shu ro'yxatni chizadi va ichkarida qolsa nom ikki xil yozilardi.
const joyi = (w) => {
  const b = w.section && !w.name.toLowerCase().includes(w.section.toLowerCase())
    ? w.section : null;
  return [b, tsexi(w)].filter(Boolean).join(' · ');
};
const omborlar = (filtr) => ref.warehouses.filter(filtr || (() => true))
  .map((w) => `<option value="${w.id}">${esc(w.name)}${
    joyi(w) ? ' · ' + esc(joyi(w)) : ''}</option>`).join('');

//  Zavod ombori — tsexga biriktirilmagani (`shop_id` bo'sh): Xom ashyo,
//  MDF, Furnitura. Ombor kartochkalari guruhlanishi bilan AYNAN bir
//  xil shart (izoh: modules/warehouse.js) — ikki joyda boshqacha
//  yozilsa bitta ombor bir ekranda zavodniki, boshqasida tsexniki
//  bo'lib turardi.
const zavodniki = (w) => !w.shop_id;

async function load() {
  const q = new URLSearchParams();
  if (tab === 'ref') {
    if ($('fQ').value.trim()) q.set('q', $('fQ').value.trim());
    if ($('fCat').value)      q.set('category', $('fCat').value);
    if ($('fWh').value)       q.set('warehouse_id', $('fWh').value);
    if ($('fOff').checked)    q.set('all', '1');
    rows = (await App.api('/api/materials?' + q)).rows;
  } else if (tab === 'stock') {
    if ($('sWh').value)       q.set('warehouse_id', $('sWh').value);
    if ($('sQ').value.trim()) q.set('q', $('sQ').value.trim());
    if ($('sMinus').checked)  q.set('minus', '1');
    rows = (await App.api('/api/materials/stock?' + q)).rows;
  } else if (tab === 'kirim') {
    if ($('kSup').value)      q.set('supplier_id', $('kSup').value);
    if ($('kWh').value)       q.set('warehouse_id', $('kWh').value);
    if ($('kFrom').value)     q.set('from', $('kFrom').value);
    if ($('kTo').value)       q.set('to', $('kTo').value);
    if ($('kQ').value.trim()) q.set('q', $('kQ').value.trim());
    rows = (await App.api('/api/materials/receipts?' + q)).rows;
  } else if (tab === 'talab') {
    if ($('tStatus').value) q.set('status', $('tStatus').value);
    if ($('tKind').value)   q.set('kind', $('tKind').value);
    rows = (await App.api('/api/materials/requests?' + q)).rows;
  } else if (tab === 'zay') {
    if ($('zStatus').value) q.set('status', $('zStatus').value);
    rows = (await App.api('/api/materials/orders?' + q)).rows;
  } else {
    rows = (await App.api('/api/materials/moves')).rows;
  }
  draw();
}

const son = (v) => Number(v).toLocaleString('ru-RU',
  { maximumFractionDigits: 3 });

//  Tomon nomi: ombor bo'lsa uning nomi, bo'lmasa nima ekani.
const TOMON = { supplier: "ta'minotchi", order: 'buyurtma', unit: 'konver',
                writeoff: 'hisobdan chiqarildi', opening: "boshlang'ich qoldiq" };
const tomon = (kind, nom) => nom ? esc(nom) : (TOMON[kind] || kind);

function draw() {
  $('cnt').textContent = rows.length ? `${rows.length} ta` : '';
  if (tab === 'stock') return drawStock();
  if (tab === 'kirim') return drawKirim();
  if (tab === 'talab') return drawTalab();
  if (tab === 'zay') return drawZay();
  if (tab === 'moves') return drawMoves();
  if (!rows.length) {
    $('body').innerHTML = `<p class="muted">Material yo'q.${
      boshqara() ? ' Ro\'yxatni fayldan yuklang.' : ''}</p>`;
    return;
  }
  $('body').innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Nomi</th><th>Turkum</th><th>O'lchov</th>
      <th>Ta'minotchi</th><th>Kod</th>
      <th>Izoh</th>${boshqara() ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows.map((r) => `<tr${r.active ? '' : ' style="opacity:.5"'}>
      <td><b>${esc(r.name)}</b>${r.active ? ''
        : ' <span class="tag">faolsiz</span>'}</td>
      <td class="muted">${esc(r.category_name || '—')}</td>
      <td class="muted">${esc(r.uom_name || r.uom)}</td>
      <!--  ★ TA'MINOTCHI RO'YXATDA TURADI: «kimdan olamiz» degan
            savol material tanlanganda emas, ro'yxatni ko'zdan
            kechirayotganda beriladi. Bittasi tugatsa qolgani shu
            yerda ko'rinadi — kartochkani ochish shart emas. -->
      <td class="muted" style="font-size:12px">${(r.suppliers || []).length
        ? r.suppliers.map((x) => esc(x.name)).join(' · ')
        : '<span class="tag warn">biriktirilmagan</span>'}</td>
      <td class="muted">${esc(r.code || '')}</td>
      <td class="muted" style="font-size:12px">${esc(r.note || '')}</td>
      ${boshqara() ? `<td class="num"><button onclick="tahrir(${r.id})">✎</button></td>` : ''}
    </tr>`).join('')}</tbody></table></div>`;
}

function drawStock() {
  if (!rows.length) {
    $('body').innerHTML = `<p class="muted">Qoldiq yo'q.${
      boshqara() ? " Boshlang'ich qoldiqni kiriting." : ''}</p>`;
    return;
  }
  //  Ombor bo'yicha guruhlanadi: har ombor o'z javoni va uning
  //  qoldig'i alohida sanaladi (omborlar ro'yxati bilan bir xil).
  const gr = [];
  for (const r of rows) {
    let g = gr.find((x) => x.id === r.warehouse_id);
    if (!g) gr.push(g = { id: r.warehouse_id, name: r.warehouse, items: [] });
    g.items.push(r);
  }
  //  ★ NARX O'RTACHA KIRIM NARXI, $ (izoh: sql/materials.sql). Summa
  //  faqat narxi BOR qatorlardan yig'iladi — narxsizi nol deb
  //  qo'shilsa omborning qiymati jimgina pasayib borardi. Shuning
  //  uchun narxsiz qatorlar SONI ombor sarlavhasida yoziladi:
  //  raqamning o'zi yolg'on emas, tushuntirilmagani yolg'on bo'lardi.
  $('body').innerHTML = gr.map((g) => {
    const jami = g.items.reduce((a, r) => a + (Number(r.amount) || 0), 0);
    const yoq  = g.items.filter((r) => r.price == null).length;
    return `
    <div class="row" style="justify-content:space-between;align-items:baseline;
      margin:18px 0 8px;gap:12px">
      <h3 style="margin:0">${esc(g.name)}</h3>
      <div class="muted" style="font-size:13px">${g.items.length} nom${
        jami ? ` · $${pul(jami)}` : ''}${
        yoq ? ` · <span class="tag warn">${yoq} tasida narx yo'q</span>` : ''}</div>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Material</th><th>Turkum</th>
        <th class="num">Qoldiq</th><th>O'lchov</th>
        <th class="num">Narx, $</th><th class="num">Summa, $</th></tr></thead>
      <tbody>${g.items.map((r) => `<tr>
        <td><b>${esc(r.material)}</b></td>
        <td class="muted">${esc(r.category_name || '—')}</td>
        <!--  ★ MANFIY QOLDIQ QIZIL: material omborga kirmasdan
              sarflangan degani — kirim hujjati yozilmagan. Raqamni
              nolga qisish yolg'on bo'lardi, yashirish esa xatoni
              ko'rinmas qilardi. -->
        <td class="num"><b${Number(r.qty) < 0 ? ' class="late"' : ''}>${
          son(r.qty)}</b></td>
        <td class="muted">${esc(r.uom_name || r.uom)}</td>
        <td class="num muted">${r.price == null ? '—' : pul(r.price)}</td>
        <td class="num">${r.amount == null ? '—' : pul(r.amount)}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
  }).join('');
}

//  Pul — ikki kasr xonasi bilan, ajratuvchisi PROBEL: «12 500.00».
//  Soni (`son`) esa kasrsiz turaveradi — ular boshqa raqam.
const pul = (v) => Number(v).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function drawMoves() {
  if (!rows.length) {
    $('body').innerHTML = '<p class="muted">Harakat yo\'q.</p>';
    return;
  }
  //  ★ ADASHIB YOZILGANI SHU YERDAN BEKOR QILINADI (izoh:
  //  modules/materials.js). Ikki xil qator:
  //
  //    · BOSHLANG'ICH QOLDIQ — bir martalik ish va o'sha bir martada
  //      adashish oson: material boshqa omborga tushib qolardi;
  //    · KONVERGA SARF — tsex boshlig'i adashib yozgan bo'lishi
  //      mumkin, lekin buni OMBOR tarixida ombor mudiri ko'radi:
  //      qoldiq minusga tushib turadi. Ilgari bekor qilish faqat
  //      boshliqning ekranida (▣ oynasi) edi va mudir uni ko'rib
  //      turib, telefon qilishdan boshqa yo'l topmasdi.
  //
  //  Kirim va talabnoma qatori bu yerdan bekor qilinmaydi: ularning
  //  O'Z hujjati bor va u qarzga ham, ikkinchi omborga ham tegadi.
  const ochirsaBoladi = (r) => boshqara() && r.status === 'ok' && !r.doc_kind
    && (r.from_kind === 'opening' || r.to_kind === 'unit');
  $('body').innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Sana</th><th>Material</th><th>Qayerdan</th><th>Qayerga</th>
      <th class="num">Soni</th><th>Kim</th><th></th></tr></thead>
    <tbody>${rows.map((r) => `<tr${r.status === 'ok' ? '' : ' style="opacity:.5"'}>
      <td class="muted">${String(r.moved_on).slice(0, 10).split('-').reverse().join('.')}</td>
      <td><b>${esc(r.material)}</b>${r.status === 'ok' ? ''
        : ' <span class="tag bad">bekor qilingan</span>'}</td>
      <td class="muted">${tomon(r.from_kind, r.from_name)}</td>
      <td class="muted">${tomon(r.to_kind, r.to_name)}</td>
      <td class="num">${son(r.qty)} <span class="muted">${esc(r.uom)}</span></td>
      <td class="muted" style="font-size:12px">${esc(r.worker || '')}</td>
      <td>${ochirsaBoladi(r)
        ? `<button class="ic" title="Bekor qilish"
             onclick="qoldiqOchir(${r.id}, '${r.to_kind}')">&times;</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

//  O'CHIRILMAYDI, BEKOR QILINADI: qoldiqdan chiqadi, tarixda
//  o'chirilgan holida qoladi. Shuning uchun so'raladi — bosilgani
//  qaytarilmaydi.
async function qoldiqOchir(id, kind) {
  const sarf = kind === 'unit';
  if (!confirm(`${sarf ? 'Konverga sarf' : "Boshlang'ich qoldiq"} qatori `
             + 'bekor qilinsinmi?\nQoldiqdan chiqadi, tarixda esa qoladi.'))
    return;
  //  Sarfning O'Z yo'li bor: u konverga tegadi va konver doirasi
  //  o'sha yerda tekshiriladi (izoh: modules/materials.js).
  const yol = sarf ? `/api/materials/consume/${id}/cancel`
                   : `/api/materials/moves/${id}/cancel`;
  try {
    await App.api(yol, { method: 'POST' });
    toast('Bekor qilindi');
    await load();
  } catch (e) { toast(e.message, true); }
}

const yop = () => { $('modalRoot').innerHTML = ''; };

// ─────────────────────────────────────────────────────── KIRIM HUJJATI
//
//  ★ MOL TA'MINOTCHIDAN KELDI. Boshlang'ich qoldiq bir martalik ish va
//  u bajarilib bo'ladi; kundalik hayotda material omborga HUJJAT bilan
//  kiradi va u ikkita ishni BIRGA qiladi: omborni to'ldiradi va
//  ta'minotchining oldidagi qarzni oshiradi (izoh: sql/materials.sql).
//
//  ★ NARX BU YERDA MAJBURIY — boshlang'ich qoldiqdan aynan shu yeri
//  farq qiladi: kirimda narx QARZNING O'ZI. Tekshiruv serverda.
const kun = (d) => String(d).slice(0, 10).split('-').reverse().join('.');

function drawKirim() {
  if (!rows.length) {
    $('body').innerHTML = '<p class="muted">Kirim hujjati yo\'q.'
      + (boshqara() ? ' «+ Kirim» bilan yozing.' : '') + '</p>';
    return;
  }
  $('body').innerHTML = '<div style="overflow-x:auto"><table>'
    + '<thead><tr><th>Hujjat</th><th>Sana</th><th>Ta\'minotchi</th>'
    + '<th>Ombor</th><th>Nima keldi</th>'
    + '<th class="num">Summa, $</th></tr></thead><tbody>'
    + rows.map((r) => {
        const bekor = r.status !== 'ok';
        //  ICHIDA NIMA BORLIGI RO'YXATDA TURADI — vitrinadan qaytarish
        //  hujjati bilan bir xil qoida: nimani solishtirish kerakligini
        //  bilish uchun hujjatni ochib ko'rishdan boshqa yo'l
        //  qolmasligi kerak. Ikkitadan ko'pi «+N» bo'lib qisqaradi.
        const it = r.items || [];
        const nima = it.slice(0, 2).map((x) =>
          esc(x.material) + ' <span class="muted">' + son(x.qty) + ' '
          + esc(x.uom) + '</span>').join('<br>')
          + (it.length > 2
             ? '<br><span class="muted">+' + (it.length - 2) + ' ta</span>' : '');
        return '<tr style="cursor:pointer' + (bekor ? ';opacity:.5' : '')
          + '" onclick="kirimKor(' + r.id + ')">'
          + '<td><b>' + esc(r.doc_no) + '</b>'
          + (r.supplier_doc
             ? '<div class="muted" style="font-size:12px">'
               + esc(r.supplier_doc) + '</div>' : '')
          + (bekor ? '<div class="tag bad">bekor qilingan</div>' : '')
          + '</td>'
          + '<td class="muted">' + kun(r.doc_on) + '</td>'
          + '<td>' + esc(r.supplier) + '</td>'
          + '<td class="muted">' + esc(r.warehouse) + '</td>'
          + '<td style="font-size:13px">' + (nima || '—') + '</td>'
          + '<td class="num"><b>' + pul(r.amount) + '</b></td></tr>';
      }).join('')
    + '</tbody></table></div>';
}

// ═════════════════════════════════════════════ TALABNOMA
//
//  Tsex boshlig'i yozadi, xom ashyo xodimi tayyorlaydi va chiqaradi.
//  Holat ustunda turadi: «meniki qayerda» degan savolga javob
//  ro'yxatning O'ZIDA bo'lsin.
const TALAB_HOLAT = {
  new:       ['Yozilgan',        'warn'],
  ready:     ['Tayyorlangan',    'ok'],
  done:      ['Chiqarilgan',     ''],
  rejected:  ['Rad etilgan',     'bad'],
  cancelled: ['Bekor qilingan',  'bad'],
};

//  Talabnoma YOZADIGAN odam: tsex boshlig'i. Xom ashyo xodimi
//  yozmaydi — u tayyorlaydi va chiqaradi (izoh: modules/materials.js).
const yozadi = () => App.can('materials.request', 'materials.manage',
                             'production.manage');

function drawTalab() {
  $('talabTools').innerHTML = yozadi()
    ? `<button class="primary" onclick="talabOch('issue')">+ Talabnoma</button>
       <button onclick="talabOch('return')">Qaytarish</button>` : '';
  if (!rows.length) {
    $('body').innerHTML = "<p class=\"muted\">Talabnoma yo'q."
      + (yozadi() ? " «+ Talabnoma» bilan yozing." : '') + '</p>';
    return;
  }
  $('body').innerHTML = '<div style="overflow-x:auto"><table>'
    + "<thead><tr><th>Hujjat</th><th>Qayerdan</th><th>Qayerga</th>"
    + '<th>Nima so\'ralgan</th><th>Kerak</th><th>Holat</th></tr></thead><tbody>'
    + rows.map((r) => {
        const [nom, rang] = TALAB_HOLAT[r.status] || [r.status, ''];
        const it = r.items || [];
        //  ICHIDA NIMA BORLIGI RO'YXATDA TURADI: tayyorlaydigan odam
        //  javondagi materialni shu ro'yxat bilan solishtiradi —
        //  kirim va vitrina hujjati bilan bir xil qoida.
        const nima = it.slice(0, 2).map((x) =>
          esc(x.material) + ' <span class="muted">' + son(x.qty) + ' '
          + esc(x.uom || '')
          + (x.issued_qty != null && Number(x.issued_qty) !== Number(x.qty)
             ? ' → ' + son(x.issued_qty) : '')
          + '</span>').join('<br>')
          + (it.length > 2
             ? '<br><span class="muted">+' + (it.length - 2) + ' ta</span>' : '');
        return '<tr style="cursor:pointer" onclick="talabKor(' + r.id + ')">'
          + '<td><b>' + esc(r.doc_no || '—') + '</b>'
          + (r.kind === 'return'
             ? '<div class="muted" style="font-size:12px">qaytarish</div>' : '')
          + '</td>'
          + '<td class="muted">' + esc(r.from_warehouse) + '</td>'
          + '<td class="muted">' + esc(r.to_warehouse) + '</td>'
          + '<td style="font-size:13px">' + (nima || '—') + '</td>'
          + '<td class="muted">' + (r.need_on ? kun(r.need_on) : '—') + '</td>'
          + '<td><span class="tag ' + rang + '">' + nom + '</span></td></tr>';
      }).join('')
    + '</tbody></table></div>';
}

// ═══════════════════════════════════════════ XARID ZAYAVKASI
//
//  ★ ZAYAVKANI ODAM YOZMAYDI — tizim yozadi (zavod qarori,
//  2026-09). Talabnoma kelganda omborda yetmagani shu yerda hujjat
//  bo'lib turadi: «+ Zayavka» tugmasi yo'q va bo'lishi ham kerak
//  emas — yetishmagan mol og'zaki aytilsa esdan chiqardi.
const ZAY_HOLAT = {
  new:       ['Yozilgan',           'warn'],
  ordered:   ['Buyurtma berilgan',  ''],
  done:      ['Keldi',              'ok'],
  cancelled: ['Bekor qilingan',     'bad'],
};

function drawZay() {
  if (!rows.length) {
    $('body').innerHTML = "<p class=\"muted\">Zayavka yo'q — omborda "
      + 'hammasi yetarli.</p>';
    return;
  }
  $('body').innerHTML = '<div style="overflow-x:auto"><table>'
    + "<thead><tr><th>Hujjat</th><th>Ta'minotchi</th><th>Ombor</th>"
    + '<th>Nima kerak</th><th>Kerak</th><th>Holat</th></tr></thead><tbody>'
    + rows.map((r) => {
        const [nom, rang] = ZAY_HOLAT[r.status] || [r.status, ''];
        const it = r.items || [];
        //  ICHIDA NIMA BORLIGI RO'YXATDA TURADI — talabnoma va kirim
        //  hujjati bilan bir xil qoida: buyurtma beradigan odam
        //  hujjatni ochmasdan turib nima kerakligini ko'radi.
        const nima = it.slice(0, 2).map((x) =>
          esc(x.material) + ' <span class="muted">' + son(x.qty) + ' '
          + esc(x.uom || '') + '</span>').join('<br>')
          + (it.length > 2
             ? '<br><span class="muted">+' + (it.length - 2) + ' ta</span>' : '');
        return '<tr style="cursor:pointer" onclick="zayKor(' + r.id + ')">'
          + '<td><b>' + esc(r.doc_no || '—') + '</b></td>'
          //  ★ TA'MINOTCHISIZ ZAYAVKA — SAVOL, bo'sh katak emas.
          //  Bitta materialda bir nechta ta'minotchi bo'ladi va
          //  qaysi biridan olish narxga qarab hal qilinadi.
          + '<td>' + (r.supplier ? esc(r.supplier)
              : '<span class="tag warn">tanlanmagan</span>') + '</td>'
          + '<td class="muted">' + esc(r.warehouse || '') + '</td>'
          + '<td style="font-size:13px">' + (nima || '—') + '</td>'
          + '<td class="muted">' + (r.need_on ? kun(r.need_on) : '—') + '</td>'
          + '<td><span class="tag ' + rang + '">' + nom + '</span></td></tr>';
      }).join('')
    + '</tbody></table></div>';
}

function zayKor(id) {
  const r = rows.find((x) => x.id === id);
  if (!r) return;
  const [nom, rang] = ZAY_HOLAT[r.status] || [r.status, ''];
  const ochiq = ['new', 'ordered'].includes(r.status);
  const it = r.items || [];
  const sup = (ref.suppliers || []);
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Xarid zayavkasi ${esc(r.doc_no || '')}</h1>
          <button onclick="yop()">Yopish</button></div>
        <p class="muted" style="margin-bottom:12px">
          ${esc(r.warehouse)} omboriga${r.need_on ? ' · kerak: ' + kun(r.need_on) : ''}
          · <span class="tag ${rang}">${nom}</span></p>
        ${boshqara() && ochiq ? `
          <div style="margin-bottom:12px"><label>Ta'minotchi</label>
            <select id="zSup" onchange="zaySup(${r.id}, this.value)">
              <option value="">— tanlanmagan —</option>
              ${sup.map((x) => `<option value="${x.id}"${
                x.id === r.supplier_id ? ' selected' : ''
                }>${esc(x.name)}</option>`).join('')}
            </select></div>` : ''}
        <table><thead><tr><th>Material</th><th class="num">Kerak</th>
          <th>Nega</th></tr></thead><tbody>
          ${it.map((x) => `<tr>
            <td>${esc(x.material)} <span class="muted">${esc(x.uom || '')}</span></td>
            <td class="num">${son(x.qty)}</td>
            <td class="muted" style="font-size:12px">${
              x.request_no ? esc(x.request_no) + (x.shop ? ' · ' + esc(x.shop) : '')
                           : '—'}</td>
          </tr>`).join('')}
        </tbody></table>
        ${r.decide_note ? `<p class="muted" style="margin-top:10px">
          Sabab: ${esc(r.decide_note)}</p>` : ''}
        <div class="row" style="gap:8px;margin-top:16px;flex-wrap:wrap">
          ${boshqara() && r.status === 'new'
            ? `<button class="primary" onclick="zayAmal(${r.id}, 'ordered')">
                 Buyurtma berdim</button>` : ''}
          ${boshqara() && ochiq
            ? `<button onclick="zayAmal(${r.id}, 'done')">Keldi</button>` : ''}
          ${boshqara() && ochiq
            ? `<button onclick="zayRad(${r.id})">Bekor qilish</button>` : ''}
        </div>
        <div id="zActMsg"></div>
      </div></div>`;
}

const zayYubor = async (yol, body) => {
  try {
    await App.api(yol, { method: 'POST', body: JSON.stringify(body || {}) });
    yop(); toast('Bajarildi'); await load();
  } catch (e) {
    if ($('zActMsg'))
      $('zActMsg').innerHTML = `<div class="tag bad" style="margin-top:10px;
        display:inline-block;white-space:normal">${esc(e.message)}</div>`;
    toast(e.message, true);
  }
};

//  Ta'minotchi tanlanganda oyna YOPILMAYDI: keyin darrov «Buyurtma
//  berdim» bosiladi va ikkinchi marta ochib o'tirish ortiqcha ish
//  bo'lardi.
async function zaySup(id, v) {
  try {
    await App.api(`/api/materials/orders/${id}/supplier`,
      { method: 'POST', body: JSON.stringify({ supplier_id: Number(v) || null }) });
    const r = rows.find((x) => x.id === id);
    if (r) { r.supplier_id = Number(v) || null;
             r.supplier = (ref.suppliers || []).find((x) => x.id === r.supplier_id)?.name
                          || null; }
    toast('Saqlandi');
  } catch (e) { toast(e.message, true); }
}

const zayAmal = (id, holat) => zayYubor(`/api/materials/orders/${id}/${holat}`);

const zayRad = (id) => {
  const sabab = prompt('Sabab?');
  if (!sabab) return;
  return zayYubor(`/api/materials/orders/${id}/reject`, { note: sabab });
};

//  ★ OCHILMA EMAS, QIDIRUV — kirim va boshlang'ich qoldiq bilan
//  bir xil qoida: zavodda to'qqiz yuz material bor.
let tQator = [];
//  Manba (zavod ombori) ro'yxati: tanlangan qabul omboriga qarab
//  qayta chiziladi, shuning uchun oyna ochilganda saqlab qo'yiladi.
let tZavod = [];

function talabOch(kind) {
  tQator = [];
  //  ★ QABUL QILADIGAN OMBOR — `shop_id` EMAS, «TSEXNIKI» (zavod
  //  qarori, 2026-09). Ilgari faqat `shop_id` borlari olinardi va
  //  «Qadoqlash ombori» ro'yxatdan tushib qolardi: u ZAVOD ombori
  //  (ta'minotchidan mol to'g'ridan-to'g'ri unga keladi, ya'ni
  //  `shop_id` yo'q), lekin uni QADOQLASH tsexi yuritadi
  //  (`owner_shop_id`). Natijada o'sha tsexning boshlig'ida ro'yxat
  //  BUTUNLAY bo'sh chiqardi va talabnoma umuman yozilmasdi.
  //
  //  Shart `/ref` dagi doira bilan bir xil manbadan: ombor
  //  TSEXNIKI bo'lsa — joyi bo'yicha yoki javobgari bo'yicha —
  //  unga talabnoma yoziladi. Xom ashyo, MDF va Furnitura
  //  ikkalasida ham bo'sh, ya'ni ular faqat MANBA bo'lib qoladi.
  const tsexlar = ref.warehouses.filter((w) => w.shop_id || w.owner_shop_id);
  //  Zavod omborlari ALOHIDA keladi: tsex boshlig'ining doirasi
  //  ko'radigan ro'yxatini cheklaydi va zavod ombori undan tushib
  //  qolardi — so'rash uchun joy qolmasdi (izoh: modules/materials.js).
  tZavod = ref.factory_warehouses || ref.warehouses.filter((w) => !w.shop_id);
  const qaytar = kind === 'return';
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:720px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>${qaytar ? 'Omborga qaytarish' : 'Talabnoma'}</h1>
          <button onclick="yop()">Yopish</button></div>
        <input type="hidden" id="tKindNew" value="${kind}">
        <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end;
          margin-bottom:12px">
          <div style="flex:1;min-width:210px"><label>Tsex ombori</label>
            <select id="tShopWh" onchange="talabYol()">${tsexlar.map((w) =>
              `<option value="${w.id}">${esc(w.name)}${
                joyi(w) ? ' · ' + esc(joyi(w)) : ''}</option>`).join('')}</select></div>
          ${qaytar ? `<div style="flex:1;min-width:210px">
            <label>Zavod ombori</label>
            <select id="tFactWh" onchange="talabYol()"></select></div>` : ''}
          ${qaytar ? '' : `<div style="width:170px"><label>Qachon kerak</label>
            <input id="tNeed" type="date"></div>`}
        </div>
        ${tsexlar.length ? '' : `<p class="tag bad" style="display:inline-block;
          white-space:normal;margin-bottom:10px">Sizga biriktirilgan ombor yo'q —
          Xodimlar sahifasida «Ombor doirasi» ni tekshiring.</p>`}
        <p id="tYol" style="margin-bottom:6px"></p>
        <p class="muted" style="margin-bottom:10px">${qaytar
          ? "Tsexdan ortib qolgan material zavod omboriga QAYTARILADI — "
            + "tsex qoldig'i kamayadi. Material so'rash uchun «+ Talabnoma»."
          : "Kerakli materialni yozing — qaysi ombordan kelishini tizim "
            + "o'zi topadi va har ombor uchun alohida hujjat yasaydi."}</p>
        <input id="tQ" placeholder="material nomini yozing" autocomplete="off"
          oninput="talabTop()" style="margin-bottom:8px">
        <div id="tList" style="max-height:190px;overflow:auto;
          margin-bottom:12px"></div>
        <div id="tRows"></div>
        <button class="primary" id="tSave" style="margin-top:14px" hidden
          onclick="talabSaqla()">Saqlash</button>
        <div id="tSaveMsg"></div>
      </div></div>`;
  talabTop(); talabRows(); talabYol();
}

//  ★ YO'NALISH YOZILIB TURADI, IKKALA HUJJATDA HAM. Ikki katak ham
//  «ombor» deb ataladi va qaysi biri manba ekani nomidan ko'rinmaydi:
//  tsex boshlig'i «Qaytarish» tugmasini adashib bosib, shkurka
//  so'ragan o'rniga tsexdagi shkurkani omborga qaytarib yuborardi va
//  buni hujjat CHIQARILGANDA — qoldiq kamayganda — bilardi. Strelka
//  saqlashdan OLDIN turadi: kirim oynasidagi «jami» bilan bir xil
//  sabab, xato o'sha yerda bilinsin.
function talabYol() {
  if (!$('tYol')) return;
  const nom = (id) => (ref.warehouses.find((w) => w.id === Number(id))
    || (ref.factory_warehouses || []).find((w) => w.id === Number(id))
    || {}).name || '—';

  //  ★ O'ZIDAN O'ZIGA HUJJAT BO'LMAYDI. «Qadoqlash ombori» ikkala
  //  ro'yxatda ham turadi — u ZAVOD ombori (manba bo'la oladi) va
  //  ayni paytda TSEXNIKI (qabul qila oladi). Ikkala katakda bir xil
  //  ombor tanlansa hujjat o'zidan o'ziga yozilardi: qoldiq
  //  o'zgarmasdi, hujjat esa navbatda turardi. Shuning uchun manba
  //  ro'yxatidan tanlangan qabul ombori olib tashlanadi.
  //
  //  Katak faqat QAYTARISHDA turadi: talabnomada manbani tizim
  //  topadi va u har QATOR uchun boshqacha bo'lishi mumkin.
  const f = $('tFactWh');
  if (f) {
    const qabul = Number($('tShopWh')?.value) || 0;
    const eski = f.value;
    const mos = tZavod.filter((w) => w.id !== qabul);
    f.innerHTML = mos.map((w) =>
      `<option value="${w.id}">${esc(w.name)}</option>`).join('');
    if (mos.some((w) => String(w.id) === eski)) f.value = eski;
  }

  const tsex   = nom($('tShopWh')?.value);
  const qaytar = $('tKindNew').value === 'return';
  $('tYol').innerHTML = qaytar
    ? '<b>' + esc(tsex) + '</b> <span class="muted">&rarr;</span> <b>'
      + esc(nom($('tFactWh')?.value)) + '</b>'
    : '<span class="muted">Zavod omboridan</span> <span class="muted">&rarr;</span> <b>'
      + esc(tsex) + '</b>';
  if (!qaytar) talabManba();
}

//  ★ MANBA HAR QATORNING YONIDA YOZILADI (zavod qarori, 2026-09).
//  Tizim manbani o'zi topadi, lekin JIM topmaydi: boshliq
//  saqlashdan OLDIN «Sintifon — Xom ashyo ombori» deb o'qiydi.
//  Jim hal qilinsa, hujjat begona omborga ketgani faqat rad
//  etilganda bilinardi (kirim oynasidagi «jami» bilan bir xil
//  sabab).
//
//  Javob SERVERDAN so'raladi: qoida u yerda (`manbaTop`) va
//  ekranda ikkinchi nusxasi bo'lsa bir kun ajralib ketardi —
//  ekranda bir ombor yozilib, hujjat boshqasiga ketardi.
let tManbaSorov = 0;
async function talabManba() {
  const idlar = tQator.map((r) => r.id);
  if (!idlar.length) return;
  const nav = ++tManbaSorov;
  try {
    const r = await App.api('/api/materials/requests/source?ids=' + idlar.join(',')
      + '&to=' + (Number($('tShopWh')?.value) || ''));
    //  Kechikib kelgan javob yangisining ustiga yozmasin: qator
    //  qo'shilgan zahoti yangi so'rov ketadi.
    if (nav !== tManbaSorov) return;
    for (const x of r.rows) {
      const q = tQator.find((y) => y.id === x.material_id);
      if (q) q.manba = x.warehouse || null;
    }
    talabRows();
  } catch { /* manba topilmasa qator baribir yoziladi */ }
}

function talabTop() {
  const q = ($('tQ')?.value || '').trim().toLowerCase();
  if (!$('tList')) return;
  const olingan = new Set(tQator.map((r) => r.id));
  const mos = q
    ? barcha.filter((m) => !olingan.has(m.id)
        && String(m.name).toLowerCase().includes(q)).slice(0, 30)
    : [];
  $('tList').innerHTML = q
    ? (mos.length
        ? mos.map((m) => `
            <button style="width:100%;text-align:left;margin-bottom:4px;
              display:flex;justify-content:space-between;gap:10px"
              onclick="talabQosh(${m.id})">
              <span>${esc(m.name)}</span>
              <span class="muted" style="font-size:12px">${
                esc(m.uom_name || m.uom)}</span></button>`).join('')
        : '<p class="muted" style="font-size:13px">Topilmadi</p>')
    : '';
}

function talabQosh(id) {
  const m = barcha.find((x) => x.id === id);
  if (!m) return;
  //  ★ YANGI QATOR TEPAGA (zavod qarori, 2026-09). Ilgari oxiriga
  //  qo'shilardi: telefonda ro'yxat o'n qatorga yetganda yangi
  //  tanlangan material EKRANDAN CHIQIB ketardi va boshliq soni
  //  yozish uchun har safar pastga surardi — qidiruv katagi esa
  //  tepada qolardi. Endi javob tanlangan joyning O'ZIDA turadi.
  //  Hujjatga ta'sir qilmaydi: saqlangach qatorlar nom bo'yicha
  //  tartiblanadi (`ORDER BY mt.name`, `sql/materials.sql`).
  tQator.unshift({ id, name: m.name, uom: m.uom_name || m.uom, qty: '' });
  $('tQ').value = '';
  talabTop(); talabRows();
  if ($('tKindNew').value !== 'return') talabManba();
}

function talabRows() {
  if (!$('tRows')) return;
  $('tRows').innerHTML = tQator.map((r, i) => `
    <div class="row" style="gap:8px;align-items:center;margin-bottom:6px">
      <div style="flex:1"><b>${esc(r.name)}</b>
        <span class="muted" style="font-size:12px"> ${esc(r.uom)}</span>
        ${r.manba ? `<div class="muted" style="font-size:12px">${
          esc(r.manba)}</div>` : ''}</div>
      <input type="number" min="0" step="0.001" value="${r.qty}"
        style="width:120px;text-align:right" placeholder="soni"
        oninput="talabQty(${i}, this.value)">
      <button class="ic" onclick="talabOchir(${i})">&times;</button>
    </div>`).join('');
  $('tSave').hidden = !tQator.length;
}

const talabQty   = (i, v) => { tQator[i].qty = v; };
const talabOchir = (i) => { tQator.splice(i, 1); talabTop(); talabRows(); };

async function talabSaqla() {
  const items = tQator.map((r) => ({ material_id: r.id, qty: Number(r.qty) || 0 }))
    .filter((x) => x.qty > 0);
  if (!items.length)
    return saqlanmadi('tSave', new Error("Soni yozilgan qator yo'q"));
  saqlanmoqda('tSave');
  try {
    const r = await App.api('/api/materials/requests', { method: 'POST',
      body: JSON.stringify({
        kind: $('tKindNew').value,
        shop_warehouse_id: Number($('tShopWh').value) || null,
        //  Talabnomada ombor YUBORILMAYDI — manbani server topadi va
        //  qatorlarni o'sha bo'yicha guruhlaydi (izoh: `manbaTop`,
        //  modules/materials.js). Qaytarishda esa manzil bitta va uni
        //  odam tanlaydi.
        factory_warehouse_id: $('tFactWh') ? (Number($('tFactWh').value) || null)
                                           : null,
        need_on: $('tNeed') ? ($('tNeed').value || null) : null,
        items }) });
    //  ★ NECHTA HUJJAT YASALGANI AYTILADI. Bitta ro'yxat ikki
    //  omborga bo'linishi mumkin va boshliq buni BILISHI kerak:
    //  ikkita hujjatni ikki xodim chiqaradi, ya'ni material ham
    //  ikki bo'lib keladi.
    const d = r.docs || [{ doc_no: r.doc_no }];
    yop();
    toast(d.length > 1
      ? d.length + ' ta hujjat: ' + d.map((x) =>
          x.doc_no + (x.warehouse ? ' · ' + x.warehouse : '')).join(', ')
      : d[0].doc_no + ' yozildi');
    tab = 'talab'; drawTabs(); await load();
  } catch (e) { saqlanmadi('tSave', e); }
}

//  Hujjatni ochish: qatorlari bilan. Tayyorlash va chiqarish shu
//  yerda — ro'yxatdan turib bosilsa qaysi biri ekani ko'rinmasdi.
async function talabKor(id) {
  const r = rows.find((x) => x.id === id);
  if (!r) return;
  const [nom, rang] = TALAB_HOLAT[r.status] || [r.status, ''];
  const ochiq = ['new', 'ready'].includes(r.status);
  const it = r.items || [];
  //  ★ QAYTARISHDA SO'Z BOSHQA. Talabnomada ombor xodimi materialni
  //  CHIQARADI, qaytarishda esa QABUL QILADI — yo'nalish teskari va
  //  hujjatni boshlagan odam ham boshqa (izoh: sql/materials.sql).
  //  Ilgari ikkala hujjatda ham «Chiqardim» deb turardi: qaytarishni
  //  ochgan mudir o'zi chiqarayotgandek o'qirdi va tsex boshlig'i
  //  tugmani adashtirib bosgani aynan shu yerda ko'rinmay qolardi.
  const qaytar = r.kind === 'return';
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>${r.kind === 'return' ? 'Qaytarish' : 'Talabnoma'} ${esc(r.doc_no || '')}</h1>
          <button onclick="yop()">Yopish</button></div>
        <p class="muted" style="margin-bottom:12px">
          ${esc(r.from_warehouse)} → ${esc(r.to_warehouse)}
          ${r.need_on ? ' · kerak: ' + kun(r.need_on) : ''}
          · <span class="tag ${rang}">${nom}</span></p>
        <table><thead><tr><th>Material</th><th class="num">So'raldi</th>
          ${boshqara() && ochiq
            ? `<th class="num">${qaytar ? 'Qabul qilinadi' : 'Beriladi'}</th>` : ''}
          ${r.status === 'done'
            ? `<th class="num">${qaytar ? 'Qabul qilindi' : 'Berildi'}</th>` : ''}
          </tr></thead><tbody>
          ${it.map((x, i) => `<tr>
            <td>${esc(x.material)} <span class="muted">${esc(x.uom || '')}</span></td>
            <td class="num">${son(x.qty)}</td>
            ${boshqara() && ochiq ? `<td class="num">
              <input type="number" min="0" step="0.001" class="tGive"
                data-mat="${x.material_id}" value="${son(x.qty)}"
                style="width:110px;text-align:right"></td>` : ''}
            ${r.status === 'done'
              ? `<td class="num">${x.issued_qty == null ? '—' : son(x.issued_qty)}</td>`
              : ''}
          </tr>`).join('')}
        </tbody></table>
        ${r.decide_note ? `<p class="muted" style="margin-top:10px">
          Sabab: ${esc(r.decide_note)}</p>` : ''}
        <div class="row" style="gap:8px;margin-top:16px;flex-wrap:wrap">
          ${boshqara() && r.status === 'new' && r.kind === 'issue'
            ? `<button onclick="talabReady(${r.id})">Tayyorladim</button>` : ''}
          ${boshqara() && ochiq
            ? `<button class="primary" onclick="talabDone(${r.id})">
                 ${qaytar ? 'Qabul qildim' : 'Chiqardim'}</button>` : ''}
          ${ochiq ? `<button onclick="talabRad(${r.id})">Bekor qilish</button>` : ''}
        </div>
        <div id="tActMsg"></div>
      </div></div>`;
}

const talabAmal = async (yol, body) => {
  try {
    await App.api(yol, { method: 'POST', body: JSON.stringify(body || {}) });
    yop(); toast('Bajarildi'); await load();
  } catch (e) {
    if ($('tActMsg'))
      $('tActMsg').innerHTML = `<div class="tag bad" style="margin-top:10px;
        display:inline-block;white-space:normal">${esc(e.message)}</div>`;
    toast(e.message, true);
  }
};

const talabReady = (id) => talabAmal(`/api/materials/requests/${id}/ready`);

//  ★ BERILGAN SONI ALOHIDA: ombor xodimi 100 so'ralganda 60 ta bera
//  oladi. Katakchalar so'ralgani bilan to'ldirilgan — hammasini
//  bergan odam raqamlarni qayta terib o'tirmasin.
const talabDone = (id) => talabAmal(`/api/materials/requests/${id}/done`, {
  items: [...document.querySelectorAll('.tGive')].map((el) => ({
    material_id: Number(el.dataset.mat), qty: Number(el.value) || 0 })),
});

const talabRad = (id) => {
  const sabab = prompt('Sabab?');
  if (!sabab) return;
  return talabAmal(`/api/materials/requests/${id}/reject`, { note: sabab });
};

//  Hujjatni ko'rish: qatorlari narxi bilan. Bekor qilish shu yerda —

        ${r.note ? `<p class="muted" style="margin-top:10px">${esc(r.note)}</p>` : ''}

               onclick="kirimBekor(${r.id})">Hujjatni bekor qilish</button>` : ''}
      </div></div>`;
}

//  O'CHIRILMAYDI, bekor qilinadi: qoldiqdan ham, ta'minotchining
//  qarzidan ham chiqadi, tarixda esa qoladi. Sabab so'raladi —
//  konver so'rovi va kassadagi operatsiya bilan bir xil idiom.
async function kirimBekor(id) {
  const sabab = prompt('Nega bekor qilinmoqda?');
  if (sabab === null) return;
  try {
    await App.api('/api/materials/receipts/' + id + '/cancel',
      { method: 'POST', body: JSON.stringify({ note: sabab }) });
    yop(); toast('Hujjat bekor qilindi'); await load();
  } catch (e) { toast(e.message, true); }
}

  //  tanlangan material EKRANDAN CHIQIB ketardi va boshliq soni

        style="width:120px;text-align:right" placeholder="narx"
        oninput="kirimNarx(${i}, this.value)">
      <span class="muted nPfx" style="width:34px;font-size:12px">$</span>
      <button class="ic" onclick="kirimOchir(${i})">&times;</button>
    </div>`).join('');
  $('nSave').hidden = !kQator.length;
  kirimKurs();
}

const kirimQty  = (i, v) => { kQator[i].qty = v; kirimJami(); };
const kirimNarx = (i, v) => { kQator[i].price = v; kirimJami(); };
const kirimOchir = (i) => { kQator.splice(i, 1); kirimTop(); kirimRows(); };

//  ★ JAMI SAQLASHDAN OLDIN KO'RINADI (boshlang'ich qoldiq va kassadagi
//  order bilan bir xil sabab): bir nol ortiqcha yozilgani aynan shu
//  yerda bilinadi, ta'minotchining qarzida emas.
function kirimJami() {
  if (!$('nJami')) return;
  const kurs = Number($('nRate')?.value) || 0;
  const uzs  = $('nCcy').value === 'UZS';
  let jami = 0, yoq = 0;
  for (const r of kQator) {
    const q = Number(r.qty) || 0, p = Number(r.price) || 0;
    if (!q) continue;
    if (!p) { yoq++; continue; }
    jami += q * (uzs ? (kurs ? p / kurs : 0) : p);
  }
  $('nJami').innerHTML = kQator.length
    ? `<div class="muted" style="font-size:12px">Jami</div>
       <div style="font-size:22px;font-weight:600">$${pul(jami)}</div>${
       yoq ? `<div class="tag bad">${yoq} qatorda narx yo'q</div>` : ''}`
    : '';
}

async function kirimSaqla() {
  const items = kQator.map((r) => ({
    material_id: r.id,
    qty: Number(r.qty) || 0,
    price: Number(r.price) || 0,
  })).filter((x) => x.qty > 0);
  if (!items.length)
    return saqlanmadi('nSave', new Error("Soni yozilgan qator yo'q"));
  if (!$('nSup').value)
    return saqlanmadi('nSave', new Error('Ta\'minotchi tanlanmadi'));
  if (!$('nWh').value)
    return saqlanmadi('nSave', new Error('Ombor tanlanmadi'));
  saqlanmoqda('nSave');
  try {
    const r = await App.api('/api/materials/receipts', { method: 'POST',
      body: JSON.stringify({
        supplier_id: Number($('nSup').value),
        warehouse_id: Number($('nWh').value),
        doc_on: $('nOn').value || null,
        supplier_doc: $('nDoc').value.trim() || null,
        ccy: $('nCcy').value,
        rate: Number($('nRate').value) || null,
        items }) });
    yop(); toast(r.doc_no + ' yozildi');
    tab = 'kirim'; drawTabs(); await load();
  } catch (e) { saqlanmadi('nSave', e); }
}

// ─────────────────────────────────────────────── BOSHLANG'ICH QOLDIQ
//
//  Tizim ishga tushgan kundagi holat. Bir martalik ish: o'sha ombor va
//  material uchun ikkinchi marta yozilmaydi — aks holda qoldiq
//  jimgina ikki barobar bo'lib ketardi (tekshiruv serverda).
let oQator = [];

function boshlangich(whId) {
  oQator = [];
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:720px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Boshlang'ich qoldiq</h1>
          <button onclick="yop()">Yopish</button></div>
        <div class="row" style="gap:12px;align-items:flex-end;margin-bottom:12px">
          <div><label>Sana</label>
            <input id="oOn" type="date"
              value="${new Date().toISOString().slice(0, 10)}"></div>
          <div style="flex:1;min-width:200px"><label>Ombor</label>
            <select id="oWh">${ref.warehouses.map((w) =>
              `<option value="${w.id}"${w.id === whId ? ' selected' : ''}>${
                esc(w.name)}${joyi(w) ? ' · ' + esc(joyi(w)) : ''}</option>`).join('')}</select></div>
        </div>
        <!--  ★ NARX HUJJATNING VALYUTASIDA (izoh: sql/materials.sql):
              MDF dollarda olinadi, mahalliy yelim so'mda. Kurs hujjat
              bo'yicha BITTA — o'sha kunning kursi baribir bitta va uni
              har qatorda qayta terish bitta xato raqam uchun o'nta
              imkoniyat berardi (kassadagi order bilan bir xil idiom). -->
        <div class="row" style="gap:12px;align-items:flex-end;margin-bottom:12px">
          <div style="width:140px"><label>Valyuta</label>
            <select id="oCcy" onchange="oKurs()">
              <option value="USD">$ — dollar</option>
              <option value="UZS">so'm</option></select></div>
          <div style="width:170px" id="oRateBox" hidden><label>Kurs (1$)</label>
            <input id="oRate" type="number" min="0" step="0.01"
              value="${ref.rate || ''}" oninput="boshJami()"></div>
          <div style="flex:1;text-align:right" id="oJami"></div>
        </div>
        <p class="muted" style="margin-bottom:12px">Tizim ishga tushgan
          kundagi holat. Bir martalik ish: bir xil material ikkinchi
          marta yozilmaydi. <b>Narx ixtiyoriy</b> — yozilmagan qator
          omborning qiymatiga qo'shilmaydi, lekin qoldiqda turaveradi.</p>
        <!--  ★ OCHILMA EMAS, QIDIRUV (konverga xom ashyo biriktirish va
              kirim hujjati bilan bir xil qoida). Zavodda to'qqiz yuz
              material bor: ochilmada ularni aylantirib topib bo'lmaydi
              va «Shkurka» ni qidirayotgan mudir ro'yxatning o'rtasida
              adashib qolardi. -->
        <input id="oQ" placeholder="material nomini yozing" autocomplete="off"
          oninput="boshTop()" style="margin-bottom:8px">
        <div id="oList" style="max-height:190px;overflow:auto;
          margin-bottom:12px"></div>
        <div id="oRows"></div>
        <button class="primary" id="oSave" style="margin-top:14px" hidden
          onclick="boshSaqla()">Saqlash</button>
        <div id="oSaveMsg"></div>
      </div></div>`;
  oKurs();
  boshTop(); boshRows();
}

//  So'm tanlanganda kurs katagi ochiladi: dollarda u kerak emas va
//  bo'sh katak bo'lib turgani «to'ldirilmagan» degan savol berardi.
function oKurs() {
  $('oRateBox').hidden = $('oCcy').value !== 'UZS';
  for (const el of document.querySelectorAll('.oPfx'))
    el.textContent = $('oCcy').value === 'UZS' ? "so'm" : '$';
  boshJami();
}

//  ★ JAMI SAQLASHDAN OLDIN KO'RINADI — kassaning boshlang'ich qoldiq
//  oynasi bilan bir xil sabab: bir nol ortiqcha yozilgani aynan shu
//  yerda bilinadi, qoldiq jadvalida emas.
function boshJami() {
  const kurs = Number($('oRate')?.value) || 0;
  const uzs  = $('oCcy').value === 'UZS';
  let jami = 0, yoq = 0;
  for (const r of oQator) {
    const q = Number(r.qty) || 0, p = Number(r.price) || 0;
    if (!q) continue;
    if (!p) { yoq++; continue; }
    jami += q * (uzs ? (kurs ? p / kurs : 0) : p);
  }
  $('oJami').innerHTML = jami || yoq
    ? `<div class="muted" style="font-size:12px">Jami</div>
       <div style="font-size:20px;font-weight:600">$${pul(jami)}</div>${
       yoq ? `<div class="muted" style="font-size:12px">${yoq} qatorda narx yo'q</div>` : ''}`
    : '';
}

//  Qidiruv yozilmaguncha ro'yxat chiqarilmaydi: to'qqiz yuz qator
//  ekranni egallab, qatorlar ostida qolib ketardi. Olingani ro'yxatdan
//  tushadi — bitta material ikki marta yozilsa server baribir rad
//  etadi, lekin buni saqlashdan oldin ko'rgan ma'qul.
function boshTop() {
  const q = ($('oQ')?.value || '').trim().toLowerCase();
  if (!$('oList')) return;
  const olingan = new Set(oQator.map((r) => r.id));
  const mos = q
    ? barcha.filter((m) => !olingan.has(m.id)
        && String(m.name).toLowerCase().includes(q)).slice(0, 30)
    : [];
  $('oList').innerHTML = q
    ? (mos.length
        ? mos.map((m) => `
            <button style="width:100%;text-align:left;margin-bottom:4px;
              display:flex;justify-content:space-between;gap:10px"
              onclick="boshQosh(${m.id})">
              <span>${esc(m.name)}</span>
              <span class="muted" style="font-size:12px">${
                esc(m.uom_name || m.uom)}</span></button>`).join('')
        : '<p class="muted" style="font-size:13px">Topilmadi</p>')
    : '';
}

function boshQosh(id) {
  const m = barcha.find((x) => x.id === id);
  if (!m) return;
  //  ★ YANGI QATOR TEPAGA (zavod qarori, 2026-09). Ilgari oxiriga
  //  qo'shilardi: telefonda ro'yxat o'n qatorga yetganda yangi
  //  tanlangan material EKRANDAN CHIQIB ketardi va boshliq soni
  //  yozish uchun har safar pastga surardi — qidiruv katagi esa
  //  tepada qolardi. Endi javob tanlangan joyning O'ZIDA turadi.
  //  Hujjatga ta'sir qilmaydi: saqlangach qatorlar nom bo'yicha
  //  tartiblanadi (`ORDER BY mt.name`, `sql/materials.sql`).
  oQator.unshift({ id, name: m.name, uom: m.uom_name || m.uom,
    qty: '', price: '' });
  $('oQ').value = '';
  boshTop(); boshRows();
}

function boshRows() {
  if (!$('oRows')) return;
  $('oRows').innerHTML = oQator.map((r, i) => `
    <div class="row" style="gap:8px;align-items:center;margin-bottom:6px">
      <div style="flex:1"><b>${esc(r.name)}</b>
        <span class="muted" style="font-size:12px"> ${esc(r.uom)}</span></div>
      <input type="number" min="0" step="0.001" value="${r.qty}"
        style="width:100px;text-align:right" placeholder="soni"
        oninput="boshQty(${i}, this.value)">
      <input type="number" min="0" step="0.0001" value="${r.price}"
        style="width:120px;text-align:right" placeholder="narx"
        oninput="boshNarx(${i}, this.value)">
      <span class="muted oPfx" style="width:34px;font-size:12px">$</span>
      <button class="ic" onclick="boshOchir(${i})">&times;</button>
    </div>`).join('');
  $('oSave').hidden = !oQator.length;
  oKurs();
}

const boshQty   = (i, v) => { oQator[i].qty = v; boshJami(); };
const boshNarx  = (i, v) => { oQator[i].price = v; boshJami(); };
const boshOchir = (i) => { oQator.splice(i, 1); boshTop(); boshRows(); };

//  Ro'yxat spravochnikdan: qo'lda yozish yo'q, aks holda bitta
//  «Petlya» va bitta «petlya » qoldiqni ikkiga bo'lib yuborardi.
let barcha = [];

async function boshSaqla() {
  const items = oQator.map((r) => ({
    material_id: r.id,
    qty: Number(r.qty) || 0,
    price: Number(r.price) || null,
    warehouse_id: Number($('oWh').value) || null,
  })).filter((x) => x.qty > 0);
  const wh = ref.warehouses.find((w) => String(w.id) === $('oWh').value);
  if (!items.length)
    return saqlanmadi('oSave', new Error("Soni yozilgan qator yo'q"));
  saqlanmoqda('oSave');
  try {
    const r = await App.api('/api/materials/opening', { method: 'POST',
      body: JSON.stringify({ on: $('oOn').value || null,
        ccy: $('oCcy').value, rate: Number($('oRate').value) || null, items }) });
    yop();
    //  Qayerga yozilgani ham aytiladi: oynada ikkita ombor ro'yxati
    //  turadi (sahifaniki va oynaniki) va adashib boshqasiga
    //  yozilgani faqat qoldiqni ochib ko'rganda bilinardi.
    toast(`${r.saved} ta qator yozildi${wh ? ' · ' + wh.name : ''}`);
    tab = 'stock'; drawTabs(); await load();
  } catch (e) { saqlanmadi('oSave', e); }
}

//  Bitta material qo'lda ham qo'shiladi: ro'yxat fayldan yuklanadi,
//  lekin ertaga bitta yangi material kelsa fayl yasab o'tirmasin.
function oyna(r) {
  const royxat = (list, v, bosh) => `<option value="">${bosh}</option>`
    + list.map((x) => `<option value="${esc(x.code)}"${
        x.code === v ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:560px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>${r ? 'Material' : 'Yangi material'}</h1>
          <button onclick="yop()">Yopish</button></div>
        <div class="grid g2">
          <div class="wide"><label>Nomi</label>
            <input id="mName" value="${esc(r?.name || '')}"
              placeholder="LDSP 16mm oq"></div>
          <div><label>O'lchov birligi</label>
            <select id="mUom">${royxat(ref.uoms, r?.uom, '— tanlang —')}</select></div>
          <div><label>Turkum</label>
            <select id="mCat">${royxat(ref.categories, r?.category, "— yo'q —")}</select></div>
          <div><label>Kod</label>
            <input id="mCode" value="${esc(r?.code || '')}" placeholder="ixtiyoriy"></div>
          <div><label>Izoh</label>
            <input id="mNote" value="${esc(r?.note || '')}" placeholder="ixtiyoriy"></div>
          ${r ? `<div class="wide"><label class="row" style="gap:10px;
            align-items:center;text-transform:none;font-size:14px;cursor:pointer">
            <input type="checkbox" id="mActive" style="width:auto"${
              r.active ? ' checked' : ''}>
            <span>Faol — ro'yxatlarda turadi</span></label>
            <div class="hint">Material O'CHIRILMAYDI: u eski hujjatlarda
              turgan bo'lishi mumkin. Keraksizi faolsizlantiriladi.</div></div>` : ''}
          <!--  ★ BITTA MATERIALDA BIR NECHTA TA'MINOTCHI: zavodda
                bitta MDF to'rtta odamdan keladi. Shuning uchun
                ochilma emas, BELGILANADIGAN ro'yxat — ochilmada
                bittasi tanlanib, qolgani yo'qolardi.  -->
          <div class="wide"><label>Ta'minotchi</label>
            <input id="mSupQ" placeholder="qidiruv" oninput="supFilter()"
              style="margin-bottom:8px">
            <div id="mSupList" style="max-height:200px;overflow:auto;
              border:1px solid var(--line);border-radius:10px;padding:8px">
              ${(ref.suppliers || []).map((sp) => `<label class="row"
                data-nom="${esc(sp.name.toLowerCase())}"
                style="gap:8px;align-items:center;text-transform:none;
                       font-size:14px;cursor:pointer;padding:3px 0">
                <input type="checkbox" value="${sp.id}" style="width:auto"${
                  (r?.suppliers || []).some((x) => x.id === sp.id) ? ' checked' : ''}>
                <span>${esc(sp.name)}</span></label>`).join('')}
            </div>
            <div class="hint">Bittadan ko'p bo'lishi mumkin — bitta MDF
              to'rtta ta'minotchidan keladi.</div></div>
        </div>
        <p class="muted" style="font-size:12px;margin-top:12px">
          ★ Har rang alohida material: «LDSP 16mm oq» va «LDSP 16mm venge» —
          ikkita qator. Rang ustun emas, u nomning ichida turadi.</p>
        <button class="primary" style="margin-top:14px"
          onclick="saqla(${r ? r.id : 'null'})">Saqlash</button>
      </div></div>`;
}

//  Ro'yxat o'ttizta — qidiruv katagi ko'z bilan izlashdan qutqaradi.
function supFilter() {
  const q = ($('mSupQ').value || '').trim().toLowerCase();
  $('mSupList').querySelectorAll('label').forEach((el) => {
    el.style.display = !q || el.dataset.nom.includes(q) ? '' : 'none';
  });
}

const yangi  = () => oyna(null);
const tahrir = (id) => oyna(rows.find((x) => x.id === id));

async function saqla(id) {
  const it = {
    name: $('mName').value.trim(), uom: $('mUom').value || null,
    category: $('mCat').value || null, code: $('mCode').value.trim() || null,
    note: $('mNote').value.trim() || null,
    //  To'liq ro'yxat yuboriladi, ayirmani SERVER chiqaradi (izoh:
    //  `modules/materials.js`) — ekrandagi belgi bilan bazadagi
    //  ro'yxat ikki yo'ldan yurmasin.
    suppliers: [...$('mSupList').querySelectorAll('input:checked')]
      .map((el) => Number(el.value)),
  };
  if (!it.name) return toast('Nomi kiritilmagan', true);
  if (!it.uom)  return toast("O'lchov birligi tanlanmagan", true);
  if (id != null) it.active = $('mActive').checked;
  try {
    await App.api(id == null ? '/api/materials' : '/api/materials/' + id,
      { method: id == null ? 'POST' : 'PATCH', body: JSON.stringify(it) });
    yop(); toast('Saqlandi'); await load();
  } catch (e) { toast(e.message, true); }
}

// ───────────────────────────────────────────────────── FAYLDAN YUKLASH
//
//  Ikki bosqich: avval TEKSHIRIB ko'rsatiladi (nechta qator, nechtasi
//  mavjud, qaysi qatorda xato), keyin saqlanadi. Xato qator bo'lsa
//  hech narsa saqlanmaydi — yarim kirgan ro'yxat eng yomoni: qaysi
//  biri o'tgani bilinmay qoladi.
function yuklash() {
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Fayldan yuklash</h1>
          <button onclick="yop()">Yopish</button></div>
        <p class="muted" style="margin-bottom:12px">Excel (.xlsx) yoki CSV.
          Ustunlar SARLAVHADAN topiladi, tartibi muhim emas.<br>
          Kerakli: <b>Nomi</b> va <b>O'lchov birligi</b>.
          Ixtiyoriy: <b>Ta'minotchi</b> · Turkum · Kod · Izoh.<br>
          Ta'minotchi katagida bittadan ko'p bo'lsa vergul bilan
          yoziladi: «Mdf Eman , Mdf O'tkir».</p>
        <input type="file" accept=".xlsx,.csv,.txt" onchange="tanla(this)">
        <div id="impOut" style="margin-top:14px"></div>
      </div></div>`;
}

async function tanla(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  picked = file;
  $('impOut').innerHTML = '<p class="muted">Tekshirilmoqda…</p>';
  try { korsat(await App.upload('/api/import/materials', file), file.name); }
  catch (e) { $('impOut').innerHTML =
    `<p class="tag bad" style="display:block">${esc(e.message)}</p>`; }
}

function korsat(r, nom) {
  const bad = r.rows.filter((x) => x.errors.length);
  $('impOut').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>${esc(nom)}</b>
      <span class="muted" style="font-size:13px">${r.total} qator${
        r.updates ? ` · ${r.updates} tasi mavjud` : ''}</span></div>
    ${r.unknown.length ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      Tanilmagan ustunlar (o'qilmaydi): ${esc(r.unknown.join(', '))}</p>` : ''}
    <!--  ★ BIRLASHTIRISH VA TOPILMAGAN TA'MINOTCHI — ikkalasi ham
          XATO EMAS, lekin JIM ham qolmaydi. Odam faylda 938 qator
          ko'rib, ekranda 930 ni ko'radi: farqi yozilmasa «sakkiztasi
          yo'qoldi» deb o'qilardi. -->
    ${r.merged ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      <b>${r.merged}</b> ta takror qator birlashtirildi — ta'minotchisi
      qo'shildi.${(r.merged_names || []).length ? ' Nomi boshqacha yozilgani: '
        + r.merged_names.map((x) => `«${esc(x.kept)}» ← «${esc(x.dropped.join('», «'))}»`)
            .join(' · ') : ''}</p>` : ''}
    ${(r.supplier_missing || []).length ? `<p class="tag warn"
      style="display:block;margin-bottom:10px;font-size:12px;white-space:normal">
      Bu ta'minotchilar ro'yxatda topilmadi — material saqlanadi, lekin
      <b>biriktirilmaydi</b>: ${r.supplier_missing.map((x) =>
        `${esc(x.name)} (${x.n})`).join(' · ')}.
      Ta'minotchilar sahifasidan qo'shib, faylni qaytadan yuklang.</p>` : ''}
    ${r.links ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      <b>${r.links}</b> ta material–ta'minotchi bog'lanishi yoziladi.</p>` : ''}
    ${bad.length ? `
      <div style="max-height:30vh;overflow:auto;margin-bottom:10px">
        <table><tbody>${bad.map((x) => `
          <tr><td style="width:70px" class="muted">${x.line}-qator</td>
              <td>${esc(x.errors.join(' · '))}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:13px">${r.bad} ta qatorda xato bor.
        Faylni tuzatib qaytadan tanlang — xato qator bo'lsa hech narsa
        saqlanmaydi.</p>`
    : `<p class="muted" style="font-size:13px;margin-bottom:12px">Hamma qator to'g'ri.${
        r.updates ? ` Mavjud ${r.updates} tasining bo'sh maydonlari to'ldiriladi.` : ''}</p>
      <button class="primary" id="impSave" onclick="saqlaFayl()" style="width:100%"
        >${r.total} ta materialni saqlash</button>`}`;
}

async function saqlaFayl() {
  $('impSave').disabled = true;
  try {
    const r = await App.upload('/api/import/materials?save=1', picked);
    yop(); await load();
    toast(`${r.saved} ta material kiritildi`
      + (r.updated ? ` · ${r.updated} tasi yangilandi` : '')
      + (r.links ? ` · ${r.links} ta ta'minotchi bog'landi` : ''));
  } catch (e) {
    toast(e.message, true);
    const b = $('impSave'); if (b) b.disabled = false;
  }
}

App.start(boot, 'materials.view', 'materials.manage', 'materials.request',
  'production.manage');
</script>
</body>
</html>
