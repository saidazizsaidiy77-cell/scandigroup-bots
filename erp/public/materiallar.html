//  So'm tanlanganda kurs katagi ochiladi: dollarda u kerak emas va
//  bo'sh katak bo'lib turgani «to'ldirilmagan» degan savol berardi.
function kirimKurs() {
  $('nRateBox').hidden = $('nCcy').value !== 'UZS';
  for (const el of document.querySelectorAll('.nPfx'))
    el.textContent = $('nCcy').value === 'UZS' ? "so'm" : '$';
  kirimJami();
}

function kirimTop() {
  const q = ($('nQ')?.value || '').trim().toLowerCase();
  if (!$('nList')) return;
  const olingan = new Set(kQator.map((r) => r.id));
  const mos = q
    ? barcha.filter((m) => !olingan.has(m.id)
        && String(m.name).toLowerCase().includes(q)).slice(0, 30)
    : [];
  $('nList').innerHTML = q
    ? (mos.length
        ? mos.map((m) => `
            <button style="width:100%;text-align:left;margin-bottom:4px;
              display:flex;justify-content:space-between;gap:10px"
              onclick="kirimQosh(${m.id})">
              <span>${esc(m.name)}</span>
              <span class="muted" style="font-size:12px">${
                esc(m.uom_name || m.uom)}</span></button>`).join('')
        : '<p class="muted" style="font-size:13px">Topilmadi</p>')
    : '';
}

function kirimQosh(id) {
  const m = barcha.find((x) => x.id === id);
  if (!m) return;
  //  ★ YANGI QATOR TEPAGA (zavod qarori, 2026-09). Ilgari oxiriga
  //  qo'shilardi: telefonda ro'yxat o'n qatorga yetganda yangi
  //  tanlangan material EKRANDAN CHIQIB ketardi va boshliq soni
  //  yozish uchun har safar pastga surardi — qidiruv katagi esa
  //  tepada qolardi. Endi javob tanlangan joyning O'ZIDA turadi.
  //  Hujjatga ta'sir qilmaydi: saqlangach qatorlar nom bo'yicha
  //  tartiblanadi (`ORDER BY mt.name`, `sql/materials.sql`).
  kQator.unshift({ id, name: m.name, uom: m.uom_name || m.uom,
    qty: '', price: '' });
  $('nQ').value = '';
  kirimTop(); kirimRows();
}

function kirimRows() {
  if (!$('nRows')) return;
  $('nRows').innerHTML = kQator.map((r, i) => `
    <div class="row" style="gap:8px;align-items:center;margin-bottom:6px">
      <div style="flex:1"><b>${esc(r.name)}</b>
        <span class="muted" style="font-size:12px"> ${esc(r.uom)}</span></div>
      <input type="number" min="0" step="0.001" value="${r.qty}"
        style="width:100px;text-align:right" placeholder="soni"
        oninput="kirimQty(${i}, this.value)">
      <input type="number" min="0" step="0.0001" value="${r.price}"
        style="width:120px;text-align:right" placeholder="narx"
        oninput="kirimNarx(${i}, this.value)">
      <span class="muted nPfx" style="width:34px;font-size:12px">$</span>
      <button class="ic" onclick="kirimOchir(${i})">&times;</button>
    </div>`).join('');
  $('nSave').hidden = !kQator.length;
  kirimKurs();
}

const kirimQty  = (i, v) => { kQator[i].qty = v; kirimJami(); };
const kirimNarx = (i, v) => { kQator[i].price = v; kirimJami(); };
const kirimOchir = (i) => { kQator.splice(i, 1); kirimTop(); kirimRows(); };

//  ★ JAMI SAQLASHDAN OLDIN KO'RINADI (boshlang'ich qoldiq va kassadagi
//  order bilan bir xil sabab): bir nol ortiqcha yozilgani aynan shu
//  yerda bilinadi, ta'minotchining qarzida emas.
function kirimJami() {
  if (!$('nJami')) return;
  const kurs = Number($('nRate')?.value) || 0;
  const uzs  = $('nCcy').value === 'UZS';
  let jami = 0, yoq = 0;
  for (const r of kQator) {
    const q = Number(r.qty) || 0, p = Number(r.price) || 0;
    if (!q) continue;
    if (!p) { yoq++; continue; }
    jami += q * (uzs ? (kurs ? p / kurs : 0) : p);
  }
  $('nJami').innerHTML = kQator.length
    ? `<div class="muted" style="font-size:12px">Jami</div>
       <div style="font-size:22px;font-weight:600">$${pul(jami)}</div>${
       yoq ? `<div class="tag bad">${yoq} qatorda narx yo'q</div>` : ''}`
    : '';
}

async function kirimSaqla() {
  const items = kQator.map((r) => ({
    material_id: r.id,
    qty: Number(r.qty) || 0,
    price: Number(r.price) || 0,
  })).filter((x) => x.qty > 0);
  if (!items.length)
    return saqlanmadi('nSave', new Error("Soni yozilgan qator yo'q"));
  if (!$('nSup').value)
    return saqlanmadi('nSave', new Error('Ta\'minotchi tanlanmadi'));
  if (!$('nWh').value)
    return saqlanmadi('nSave', new Error('Ombor tanlanmadi'));
  const q = kMod === 'return';
  //  Tekshiruv SERVERDA ham (`POST /returns`): katakni bo'sh
  //  yuborishga ekrandan ham, qo'ldan ham yo'l qoldirilmaydi.
  const note = q ? ($('nNote')?.value || '').trim() : '';
  if (q && !note)
    return saqlanmadi('nSave', new Error('Sabab yozilmadi'));
  saqlanmoqda('nSave');
  try {
    const r = await App.api(
      q ? '/api/materials/returns' : '/api/materials/receipts',
      { method: 'POST',
        body: JSON.stringify({
          supplier_id: Number($('nSup').value),
          warehouse_id: Number($('nWh').value),
          doc_on: $('nOn').value || null,
          supplier_doc: $('nDoc').value.trim() || null,
          ccy: $('nCcy').value,
          rate: Number($('nRate').value) || null,
          note: note || null,
          items }) });
    yop(); toast(r.doc_no + ' yozildi');
    tabga(q ? 'qayt' : 'kirim'); await load();
  } catch (e) { saqlanmadi('nSave', e); }
}

//  So'm tanlanganda kurs katagi ochiladi: dollarda u kerak emas va

//  Qidiruv yozilmaguncha ro'yxat chiqarilmaydi: to'qqiz yuz qator

function boshQosh(id) {

  //  tanlangan material EKRANDAN CHIQIB ketardi va boshliq soni

  //  tartiblanadi (`ORDER BY mt.name`, `sql/materials.sql`).
  oQator.unshift({ id, name: m.name, uom: m.uom_name || m.uom,

}

const boshQty   = (i, v) => { oQator[i].qty = v; boshJami(); };
const boshNarx  = (i, v) => { oQator[i].price = v; boshJami(); };
const boshOchir = (i) => { oQator.splice(i, 1); boshTop(); boshRows(); };

//  Ro'yxat spravochnikdan: qo'lda yozish yo'q, aks holda bitta
//  «Petlya» va bitta «petlya » qoldiqni ikkiga bo'lib yuborardi.
let barcha = [];

async function boshSaqla() {
  const items = oQator.map((r) => ({
    material_id: r.id,
    qty: Number(r.qty) || 0,
    price: Number(r.price) || null,
    warehouse_id: Number($('oWh').value) || null,
  })).filter((x) => x.qty > 0);
  const wh = ref.warehouses.find((w) => String(w.id) === $('oWh').value);
  if (!items.length)
    return saqlanmadi('oSave', new Error("Soni yozilgan qator yo'q"));
  saqlanmoqda('oSave');
  try {
    const r = await App.api('/api/materials/opening', { method: 'POST',
      body: JSON.stringify({ on: $('oOn').value || null,
        ccy: $('oCcy').value, rate: Number($('oRate').value) || null, items }) });
    yop();
    //  Qayerga yozilgani ham aytiladi: oynada ikkita ombor ro'yxati
    //  turadi (sahifaniki va oynaniki) va adashib boshqasiga
    //  yozilgani faqat qoldiqni ochib ko'rganda bilinardi.
    toast(`${r.saved} ta qator yozildi${wh ? ' · ' + wh.name : ''}`);
    tabga('stock'); await load();
  } catch (e) { saqlanmadi('oSave', e); }
}

//  ──────────────────────────────── «NEGA MINUSDA» — EKRANDAGI JAVOB
//
//  ★ SAVOL BERILGAN JOYDA JAVOB BERILADI (zavod qarori, 2026-10;
//  izoh: modules/materials.js). Qizil raqam bosiladi va oyna uchta
//  narsani YONMA-YON qo'yadi: minus QACHON paydo bo'lgani, kalit
//  QACHON yoqilgani va tuzatishning uchta yo'li.
//
//  Ikki javob bir-biridan ATAYLAB ajratiladi va rangi ham boshqa:
//  minus kalitdan OLDIN yozilgan bo'lsa — savol tugadi; KEYIN
//  yozilgan bo'lsa — bu kodning xatosi va ekran shuni ochiq aytadi.
//  Aralashtirilsa «kalit ishlamayapti» degan shubha har safar
//  qolardi va haqiqiy teshik o'sha shubhaning ichida ko'rinmay
//  ketardi.
async function minusOch(materialId, warehouseId) {
  let d;
  try {
    d = await App.api(`/api/materials/minus?material_id=${materialId
      }&warehouse_id=${warehouseId}`);
  } catch (e) { return toast(e.message, true); }

  const bosh = d.boshlanish;
  //  Minus paydo bo'lgan KUN — sahifaning `kun()` i bilan (hamma
  //  joyda bir xil ko'rinish). Kalit yoqilgan PAYT esa soat bilan:
  //  bir kunning ichida yoqilgani va yozilgani solishtirilishi kerak
  //  bo'lishi mumkin.
  const payt = (v) => {
    if (!v) return null;
    const t = new Date(v);
    return `${kun(v)} ${String(t.getHours()).padStart(2, '0')}:${
      String(t.getMinutes()).padStart(2, '0')}`;
  };

  //  Qaysi tomonga ketgani: konver RAQAMI, ombor nomi yoki yorliq —
  //  «sarf» degan so'zning o'zi qaysi konverga ketganini aytmaydi.
  const tomon = !bosh ? '' : (bosh.conveyor_no ? `konver ${bosh.conveyor_no}`
    : bosh.other_wh ? bosh.other_wh
    : bosh.other_sup ? bosh.other_sup
    : bosh.other_kind === 'writeoff' ? 'hisobdan chiqarish'
    : bosh.other_kind === 'order' ? 'talabnoma' : '');

  //  Minus kalitdan KEYIN paydo bo'lganmi: shart BITTA joyda va
  //  javobning rangi ham shundan chiqadi.
  const keyin = !!(bosh && d.kalit.on && d.kalit.on_at
    && new Date(bosh.created_at) > new Date(d.kalit.on_at));

  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:620px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <h1>Nega minusda?</h1>
          <button onclick="yop()">Yopish</button></div>
        <div class="muted" style="margin-bottom:14px">${esc(d.material)}
          &middot; ${esc(d.warehouse)} &middot; hozir
          <b class="late">${son(d.bor)} ${esc(d.uom || '')}</b></div>

        ${!bosh ? `<p class="muted">Minus topilmadi — qoldiq hozir
          manfiy emas yoki harakatlari bekor qilingan.</p>` : `
        <table style="margin-bottom:14px"><tbody>
          <tr><td class="muted">Minus paydo bo'lgan kun</td>
              <td><b>${kun(bosh.moved_on)}</b></td></tr>
          <tr><td class="muted">Qaysi yozuv bilan</td>
              <td>${son(Math.abs(bosh.qty))} ${esc(d.uom || '')} chiqdi${
                tomon ? ` &rarr; ${esc(tomon)}` : ''}</td></tr>
          <tr><td class="muted">Qoldiq</td>
              <td>${son(bosh.edi)} &rarr;
                <b class="late">${son(bosh.saldo)}</b></td></tr>
          <tr><td class="muted">Kim yozgan</td>
              <td>${esc(bosh.worker || '—')}</td></tr>
          ${bosh.note ? `<tr><td class="muted">Izoh</td>
              <td>${esc(bosh.note)}</td></tr>` : ''}
          <tr><td class="muted">Kompyuterga tushgan payt</td>
              <td class="muted">${payt(bosh.created_at) || '—'}</td></tr>
        </tbody></table>

        <!--  ★ KALIT — JAVOBNING IKKINCHI YARMI. «Yoqib qo'ydim,
              lekin minus turibdi» degan savolning javobi aynan shu
              ikki sana solishtirilganda chiqadi. -->
        ${!d.kalit.on
          ? `<div class="tag warn">«Ombor qoldig'i minusga tushmasin»
              kaliti O'CHIQ — chiqim qoldiqdan ko'p bo'lsa ham
              to'xtatilmaydi.</div>`
          : keyin
            ? `<div class="tag warn"><b>Bu yozuv kalit yoqilgandan
                KEYIN tushgan</b> (kalit ${payt(d.kalit.on_at)} da
                yoqilgan) — ya'ni to'siq chetlab o'tilgan. Bu
                tizimning xatosi, shuni aytib qo'ying.</div>`
            : `<div class="tag">Kalit <b>${payt(d.kalit.on_at) || '—'}</b>
                da yoqilgan, bu yozuv esa undan OLDIN tushgan. Kalit
                faqat BUNDAN KEYINGI chiqimni to'xtatadi —
                o'tmishda yozilgan minusni o'zi tuzatmaydi.</div>`}`}

        <!--  ★ TUZATISHNING TO'RTTA YO'LI VA HAMMASI SABABNIKI
              (izoh: modules/materials.js). Ro'yxat bo'lmasa odam
              minusni «⚖ Sanoq» bilan jimgina nolga tushirardi —
              holbuki mol kelgan bo'lsa ta'minotchining qarzi
              yozilmay qolardi. -->
        <div style="margin-top:14px"><b>Tuzatish yo'li</b></div>
        <ul class="muted"
            style="margin:6px 0 0;padding-left:20px;line-height:1.7">
          <li>Mol kelgan, hujjati yozilmagan &rarr; <b>Kirim</b>
              (ta'minotchining qarzi oshadi).</li>
          <li>Tizimdan oldin javonda turgan &rarr;
              <b>Boshlang'ich qoldiq</b> (qarzsiz).</li>
          <li>Sarf adashib yozilgan &rarr; <b>Harakat</b> tabida o'sha
              qatorni bekor qilish.</li>
          <li>Sababi topilmadi &rarr; <b>&#9878; Sanoq</b> — hujjat,
              sana va sabab bilan.</li>
        </ul>
      </div>
    </div>`;
}

// ────────────────────────────────────────────── QOLDIQNI TO'G'RILASH
//
//  ★ SANOQ IKKI TOMONGA ISHLAYDI (zavod qarori, 2026-10): javonda
//  sanalgan dona hisobdagidan KAM ham, KO'P ham chiqadi va ikkalasi
//  bitta varaqdan to'g'rilanadi. Ilgari oyna FAQAT minusga tushgan
//  qatorlarni yig'ardi — server esa ikkala yo'nalishni ham bilardi
//  (`writeoff → ombor` va `ombor → writeoff`), ya'ni ortiqcha chiqqan
//  dona uchun ekranda joy yo'q edi va mudir uni hech qayerda yoza
//  olmasdi. Ikkita mexanizm yozilmadi: hujjat boshidanoq ikki
//  tomonli.
//
//  ★ MINUSNI BIR OYNADA NOLGA KELTIRISH (zavod qarori, 2026-10).
//  Zavodda o'n to'rtta ombor va uch yuzdan ortiq nom bor; minusga
//  tushganlari o'ttizga yaqin va ularni birma-bir ochib tuzatish
//  yarim kunlik ish bo'lardi — har biri uchun alohida hujjat yozish
//  esa tarixni o'ttizta bir xil qator bilan to'ldirardi.
//
//  Oyna ro'yxatni O'ZI yig'adi: ekranda turgan qatorlarning MINUSGA
//  tushganlari, hammasi belgilangan holda. Hech narsa qidirilmaydi
//  va qo'lda terilmaydi — javob allaqachon ekranda turgan edi.
//
//  ★ SANOQ SONI QATORDA TURADI va standarti NOL: oynaning asosiy
//  ishi minusni nolga keltirish. Javonda haqiqatan bir nechtasi
//  turgan bo'lsa o'sha raqam yoziladi va tuzatish o'shanga keltiradi
//  — ya'ni bu umumiy SANOQ oynasi, faqat minusdan boshlanadi.
//
//  Qatorni belgidan chiqarish ham mumkin: sababi aniq bo'lgan minus
//  (kirim hujjati yozilmagan) bu yerda EMAS, kirim bilan tuzatiladi
//  va oyna uni majburlamaydi.
let szQator = [], szTopilsin = '';

function togriOch() {
  //  Ekranda turgan qatorlardan minusga tushganlari. Ro'yxat
  //  sahifadagi filtr bo'yicha: ombor tanlangan bo'lsa faqat
  //  o'shaniki — oyna ekranda ko'rinmagan qatorni jimgina
  //  tuzatmaydi.
  //  ★ EKRANDAGI HAMMA QATOR, faqat minuslar emas: sanoqda farq
    //  ikki tomonga chiqadi. Lekin standartlar BOSHQA va bu ataylab —
    //  minusda javob allaqachon ma'lum (javonda manfiy dona turmaydi,
    //  ya'ni nol), qolganida esa HOZIRGISI turadi va qator
    //  belgilanmagan bo'ladi: uch yuz qatorli varaqda nol standart
    //  bo'lsa bitta tasodifiy «hammasini belgilash» butun javonni
    //  nolga tushirardi.
  szQator = rows.map((r) => {
    const bor = Number(r.qty);
    return {
      material_id: r.material_id, warehouse_id: r.warehouse_id,
      material: r.material, warehouse: r.warehouse,
      uom: r.uom_name || r.uom, bor,
      to_qty: bor < 0 ? 0 : bor, tanlangan: bor < 0,
    };
  });
  szTopilsin = '';
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:720px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Sanoq — qoldiqni to'g'rilash</h1>
          <button onclick="yop()">Yopish</button></div>
        ${!szQator.length ? `<p class="muted">Ekranda qator yo'q \u2014
          avval ombor yoki qidiruvni tanlang.</p>`
        : `
        <div class="row" style="gap:12px;align-items:flex-end;margin-bottom:12px">
          <div><label>Sana</label>
            <input id="szOn" type="date"
              value="${new Date().toISOString().slice(0, 10)}"></div>
          <div style="flex:1;min-width:200px"><label>Sabab</label>
            <input id="szNote"
              placeholder="masalan: sanoq, hujjati topilmadi"></div>
          <div style="flex:1;min-width:160px"><label>Qidiruv</label>
            <input id="szFind" placeholder="material, ombor"
              oninput="togriTop(this.value)"></div>
        </div>
        <!--  ★ SABAB MAJBURIY: tuzatish ombor qiymatiga tegadi va
              «nega nolga tushdi» degan savol keyin beriladi.
              Sababsiz hujjat o'sha savolni javobsiz qoldirardi. -->
        <p class="muted" style="margin-bottom:12px">Javondagi donani sanab
          «Sanoqda» katagiga yozing \u2014 farqi borlari saqlanadi.
          <b>Kam chiqsa</b> hisobdan chiqariladi, <b>ko'p chiqsa</b>
          hisobga olinadi: ikkalasi ham bitta yo'ldan o'tadi.
          Minusga tushgan qatorlar oldindan belgilangan \u2014 javonda
          manfiy dona turmaydi. Sababi ma'lum minus (kirim hujjati
          yozilmagan) bu yerda EMAS, kirim yoki boshlang'ich qoldiq
          bilan tuzatiladi: qarz ham, ombor qiymati ham o'shanda
          to'g'ri chiqadi. Raqam jimgina o'zgarmaydi \u2014 tarixda
          sanoq qatori bo'lib qoladi va kerak bo'lsa bekor
          qilinadi.</p>
        <div id="szRows" style="max-height:320px;overflow:auto"></div>
        <button class="primary" id="szSave" style="margin-top:14px"
          onclick="togriSaqla()">To'g'rilash</button>
        <div id="szSaveMsg"></div>`}
      </div></div>`;
  if (szQator.length) togriChiz();
}

//  Ro'yxat uch yuz qatorga yetadi \u2014 qidiruv katagi shu sababdan.
//  Belgi va sanoq soni QATORNING o'zida saqlanadi (`szQator`), ya'ni
//  qidiruv tozalangach yozilgani joyida qoladi: filtr ko'rinish, ish
//  emas.
const szKor = () => {
  const q = szTopilsin.toLowerCase();
  return szQator.filter((r) => !q
    || [r.material, r.warehouse].some((v) =>
         String(v || '').toLowerCase().includes(q)));
};
function togriTop(v) { szTopilsin = String(v || '').trim(); togriChiz(); }

function togriChiz() {
  const kor = szKor();
  const n = kor.filter((r) => r.tanlangan).length;
  const minus = szQator.filter((r) => r.bor < 0).length;
  $('szRows').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span class="muted" style="font-size:12px">${kor.length} ta qator${
        szQator.length !== kor.length ? ` (jami ${szQator.length})` : ''
      }${minus ? ` \u00b7 minusda <b>${minus}</b>` : ''
      } \u00b7 belgilangani <b>${n}</b></span>
      <button onclick="togriHam(${n < kor.length})">${
        n < kor.length ? 'Hammasini belgilash' : 'Belgini olish'}</button>
    </div>
    <table><thead><tr><th></th><th>Material</th><th>Ombor</th>
      <th class="num">Hozir</th><th class="num">Sanoqda</th>
      <th class="num">Farq</th></tr></thead>
    <tbody>${kor.map((r) => {
      const i = szQator.indexOf(r);
      const farq = Number(r.to_qty || 0) - r.bor;
      return `<tr data-i="${i}"${r.tanlangan ? '' : ' style="opacity:.45"'}>
        <td><input type="checkbox" style="width:auto"${r.tanlangan ? ' checked' : ''}
          onchange="togriBelgi(${i}, this.checked)"></td>
        <td><b>${esc(r.material)}</b> <span class="muted">${esc(r.uom)}</span></td>
        <td class="muted" style="font-size:12px">${esc(r.warehouse)}</td>
        <td class="num"><b${r.bor < 0 ? ' class="late"' : ''}>${son(r.bor)}</b></td>
        <td class="num"><input type="number" min="0" step="0.001"
          value="${r.to_qty}" style="max-width:90px;text-align:right"
          oninput="togriSon(${i}, this.value)"></td>
        <td class="num${farq ? ' late' : ''}">${
          farq ? (farq > 0 ? '+' : '') + son(farq) : '\u2014'}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function togriBelgi(i, v) { szQator[i].tanlangan = !!v; togriChiz(); }
//  Belgi faqat KO'RINIB turgan qatorlarga qo'yiladi: qidiruv bilan
//  qisqartirilgan ro'yxatda «hammasini belgilash» ekranda
//  ko'rinmaydigan uch yuz qatorni ham olib ketardi.
function togriHam(v) { szKor().forEach((r) => { r.tanlangan = v; }); togriChiz(); }
//  Chizish qayta chaqirilmaydi: katakdagi kursor yo'qolib ketardi.
//  Faqat «Farq» ustuni yangilanadi \u2014 saqlashda baribir SERVER
//  qayta hisoblaydi (izoh: modules/materials.js).
//
//  \u2605 SON YOZILGANI QATORNI O'ZI BELGILAYDI: varaqda uch yuz qator
//  turadi va sanagan odam katakka raqam yozib, yonidagi katakchani
//  bosishni unutardi \u2014 saqlashda o'sha qator jimgina tushib
//  qolardi.
function togriSon(i, v) {
  //  Bo'sh qoldirilgani «nol sanadim» EMAS, «tegmadim» degani: qator
  //  o'z standartiga qaytadi — minusda nol, qolganida hozirgisi.
  //  Aks holda yozilgan raqamni o'chirib qo'ygan odam qatorni
  //  bilmasdan nolga tushirardi.
  const def = szQator[i].bor < 0 ? 0 : szQator[i].bor;
  szQator[i].to_qty = v === '' ? def : Number(v);
  const farq = Number(szQator[i].to_qty || 0) - szQator[i].bor;
  if (farq && !szQator[i].tanlangan) {
    szQator[i].tanlangan = true;
    const box = $('szRows').querySelector(`tbody tr[data-i="${i}"] input[type=checkbox]`);
    const tr  = $('szRows').querySelector(`tbody tr[data-i="${i}"]`);
    if (box) box.checked = true;
    if (tr)  tr.removeAttribute('style');
  }
  const td = $('szRows').querySelector(`tbody tr[data-i="${i}"]`)?.lastElementChild;
  if (td) {
    td.textContent = farq ? (farq > 0 ? '+' : '') + son(farq) : '\u2014';
    td.className = 'num' + (farq ? ' late' : '');
  }
}

async function togriSaqla() {
  const items = szQator.filter((r) => r.tanlangan).map((r) => ({
    material_id: r.material_id, warehouse_id: r.warehouse_id,
    to_qty: r.to_qty,
  }));
  if (!items.length)
    return saqlanmadi('szSave', new Error("Birorta qator belgilanmagan"));
  if (!$('szNote').value.trim())
    return saqlanmadi('szSave', new Error('Sabab yozilmagan'));
  saqlanmoqda('szSave');
  try {
    const r = await App.api('/api/materials/adjust', { method: 'POST',
      body: JSON.stringify({ on: $('szOn').value || null,
        note: $('szNote').value.trim(), items }) });
    yop();
    toast(`${r.saved} ta qator to'g'rilandi`);
    await load();
  } catch (e) { saqlanmadi('szSave', e); }
}

//  Bitta material qo'lda ham qo'shiladi: ro'yxat fayldan yuklanadi,
//  lekin ertaga bitta yangi material kelsa fayl yasab o'tirmasin.
function oyna(r) {
  const royxat = (list, v, bosh) => `<option value="">${bosh}</option>`
    + list.map((x) => `<option value="${esc(x.code)}"${
        x.code === v ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:560px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>${r ? 'Material' : 'Yangi material'}</h1>
          <button onclick="yop()">Yopish</button></div>
        <div class="grid g2">
          <div class="wide"><label>Nomi</label>
            <input id="mName" value="${esc(r?.name || '')}"
              placeholder="LDSP 16mm oq"></div>
          <div><label>O'lchov birligi</label>
            <select id="mUom">${royxat(ref.uoms, r?.uom, '— tanlang —')}</select></div>
          <div><label>Turkum</label>
            <select id="mCat">${royxat(ref.categories, r?.category, "— yo'q —")}</select></div>
          <div><label>Kod</label>
            <input id="mCode" value="${esc(r?.code || '')}" placeholder="ixtiyoriy"></div>
          <div><label>Izoh</label>
            <input id="mNote" value="${esc(r?.note || '')}" placeholder="ixtiyoriy"></div>
          ${r ? `<div class="wide"><label class="row" style="gap:10px;
            align-items:center;text-transform:none;font-size:14px;cursor:pointer">
            <input type="checkbox" id="mActive" style="width:auto"${
              r.active ? ' checked' : ''}>
            <span>Faol — ro'yxatlarda turadi</span></label>
            <div class="hint">Material O'CHIRILMAYDI: u eski hujjatlarda
              turgan bo'lishi mumkin. Keraksizi faolsizlantiriladi.</div></div>` : ''}
          <!--  ★ BITTA MATERIALDA BIR NECHTA TA'MINOTCHI: zavodda
                bitta MDF to'rtta odamdan keladi. Shuning uchun
                ochilma emas, BELGILANADIGAN ro'yxat — ochilmada
                bittasi tanlanib, qolgani yo'qolardi.  -->
          <div class="wide"><label>Ta'minotchi</label>
            <input id="mSupQ" placeholder="qidiruv" oninput="supFilter()"
              style="margin-bottom:8px">
            <div id="mSupList" style="max-height:200px;overflow:auto;
              border:1px solid var(--line);border-radius:10px;padding:8px">
              ${(ref.suppliers || []).map((sp) => `<label class="row"
                data-nom="${esc(sp.name.toLowerCase())}"
                style="gap:8px;align-items:center;text-transform:none;
                       font-size:14px;cursor:pointer;padding:3px 0">
                <input type="checkbox" value="${sp.id}" style="width:auto"${
                  (r?.suppliers || []).some((x) => x.id === sp.id) ? ' checked' : ''}>
                <span>${esc(sp.name)}</span></label>`).join('')}
            </div>
            <div class="hint">Bittadan ko'p bo'lishi mumkin — bitta MDF
              to'rtta ta'minotchidan keladi.</div></div>
        </div>
        <p class="muted" style="font-size:12px;margin-top:12px">
          ★ Har rang alohida material: «LDSP 16mm oq» va «LDSP 16mm venge» —
          ikkita qator. Rang ustun emas, u nomning ichida turadi.</p>
        <button class="primary" style="margin-top:14px"
          onclick="saqla(${r ? r.id : 'null'})">Saqlash</button>
      </div></div>`;
}

//  Ro'yxat o'ttizta — qidiruv katagi ko'z bilan izlashdan qutqaradi.
function supFilter() {
  const q = ($('mSupQ').value || '').trim().toLowerCase();
  $('mSupList').querySelectorAll('label').forEach((el) => {
    el.style.display = !q || el.dataset.nom.includes(q) ? '' : 'none';
  });
}

const yangi  = () => oyna(null);
const tahrir = (id) => oyna(rows.find((x) => x.id === id));

async function saqla(id) {
  const it = {
    name: $('mName').value.trim(), uom: $('mUom').value || null,
    category: $('mCat').value || null, code: $('mCode').value.trim() || null,
    note: $('mNote').value.trim() || null,
    //  To'liq ro'yxat yuboriladi, ayirmani SERVER chiqaradi (izoh:
    //  `modules/materials.js`) — ekrandagi belgi bilan bazadagi
    //  ro'yxat ikki yo'ldan yurmasin.
    suppliers: [...$('mSupList').querySelectorAll('input:checked')]
      .map((el) => Number(el.value)),
  };
  if (!it.name) return toast('Nomi kiritilmagan', true);
  if (!it.uom)  return toast("O'lchov birligi tanlanmagan", true);
  if (id != null) it.active = $('mActive').checked;
  try {
    await App.api(id == null ? '/api/materials' : '/api/materials/' + id,
      { method: id == null ? 'POST' : 'PATCH', body: JSON.stringify(it) });
    yop(); toast('Saqlandi'); await load();
  } catch (e) { toast(e.message, true); }
}

// ───────────────────────────────────────────────────── FAYLDAN YUKLASH
//
//  Ikki bosqich: avval TEKSHIRIB ko'rsatiladi (nechta qator, nechtasi
//  mavjud, qaysi qatorda xato), keyin saqlanadi. Xato qator bo'lsa
//  hech narsa saqlanmaydi — yarim kirgan ro'yxat eng yomoni: qaysi
//  biri o'tgani bilinmay qoladi.
function yuklash() {
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)yop()">
      <div class="modal" style="max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Fayldan yuklash</h1>
          <button onclick="yop()">Yopish</button></div>
        <p class="muted" style="margin-bottom:12px">Excel (.xlsx) yoki CSV.
          Ustunlar SARLAVHADAN topiladi, tartibi muhim emas.<br>
          Kerakli: <b>Nomi</b> va <b>O'lchov birligi</b>.
          Ixtiyoriy: <b>Ta'minotchi</b> · Turkum · Kod · Izoh.<br>
          Ta'minotchi katagida bittadan ko'p bo'lsa vergul bilan
          yoziladi: «Mdf Eman , Mdf O'tkir».</p>
        <input type="file" accept=".xlsx,.csv,.txt" onchange="tanla(this)">
        <div id="impOut" style="margin-top:14px"></div>
      </div></div>`;
}

async function tanla(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  picked = file;
  $('impOut').innerHTML = '<p class="muted">Tekshirilmoqda…</p>';
  try { korsat(await App.upload('/api/import/materials', file), file.name); }
  catch (e) { $('impOut').innerHTML =
    `<p class="tag bad" style="display:block">${esc(e.message)}</p>`; }
}

function korsat(r, nom) {
  const bad = r.rows.filter((x) => x.errors.length);
  $('impOut').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>${esc(nom)}</b>
      <span class="muted" style="font-size:13px">${r.total} qator${
        r.updates ? ` · ${r.updates} tasi mavjud` : ''}</span></div>
    ${r.unknown.length ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      Tanilmagan ustunlar (o'qilmaydi): ${esc(r.unknown.join(', '))}</p>` : ''}
    <!--  ★ BIRLASHTIRISH VA TOPILMAGAN TA'MINOTCHI — ikkalasi ham
          XATO EMAS, lekin JIM ham qolmaydi. Odam faylda 938 qator
          ko'rib, ekranda 930 ni ko'radi: farqi yozilmasa «sakkiztasi
          yo'qoldi» deb o'qilardi. -->
    ${r.merged ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      <b>${r.merged}</b> ta takror qator birlashtirildi — ta'minotchisi
      qo'shildi.${(r.merged_names || []).length ? ' Nomi boshqacha yozilgani: '
        + r.merged_names.map((x) => `«${esc(x.kept)}» ← «${esc(x.dropped.join('», «'))}»`)
            .join(' · ') : ''}</p>` : ''}
    ${(r.supplier_missing || []).length ? `<p class="tag warn"
      style="display:block;margin-bottom:10px;font-size:12px;white-space:normal">
      Bu ta'minotchilar ro'yxatda topilmadi — material saqlanadi, lekin
      <b>biriktirilmaydi</b>: ${r.supplier_missing.map((x) =>
        `${esc(x.name)} (${x.n})`).join(' · ')}.
      Ta'minotchilar sahifasidan qo'shib, faylni qaytadan yuklang.</p>` : ''}
    ${r.links ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      <b>${r.links}</b> ta material–ta'minotchi bog'lanishi yoziladi.</p>` : ''}
    ${bad.length ? `
      <div style="max-height:30vh;overflow:auto;margin-bottom:10px">
        <table><tbody>${bad.map((x) => `
          <tr><td style="width:70px" class="muted">${x.line}-qator</td>
              <td>${esc(x.errors.join(' · '))}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:13px">${r.bad} ta qatorda xato bor.
        Faylni tuzatib qaytadan tanlang — xato qator bo'lsa hech narsa
        saqlanmaydi.</p>`
    : `<p class="muted" style="font-size:13px;margin-bottom:12px">Hamma qator to'g'ri.${
        r.updates ? ` Mavjud ${r.updates} tasining bo'sh maydonlari to'ldiriladi.` : ''}</p>
      <button class="primary" id="impSave" onclick="saqlaFayl()" style="width:100%"
        >${r.total} ta materialni saqlash</button>`}`;
}

async function saqlaFayl() {
  $('impSave').disabled = true;
  try {
    const r = await App.upload('/api/import/materials?save=1', picked);
    yop(); await load();
    toast(`${r.saved} ta material kiritildi`
      + (r.updated ? ` · ${r.updated} tasi yangilandi` : '')
      + (r.links ? ` · ${r.links} ta ta'minotchi bog'landi` : ''));
  } catch (e) {
    toast(e.message, true);
    const b = $('impSave'); if (b) b.disabled = false;
  }
}

App.start(boot, 'materials.view', 'materials.manage', 'materials.request',
  'production.manage');
</script>
</body>
</html>
