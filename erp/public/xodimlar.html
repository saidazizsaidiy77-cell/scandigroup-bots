<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xodimlar · ZELTA ERP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Xodimlar va rollar</h1></div>
  <div class="row"><button class="primary" onclick="openForm()">Xodim qo'shish</button>
    <span class="row" id="erpUser"></span></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;align-items:flex-end;
    gap:12px;flex-wrap:wrap;margin-bottom:10px">
    <h2 style="margin:0">Xodimlar</h2>
    <!--  Qidiruv KLIENTDA: ro'yxat bir marta o'qiladi va yigirma-o'ttiz
          qatordan iborat, ya'ni har harfda serverga borish ortiqcha.
          Ism, telefon va rol nomi birga qidiriladi — qaysi ustunda
          izlashni o'ylab o'tirmaslik uchun.

          PIN bo'yicha qidirilmaydi: u bazada ochiq matnda turmaydi
          (izoh: `erp/pin.js`). -->
    <div style="flex:1;max-width:340px"><label>Qidiruv</label>
      <input id="wQ" placeholder="ism · telefon · rol" oninput="drawWorkers()"></div>
  </div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Ism</th><th>PIN</th><th>Telegram ID</th><th>Rollar</th>
      <th>Holat</th><th></th></tr></thead>
    <tbody id="tW"></tbody>
  </table></div>
  <p class="muted" style="margin-top:12px;font-size:13px">
    Rol o'zgartirilsa yoki xodim o'chirilsa uning sessiyalari bekor qilinadi —
    yangi huquq darhol kuchga kiradi.</p>
</div>

<div class="card" style="margin-top:16px">
  <h2>Rollar</h2>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Rol</th><th>Ko'rinish</th><th class="num">Huquqlar</th></tr></thead>
    <tbody id="tR"></tbody>
  </table></div>
</div>

<div id="modalRoot"></div>

<script>
const $ = id => document.getElementById(id);

// Bu rollar mijozlar bilan ishlaydi — ularga tsex emas, SAVDO YO'NALISHI
// biriktiriladi: biri B2B bilan, boshqasi eksport bilan ishlaydi.
const SALES_ROLES = new Set(['sotuvchi']);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SURFACE = { web:'Sayt', miniapp:'Telegram ilova', bot:'Bot xabari' };

let meta = null, workers = [];

async function load(){
  [meta, workers] = await Promise.all([
    App.api('/api/admin/roles'), App.api('/api/admin/workers')]);

  drawWorkers();

  $('tR').innerHTML = meta.roles.map(r => `
    <tr><td>${esc(r.name)}<div class="muted" style="font-size:12px">${esc(r.code)}</div></td>
      <td class="muted">${SURFACE[r.surface] || r.surface}</td>
      <td class="num">${r.permission_count}</td></tr>`).join('');
}

function drawWorkers(){
  const q = ($('wQ')?.value || '').trim().toLowerCase();
  const mos = (w) => !q
    || w.name.toLowerCase().includes(q)
    || (w.phone || '').toLowerCase().includes(q)
    || w.roles.some(r => (r.name || '').toLowerCase().includes(q)
                      || (r.scope_shop || '').toLowerCase().includes(q));
  const ro = workers.filter(mos);
  $('tW').innerHTML = ro.length ? ro.map(w => `
    <tr>
      <td>${esc(w.name)}${w.phone ? `<div class="muted" style="font-size:12px">${esc(w.phone)}</div>` : ''}</td>
      <!--  ★ PIN KO'RSATILMAYDI. Bazada uning izi turadi, izdan raqamni
            tiklab bo'lmaydi — shuning uchun «unutdim» degan xodimga eski
            PIN aytilmaydi, YANGISI qo'yiladi. -->
      <td class="muted">${w.has_pin ? 'qo\'yilgan' : '—'}</td>
      <td class="muted">${w.tg_id ? esc(w.tg_id) : '<span class="tag warn">ulanmagan</span>'}</td>
      <td>${w.roles.length ? w.roles.map(r =>
        `<span class="tag">${esc(r.name)}${r.scope_shop ? ' · ' + esc(r.scope_shop) : ''}${
           r.scope_warehouse ? ' · ' + esc(r.scope_warehouse) : ''}${
           r.scope_channel_name ? ' · ' + esc(r.scope_channel_name) : ''}${
           r.scope_own ? ' · o\'zinikini' : ''}</span>`
        ).join(' ') : '<span class="tag bad">rol yo\'q</span>'}</td>
      <td>${w.active ? '<span class="tag ok">faol</span>' : '<span class="tag">o\'chirilgan</span>'}</td>
      <td class="num"><button onclick="openForm(${w.id})">Tahrirlash</button></td>
    </tr>`).join('')
    : `<tr><td colspan="6" class="muted" style="padding:16px">
         «${esc(q)}» bo'yicha xodim topilmadi</td></tr>`;
}

function openForm(id){
  const w = id ? workers.find(x => x.id === id) : null;
  const checked = (code) => w?.roles.some(r => r.code === code);
  const scopeOf = (code) => w?.roles.find(r => r.code === code)?.scope_shop_id || '';
  const chanOf  = (code) => w?.roles.find(r => r.code === code)?.scope_channel || '';
  const whOf    = (code) => w?.roles.find(r => r.code === code)?.scope_warehouse_id || '';
  //  Yangi xodimda belgi QO'YILGAN bo'lib ochiladi: zavod qoidasi
  //  shunday — savdo xodimi o'zinikini ko'radi. Bosh ofis menejeri
  //  uchun katakcha olib tashlanadi.
  const ownOf_  = (code) => (w ? !!w.roles.find(r => r.code === code)?.scope_own : true);

  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal" style="max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:18px">
          <h1>${w ? 'Xodimni tahrirlash' : "Yangi xodim"}</h1>
          <button onclick="close_()">Yopish</button></div>
        <div class="stack">
          <div><label>Ism familiya</label>
            <input id="wName" value="${esc(w?.name || '')}"></div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Telefon</label>
              <input id="wPhone" value="${esc(w?.phone || '')}" placeholder="+998..."></div>
            <!--  Maydon HAR DOIM BO'SH ochiladi: eski PIN o'qilmaydi.
                  Bo'sh qoldirilsa tegilmaydi, raqam yozilsa almashtiriladi. -->
            <div style="flex:1"><label>PIN (4-6 raqam)</label>
              <input id="wPin" inputmode="numeric" placeholder="${
                w?.has_pin ? 'o\'zgartirish uchun yangisini yozing' : 'masalan 4417'}"></div>
          </div>
          <!-- Telegram ID ixtiyoriy: u faqat Telegram ilovasi orqali kirish
               uchun kerak, saytga PIN bilan kiriladi. Maydonga @nom yozilishi
               oddiy hol edi — shuning uchun sarlavhada raqam ekani aytilgan
               va faqat raqam kiritiladi. -->
          <div><label>Telegram ID <span style="text-transform:none">— ixtiyoriy,
            faqat raqam (bot ichida /myid yozib olinadi). @nom emas.</span></label>
            <input id="wTg" inputmode="numeric" placeholder="123456789"
                   oninput="this.value = this.value.replace(/\D/g, '')"
                   value="${esc(w?.tg_id || '')}"></div>

          <!--  Qo'liga pul beriladigan xodim. Zavodda pul hamma xodimga
                berilmaydi — beshta odam oladi, shuning uchun kassada
                ro'yxat shu belgi bilan qisqaradi. Belgi rolda emas,
                XODIMDA: pul olish lavozimga emas, ishonchga bog'liq. -->
          <div><label>Kassa</label>
            <div class="row" style="gap:10px;align-items:center">
              <input type="checkbox" id="wCash" style="width:auto"
                     ${w?.can_hold_cash ? 'checked' : ''}
                     onchange="$('wCashG').style.display = this.checked ? '' : 'none'">
              <span style="flex:1">Qo'liga pul beriladi
                <span class="muted" style="font-size:12px">· kassir shu xodimga
                  chiqim yoza oladi, xodim esa sarfini o'zi yozadi</span></span>
            </div>
            <!--  ★ NIMAGA SARFLAY OLADI. Pul «hisob berish sharti bilan»
                  beriladi va xodim sarfini o'zi yozadi — lekin hamma
                  hamma narsani emas: tsex boshlig'i faqat oylik uchun,
                  ombor mudiri esa barcha harajat uchun.
                  HECH NARSA belgilanmasa — hamma guruh (tsex doirasi
                  bilan bir xil qoida: bo'sh doira cheklov yo'qligi). -->
            <div id="wCashG" style="margin-top:10px${
              w?.can_hold_cash ? '' : ';display:none'}">
              <label>Nimaga sarflay oladi</label>
              <div class="row" style="gap:8px;flex-wrap:wrap">
                ${(meta.expense_groups || []).map(g => `
                  <label class="tag" style="cursor:pointer;display:inline-flex;
                    align-items:center;gap:6px;padding:6px 10px">
                    <input type="checkbox" class="cashg" value="${esc(g.code)}"
                      style="width:auto"
                      ${(w?.cash_groups || []).includes(g.code) ? 'checked' : ''}>
                    ${esc(g.name)}</label>`).join('')}
              </div>
              <div class="muted" style="font-size:12px;margin-top:6px">
                Hech biri belgilanmasa — barcha harajat guruhi</div>
            </div>

            <!--  ★ INKASSATOR. Savdo doirasi mijozni MENEJERGA
                  biriktiradi, pulni esa zavodda bitta odam yig'ib
                  yuradi: u mijozning menejeri emas. Belgi FAQAT
                  kassaga tegadi — «Mijozdan pul olindi» oynasidagi
                  ro'yxat hamma mijozni ko'rsatadi; savdo bo'limi
                  eskicha qoladi va boshqa menejerning buyurtmasi
                  unga ochilmaydi (izoh: sql/cash.sql). -->
            <div class="row" style="gap:10px;align-items:center;margin-top:10px">
              <input type="checkbox" id="wInkas" style="width:auto"
                     ${w?.cash_all_customers ? 'checked' : ''}>
              <span style="flex:1">Hamma mijozdan pul oladi
                <span class="muted" style="font-size:12px">· inkassator: «Mijozdan
                  pul olindi» ro'yxatida barcha mijoz turadi, savdo bo'limidagi
                  doirasi o'zgarmaydi</span></span>
            </div>

            <!--  ★ QO'LIDAGI PULNI SARFLAYDIMI. Podotchyot olgan
                  xodimning pulidan harajat yoziladi — ombor mudiri
                  bozorga boradi. Inkassatorning qo'lidagi pul esa
                  mijozdan yig'ilgani va uning bitta yo'li bor:
                  kassaga topshiriladi. Standarti — YOZADI, belgi
                  olib tashlanadigan joy bitta (izoh: sql/cash.sql). -->
            <div class="row" style="gap:10px;align-items:center;margin-top:10px">
              <input type="checkbox" id="wSpend" style="width:auto"
                     ${w && w.can_spend_cash === false ? '' : 'checked'}>
              <span style="flex:1">Qo'lidagi pulni harajatga yozadi
                <span class="muted" style="font-size:12px">· belgilanmasa pul
                  faqat kassaga topshiriladi — inkassator shunday</span></span>
            </div></div>

          <div><label>Rollar</label>
            <div class="stack" style="gap:8px">
              ${meta.roles.map(r => `
                <div class="row" style="gap:10px;align-items:center">
                  <input type="checkbox" style="width:auto" class="role" value="${r.code}"
                         ${checked(r.code) ? 'checked' : ''}>
                  <span style="flex:1">${esc(r.name)}
                    <span class="muted" style="font-size:12px">· ${SURFACE[r.surface]}</span></span>
                  <!-- Tsex doirasi ishlab chiqarish rollari uchun, savdo
                       yo'nalishi esa savdo uchun: bittasi tanlanadi. -->
                  ${SALES_ROLES.has(r.code) ? `
                  <select class="chan" data-role="${r.code}" style="width:150px">
                    <option value="">Barcha yo'nalish</option>
                    ${meta.channels.map(c => `<option value="${esc(c.code)}"
                      ${chanOf(r.code) === c.code ? 'selected' : ''}
                      >${esc(c.name)}</option>`).join('')}
                  </select>
                  <!-- Vitrina sotuvchisi shaharning bir nuqtasida ishlaydi:
                       nuqtasi biriktirilsa u faqat o'sha vitrinaning
                       qoldig'ini ko'radi (ustiga T/M omborni). Bo'sh
                       qoldirilsa — bosh ofis, hamma omborni ko'radi. -->
                  <select class="wh" data-role="${r.code}" style="width:170px">
                    <option value="">Vitrinasiz (bosh ofis)</option>
                    ${(meta.warehouses || []).map(h => `<option value="${h.id}"
                      ${String(whOf(r.code)) === String(h.id) ? 'selected' : ''}
                      >${esc(h.name)}</option>`).join('')}
                  </select>
                  <!--  ★ O'Z MIJOZI, O'Z BUYURTMASI. Yo'nalish doirasi
                        bitta menejerni ajratib bermaydi: bitta kanalda
                        bir nechta menejer ishlaydi va ular bir-birining
                        mijozini ko'rib turardi. Bo'sh qoldirilsa —
                        butun savdo (bosh ofis, rahbariyat). -->
                  <label class="tag" style="cursor:pointer;display:inline-flex;
                    align-items:center;gap:6px;padding:6px 10px;white-space:nowrap">
                    <input type="checkbox" class="own" data-role="${r.code}"
                      style="width:auto" ${ownOf_(r.code) ? 'checked' : ''}>
                    Faqat o'zinikini</label>` : `
                  <select class="scope" data-role="${r.code}" style="width:190px">
                    <option value="">Barcha tsex</option>
                    ${meta.shops.map(s => `<option value="${s.id}"
                      ${String(scopeOf(r.code)) === String(s.id) ? 'selected' : ''}
                      >${esc(s.name)}</option>`).join('')}
                  </select>`}
                </div>`).join('')}
            </div>
          </div>

          ${w ? `<div class="row" style="gap:10px;align-items:center">
            <input type="checkbox" id="wActive" style="width:auto" ${w.active ? 'checked' : ''}>
            <span>Faol</span></div>` : ''}

          <button class="primary" onclick="save(${id || 'null'})">Saqlash</button>
        </div>
      </div>
    </div>`;
}
const close_ = () => { $('modalRoot').innerHTML = ''; };

async function save(id){
  const roles = [...document.querySelectorAll('.role:checked')].map(cb => ({
    code: cb.value,
    scope_shop_id: document.querySelector(`.scope[data-role="${cb.value}"]`)?.value || null,
    scope_channel: document.querySelector(`.chan[data-role="${cb.value}"]`)?.value || null,
    scope_warehouse_id: document.querySelector(`.wh[data-role="${cb.value}"]`)?.value || null,
    scope_own: !!document.querySelector(`.own[data-role="${cb.value}"]`)?.checked,
  }));
  const body = {
    name:  $('wName').value.trim(),
    phone: $('wPhone').value.trim() || null,
    pin:   $('wPin').value.trim() || null,
    tg_id: $('wTg').value.trim() || null,
    can_hold_cash: $('wCash').checked,
    cash_all_customers: $('wInkas').checked,
    can_spend_cash: $('wSpend').checked,
    cash_groups: [...document.querySelectorAll('.cashg')]
      .filter(c => c.checked).map(c => c.value),
    roles,
  };
  if (id) body.active = $('wActive').checked;
  try{
    await App.api(id ? '/api/admin/workers/' + id : '/api/admin/workers',
      { method: id ? 'PATCH' : 'POST', body: JSON.stringify(body) });
    close_(); load();
  }catch(e){ alert(e.message); }
}

App.start(load, 'admin.users');
</script>
</body>
</html>
