<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xodimlar · ZELTA ERP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body class="wide">

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Xodimlar va rollar</h1></div>
  <div class="row"><button onclick="openImport()">Fayldan yuklash</button>
    <button class="primary" onclick="openForm()">Xodim qo'shish</button>
    <span class="row" id="erpUser"></span></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;align-items:flex-end;
    gap:12px;flex-wrap:wrap;margin-bottom:10px">
    <h2 style="margin:0">Xodimlar</h2>
    <!--  Qidiruv KLIENTDA: ro'yxat bir marta o'qiladi va yigirma-o'ttiz
          qatordan iborat, ya'ni har harfda serverga borish ortiqcha.
          Ism, telefon va rol nomi birga qidiriladi — qaysi ustunda
          izlashni o'ylab o'tirmaslik uchun.

          PIN bo'yicha qidirilmaydi: u bazada ochiq matnda turmaydi
          (izoh: `erp/pin.js`). -->
    <!--  ★ O'CHIRILGAN XODIM RO'YXATDA TURMAYDI. Tizimda «o'chirish» —
          «Faol» ni olib tashlash: xodim saytga kira olmaydi va hech
          qaysi ro'yxatda chiqmaydi, lekin uning id si audit
          jurnalida, konverda va harakatlarda qolaveradi — qator
          BUTUNLAY o'chirilsa o'sha yozuvlar egasiz qolardi.
          Shuning uchun jadvalda ham ko'rinmaydi; kerak bo'lsa
          katakcha bilan qaytariladi (masalan, qaytadan ishga
          olingan odamni topish uchun). -->
    <label class="row" style="gap:8px;align-items:center;cursor:pointer;
      white-space:nowrap;font-size:13px">
      <input type="checkbox" id="wOff" style="width:auto" onchange="drawWorkers()">
      O'chirilganlar</label>
    <div style="flex:1;max-width:340px"><label>Qidiruv</label>
      <input id="wQ" placeholder="ism · lavozim · bo'lim · rol" oninput="drawWorkers()"></div>
  </div>
  <!--  Jadval O'Z qutisida aylanadi (`max-height`): sarlavha tepada
        qotib turishi uchun scroll konteyner kerak, sahifaning o'z
        aylanishida u baribir yuqoriga chiqib ketardi — jurnal va
        ombor qoldig'i bilan bir xil yechim (izoh: style.css). -->
  <div style="overflow:auto;max-height:72vh"><table class="staff">
    <!--  ★ GURUH, TSEX, BO'LIM va LAVOZIM — ALOHIDA USTUN.
          Ilgari to'rtalasi bitta «Joyi» katagida turardi va oltmish
          qatorli ro'yxatda ko'z ularni ajrata olmasdi: qaysi biri
          bo'lim, qaysi biri lavozim ekani har qatorda qayta
          o'qilardi. Alohida ustunda esa ko'z bitta ustun bo'ylab
          pastga yuguradi — «stul tsexida kim bor» degan savolga
          javob shunday topiladi. -->
    <thead><tr id="wHead"></tr></thead>
    <tbody id="tW"></tbody>
  </table></div>
  <p class="muted" style="margin-top:12px;font-size:13px">
    Rol o'zgartirilsa yoki xodim o'chirilsa uning sessiyalari bekor qilinadi —
    yangi huquq darhol kuchga kiradi.</p>
</div>

<div class="card" style="margin-top:16px">
  <h2>Rollar</h2>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Rol</th><th>Ko'rinish</th><th class="num">Huquqlar</th></tr></thead>
    <tbody id="tR"></tbody>
  </table></div>
</div>

<div id="modalRoot"></div>

<script>
const $ = id => document.getElementById(id);

// Bu rollar mijozlar bilan ishlaydi — ularga tsex emas, SAVDO YO'NALISHI
// biriktiriladi: biri B2B bilan, boshqasi eksport bilan ishlaydi.
//  Savdo doirasi (yo'nalish, vitrina, «Faqat o'zinikini») shu
//  rollarda so'raladi. Boshliq ham savdo xodimi: farqi faqat
//  doirasida — unda u bo'sh qoladi va u butun savdoni ko'radi.
const SALES_ROLES = new Set(['sotuvchi', 'savdo_boshliq']);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SURFACE = { web:'Sayt', miniapp:'Telegram ilova', bot:'Bot xabari' };

let meta = null, workers = [];

async function load(){
  [meta, workers] = await Promise.all([
    App.api('/api/admin/roles'), App.api('/api/admin/workers')]);

  drawWorkers();

  $('tR').innerHTML = meta.roles.map(r => `
    <tr><td>${esc(r.name)}<div class="muted" style="font-size:12px">${esc(r.code)}</div></td>
      <td class="muted">${SURFACE[r.surface] || r.surface}</td>
      <td class="num">${r.permission_count}</td></tr>`).join('');
}

//  ★ USTUN BO'YICHA SARALASH — KLIENTDA (zavod qarori, 2026-09).
//  Ro'yxat bir marta o'qiladi va yetmishtacha qatordan iborat, ya'ni
//  har bosishda serverga borish ortiqcha; qidiruv ham shu sababdan
//  klientda turadi. Serverga chiqarilsa ikkita tartib paydo bo'lardi —
//  biri so'rovda, biri sahifada.
//
//  Sarlavha va SARALANADIGAN QIYMAT bitta ro'yxatdan chiqadi: ikki
//  joyda yozilsa «Tsex» sarlavhasi bir kun lavozimni saralab qo'yardi.
//  Katakning KO'RINISHI esa o'z joyida qoladi — biri teg, biri rangli
//  yozuv, biri oddiy matn.
const USTUN = [
  { k: 'name',  t: 'Ism',         v: w => w.name },
  { k: 'group', t: 'Guruh',       v: w => w.staff_group },
  { k: 'shop',  t: 'Tsex',        v: w => w.shop },
  { k: 'dept',  t: "Bo'lim",      v: w => w.section || w.dept },
  { k: 'pos',   t: 'Lavozim',     v: w => w.position },
  { k: 'pin',   t: 'PIN',         v: w => (w.has_pin ? 'qo\'yilgan' : '') },
  { k: 'tg',    t: 'Telegram ID', v: w => (w.tg_id ? String(w.tg_id) : '') },
  { k: 'roles', t: 'Rollar',      v: w => w.roles.map(r => r.name).join(', ') },
  { k: 'act',   t: 'Holat',       v: w => (w.active ? 'faol' : '') },
];

//  Standarti — SERVERNIKI: faol xodimlar tepada, ichida ism bo'yicha.
//  Sahifa ochilganda hech narsa saralanmaydi, ya'ni kecha qanday
//  turgan bo'lsa bugun ham shunday ochiladi.
let sortK = null, sortAsc = true;

function sortSet(k){
  if (sortK === k) sortAsc = !sortAsc; else { sortK = k; sortAsc = true; }
  drawWorkers();
}

function drawHead(){
  $('wHead').innerHTML = USTUN.map(c => `
    <th style="cursor:pointer;user-select:none;white-space:nowrap"
        onclick="sortSet('${c.k}')">${esc(c.t)}<span style="opacity:.45">${
      sortK === c.k ? (sortAsc ? ' \u25b2' : ' \u25bc') : ''}</span></th>`).join('')
    + '<th></th>';
}

function drawWorkers(){
  drawHead();
  const q = ($('wQ')?.value || '').trim().toLowerCase();
  const mos = (w) => !q
    || w.name.toLowerCase().includes(q)
    || (w.phone || '').toLowerCase().includes(q)
    || (w.position || '').toLowerCase().includes(q)
    || (w.section || '').toLowerCase().includes(q)
    || (w.dept || '').toLowerCase().includes(q)
    || (w.shop || '').toLowerCase().includes(q)
    || (w.staff_group || '').toLowerCase().includes(q)
    || w.roles.some(r => (r.name || '').toLowerCase().includes(q)
                      || (r.scope_shop || '').toLowerCase().includes(q));
  const off = $('wOff') && $('wOff').checked;
  const ro = workers.filter(w => (off || w.active) && mos(w));
  if (sortK) {
    const col = USTUN.find(c => c.k === sortK);
    //  ★ BO'SH KATAK HAR DOIM OXIRIDA, saralash yo'nalishidan qat'i
    //  nazar. «Tsex» bosilganda tepaga o'n beshta bo'sh qator chiqsa
    //  javob ko'rinmasdi — bo'shni qidirayotgan odam esa ro'yxat
    //  oxirigacha tushadi va ularni o'sha yerda birga topadi.
    ro.sort((a, b) => {
      const x = (col.v(a) || '').toString(), y = (col.v(b) || '').toString();
      if (!x !== !y) return x ? -1 : 1;
      //  Ism bo'yicha ikkinchi darajali tartib: bir xil tsexdagi
      //  qatorlar har chizilganda joyini almashtirib turmasin.
      return x.localeCompare(y, 'uz') * (sortAsc ? 1 : -1)
          || a.name.localeCompare(b.name, 'uz');
    });
  }
  $('tW').innerHTML = ro.length ? ro.map(w => `
    <tr>
      <td>${esc(w.name)}${w.phone ? `<div class="muted" style="font-size:12px">${esc(w.phone)}</div>` : ''}</td>
      <!--  ★ PIN KO'RSATILMAYDI. Bazada uning izi turadi, izdan raqamni
            tiklab bo'lmaydi — shuning uchun «unutdim» degan xodimga eski
            PIN aytilmaydi, YANGISI qo'yiladi. -->
      <!--  Bo'lim IKKI manbadan: ishlab chiqarish bo'limi bo'lsa
            o'sha, bo'lmasa qog'ozdagi nomi («HR», «Logistika») —
            ekranda ikkalasi ham BO'LIM, ajratib ko'rsatish
            xodimga hech narsa bermasdi (izoh: sql/production.sql). -->
      ${USTUN.slice(1, 5).map(c =>
        `<td class="muted" style="font-size:13px">${
          c.v(w) ? esc(c.v(w)) : '—'}</td>`).join('')}
      <td class="muted">${w.has_pin ? 'qo\'yilgan' : '—'}</td>
      <td class="muted">${w.tg_id ? esc(w.tg_id) : '<span class="tag warn">ulanmagan</span>'}</td>
      <td>${w.roles.length ? w.roles.map(r =>
        `<span class="tag">${esc(r.name)}${r.scope_shop ? ' · ' + esc(r.scope_shop) : ''}${
           r.scope_warehouse ? ' · ' + esc(r.scope_warehouse) : ''}${
           r.scope_channel_name ? ' · ' + esc(r.scope_channel_name) : ''}${
           r.scope_own ? ' · o\'zinikini' : ''}</span>`
        ).join(' ') : '<span class="tag bad">rol yo\'q</span>'}</td>
      <td>${w.active ? '<span class="tag ok">faol</span>' : '<span class="tag">o\'chirilgan</span>'}</td>
      <td class="num"><button onclick="openForm(${w.id})">Tahrirlash</button></td>
    </tr>`).join('')
    : `<tr><td colspan="10" class="muted" style="padding:16px">
         ${q ? `«${esc(q)}» bo'yicha xodim topilmadi`
             : "Faol xodim yo'q \u2014 «O'chirilganlar» ni belgilang"}</td></tr>`;
}

//  Bo'lim ro'yxati TANLANGAN TSEXNIKIGA qisqaradi: zavodda yigirma
//  sakkizta bo'lim bor va «Qadoqlash» ikkita tsexda uchraydi — tsexi
//  yozilmagan ro'yxatdan to'g'risini terib olish qiyin.
function bolimlarChiz(){
  const sh = $('wShop').value;
  const bor = $('wSection').value;
  const list = (meta.sections || []).filter(x => !sh || String(x.shop_id) === sh);
  $('wSection').innerHTML = `<option value="">— yo'q —</option>` +
    list.map(x => `<option value="${x.id}"${String(x.id) === bor ? ' selected' : ''
      }>${esc(x.name)}${sh ? '' : ' · ' + esc(x.shop)}</option>`).join('');
  //  Tanlangani boshqa tsexniki bo'lib qolgan bo'lsa tushib ketadi —
  //  katak bo'sh qoladi va bu TO'G'RI: tsex almashdi, bo'lim ham.
}

function tsexBolimdan(){
  const s = (meta.sections || []).find(x => String(x.id) === $('wSection').value);
  if (s) $('wShop').value = String(s.shop_id);
}

function openForm(id){
  const w = id ? workers.find(x => x.id === id) : null;
  const checked = (code) => w?.roles.some(r => r.code === code);
  const scopeOf = (code) => w?.roles.find(r => r.code === code)?.scope_shop_id || '';
  const chanOf  = (code) => w?.roles.find(r => r.code === code)?.scope_channel || '';
  const whOf    = (code) => w?.roles.find(r => r.code === code)?.scope_warehouse_id || '';
  //  ★ IKKI NARX (izoh: sql/sales.sql). Standarti ULGURJI: menejerlar
  //  ko'pchiligi shunda ishlaydi va yangi xodimning ekrani
  //  o'zidan-o'zi o'zgarmaydi. Chakana bilan ishlaydiganida belgi
  //  qo'yiladi — ism kodga yozilmaydi (4-qoida).
  const priceOf = (code) => w?.roles.find(r => r.code === code)?.price_kind || 'opt';
  //  Yangi xodimda belgi QO'YILGAN bo'lib ochiladi: zavod qoidasi
  //  shunday — savdo xodimi o'zinikini ko'radi. Bosh ofis menejeri
  //  uchun katakcha olib tashlanadi.
  const ownOf_  = (code) => (w ? !!w.roles.find(r => r.code === code)?.scope_own : true);

  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal" style="max-width:640px">
        <div class="row" style="justify-content:space-between;margin-bottom:18px">
          <h1>${w ? 'Xodimni tahrirlash' : "Yangi xodim"}</h1>
          <button onclick="close_()">Yopish</button></div>
        <div class="stack">
          <div><label>Ism familiya</label>
            <input id="wName" value="${esc(w?.name || '')}"></div>

          <!--  ★ SHTAT JOYI — ishbay oylik shundan hisoblanadi
                (izoh: sql/production.sql). Dasturga KIRMAYDIGAN xodim
                ham shu yerda turadi: uning PIN'i ham, roli ham yo'q,
                lekin oylik beriladi.

                Bo'lim tanlansa tsex O'ZI aniqlanadi — server qo'yadi
                (shtat funksiyasi): ikki katak alohida to'ldirilsa bir kun
                ular qarama-qarshi bo'lib qolardi. Ro'yxatda bo'lim
                nomi tsexi bilan turadi, chunki «Qadoqlash» ikkita
                tsexda ham bor. -->
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Guruh</label>
              <input id="wGroup" list="wGroups" value="${esc(w?.staff_group || '')}"
                     placeholder="Ishlab chiqarish · Ombor · Savdo · AUP">
              <datalist id="wGroups">${
                [...new Set(workers.map(x => x.staff_group).filter(Boolean))]
                  .map(g => `<option value="${esc(g)}">`).join('')}</datalist></div>
            <div style="flex:1"><label>Lavozim</label>
              <input id="wPos" value="${esc(w?.position || '')}"
                     placeholder="Arra operatori"></div>
          </div>
          <div class="row" style="gap:12px">
            <!--  ★ TSEX BO'LIMSIZ HAM QO'YILADI: tsex boshlig'ining
                  bo'limi YO'Q — u butun tsexga mas'ul. Ilgari tsexni
                  faqat bo'lim orqali tanlash mumkin edi va boshliqning
                  tsexi jadvalda bo'sh qolib ketardi. -->
            <div style="flex:1"><label>Tsex</label>
              <select id="wShop" onchange="bolimlarChiz()">
                <option value="">— yo'q —</option>
                ${(meta.shops || []).map(x => `<option value="${x.id}"${
                  w?.shop_id === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}
              </select></div>
            <!--  Bo'lim tanlansa tsex O'SHANIKI bo'lib qo'yiladi
                  (serverda ham shunday): ikkalasi alohida to'ldirilsa
                  bir kun qarama-qarshi bo'lib qolardi. -->
            <div style="flex:1"><label>Ishlab chiqarish bo'limi</label>
              <select id="wSection" onchange="tsexBolimdan()"></select></div>
            <!--  Bo'lim MATNI alohida: «HR», «Logistika» va
                  «Ma'muriy-xo'jalik bo'limi» ishlab chiqarish bo'limi
                  emas va ro'yxatda yo'q — lekin qog'ozda bor va
                  odamning joyi yozilib turishi kerak. -->
            <div style="flex:1"><label>Bo'lim nomi</label>
              <input id="wDept" value="${esc(w?.dept || '')}"
                     placeholder="HR · Logistika"></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Telefon</label>
              <input id="wPhone" value="${esc(w?.phone || '')}" placeholder="+998..."></div>
            <!--  Maydon HAR DOIM BO'SH ochiladi: eski PIN o'qilmaydi.
                  Bo'sh qoldirilsa tegilmaydi, raqam yozilsa almashtiriladi. -->
            <div style="flex:1"><label>PIN (4-6 raqam)</label>
              <input id="wPin" inputmode="numeric" placeholder="${
                w?.has_pin ? 'o\'zgartirish uchun yangisini yozing' : 'masalan 4417'}"></div>
          </div>
          <!-- Telegram ID ixtiyoriy: u faqat Telegram ilovasi orqali kirish
               uchun kerak, saytga PIN bilan kiriladi. Maydonga @nom yozilishi
               oddiy hol edi — shuning uchun sarlavhada raqam ekani aytilgan
               va faqat raqam kiritiladi. -->
          <div><label>Telegram ID <span style="text-transform:none">— ixtiyoriy,
            faqat raqam (bot ichida /myid yozib olinadi). @nom emas.</span></label>
            <input id="wTg" inputmode="numeric" placeholder="123456789"
                   oninput="this.value = this.value.replace(/\D/g, '')"
                   value="${esc(w?.tg_id || '')}"></div>

          <!--  Qo'liga pul beriladigan xodim. Zavodda pul hamma xodimga
                berilmaydi — beshta odam oladi, shuning uchun kassada
                ro'yxat shu belgi bilan qisqaradi. Belgi rolda emas,
                XODIMDA: pul olish lavozimga emas, ishonchga bog'liq. -->
          <div><label>Kassa</label>
            <div class="row" style="gap:10px;align-items:center">
              <input type="checkbox" id="wCash" style="width:auto"
                     ${w?.can_hold_cash ? 'checked' : ''}
                     onchange="$('wCashG').style.display = this.checked ? '' : 'none'">
              <span style="flex:1">Qo'liga pul beriladi
                <span class="muted" style="font-size:12px">· kassir shu xodimga
                  chiqim yoza oladi, xodim esa sarfini o'zi yozadi</span></span>
            </div>
            <!--  ★ NIMAGA SARFLAY OLADI. Pul «hisob berish sharti bilan»
                  beriladi va xodim sarfini o'zi yozadi — lekin hamma
                  hamma narsani emas: tsex boshlig'i faqat oylik uchun,
                  ombor mudiri esa barcha harajat uchun.
                  HECH NARSA belgilanmasa — hamma guruh (tsex doirasi
                  bilan bir xil qoida: bo'sh doira cheklov yo'qligi). -->
            <div id="wCashG" style="margin-top:10px${
              w?.can_hold_cash ? '' : ';display:none'}">
              <label>Nimaga sarflay oladi</label>
              <div class="row" style="gap:8px;flex-wrap:wrap">
                ${(meta.expense_groups || []).map(g => `
                  <label class="tag" style="cursor:pointer;display:inline-flex;
                    align-items:center;gap:6px;padding:6px 10px">
                    <input type="checkbox" class="cashg" value="${esc(g.code)}"
                      style="width:auto"
                      ${(w?.cash_groups || []).includes(g.code) ? 'checked' : ''}>
                    ${esc(g.name)}</label>`).join('')}
              </div>
              <div class="muted" style="font-size:12px;margin-top:6px">
                Hech biri belgilanmasa — barcha harajat guruhi</div>
            </div>

            <!--  ★ INKASSATOR. Savdo doirasi mijozni MENEJERGA
                  biriktiradi, pulni esa zavodda bitta odam yig'ib
                  yuradi: u mijozning menejeri emas. Belgi FAQAT
                  kassaga tegadi — «Mijozdan pul olindi» oynasidagi
                  ro'yxat hamma mijozni ko'rsatadi; savdo bo'limi
                  eskicha qoladi va boshqa menejerning buyurtmasi
                  unga ochilmaydi (izoh: sql/cash.sql). -->
            <div class="row" style="gap:10px;align-items:center;margin-top:10px">
              <input type="checkbox" id="wInkas" style="width:auto"
                     ${w?.cash_all_customers ? 'checked' : ''}>
              <span style="flex:1">Hamma mijozdan pul oladi
                <span class="muted" style="font-size:12px">· inkassator: «Mijozdan
                  pul olindi» ro'yxatida barcha mijoz turadi, savdo bo'limidagi
                  doirasi o'zgarmaydi</span></span>
            </div>

            <!--  ★ QO'LIDAGI PULNI SARFLAYDIMI. Podotchyot olgan
                  xodimning pulidan harajat yoziladi — ombor mudiri
                  bozorga boradi. Inkassatorning qo'lidagi pul esa
                  mijozdan yig'ilgani va uning bitta yo'li bor:
                  kassaga topshiriladi. Standarti — YOZADI, belgi
                  olib tashlanadigan joy bitta (izoh: sql/cash.sql). -->
            <div class="row" style="gap:10px;align-items:center;margin-top:10px">
              <input type="checkbox" id="wSpend" style="width:auto"
                     ${w && w.can_spend_cash === false ? '' : 'checked'}>
              <span style="flex:1">Qo'lidagi pulni harajatga yozadi
                <span class="muted" style="font-size:12px">· belgilanmasa pul
                  faqat kassaga topshiriladi — inkassator shunday</span></span>
            </div></div>

          <!--  ★ OMBOR BITTA ROLDA IKKI XIL ODAMGA KERAK BO'LADI.
                Qoldiq ma'lumot kirituvchiga «ertaga nima so'rayman»
                degan savol uchun ochilgan, lekin bu HAMMA kirituvchiga
                kerak emas: biriga ish quroli, ikkinchisiga ortiqcha
                bo'lim. Rol buni ajrata olmaydi (huquqlar KODDA), shu
                sababdan belgi xodimda (izoh: sql/warehouse.sql). -->
          <div><label>Ombor</label>
            <div class="row" style="gap:10px;align-items:center">
              <input type="checkbox" id="wWh" style="width:auto"
                     ${w && w.sees_warehouse === false ? '' : 'checked'}>
              <span style="flex:1">Ombor bo'limini ko'radi
                <span class="muted" style="font-size:12px">· belgilanmasa menyuda
                  «Ombor» umuman chizilmaydi — qoldiq ham, qabul qilish ham</span></span>
            </div></div>

          <div><label>Rollar</label>
            <div class="stack" style="gap:8px">
              ${meta.roles.map(r => `
                <div class="row" style="gap:10px;align-items:center">
                  <input type="checkbox" style="width:auto" class="role" value="${r.code}"
                         ${checked(r.code) ? 'checked' : ''}>
                  <span style="flex:1">${esc(r.name)}
                    <span class="muted" style="font-size:12px">· ${SURFACE[r.surface]}</span></span>
                  <!-- Tsex doirasi ishlab chiqarish rollari uchun, savdo
                       yo'nalishi esa savdo uchun: bittasi tanlanadi. -->
                  ${SALES_ROLES.has(r.code) ? `
                  <select class="chan" data-role="${r.code}" style="width:150px">
                    <option value="">Barcha yo'nalish</option>
                    ${meta.channels.map(c => `<option value="${esc(c.code)}"
                      ${chanOf(r.code) === c.code ? 'selected' : ''}
                      >${esc(c.name)}</option>`).join('')}
                  </select>
                  <!--  Narx turi: menejer qaysi narx bilan ishlaydi.
                        Chegara shundan chiqadi — undan past sotish
                        direktor ruxsatini talab qiladi. -->
                  <select class="pkind" data-role="${r.code}" style="width:130px">
                    <option value="opt"${priceOf(r.code) === 'opt' ? ' selected' : ''}
                      >Ulgurji narx</option>
                    <option value="retail"${priceOf(r.code) === 'retail' ? ' selected' : ''}
                      >Chakana narx</option>
                  </select>
                  <!-- Vitrina sotuvchisi shaharning bir nuqtasida ishlaydi:
                       nuqtasi biriktirilsa u faqat o'sha vitrinaning
                       qoldig'ini ko'radi (ustiga T/M omborni). Bo'sh
                       qoldirilsa — bosh ofis, hamma omborni ko'radi. -->
                  <select class="wh" data-role="${r.code}" style="width:170px">
                    <option value="">Vitrinasiz (bosh ofis)</option>
                    ${(meta.warehouses || []).map(h => `<option value="${h.id}"
                      ${String(whOf(r.code)) === String(h.id) ? 'selected' : ''}
                      >${esc(h.name)}</option>`).join('')}
                  </select>
                  <!--  ★ O'Z MIJOZI, O'Z BUYURTMASI. Yo'nalish doirasi
                        bitta menejerni ajratib bermaydi: bitta kanalda
                        bir nechta menejer ishlaydi va ular bir-birining
                        mijozini ko'rib turardi. Bo'sh qoldirilsa —
                        butun savdo (bosh ofis, rahbariyat). -->
                  <label class="tag" style="cursor:pointer;display:inline-flex;
                    align-items:center;gap:6px;padding:6px 10px;white-space:nowrap">
                    <input type="checkbox" class="own" data-role="${r.code}"
                      style="width:auto" ${ownOf_(r.code) ? 'checked' : ''}>
                    Faqat o'zinikini</label>` : `
                  <select class="scope" data-role="${r.code}" style="width:190px">
                    <option value="">Barcha tsex</option>
                    ${meta.shops.map(s => `<option value="${s.id}"
                      ${String(scopeOf(r.code)) === String(s.id) ? 'selected' : ''}
                      >${esc(s.name)}</option>`).join('')}
                  </select>`}
                </div>`).join('')}
            </div>
          </div>

          ${w ? `<div class="row" style="gap:10px;align-items:center">
            <input type="checkbox" id="wActive" style="width:auto" ${w.active ? 'checked' : ''}>
            <span>Faol</span></div>` : ''}

          <button class="primary" onclick="save(${id || 'null'})">Saqlash</button>
        </div>
      </div>
    </div>`;
  //  Bo'limlar ro'yxati modal chizilgandan KEYIN to'ldiriladi: u
  //  tanlangan tsexga bog'liq va shablon ichida hisoblanmaydi.
  bolimlarChiz();
  if (w?.section_id) $('wSection').value = String(w.section_id);
}
const close_ = () => { $('modalRoot').innerHTML = ''; };

async function save(id){
  const roles = [...document.querySelectorAll('.role:checked')].map(cb => ({
    code: cb.value,
    scope_shop_id: document.querySelector(`.scope[data-role="${cb.value}"]`)?.value || null,
    scope_channel: document.querySelector(`.chan[data-role="${cb.value}"]`)?.value || null,
    price_kind: document.querySelector(`.pkind[data-role="${cb.value}"]`)?.value || null,
    scope_warehouse_id: document.querySelector(`.wh[data-role="${cb.value}"]`)?.value || null,
    scope_own: !!document.querySelector(`.own[data-role="${cb.value}"]`)?.checked,
  }));
  const body = {
    name:  $('wName').value.trim(),
    //  Shtat maydonlari HAR DOIM yuboriladi (bo'shi ham): bo'sh
    //  qoldirilgani «tegma» emas, «yo'q» degani — noto'g'ri
    //  qo'yilgan bo'lim shu yerdan olib tashlanadi.
    staff_group: $('wGroup').value.trim(),
    position:    $('wPos').value.trim(),
    dept:        $('wDept').value.trim(),
    section_id:  $('wSection').value || null,
    shop_id:     $('wShop').value || null,
    phone: $('wPhone').value.trim() || null,
    pin:   $('wPin').value.trim() || null,
    tg_id: $('wTg').value.trim() || null,
    can_hold_cash: $('wCash').checked,
    cash_all_customers: $('wInkas').checked,
    can_spend_cash: $('wSpend').checked,
    sees_warehouse: $('wWh').checked,
    cash_groups: [...document.querySelectorAll('.cashg')]
      .filter(c => c.checked).map(c => c.value),
    roles,
  };
  if (id) body.active = $('wActive').checked;
  try{
    await App.api(id ? '/api/admin/workers/' + id : '/api/admin/workers',
      { method: id ? 'PATCH' : 'POST', body: JSON.stringify(body) });
    close_(); load();
  }catch(e){ alert(e.message); }
}

// ───────────────────────────────────────────────────── FAYLDAN YUKLASH
//
//  ★ ZAVODDA OLTMISH KISHI, TIZIMGA O'NTASI KIRADI. Qolgani — arra
//  operatori, shkurkachi, qorovul, oshpaz: ular dasturni ochmaydi,
//  lekin OYLIK hammasiga beriladi va ishbay hisob konver qaysi
//  bo'limdan o'tganiga bog'lanadi. Shuning uchun shtat ro'yxati
//  hoziroq kiritiladi va uni qo'lda terib chiqish yarim kunlik ish
//  bo'lardi.
//
//  Ikki bosqich, ta'minotchilar bilan bir xil: avval TEKSHIRIB
//  ko'rsatiladi, keyin saqlanadi. Xato qator bo'lsa hech narsa
//  saqlanmaydi — yarim kirgan ro'yxat eng yomoni.
let picked = null;

function openImport(){
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal" style="max-width:700px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Xodimlarni fayldan yuklash</h1>
          <button onclick="close_()">Yopish</button></div>
        <p class="muted" style="font-size:13px;margin-bottom:14px">
          Ustunlar sarlavhadan topiladi, tartibi muhim emas:
          <b>F.I.SH</b> · Guruh · Tsex · Bo'lim · Lavozim · Telefon.
          Faqat F.I.SH majburiy.<br>
          <b>PIN va rol fayldan o'qilmaydi</b> — PIN yozilgan fayl
          pochtada va stol ustida qolardi. Ular xodim kartochkasidan
          beriladi.</p>
        <input type="file" accept=".xlsx,.csv,.txt" onchange="pick(this)">
        <div id="impOut" style="margin-top:14px"></div>
      </div></div>`;
}

async function pick(input){
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  picked = file;
  $('impOut').innerHTML = `<p class="muted">Tekshirilmoqda\u2026</p>`;
  try { show(await App.upload('/api/import/workers', file), file.name); }
  catch (e) { $('impOut').innerHTML =
    `<p class="tag bad" style="display:block">${esc(e.message)}</p>`; }
}

function show(r, filename){
  const bad = r.rows.filter(x => x.errors.length);
  $('impOut').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <b>${esc(filename)}</b>
      <span class="muted" style="font-size:13px">${r.total} qator${
        r.updates ? ` \u00b7 ${r.updates} tasi mavjud` : ''}</span>
    </div>
    ${r.unknown.length ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
      Tanilmagan ustunlar (o'qilmaydi): ${esc(r.unknown.join(', '))}</p>` : ''}
    ${(r.no_section || []).length ? `
      <div class="tag warn" style="display:block;margin-bottom:10px;
        text-align:left;white-space:normal">
        <b>${r.no_section.length} ta xodimning bo'limi ro'yxatda topilmadi.</b>
        Ular baribir kiritiladi, lekin ishbay oyligi bo'limga
        bog'lanmaydi \u2014 bo'limini kartochkadan qo'yish kerak:<br>
        <span style="font-size:12px">${esc(r.no_section.join(' \u00b7 '))}</span></div>` : ''}
    ${bad.length ? `
      <div style="max-height:30vh;overflow:auto;margin-bottom:10px">
        <table><tbody>${bad.map(x => `
          <tr><td style="width:70px" class="muted">${x.line}-qator</td>
              <td>${esc(x.errors.join(' \u00b7 '))}</td></tr>`).join('')}</tbody></table>
      </div>
      <p class="muted" style="font-size:13px">${r.bad} ta qatorda xato bor.
        Faylni tuzatib qaytadan tanlang \u2014 xato qator bo'lsa hech narsa
        saqlanmaydi.</p>`
    : `<p class="muted" style="font-size:13px;margin-bottom:12px">Hamma qator to'g'ri.${
        r.updates ? ` Mavjud ${r.updates} tasi yangilanadi: PIN, rol va pul
        belgilariga tegilmaydi.` : ''}</p>
      <button class="primary" id="impSave" onclick="saveFile()" style="width:100%"
        >${r.total} ta xodimni saqlash</button>`}`;
}

async function saveFile(){
  $('impSave').disabled = true;
  try {
    const r = await App.upload('/api/import/workers?save=1', picked);
    close_(); await load();
    alert(`${r.saved} ta xodim kiritildi` +
          (r.created ? ` \u2014 ${r.created} tasi yangi` : '') +
          (r.updated ? `, ${r.updated} tasi yangilandi` : '') + '.' +
          (r.no_section ? `\n\n${r.no_section} tasining bo'limi topilmadi \u2014 ` +
            "kartochkasidan qo'yish kerak." : ''));
  } catch (e) {
    alert(e.message);
    const b = $('impSave'); if (b) b.disabled = false;
  }
}

App.start(load, 'admin.users');
</script>
