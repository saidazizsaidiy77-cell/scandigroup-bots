// ═══════════════════════════════════════════════════════ JO'NATISH
//
//  Savdo buyurtmani yozadi va bron qo'yadi, lekin mahsulotni zavoddan
//  chiqarmaydi: mijoz bilan kunini kelishgach chiqarishga beradi. Mudir bu yerda
//  ko'radi — nima, qancha, qayerga va kim kutib oladi — va mashinaga
//  ortilganini tasdiqlaydi.
//
//  Bronning hammasi omborga yetib kelmagan bo'lsa tugma ishlamaydi:
//  yarmi hali tsexda turganda «jo'natildi» deb yozib qo'yish mijoz
//  qarzini ham noto'g'ri oshirardi.
async function loadShip() {
  ship = (await App.api('/api/sales/shipping')).rows;
  //  Kunning hisobi SERVERDAN keladi, shu yerda qayta sanalmaydi:
  //  bosh sahifa ham shu raqamni ko'rsatadi va ikki joyda yozilgan
  //  shart bir kun bir-biridan ajralib ketardi.
  kun = await App.api('/api/sales/day');
  drawTabs();
  drawShip();
}

//  ★ BUGUNGA OLISH. Mudir ertalab mashinaga sig'adiganini tanlaydi —
//  sana bilan avtomat emas: `due_on` mijozga aytilgan va'da, mashinaga
//  nima sig'ishini esa faqat u biladi. Ikkinchi bosish rejadan chiqaradi.
async function planDay(id, olingan) {
  try {
    await App.api(`/api/sales/orders/${id}/plan-day`, {
      method: 'POST',
      //  `body` MATN bo'lishi shart: obyekt yuborilsa `fetch` uni
      //  «[object Object]» qilib jo'natadi va server JSON ni o'qiy olmaydi.
      body: JSON.stringify({ on: olingan ? null : isoDay(new Date()) }) });
    await loadShip();
  } catch (e) { toast(e.message, true); }
}

//  Sana — CHIQIB KETISH sanasi bo'yicha: mudir kunini shunga qarab
//  tuzadi («bugun nima ketadi»), savdo qachon yuborganiga qarab emas.
//  Sanasi qo'yilmagan buyurtma oraliq tanlanganda chiqmaydi: u hali
//  kunga bog'lanmagan.
const shipRows = () => ship.filter(o => {
  const d = (o.due_on || '').slice(0, 10);
  const q = shipF.q.trim().toLowerCase();
  return (!shipF.from || (d && d >= shipF.from))
      && (!shipF.to   || (d && d <= shipF.to))
      && (!shipF.customer || String(o.customer_id) === shipF.customer)
      && (!q || String(o.order_no || '').toLowerCase().includes(q));
});

function setShipF(k, v) { shipF[k] = v; drawShip(); }
function clearShipF() { Object.keys(shipF).forEach(k => shipF[k] = ''); drawShip(); }

function shipFilter() {
  //  Mijozlar ro'yxati SHU ro'yxatdan yig'iladi: mudirga zavodning
  //  barcha mijozi emas, hozir chiqishni kutayotganlari kerak.
  const mijozlar = [...new Map(ship.map(o => [o.customer_id, o.customer_name]))]
    .sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'uz'));
  const bor = shipF.from || shipF.to || shipF.customer || shipF.q;
  return `<div class="card" style="margin-bottom:16px">
    <div style="display:grid;gap:12px;align-items:start;
         grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div><label>Chiqib ketish \u2014 dan</label>
        <input type="date" value="${esc(shipF.from)}"
          onchange="setShipF('from', this.value)"></div>
      <div><label>gacha</label>
        <input type="date" value="${esc(shipF.to)}"
          onchange="setShipF('to', this.value)"></div>
      <div><label>Mijoz</label>
        <select onchange="setShipF('customer', this.value)">
          <option value="">\u2014 barchasi \u2014</option>
          ${mijozlar.map(([id, nom]) => `<option value="${id}"${
            shipF.customer === String(id) ? ' selected' : ''}>${esc(nom)}</option>`).join('')}
        </select></div>
      <div><label>Zakaz &#8470;</label>
        <input value="${esc(shipF.q)}" placeholder="Z-638"
          oninput="setShipF('q', this.value)"></div>
      <div>${bor ? `<label>&nbsp;</label><button style="width:100%"
        onclick="clearShipF()">Tozalash</button>` : ''}</div>
    </div>
  </div>`;
}

//  Kunning hisobi: bugunga nechtasi olingan, nechtasi chiqib ketdi va
//  nechtasi qoldi. Mudir kun bo'yi shu uchta raqamga qaraydi, direktor
//  esa aynan shu raqamni bosh sahifada ko'radi.
function kunCard() {
  if (!kun || !kun.olindi) return '';
  return `<div class="card" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:16px">
      <div><h2 style="margin:0">Bugun chiqadi</h2>
        <div class="muted" style="font-size:13px;margin-top:4px">
          ${kun.kech ? `${kun.kech} tasi oldingi kundan qolgan` :
            'hammasi bugunga olingan'}</div></div>
      <div class="row" style="gap:28px">
        <div><div class="kpi">${kun.olindi}</div>
          <div class="muted" style="font-size:12px">olindi</div></div>
        <div><div class="kpi mny-in">${kun.chiqdi}</div>
          <div class="muted" style="font-size:12px">chiqdi</div></div>
        <div><div class="kpi${kun.qoldi ? ' mny-out' : ''}">${kun.qoldi}</div>
          <div class="muted" style="font-size:12px">qoldi</div></div>
      </div>
    </div>
  </div>`;
}

function drawShip() {
  if (!ship.length) {
    $('body').innerHTML = `<div class="card"><h2>Chiqariladigan buyurtma yo'q</h2>
      <p class="muted" style="margin-top:8px">Savdo buyurtmani tayyorlab
      «Mijozga chiqarish» deganda u shu yerda paydo bo'ladi.</p></div>`;
    return;
  }
  const list = shipRows();
  const bugun = isoDay(new Date());
  if (!list.length) {
    $('body').innerHTML = shipFilter() + `<div class="card">
      <h2>Filtrga mos buyurtma yo'q</h2>
      <p class="muted" style="margin-top:8px">Jami ${ship.length} ta buyurtma
      chiqishni kutmoqda \u2014 filtrni kengaytiring.</p></div>`;
    return;
  }
  $('body').innerHTML = kunCard() + shipFilter() + (list.length < ship.length
    ? `<p class="muted" style="font-size:13px;margin-bottom:12px">${
        list.length} ta \u00b7 jami ${ship.length} tadan</p>` : '')
    + list.map(o => {
    const tayyor = o.in_warehouse_qty >= o.assigned_qty;
    //  Chiqib ketish sanasi — savdo mijozga aytgan kun. Tizim uni MAJBUR
    //  qilmaydi: kunni mudir o'zi tuzadi va erta ham, kech ham chiqarish
    //  mumkin. Lekin sana O'TIB KETGANI ko'rinib tursin — ro'yxat shu sana
    //  bo'yicha saralanadi, ya'ni kechikkani allaqachon tepada turadi va
    //  sababini aytmasa mudir uni oddiy qator deb o'qirdi.
    const due = (o.due_on || '').slice(0, 10);
    const kech = due && due < bugun;
    //  Kunlik rejaga olinganmi va qaysi kunga: bugungisi yashil, oldingi
    //  kundan qolgani sariq — ikkinchisi «bu hali chiqmagan» degani.
    const olingan = !!o.plan_on;
    const olinganBugun = olingan && String(o.plan_on).slice(0, 10) === bugun;
    return `<div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0">${esc(o.order_no)} · ${esc(o.customer_name)}</h2>
          <div class="muted" style="font-size:13px;margin-top:4px">
            ${esc(o.ship_to_name || 'qayerga — tanlanmagan')}${
              o.address ? ' · ' + esc(o.address) : ''}${
              o.receiver_phone ? ' · kutib oluvchi ' + esc(o.receiver_phone)
                : (o.customer_phone ? ' · ' + esc(o.customer_phone) : '')}
          </div>
          <div class="muted" style="font-size:12px;margin-top:3px">
            Chiqib ketish: ${o.due_on
              ? `<b class="${kech ? 'late' : ''}">${d8(o.due_on)}</b>${
                  due === bugun ? ' · bugun' : ''}` : '—'} ·
            ${esc(o.manager_name || '')} chiqarishga berdi ${d8(o.sent_to_wh_on)}</div>
        </div>
        <div class="row" style="gap:8px;align-items:center">
          ${kech ? `<span class="tag bad">${
            Math.round((Date.parse(bugun) - Date.parse(due)) / 864e5)
            } kun kechikdi</span>` : ''}
          ${olingan ? `<span class="tag ${olinganBugun ? 'ok' : 'warn'}">${
            olinganBugun ? 'bugunga olingan'
              : `${d8(o.plan_on)} dan qolgan`}</span>` : ''}
          ${tayyor ? `<span class="tag ok">hammasi omborda</span>`
                   : `<span class="tag warn">${o.in_warehouse_qty} / ${
                        o.assigned_qty} omborda</span>`}
          <!--  Yuk xati TASDIQDAN OLDIN chop etiladi: mudir hujjatni
                chiqaradi, haydovchining qo'liga beradi, mashina ortiladi
                va shundan keyin «Chiqarib yubordim» bosiladi. Tasdiqdan
                keyin chop etish kech bo'lardi — qog'oz allaqachon yo'lda.
                Alohida oynada ochiladi: ro'yxat joyida qolsin. -->
          ${canShip ? `<button onclick="planDay(${o.id}, ${olingan})">${
            olingan ? 'Rejadan chiqarish' : 'Bugunga olish'}</button>` : ''}
          <button onclick="window.open('/yukxati.html?id=${o.id}',
            'yukxati' + ${o.id})">Yuk xati</button>
          <button class="primary" ${tayyor ? '' : 'disabled'}
            onclick="doShip(${o.id})">Chiqarib yubordim</button>
        </div>
      </div>
      <table class="board" style="margin-top:12px"><thead><tr>
        <th class="c-no">Konveyer &#8470;</th><th class="c-name">Nomi</th>
        <th class="c-type">Turi</th><th class="c-qty num">Soni</th><th>Qayerda</th>
      </tr></thead><tbody>${o.units.map(u => `
        <tr>
          <td class="c-no"><b>${esc(u.conveyor_no)}</b></td>
          <td class="c-name">${esc(u.product)}${u.color
            ? `<div class="muted" style="font-size:12px">${esc(u.color)}${
                u.fabric ? ' · ' + esc(u.fabric) : ''}</div>` : ''}</td>
          <td class="c-type muted">${esc(u.product_type || '')}</td>
          <!--  Faqat SHU buyurtmaga olingan soni: konverning umumiy hajmi
                yozilsa mudir «48 ta chiqarish kerak» deb o'qib qolardi. -->
          <td class="c-qty num">${u.qty}</td>
          <td>${u.status === 'fg'
            ? `<span class="tag ok">${esc(u.warehouse || 'T/M ombor')}</span>`
            : `<span class="tag warn">${esc(u.section || 'boshlanmagan')}</span>`}</td>
        </tr>`).join('')}</tbody></table>
    </div>`;
  }).join('');
}

//  Nakladnoy yozilayotgan payt mudir faqat CHIQQAN KUNNI qo'yadi.
//  Pul kirim sanasi — savdo menejerining ishi: pul masalasini mijoz
//  bilan u kelishadi, mudir esa mahsulot chiqqanini tasdiqlaydi
//  (buyurtma kartochkasida, `public/buyurtmalar.html`).
function doShip(id) {
  const o = ship.find(x => x.id === id);
  const bugun = isoDay(new Date());
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeShip()">
      <div class="modal" style="max-width:460px">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h1 style="margin:0">${esc(o.order_no)}</h1>
          <button onclick="closeShip()">Yopish</button></div>
        <p class="muted" style="margin-bottom:18px">${esc(o.customer_name)} \u00b7
          <b>${o.assigned_qty}</b> dona \u00b7 ${esc(o.ship_to_name || '—')}</p>
        <div class="stack">
          <div><label>Chiqib ketgan sana</label>
            <input id="shOn" type="date" value="${bugun}"></div>
          <button class="primary" onclick="okShip(${id})">Chiqarib yubordim</button>
        </div>
      </div></div>`;
}

const closeShip = () => { $('modalRoot').innerHTML = ''; };

// ══════════════════════════════════════════ VITRINADAN QAYTARISH
//
//  Hujjat UCH qo'ldan o'tadi va har bosqichda boshqa odam bosadi
//  (izoh: sql/warehouse.sql). Shuning uchun tugma HOLATGA qarab
//  chiziladi, huquqqa emas: server baribir ikkalasini ham tekshiradi.
//
//      new        vitrina tasdiqlaydi   «Tasdiqlash»
//      confirmed  T/M qabul qiladi      «Qabul qilish»
//      accepted   tugadi
//
//  «Yo'lda» degan holat ataylab ko'rinadi: do'kondan chiqqan, lekin
//  omborga yetib kelmagan mahsulot qoldiqda hali vitrinada turadi va
//  mudir uni javonda izlab yurmasin.
//  ★ HOLAT KIMNI KUTAYOTGANINI AYTADI, o'zini emas. Hujjat uch qo'ldan
//  o'tadi va har bosqichda tugma FAQAT bittasida chiqadi — qolganlar
//  «nega bosilmayapti» deb o'ylamasin. Vitrina nomi ham yoziladi:
//  T/M mudiri ro'yxatda o'nta hujjat ko'radi va qaysi do'kondan javob
//  kutilayotganini bilishi kerak.
//  ★ HUJJATLAR BU YERDA EMAS — «Omborlar aro harakat» sahifasida
//  (`public/omborlar-aro.html`). Ilgari ular ombor sahifasining
//  «Qaytarish» tabida turardi va T/M ombor mudiri vitrinaga jo'natish
//  tugmasini o'sha tabning ichidan izlab topa olmasdi: u JO'NATMOQCHI
//  edi, tab esa «qaytarish» deb atalardi. Ikki nusxa qilinmadi —
//  hujjat bitta faylda, yuk xati bilan bir xil sabab.

async function okShip(id) {
  try {
    await App.api(`/api/sales/orders/${id}/ship`, { method: 'POST',
      body: JSON.stringify({ ship_on: $('shOn').value || null }) });
    closeShip();
    toast('Jo\'natildi');
    await loadShip();
  } catch (e) { toast(e.message, true); }
}

// ═══════════════════════════════════════════════════════════ HARAKAT
//
//  Kirim — ombor qabul qilgani, chiqim — mijozga chiqqani. Chiqim savdo
//  moduli ulanmaguncha bo'sh keladi; ko'rinish shundan qat'i nazar tayyor
//  turadi, savdo ulanganda o'zi to'ladi.
let moves = null;
//  Tanlangan filtr o'zgaruvchida saqlanadi: jadval har safar qaytadan
//  chiziladi va <select> ning qiymati shu bilan tiklanmasa, har
//  yuklashda «Hammasi» ga qaytib ketardi.
let mKind = '', mQ = '';

function drawMoves() {
  const d = moves;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div><label>Sanadan</label>
          <input id="mFrom" type="date" value="${d.from}" onchange="loadMoves()"></div>
        <div><label>Sanagacha</label>
          <input id="mTo" type="date" value="${d.to}" onchange="loadMoves()"></div>
        <button onclick="period(0)">Bugun</button>
        <button onclick="period(7)">7 kun</button>
        <button onclick="period(30)">30 kun</button>
        <!--  Kirim/chiqim filtri: ombor mudirining savoli ko'pincha bitta
              tomon haqida bo'ladi — «bugun nima keldi» yoki «bugun nima
              chiqdi». Aralash ro'yxatdan buni sanab chiqarish kerak
              bo'lardi. Filtr SERVERDA (?kind=): oraliq katta bo'lsa
              qatorlar chegarasiga yetib, klientda yarmi yo'qolardi. -->
        <!--  Bitta katak uchala savolga javob beradi: mijoz nomi, konver
              raqami va zakaz raqami birga qidiriladi. Uchta alohida
              katak qilinsa mudir qaysi biriga yozishni o'ylab o'tirardi,
              va uchtasi ham bo'sh turgan filtr qatori joy egallardi. -->
        <div style="flex:1;min-width:220px"><label>Qidiruv</label>
          <input id="mQ" value="${esc(d.q || '')}"
            placeholder="mahsulot · mijoz · konver № · zakaz №"
            onchange="loadMoves()"></div>
        <div><label>Amal</label>
          <select id="mKind" onchange="loadMoves()">
            ${[['', 'Hammasi'], ['kirim', 'Faqat kirim'], ['chiqim', 'Faqat chiqim']]
              .map(([v, t]) => `<option value="${v}"${
                mKind === v ? ' selected' : ''}>${t}</option>`).join('')}
          </select></div>
      </div>
    </div>

    <div class="grid g3" style="margin-top:16px">
      <div class="card"><h2>Kirim</h2><div class="kpi" style="color:var(--ok)">${d.kirim}<small> dona</small></div></div>
      <div class="card"><h2>Chiqim</h2><div class="kpi">${d.chiqim}<small> dona</small></div></div>
      <div class="card"><h2>Farqi</h2><div class="kpi">${d.kirim - d.chiqim}<small> dona</small></div></div>
    </div>

    ${!d.rows.length ? `<div class="card" style="margin-top:16px"><h2>Harakat yo'q</h2>
      <p class="muted" style="margin-top:8px">Tanlangan oraliqda omborga kirim ham,
      undan chiqim ham bo'lmagan.</p></div>`
    : `<div class="card" style="margin-top:16px">
      <table class="board"><thead><tr>
        <th>Sana</th><th>Amal</th><th class="c-no">Konveyer &#8470;</th>
        <th class="c-name">Nomi</th><th class="c-qty num">Soni</th><th>Mijoz</th>
        <!--  Kirimda kim QABUL QILGAN, chiqimda kim CHIQARGAN. Dona
              yetishmaganda savol aynan shu bo'ladi va javobi shu
              ustunda turadi — audit jurnalini ochish kerak emas. -->
        <th>Kim</th>
        <!--  ★ ADASHIB BOSILGAN KO'CHIRISH ORQAGA OLINADI. Ustun faqat
              huquqi borida chiziladi: tekshiruv baribir SERVERDA. -->
        ${canMove ? '<th></th>' : ''}
      </tr></thead>
      <tbody>${d.rows.map(r => `
        <tr>
          <td>${d8(r.on_date)}</td>
          <td><span class="tag ${r.kind === 'kirim' ? 'ok' : ''}">${r.kind}</span></td>
          <!--  Konver raqami ostida ZAKAZ raqami: «kim chiqargan» degan
                savoldan keyingi savol «qaysi hujjat bilan» bo'ladi.
                Bosilsa o'sha yuk xati ochiladi. -->
          <td class="c-no"><b>${esc(r.conveyor_no)}</b>${r.order_no
            ? `<div style="font-size:12px">${r.order_id
                ? `<a href="/yukxati.html?id=${r.order_id}" target="_blank"
                     onclick="event.stopPropagation()">${esc(r.order_no)}</a>`
                : `<span class="muted">${esc(r.order_no)}</span>`}</div>` : ''}</td>
          <td class="c-name">${esc(r.product)}<div class="muted"
            style="font-size:12px">${esc(r.product_type || '')}</div></td>
          <td class="c-qty num">${r.qty}</td>
          <td class="muted">${esc(r.customer_name)}</td>
          <td>${r.by_name ? esc(r.by_name)
            : '<span class="muted">&mdash;</span>'}<div class="muted"
            style="font-size:12px">${r.kind === 'kirim' ? 'qabul qildi' : 'chiqardi'}</div></td>
          <!--  Tugma FAQAT ko'chirish qatorida: ishlab chiqarishdan
                kirimda va mijozga chiqimda ko'chirish yo'q, ya'ni
                bekor qilinadigan narsa ham yo'q (move_id bo'sh).
                Kichik: lentadagi asosiy ish o'qish, bu esa kunda
                bir-ikki marta bosiladi (xom ashyodagi qaytarish
                tugmasi bilan bir xil sabab).
                Izohda BACKTICK yo'q: bu matn JS shablonining ICHIDA
                turadi va backtick uni o'sha yerda tugatib qo'yardi. -->
          ${!canMove ? '' : `<td class="num">${r.move_id
            ? `<button class="ic" title="Ko'chirishni bekor qilish"
                 onclick="kochBekor(${r.move_id}, '${esc(r.conveyor_no)}')"
                 >↩</button>` : ''}</td>`}
        </tr>`).join('')}</tbody></table></div>`}`;
}

//  ★ KO'CHIRISHNI BEKOR QILISH (zavod qarori, 2026-10; izoh:
//  modules/warehouse.js). Vitrinaga ko'chirish bitta bosish va u ham
//  bexosdan bosiladi — qaytaradigan joy esa yo'q edi: mahsulot
//  vitrinada ko'rinib qolar, mudir uni QAYTARISH HUJJATI bilan
//  qaytarishi kerak bo'lardi, holbuki mahsulot javondan qimirlamagan
//  ham.
//
//  Yangi harakat yozilmaydi — o'sha qatorning O'ZI bekor qilinadi:
//  teskari ko'chirish tarixda ikkita yolg'on qator qoldirardi.
//
//  Sabab MAJBURIY: qator tarixda «bekor qilingan» bo'lib turadi va
//  «nega» degan savol keyin beriladi.
async function kochBekor(id, no) {
  const sabab = prompt(`${no} — ko'chirish bekor qilinsinmi?\n` +
    'Sababini yozing (adashib bosildi, mahsulot ketmadi…)');
  if (sabab === null) return;
  if (!sabab.trim()) return toast('Sabab yozilmagan', true);
  try {
    const r = await App.api(`/api/warehouse/fg/moves/${id}/cancel`,
      { method: 'POST', body: JSON.stringify({ note: sabab.trim() }) });
    toast(`${no} · ${r.qty} ta ${r.to} ga qaytarildi`);
    await loadMoves();
  } catch (e) { toast(e.message, true); }
}

function period(days) {
  const to = new Date();
  const from = new Date(Date.now() - days * 864e5);
  $('mFrom').value = isoDay(from);
  $('mTo').value = isoDay(to);
  loadMoves();
}

async function loadMoves() {
  const p = wq(new URLSearchParams());
  p.set('from', $('mFrom')?.value || isoDay(new Date(Date.now() - 7 * 864e5)));
  p.set('to', $('mTo')?.value || isoDay(new Date()));
  if ($('mKind')) mKind = $('mKind').value;
  if (mKind) p.set('kind', mKind);
  if ($('mQ')) mQ = $('mQ').value;
  if (mQ) p.set('q', mQ);
  moves = await App.api('/api/units/stock/moves?' + p);
  drawMoves();
  //  Jadval qayta chizilgach fokus qidiruv katagiga qaytariladi:
  //  aks holda mijoz nomini yozib bo'lgach klaviatura yopilib qolardi.
  if (mQ && $('mQ')) { $('mQ').focus(); $('mQ').setSelectionRange(9999, 9999); }
}

// ═══════════════════ KIRIM — TA'MINOTCHIDAN TAYYOR MAHSULOT ═════════════════
//
//  Matras zavodda yasalmaydi: u ta'minotchidan TAYYOR holda keladi va
//  do'konda alohida sotiladi (izoh: sql/warehouse.sql). Hujjat IKKI
//  ishni birga qiladi — omborni to'ldiradi va ta'minotchining oldidagi
//  qarzni oshiradi.
async function loadBuy() {
  if (!buyRef) buyRef = await App.api('/api/warehouse/fg/buyable');
  buyRows = (await App.api('/api/warehouse/fg/receipts')).rows;
  drawBuy();
}

function drawBuy() {
  //  Ro'yxat bo'sh bo'lsa sababi YOZILADI: «— bo'sh —» degan yozuv
  //  mudirni nima qilish kerakligi haqida savol bilan qoldirardi.
  const bor = buyRows.length;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px;
        flex-wrap:wrap;gap:8px">
        <div>
          <h2 style="margin:0">Ta'minotchidan kirim</h2>
          <p class="muted" style="font-size:13px;margin-top:4px">
            Zavodda yasalmaydigan tayyor mahsulot — matras. Kirim omborni
            to'ldiradi va ta'minotchining oldidagi qarzni oshiradi.</p>
        </div>
        <button class="primary" onclick="buyOpen()">+ Yangi kirim</button>
      </div>
      ${bor ? `<div class="tbox"><table>
        <thead><tr><th>Hujjat</th><th>Sana</th><th>Ta'minotchi</th>
          <th>Nima keldi</th><th class="num">Soni</th>
          <th class="num">Summa, $</th><th></th></tr></thead>
        <tbody>${buyRows.map(buyRow).join('')}</tbody></table></div>`
      : `<p class="muted" style="font-size:13px">Hali kirim yozilmagan.</p>`}
    </div>`;
}

const buyRow = (r) => `<tr${r.status === 'cancelled'
    ? ' style="opacity:.55"' : ''}>
  <td><b>${esc(r.doc_no || '')}</b>${r.supplier_doc
    ? `<div class="muted" style="font-size:12px">${esc(r.supplier_doc)}</div>` : ''}</td>
  <td>${d8(r.doc_on)}</td>
  <td>${esc(r.supplier || '')}</td>
  <!--  NIMA kelgani ro'yxatda turadi, qatorlar SONI emas: «2 qator»
        degan yozuv nima kelganini aytmasdi va hujjatni ochib
        ko'rishdan boshqa yo'l qolmasdi (vitrina hujjati bilan bir
        xil qoida). -->
  <td>${(r.items || []).map((x) => `${esc(x.product)}${x.color
    ? ` <span class="muted">${esc(x.color)}</span>` : ''} · ${x.qty}`)
    .join('<br>')}</td>
  <td class="num">${r.qty}</td>
  <td class="num">${money(r.amount)}</td>
  <td>${r.status === 'cancelled'
    ? `<span class="tag bad">bekor</span>`
    : (canBuy ? `<button onclick="buyCancel(${r.id}, '${esc(r.doc_no)}')"
        >Bekor qilish</button>` : '')}</td></tr>`;

//  Bekor qilishda sabab SO'RALADI: pulga tegadigan hujjat izsiz
//  yo'qolmaydi (kassadagi operatsiya bilan bir xil qoida).
async function buyCancel(id, no) {
  const sabab = prompt(`${no} — nega bekor qilinmoqda?`);
  if (sabab === null) return;
  if (!sabab.trim()) return toast('Sabab yozilmadi', true);
  try {
    await App.api(`/api/warehouse/fg/receipts/${id}/cancel`,
      { method: 'POST', body: JSON.stringify({ note: sabab.trim() }) });
    toast('Bekor qilindi');
    await loadBuy();
  } catch (e) { toast(e.message, true); }
}

//  Oyna xom ashyo kirimi bilan BIR XIL shaklda: kimdan, qachon, qaysi
//  valyutada — ostida qatorlar, eng pastda jami. Jami saqlashdan OLDIN
//  ko'rinadi: bir nol ortiqcha yozilgani aynan shu yerda bilinadi,
//  ta'minotchining qarzida emas.
function buyOpen() {
  buyLines = [{ product_id: '', qty: '', price: '', color: '' }];
  const bugun = isoDay(new Date());
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="buyBox" onclick="if(event.target===this)buyClose()">
      <div class="modal" style="max-width:720px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h2 style="margin:0">Ta'minotchidan kirim</h2>
          <button onclick="buyClose()">Yopish</button></div>

        <!--  Maydonlar bir xil kenglikdagi panjarada. Uslub SHU YERDA,
              inline: `.grid2` kassa sahifasining o'z uslubi va uni bu
              yerga ko'chirish ikkinchi nusxa bo'lardi. -->
        <div style="display:grid;gap:12px;
          grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
          <div><label>Ta'minotchi</label>
            <select id="bSup">
              <option value="">— tanlang —</option>
              ${(buyRef.suppliers || []).map((x) =>
                `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
            </select>
            ${(buyRef.suppliers || []).length ? '' :
              `<div class="hint">Ta'minot bo'limida ta'minotchi qo'shing</div>`}</div>
          <div><label>Sana</label>
            <input id="bDate" type="date" value="${bugun}"></div>
          <div><label>Ta'minotchining hujjati</label>
            <input id="bDoc" placeholder="nakladnoy raqami — ixtiyoriy"></div>
          <div><label>Valyuta</label>
            <select id="bCcy" onchange="buyCalc()">
              <option value="USD">Dollar</option><option value="UZS">So'm</option>
            </select></div>
          <div id="bRateBox" hidden><label>Kurs, 1$ = so'm</label>
            <input id="bRate" type="number" min="0" step="0.0001" inputmode="decimal"
              value="${buyRef.rate || ''}" oninput="buyCalc()">
            <div class="hint">${buyRef.rate ? 'oxirgi kurs' : ''}</div></div>
        </div>

        <div id="bLines" style="margin-top:14px"></div>
        <button onclick="buyAdd()" style="margin-top:8px">+ Qator</button>

        <div class="row" style="justify-content:space-between;align-items:baseline;
          gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;
          border-top:1px solid var(--line)">
          <div><span class="muted" style="font-size:13px">Jami</span>
            <div id="bSum" style="font-size:26px;font-weight:600">—</div></div>
          <div class="row" style="gap:10px">
            <button class="primary" onclick="buySave()">Saqlash</button>
            <button onclick="buyClose()">Bekor qilish</button></div>
        </div>
      </div></div>`);
  buyDraw();
}

const buyClose = () => { $('buyBox')?.remove(); };
const buyAdd = () => { buyLines.push({ product_id: '', qty: '', price: '', color: '' });
                       buyDraw(); };

function buyDraw() {
  $('bLines').innerHTML = buyLines.map((l, i) => `
    <div class="row" style="gap:8px;align-items:flex-end;margin-bottom:8px;
      flex-wrap:wrap">
      <div style="flex:2;min-width:160px">
        ${i ? '' : '<label>Mahsulot</label>'}
        <select onchange="buySet(${i},'product_id',this.value)">
          <option value="">— tanlang —</option>
          ${(buyRef.rows || []).map((p) => `<option value="${p.id}"${
            String(l.product_id) === String(p.id) ? ' selected' : ''
          }>${esc(p.name)}</option>`).join('')}
        </select></div>
      <div style="flex:1;min-width:90px">
        ${i ? '' : '<label>Rangi</label>'}
        <input value="${esc(l.color || '')}" placeholder="ixtiyoriy"
          oninput="buySet(${i},'color',this.value)"></div>
      <div style="flex:1;min-width:80px">
        ${i ? '' : '<label>Soni</label>'}
        <input type="number" min="1" step="1" inputmode="numeric"
          value="${l.qty}" oninput="buySet(${i},'qty',this.value)"></div>
      <div style="flex:1;min-width:100px">
        ${i ? '' : '<label>Narxi</label>'}
        <input type="number" min="0" step="0.01" inputmode="decimal"
          value="${l.price}" oninput="buySet(${i},'price',this.value)"></div>
      <button class="ic" title="Qatorni olib tashlash"
        onclick="buyDel(${i})">&times;</button>
    </div>`).join('');
  buyCalc();
}

function buySet(i, k, v) { buyLines[i][k] = v; if (k !== 'color') buyCalc(); }
function buyDel(i) {
  //  Oxirgi qator o'chirilmaydi: bo'sh hujjatda saqlaydigan narsa yo'q
  //  va ekranda «+ Qator» dan boshqa hech narsa qolmasdi.
  if (buyLines.length < 2) return;
  buyLines.splice(i, 1); buyDraw();
}

function buyCalc() {
  if (!$('bCcy')) return;
  const so = $('bCcy').value === 'UZS';
  $('bRateBox').hidden = !so;
  const r = Number($('bRate')?.value) || 0;
  let jami = 0;
  for (const l of buyLines) {
    const n = Number(l.qty) || 0, p = Number(l.price) || 0;
    jami += n * (so ? (r > 0 ? p / r : 0) : p);
  }
  $('bSum').innerHTML = jami
    ? `${money(Math.round(jami * 100) / 100)} <span class="muted">$</span>`
    : '<span class="muted">—</span>';
}

async function buySave() {
  const items = buyLines
    .filter((l) => l.product_id && Number(l.qty) > 0)
    .map((l) => ({ product_id: Number(l.product_id), qty: Number(l.qty),
                   price: Number(l.price), color: l.color }));
  if (!items.length) return toast("Qator to'ldirilmadi", true);
  try {
    const r = await App.api('/api/warehouse/fg/receipts', {
      method: 'POST', body: JSON.stringify({
        supplier_id: Number($('bSup').value) || null,
        doc_on: $('bDate').value || null,
        supplier_doc: $('bDoc').value,
        ccy: $('bCcy').value,
        rate: $('bRate')?.value || null,
        items }) });
    buyClose();
    toast(`${r.doc_no} · ${money(r.amount)} $`);
    await loadBuy();
  } catch (e) { toast(e.message, true); }
}

App.start(async () => {
  canAccept = App.can('warehouse.move', 'production.manage');
  canMove = App.can('warehouse.move', 'warehouse.manage', 'production.manage');
  canShip = canMove;
  //  Soni — tarixga tegadigan maydon (CLAUDE.md): faqat administrator
  //  va ishlab chiqarish boshlig'i to'g'rilaydi. Tekshiruv serverda ham.
  canFixQty = App.can('production.manage');
  //  ★ SANOQNI JAVONNI SANAGAN ODAM TO'G'RILAYDI (zavod qarori,
  //  2026-10). Konverni BEKOR qilish va mahsulotini almashtirish
  //  ishlab chiqarishda qolaveradi — ular jurnalga tegadi; SONI esa
  //  javondagi donaning javobi va farqni mudir topadi. Tekshiruv
  //  serverda ham (`POST /api/warehouse/fg/count`): tugmani
  //  ko'rsatish himoya emas.
  canCount = App.can('warehouse.manage', 'production.manage');
  // Ko'chiriladigan omborlar ro'yxati bir marta o'qiladi: har konver
  // uchun so'rov yuborilsa, ro'yxat ochilganda o'nlab so'rov ketardi.
  if (canMove) {
    try { targets = (await App.api('/api/warehouse/targets')).rows; }
    catch { targets = []; }
  }
  canLedger = App.can('warehouse.move', 'warehouse.manage',
                      'production.manage', 'production.reports');
  canBuy = App.can('warehouse.manage', 'production.manage');
  //  Savdo — omborni faqat O'QIYDIGAN odam: unga aylanma emas, qoldiq
  //  kerak (izoh: `faqatQoldiq`).
  savdoKoz = App.can('sales.view', 'sales.manage')
    && !App.can('warehouse.move', 'warehouse.manage', 'production.manage');
  // Telefonda mudir eshik oldida turadi — birinchi ekran qabul qilish
  if (isPhone && canAccept && isTM()) tab = 'inbox';
  // Qabul qilish ro'yxati tabda raqam bo'lib turishi uchun oldindan
  // o'qiladi — ochilmasa ham mudir kutayotgan borligini ko'radi.
  if (canAccept && isTM()) rows = await App.api('/api/units/stock/inbox');
  // Chiqariladiganlar soni tabda turadi: mudir ochmasa ham kutayotgan
  // buyurtma borligini ko'radi.
  if (canShip && isTM()) {
    try { ship = (await App.api('/api/sales/shipping')).rows; } catch { ship = []; }
  }
  drawTabs();
  await (tab === 'inbox' ? draw() : loadStock());
}, 'warehouse.view', 'production.view');
</script>
</body>
</html>
