<!--  ★ QOG'OZ O'ZI AYTIB TURADI (zavod qarori, 2026-10). Inventarizatsiya
      varag'i javon oldiga olib boriladi va u yerda ekran yo'q: varaqning

<script>
// ============================================================================
//  TAYYOR MAHSULOT OMBORI — QABUL QILISH
//
//  Qadoqlash tsexi «T/M omborga jo'natdim» deydi; mahsulot hali o'sha
//  yerda, qadoqlash tsexining javobgarligida turadi. Ombor mudiri uni
//  ko'zi bilan ko'rib «qabul qildim» deydi — faqat shundan keyin:
//    · ombor qoldig'iga tushadi
//    · ishlab chiqarish jurnalidan chiqadi
//
//  Ikki bosqich tsexlar orasidagi bilan bir xil sababdan: bitta tugma
//  bitta sana beradi, ikkita tugma esa ikkita — va ular orasidagi farq
//  mahsulot qancha kutib turganini ko'rsatadi.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Telefonda — qabul qilish, kompyuterda — qoldiq. Mudir telefonni
// omborning eshigida, mahsulot kelganda ochadi: unga kerakli birinchi
// ekran «qabul qildim» tugmasi. Stol ustidagi kompyuterda esa u qoldiqni
// ko'radi — nimadan nechta borligini.
const isPhone = window.matchMedia('(max-width: 620px)').matches;

//  Korxona nomi — zavodning O'Z nomi, mijoz ma'lumoti emas: kodda
//  bitta qator bo'lib turadi (yuk xati bilan bir xil).
const FIRMA = 'ZELTA PREMIUM';

//  Qaysi ombor ochilgan — manzilda (`?w=VITR-ABU`). Ko'rsatilmasa T/M
//  ombor: eski havolalar va telefondagi yorliqlar shundan buzilmaydi.
//  Kod har so'rovga qo'shiladi, shunda qoldiq, tarix va Excel bitta
//  ombor haqida gapiradi.
const WH = new URLSearchParams(location.search).get('w') || '';
const wq = (p) => { if (WH) p.set('w', WH); return p; };
let whName = '';
let canMove = false, canFixQty = false, canCount = false, targets = [];
//  ★ SAVDOGA FAQAT QOLDIQ (zavod qarori, 2026-09).
//
//  Ombor mudirining savoli AYLANMA: bugun nima keldi, nima chiqdi,
//  nechtasi bronda va javonda nechta qoldi. Savdo xodimining savoli
//  esa BITTA: mijozga hozir nechtasini va'da qila olaman. Javob ham
//  bitta raqam — bronni ayirgandagi qoldiq: bronda turgani boshqa
//  mijozniki va uni ikkinchi marta sotib bo'lmaydi.
//
//  Ilgari savdo to'rtta ustunni ko'rardi va ularning ichidan o'zining
//  javobini qidirib o'tirardi — ustiga «Qoldiq» ustuni JISMONAN
//  turganini ko'rsatardi, ya'ni bronda turganini ham. Menejer o'sha
//  raqamni bo'sh deb o'qib, allaqachon va'da qilingan mahsulotni
//  ikkinchi marta va'da qilardi.
//
//  Chegara HUQUQDAN chiqadi, lavozimdan emas (4-qoida): omborga
//  YOZADIGAN odamda (mudir, ishlab chiqarish) aylanma qolaveradi.
//  Bu KO'RINISH, himoya emas — server baribir o'sha raqamlarni
//  beradi va Excelga chiqarish ham to'la bo'ladi.
let savdoKoz = false;
const faqatQoldiq = () => savdoKoz && isTM();
//  ★ «QOLDIQ» BITTA NARSANI ANGLAYDI: bronni ayirgandagi, ya'ni
//  sotish mumkin bo'lgani. Ilgari u IKKI xil edi — savdoda bo'sh
//  qoldiq, mudirda esa javondagi JISMONIY soni; bitta so'z ikki
//  raqamni ataydi va ikki odam bir-biriga «qoldiq nechta» deb
//  telefon qilganda har biri o'zinikini aytardi.
//
//  Mudirga jismoniy soni ham kerak (inventarizatsiyada javondagi
//  dona shu bilan solishtiriladi).
//
//  ★ «BRONSIZ QOLDIQ» OLIB TASHLANDI (zavod qarori, 2026-10) va
//  «Qoldiq» yagona ustun bo'lib qoldi: u javonda JISMONAN turganini
//  aytadi. Ikkita qoldiq ustuni yonma-yon turgani savolni oson
//  qilmadi, qiyin qildi — mudir ham, menejer ham har safar qaysi
//  biri o'ziniki ekanini ajratib o'qishi kerak edi. Sotish mumkin
//  bo'lgani yo'qolmadi: u QOLDIQ bilan BRONDA ning ayirmasi va
//  ikkala raqam ham yonma-yon turadi.

//  ★ «FAQAT FAKT» — JAVONDA TURGANI (zavod qarori, 2026-10).
//
//  Qoldiq jadvali IKKI manbadan yig'iladi: hozir javonda turgani va
//  tanlangan oraliqda QIMIRLAGANI (izoh: `yoqIzoh`). Mudirning kunlik
//  savoliga bu to'g'ri javob — «davr ichida nima o'tdi» — lekin
//  INVENTARIZATSIYA boshqa savol: javonda nima turibdi. Varaq javon
//  oldiga olib boriladi va unda qoldig'i nol qator faqat xalaqit
//  beradi: sanaydigan odam har safar «buni ham sanaymanmi» deb
//  to'xtaydi.
//
//  Shuning uchun belgi qo'yilsa AYLANMA umuman chizilmaydi —
//  ustunlari ham, kartochkalari ham. Ikkalasi bir varaqda tursa
//  qator «kirdi 40, qoldiq 0» bo'lib, sanoq varag'i yana savol
//  beradigan hujjatga aylanardi. Qoldiq, bron va summa esa HOZIRGI
//  holat, ya'ni ular oraliqdan qat'i nazar to'g'ri va o'z joyida
//  qoladi — yig'indi ham o'sha manbadan keladi.
let faktOnly = false;
//  Aylanma ustunlari: savdoga umuman chizilmaydi (izoh:
//  `faqatQoldiq`), inventarizatsiya varag'ida esa vaqtincha yopiladi.
const aylKor = () => !faqatQoldiq() && !faktOnly;

//  ★ QOLDIQ ORALIQQA ERGASHADI (zavod qarori, 2026-10). Ilgari ikkita
//  ustun turardi: «Qoldiq» — bugungi, «Oraliq oxiriga» — tanlangan
//  kunniki. Niyat to'g'ri edi, natijasi esa yo'q: sana filtri
//  qo'yilgandan keyin mudirga BIR raqam kerak, ikkitasi emas — va
//  yonma-yon turgan ikki son har safar «qaysi biri menikidir» degan
//  savolni berardi. Jadvalda to'qqizta ustun bo'lib, javob ularning
//  orasida yo'qolardi.
//
//  Endi ustun BITTA va u savolga ergashadi: oraliq tanlanmagan
//  bo'lsa bugungi qoldiq, tanlangan bo'lsa O'SHA KUNNING oxiridagi
//  qoldiq. Shakl ham shundan to'liq bo'ladi:
//
//      kirdi − chiqdi = qoldiqning o'zgarishi
//
//  Yozilishi BITTA joyda: jadval, JAMI qatori, kartochka va saralash
//  to'rttasi ham shundan o'qiydi — ikki nusxada bo'lsa biri ertaga
//  ikkinchisidan ajralib, ekrandagi ustun o'z yig'indisiga mos
//  kelmay qolardi.
const davrKor = () => aylKor() && !!(stock && (stock.from || stock.to));
const qoldiqVal = (r) => Number(davrKor() ? r.oxir : r.qty) || 0;
//  Bronda — HOZIRGI holat, ya'ni «faqat fakt» da ham qoladi: javonda
//  turgan mahsulotning qanchasi mijozniki ekani sanoqda ham kerak.
//
//  ★ SAVDOGA HAM CHIZILADI (zavod qarori, 2026-10). «Bronsiz qoldiq»
//  ustuni olib tashlandi, ya'ni menejer endi javondagi JISMONIY
//  sonni ko'radi — va bron ko'rsatilmasa o'sha raqamni bo'sh deb
//  o'qib, boshqa mijozga va'da qilingan mahsulotni ikkinchi marta
//  va'da qilardi. Ikki raqam yonma-yon tursa javob o'zi chiqadi:
//  «10 qoldiq, 6 bronda».
const bronUstun = () => isTM();
//  Ochilgan qator ostidagi katak butun kenglikni egallaydi. Ustunlar
//  shartga qarab paydo bo'lib yo'qoladi, shuning uchun soni BITTA
//  joyda sanaladi: ikki nusxada bo'lsa biri ertaga ikkinchisidan
//  ajralib, konver ro'yxati jadvalni surib yuborardi.
const ustunSoni = () => 4 + (aylKor() ? 2 : 0)
  + 1 + (bronUstun() ? 1 : 0) + (isTM() ? 0 : 2);
//  Huquqlar App.start() ICHIDA o'qiladi: undan oldin sessiya hali
//  yuklanmagan va App.can() hamma narsaga «yo'q» deydi.
//
//  canAccept — qabul qilish ombor mudirining ishi; savdoda bu huquq
//  yo'q, shuning uchun unga tab umuman ko'rsatilmaydi: tugmasi
//  ishlamaydigan ro'yxat «nega bosilmayapti» degan savol tug'diradi.
//
//  canLedger — kirim/chiqim tarixi omborni yurituvchi va rahbariyat
//  uchun. Savdoga qoldiq yetarli: unga nima sotishga tayyor turgani
//  kerak, o'sha mahsulot omborga qachon kirgani emas.
let rows = [], tab = 'stock', canAccept = false, canLedger = false;
//  canBuy — ta'minotchidan keladigan TAYYOR mahsulot (matras) kirimi.
//  Molni T/M ombor mudiri qabul qiladi va hujjatni o'zi yozadi: javonni
//  u sanaydi (izoh: sql/warehouse.sql).
let canBuy = false, buyRef = null, buyRows = [], buyLines = [];
//  Chiqariladigan buyurtmalar: savdo «mijozga chiqarilsin» deganlari.
//  Boshqa buyurtmalar bu yerda UMUMAN ko'rinmaydi — ular hali
//  savdoning qo'lida va mudirning ishi emas. Mudir
//  mashinaga ortilganini ko'zi bilan ko'rib tasdiqlaydi.
let ship = [], canShip = false, kun = null;
//  Jo'natish ro'yxatining filtri. Mudirda ertalab o'nlab buyurtma
//  turadi va savoli aniq: «bugun nima chiqadi», «falonchining zakazi
//  qaysi», «Z-638 qayerda». Ro'yxat kichik — filtr KLIENTDA ishlaydi,
//  serverga qayta so'rov ketmaydi va yozgan zahoti javob beradi.
const shipF = { from: '', to: '', customer: '', q: '' };
const picked = new Set();
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const d8 = v => !v ? '—' : (s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`)(String(v).slice(0,10));
// Narx kasrli bo'lishi mumkin (o'rtacha), summa esa odatda butun.
// Ikkitadan ortiq kasr raqam ko'rsatilmaydi — u hech narsa aytmaydi.
const money = v => v == null ? ''
  : Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 2 });

// Kirganda qoldiq ochiladi — «nimadan nechta bor» kunlik savol.
// Qabul qilish yonida nechta kutayotgani turadi, aks holda ombor
// qoldiqni ochib, kutayotgan mahsulotni ko'rmay qolishi mumkin.
const ALL_TABS = [['stock', 'Qoldiq'], ['inbox', 'Qabul qilish'],
                  ['ship', "Jo'natish"], ['buy', 'Kirim'], ['moves', 'Harakat']];
//  «Qabul qilish» faqat T/M omborda: ishlab chiqarish vitrinaga
//  to'g'ridan-to'g'ri topshirmaydi, mahsulot u yerga T/M ombordan
//  ko'chiriladi.
const isTM = () => !WH || WH === 'TM';
const tabs = () => ALL_TABS.filter(([k]) => (k !== 'inbox' || (canAccept && isTM()))
                                         && (k !== 'ship' || (canShip && isTM()))
                                         //  Kirim faqat T/M omborda: mol
                                         //  ta'minotchidan ZAVODGA keladi,
                                         //  vitrinaga esa u T/M dan
                                         //  omborlar aro hujjat bilan boradi.
                                         && (k !== 'buy' || (canBuy && isTM()))
                                         && (k !== 'moves' || canLedger));
function drawTabs() {
  // Bitta tab — tab emas: tanlash imkoni yo'q qator faqat joy egallaydi.
  const T = tabs();
  if (T.length < 2) { $('tabs').innerHTML = ''; return; }
  $('tabs').innerHTML = T.map(([k, t]) =>
    `<button ${k === tab ? 'class="primary"' : ''} onclick="go('${k}')">${t}${
      k === 'inbox' && rows.length ? ` <b>${rows.length}</b>` : ''}${
      k === 'ship' && ship.length ? ` <b>${ship.length}</b>` : ''}</button>`).join('');
}
async function go(k) {
  tab = k; drawTabs();
  //  Qog'ozdagi sarlavha chop etishdan OLDIN to'ldiriladi, ya'ni
  //  boshqa tabga o'tilgach eskisi osilib qolardi: Ctrl+P bosgan
  //  odam qoldiq sarlavhasi bilan harakatlar ro'yxatini chiqarardi.
  $('printHead').innerHTML = '';
  $('body').innerHTML = `<p class="muted">Yuklanmoqda…</p>`;
  if (k === 'inbox') return load();
  if (k === 'stock') return loadStock();
  if (k === 'ship') return loadShip();
  if (k === 'buy') return loadBuy();
  return loadMoves();
}

//  Sahifa sarlavhasi ombor nomi bilan almashadi: uchta vitrina va T/M
//  ombor bitta sahifadan ochiladi va qaysi birida turganini ko'rish
//  kerak — brauzer tabida ham.
function setTitle(name) {
  if (!name || name === whName) return;
  whName = name;
  document.querySelector('.top h1').textContent = name;
  document.title = name + ' \u00b7 ZELTA';
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// Necha kun kutib turganini ko'rsatamiz: uzoq turgani ombor bilan
// qadoqlash orasida uzilish borligini bildiradi.
function waited(d) {
  if (d == null) return '';
  if (d === 0) return `<span class="tag">bugun</span>`;
  return `<span class="tag ${d > 2 ? 'bad' : 'warn'}">${d} kun kutmoqda</span>`;
}

function draw() {
  if (!rows.length) {
    $('body').innerHTML = `<div class="card"><h2>Qabul qilinadigan mahsulot yo'q</h2>
      <p class="muted" style="margin-top:8px">Qadoqlash tsexi «T/M omborga jo'natdim»
      deganda mahsulot shu yerda paydo bo'ladi.</p></div>`;
    return;
  }
  const sel = rows.filter(r => picked.has(r.id)).length;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="row" style="gap:10px">
          <h2 style="margin:0">Qabul qilish</h2>
          <span class="muted" style="font-size:13px">${rows.length} ta</span>
        </div>
        ${canAccept && rows.length > 1 ? `<button ${sel ? 'class="primary"' : ''}
          onclick="bulk()">${sel ? `${sel} tasini qabul qilish` : 'Hammasini tanlash'}</button>` : ''}
      </div>
      <table class="board">
        <thead><tr>
          <th class="c-sel"></th><th class="c-no">Konveyer &#8470;</th>
          <th class="c-name">Nomi</th><th class="c-type">Turi</th>
          <th class="c-qty num">Soni</th><th class="c-due">Kutmoqda</th><th class="c-act"></th>
        </tr></thead>
        <!--  Soni katagida «N buyurtmada» turadi — jurnaldagi bilan bir
              xil, bitta jadvaldan hisoblanadi. Qabul qiluvchining ishi
              navbat tuzish: ichida mijoz kutayotgan konver avval qabul
              qilinsa, o'sha kuniyoq chiqarib yuboriladi. -->
        <tbody>${rows.map(r => `
          <tr>
            <td class="c-sel">${canAccept ? `<input type="checkbox" style="width:auto"
              ${picked.has(r.id) ? 'checked' : ''} onchange="pick(${r.id},this.checked)">` : ''}</td>
            <td class="c-no"><b>${esc(r.conveyor_no)}</b></td>
            <td class="c-name">${esc(r.product)}${r.color
              ? `<div class="muted" style="font-size:12px">${esc(r.color)}</div>` : ''}</td>
            <td class="c-type muted">${esc(r.product_type || '')}</td>
            <td class="c-qty num">${r.qty}${r.booked_qty
              ? `<div class="new-bron" style="font-size:11.5px">${
                  r.booked_qty} buyurtmada</div>` : ''}</td>
            <td class="c-due">${waited(r.days_waiting)}${r.booked_qty && r.kim
              ? `<div style="font-size:12px"><b>${esc(r.kim)}</b> kutmoqda</div>` : ''}
              <div class="muted" style="font-size:12px">${
                r.handover_on ? d8(r.handover_on) + " jo'natilgan" : ''}${
                r.sent_by ? ' \u00b7 ' + esc(r.sent_by) : ''}</div></td>
            <!--  ★ UCHTA AMAL. «Qabul qildim» — hammasi; «qismi» —
                  javonga nechtasi qo'yilgani (qolgani ro'yxatda
                  qolaveradi); «↩» — tsexga qaytarish: mahsulot
                  kelmagan bo'lsa qator ombor ro'yxatida osilib
                  qolmasin. Ikkinchi ikkitasi kichik: ular kunda bir
                  marta kerak bo'ladigan tuzatish, asosiy amal emas. -->
            <td class="c-act">${canAccept ? `
              <button class="primary" onclick="accept([{unit_id:${r.id}}])">Qabul qildim</button>
              ${r.qty > 1 ? `<button class="ic" title="Bir qismini qabul qilish"
                onclick="askQty(${r.id})">qismi</button>` : ''}
              <button class="ic" title="Tsexga qaytarish — mahsulot kelmagan"
                onclick="qaytar(${r.id})">&#8629;</button>` : ''}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function pick(id, on) { on ? picked.add(id) : picked.delete(id); draw(); }

async function accept(items) {
  try {
    await App.api('/api/units/stock/accept', {
      method: 'POST', body: JSON.stringify({ items }) });
    toast(items.length === 1 ? 'Qabul qilindi'
      : `${items.length} ta mahsulot qabul qilindi`);
    picked.clear();
    await load();
  } catch (e) { toast(e.message, true); }
}

//  ★ BIR QISMINI QABUL QILISH. Qadoqlash «10 ta jo'natdim» deydi,
//  javonga esa 2 tasi qo'yiladi. Konver bo'linadi: qabul qilingani
//  qoldiqqa tushadi, qolgani shu ro'yxatda «jo'natilgan» bo'lib
//  turaveradi — ya'ni ikkala raqam ham to'g'ri bo'ladi.
function askQty(id) {
  const r = rows.find(x => x.id === id);
  if (!r) return;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="qtyBox" onclick="if(event.target===this)closeQty()">
      <div class="modal" style="max-width:360px">
        <h2 style="margin-bottom:4px">${esc(r.conveyor_no)}</h2>
        <p class="muted" style="font-size:13px;margin-bottom:16px">${esc(r.product)} ·
          jo'natilgani <b>${r.qty} ta</b></p>
        <label>Nechtasi javonga qo'yildi?</label>
        <input id="qtyVal" type="number" inputmode="numeric" min="1" max="${r.qty}"
               value="${r.qty > 1 ? r.qty - 1 : 1}"
               style="text-align:center;font-size:22px">
        <p class="muted" style="font-size:12px;margin-top:8px">Qolgani ro'yxatda
          qoladi — kelganda qabul qilinadi.</p>
        <button class="primary" style="width:100%;margin-top:14px"
          onclick="okQty(${id}, ${r.qty})">Qabul qildim</button>
        <button style="width:100%;margin-top:8px" onclick="closeQty()">Bekor qilish</button>
      </div>
    </div>`);
  setTimeout(() => $('qtyVal')?.select(), 50);
}

const closeQty = () => $('qtyBox')?.remove();

function okQty(id, max) {
  const n = Number($('qtyVal').value);
  if (!Number.isInteger(n) || n < 1 || n > max)
    return toast(`1 dan ${max} gacha son kiriting`, true);
  closeQty();
  accept([{ unit_id: id, qty: n }]);
}

//  ★ TSEXGA QAYTARISH. Qadoqlash «jo'natdim» deb bosgan, lekin
//  mahsulot omborga kelmagan: adashib bosilgan yoki tsex uni qaytarib
//  olgan. Ilgari qator ombor ro'yxatida osilib qolardi — mudir uni
//  qabul qila olmasdi (mahsulot yo'q) va olib ham tashlay olmasdi.
//  Mahsulot joyidan qimirlamaydi: faqat «jo'natilgan» belgisi o'chadi
//  va konver tsex ekraniga qaytadi.
async function qaytar(id) {
  const r = rows.find(x => x.id === id);
  if (!confirm(`${r ? r.conveyor_no : 'Konver'} tsexga qaytarilsinmi?\n`
    + `Mahsulot joyidan qimirlamaydi — «jo'natilgan» belgisi o'chadi.`)) return;
  try {
    await App.api('/api/units/stock/return',
      { method: 'POST', body: JSON.stringify({ items: [id] }) });
    toast('Tsexga qaytarildi');
    picked.delete(id);
    await load();
  } catch (e) { toast(e.message, true); }
}

function bulk() {
  const sel = rows.filter(r => picked.has(r.id)).map(r => ({ unit_id: r.id }));
  if (!sel.length) { rows.forEach(r => picked.add(r.id)); return draw(); }
  accept(sel);
}

async function load() {
  rows = await App.api('/api/units/stock/inbox');
  drawTabs();          // qabul qilingach tabdagi raqam ham kamayadi
  draw();
}

// ═══════════════════════════════════════════════════════════ QOLDIQ
//
//  Ikki qavat, chunki ikki xil savol beriladi:
//
//    1. «Nimadan nechta bor?» — mahsulot turi, rangi, matosi bo'yicha
//       jamlanma jadval. Ombor mudiri kunda shuni ochadi.
//    2. «Qaysi biri?» — qatorni bosganda o'sha rang-matodagi KONVER
//       raqamlari chiqadi. Shikoyat kelganda javob shu yerdan topiladi.
//
//  Sana oralig'i omborga QABUL QILINGAN kun bo'yicha: «shu oraliqda
//  kirgan va hozir ham turganlari».
let stock = null;
const openRows = new Map();   // kalit → konverlar (bir marta yuklanadi)

const rowKey = r => `${r.product_id}|${r.color || ''}|${r.fabric || ''}`;

//  Tanlangan turlar. Bir nechtasi birdan tanlanadi — «penal va kamod
//  nechta qoldi» degan savol zavodda bitta turnikidan ko'proq beriladi.
//  Shuning uchun ro'yxat emas, bosiladigan chiplar: ikkinchisini tanlash
//  uchun Ctrl ushlab turish kerak bo'lmasin.
//
//  Mahsulot bo'yicha alohida filtr YO'Q: turlar beshta, mahsulot esa
//  o'nlab — har biriga chip qo'yilsa filtr jadvaldan uzun bo'lib
//  ketardi. Aniq mahsulot kerak bo'lsa qidiruv maydoni bor.
const sel = { type: new Set() };

function stockParams() {
  const p = wq(new URLSearchParams());
  const q = $('sQ')?.value.trim();     if (q) p.set('q', q);
  const f = $('sFrom')?.value;         if (f) p.set('from', f);
  const t = $('sTo')?.value;           if (t) p.set('to', t);
  if (sel.type.size) p.set('product_type', [...sel.type].join(','));
  return p.toString();
}

//  Turlar: nechtasi tanlansa, hammasi ko'rsatiladi. Yonida qoldig'i —
//  qaysi turdan nima borligi tanlashdan oldin ko'rinsin.
function typeChips(d) {
  const list = d.facets || [];
  // Bitta tur bo'lsa chip ham kerak emas: tanlash imkoni yo'q qator
  // faqat joy egallaydi.
  if (list.length < 2) return '';
  return list.map(f =>
    `<button class="${sel.type.has(f.product_type) ? 'primary' : ''}"
       onclick="toggleType('${esc(f.product_type)}')"
       >${esc(f.product_type)} <b>${f.qty}</b></button>`).join('');
}

function toggleType(t) {
  sel.type.has(t) ? sel.type.delete(t) : sel.type.add(t);
  loadStock();
}

//  ★ SARALASH KLIENTDA (zavod qarori, 2026-09). Qoldiq so'rovida
//  LIMIT yo'q — sahifada qatorlarning HAMMASI turadi, ya'ni sarlavha
//  bosilgan zahoti javob beradi va serverga ikkinchi marta borilmaydi.
//  JURNALDA teskari va sababi ham teskari: u 500 qator bilan
//  cheklangan, ya'ni faqat ko'rinib turganini saralash noto'g'ri
//  javob berardi va saralash u yerda SERVERDA qoladi.
//
//  Ustunlar: matnniki nomi bilan, raqamniki qiymati bilan. Aylanma
//  ustunlari («kirdi») tanlangan ORALIQNIKI — saralash ham o'sha
//  raqam bo'yicha bo'ladi va boshqa savolga javob bermaydi.
const SORT = {
  product: r => r.product,
  type:    r => r.product_type,
  color:   r => r.color,
  fabric:  r => r.fabric,
  kirdi:   r => +r.kirdi,
  chiqdi:  r => +r.chiqdi,
  bron:    r => +r.bron,
  //  «Qoldiq» ekranda nima tursa — o'shanikidir: oraliq tanlangan
  //  bo'lsa o'sha kunniki, aks holda bugungi (izoh: `qoldiqVal`).
  qoldiq:  r => qoldiqVal(r),
  narx:    r => narx(r),
  //  ★ IKKI XIL «—», ikki xil saralash. Aylanma ustunlarida nol
  //  HAQIQIY javob («bron qo'yilmagan») va o'z joyida turadi.
  //  Summada esa u NOMA'LUM: narxi yozilmagan konverning summasi
  //  nol emas — ekranda ham «—» bo'lib turadi (izoh: `drawStockRow`).
  //  Nol deb saralansa o'sishiga bosganda u eng arzon bo'lib tepaga
  //  chiqardi va yolg'on javob berardi, shuning uchun bo'sh katak
  //  qoidasiga tushadi: har doim oxirida.
  summa:   r => Number(r.amount) || null,
};
//  Raqamli ustunda birinchi bosish KO'PDAN kichikka: savol «qaysi
//  mahsulot ko'p turibdi» va eng kichik qatorni tepaga chiqarish
//  javobni ikkinchi bosishga surardi. Matnda esa A→Z.
const RAQAM = new Set(['kirdi', 'chiqdi', 'qoldiq', 'bron',
                       'narx', 'summa']);

//  Standarti — SERVERNIKI (mahsulot · turi · rang · mato). Sahifa
//  ochilganda hech narsa saralanmaydi: mudir kechagi tartibni
//  o'sha joyidan topadi (xodimlar ro'yxati bilan bir xil qoida).
let sortK = null, sortAsc = true;

function sortSet(k) {
  if (sortK === k) sortAsc = !sortAsc;
  else { sortK = k; sortAsc = !RAQAM.has(k); }
  //  Terilgan, lekin hali yuborilmagan qidiruv yo'qolmasin: sahifa
  //  butunlay qayta chiziladi va katak `stock.q` dan to'ladi.
  if ($('sQ')) stock.q = $('sQ').value;
  drawStock();
}

//  ★ SAVDOGA NOL QATOR CHIZILMAYDI (zavod qarori, 2026-10). Qator
//  ikki manbadan tushadi va davr ichida kirib-chiqib ketgani ham o'z
//  qatorida turadi (izoh: `yoqIzoh`). MUDIRGA bu javob: aylanma
//  ustunlari yonida turadi va «bugun nima o'tdi» degan savolni o'qiydi.
//
//  SAVDOGA esa o'sha ustunlar umuman chizilmaydi (izoh: `faqatQoldiq`),
//  ya'ni qatorda yagona raqam «Qoldiq 0» bo'lib qolardi va u hech
//  narsani tushuntirmasdi — menejer javonda yo'q mahsulotni
//  ro'yxatda ko'rib, nega turganini bilmasdi. Uning savoli bitta:
//  mijozga hozir nechtasini va'da qila olaman.
//
//  Bu KO'RINISH, himoya emas: server baribir o'sha qatorlarni beradi
//  va yuqoridagi kartochkalar ham o'zgarmaydi — nol qator
//  yig'indiga baribir nol qo'shadi.
//  «Faqat fakt» ham AYNAN shu shartdan o'tadi: ikkalasining savoli
//  bitta — «javonda bormi» — va ikki xil shart yozilsa biri
//  ertaga ikkinchisidan ajralib ketardi.
const javonda = r => Number(r.qty) || Number(r.bron);
const korinadigan = rows => (faqatQoldiq() || faktOnly)
  ? rows.filter(javonda) : rows;

function saralangan(rows) {
  if (!sortK || !SORT[sortK]) return rows;
  const qiy = SORT[sortK], yon = sortAsc ? 1 : -1;
  //  Nusxa olinadi: `sort` massivning O'ZINI o'zgartiradi va server
  //  bergan tartib yo'qolardi — u esa standart tartib, ya'ni qaytib
  //  kelishi kerak.
  //
  //  Teng qiymatlar SERVER tartibida qoladi (`Array.sort` barqaror),
  //  shuning uchun ikkinchi darajali kalit yozilmadi: «Turi» bo'yicha
  //  saralanganda ichidagilar mahsulot nomi bo'yicha turaveradi va
  //  qatorlar har bosishda joyini almashtirmaydi.
  return rows.slice().sort((a, b) => {
    const x = qiy(a), y = qiy(b);
    //  ★ BO'SH KATAK HAR DOIM OXIRIDA, yo'nalishdan qat'i nazar
    //  (xodimlar ro'yxati bilan bir xil qoida): rangi yozilmagan
    //  o'nta qator tepaga chiqsa javob ko'rinmasdi, bo'shni
    //  qidirayotgan odam esa ularni oxirida birga topadi.
    //
    //  NOL bo'sh EMAS: «bronda 0» — haqiqiy javob va o'z joyida
    //  turadi, aks holda bron qo'yilmagan mahsulot ro'yxat
    //  oxiriga tushib ketardi.
    const bx = x == null || x === '', by = y == null || y === '';
    if (bx !== by) return bx ? 1 : -1;
    if (bx) return 0;
    return (typeof x === 'number' ? x - y
      : String(x).localeCompare(String(y), 'uz')) * yon;
  });
}

//  Sarlavha katagi: nomi, saralash o'qi va bosilganda yo'nalishi.
const th = (k, cls, nom) => `<th class="${cls}" onclick="sortSet('${k}')">${
  nom}<span style="opacity:.45">${
  sortK === k ? (sortAsc ? ' \u25b2' : ' \u25bc') : ''}</span></th>`;

//  ★ KARTOCHKADAGI RAQAM O'LCHOV BIRLIGI BO'YICHA (CLAUDE.md): stul
//  DONA, penal KOMPLEKT — ularni bitta yig'indiga qo'shib bo'lmaydi,
//  «22» degan raqam nimani anglashi noma'lum qolardi. Beshta
//  kartochka beshta joyda bir xil chizilishi kerak, shuning uchun
//  yozilishi BITTA joyda: ikki nusxada bo'lsa biri ertaga
//  ikkinchisidan ajralib ketardi.
//
//  Nol ham yoziladi: bo'sh kartochka «hisoblanmadi» degan savol
//  qoldirardi, nol esa javob — bu oraliqda hech narsa kelmagan.
function uomKpi(d, kalit) {
  const bor = (d.total.by_uom || []).filter((x) => Number(x[kalit]));
  return bor.length
    ? bor.map((x) => `${x[kalit]}<small> ${esc(x.uom)}</small>`).join(' \u00b7 ')
    : String(d.total[kalit] ?? 0);
}

//  Aylanma kartochkasi QAYSI oraliqniki ekanini o'zi aytadi — aks

//  Qator + (ochilgan bo'lsa) uning konverlari. Konverlar ostidagi qator
//  jadvalning o'zida turadi — alohida oyna ochilsa mudir qaysi qatordan
//  kelganini yo'qotadi.
//  Qatordagi narx. Bir xil mahsulot turli narxda kirgan bo'lsa bitta
//  «to'g'ri» raqam yo'q — shunda o'rtacha ko'rsatiladi va «o'rt.» deb
//  belgilanadi. Narxsiz konverlar bo'lsa summa ham to'liq emas, shuning
//  uchun chiziqcha: bo'sh katak savol berdiradi, yolg'on raqam bermaydi.
//  Raqamning O'ZI alohida: uni saralash ham o'qiydi va ekranda
//  turgan bilan BIR XIL bo'lishi kerak — ikki nusxada bo'lsa
//  «narx bo'yicha» saralangan ro'yxat o'z ustuniga mos kelmasdi.
function narx(r) {
  if (r.price_min == null) return null;
  return Number(r.price_min) === Number(r.price_max)
    ? Number(r.price_min) : (Number(r.amount) / (Number(r.qty) || 1));
}
function price(r) {
  const v = narx(r);
  if (v == null) return '<span class="muted">\u2014</span>';
  return money(v) + (Number(r.price_min) === Number(r.price_max) ? ''
    : ` <span class="muted" style="font-size:11px">o'rt.</span>`);
}

//  Jadval ostidagi JAMI. O'lchov birligi bo'yicha ajratiladi: stul
//  DONA bilan, penal/kamod/sp/stol KOMPLEKT bilan sanaladi va ularni
//  bitta raqamga qo'shib bo'lmaydi — «22» degan yig'indi nimani
//  anglatishi noma'lum bo'lib qolardi (CLAUDE.md).
function jamiRows(d) {
  //  Savdoda qator FAQAT bo'sh qoldig'i borida turadi: hammasi
  //  bronda bo'lgan mahsulot unga sotiladigan narsa emas.
  //  Sanoq varag'ida faqat javonda turgani: aylanma ustunlari
  //  chizilmagan joyda ular bo'yicha qator qoldirish «nimaning
  //  jamisi» degan savol berardi.
  const u = (d.total.by_uom || []).filter(x => faqatQoldiq() || faktOnly
    ? qoldiqVal(x) : (qoldiqVal(x) || x.kirdi || x.chiqdi));
  if (!u.length) return '';
  const son = (v) => v ? `<b>${v}</b>` : '<span class="muted">\u2014</span>';
  return u.map((x, i) => `<tr>
    <td class="s-name">${i === 0 ? 'JAMI' : ''}</td>
    <td class="s-type muted">${esc(x.uom)}</td>
    <td class="s-color"></td><td class="s-fabric"></td>
    ${!aylKor() ? '' : `<td class="s-in">${son(x.kirdi)}</td>
    <td class="s-out">${son(x.chiqdi)}</td>`}
    <td class="s-qty"><b>${qoldiqVal(x)}</b> <span class="muted"
      style="font-size:11px">${esc(x.uom)}</span></td>
    ${bronUstun() ? `<td class="s-bron">${son(x.bron)}</td>` : ''}
    ${isTM() ? '' : `<td class="s-price"></td>
      <td class="s-amount">${i === 0 && Number(d.total.amount)
        ? `<b>${money(d.total.amount)}</b>` : ''}</td>`}
  </tr>`).join('');
}

//  ★ BO'SH QATOR SAVOL QOLDIRMAYDI (zavod qarori, 2026-10). Qoldiq
//  jadvali IKKI manbadan yig'iladi: hozir javonda turgani
//  (`v_fg_units`) va tanlangan oraliqda QIMIRLAGANI (`v_fg_moves`).
//  Shuning uchun kelib, o'sha oraliqning O'ZIDA chiqib ketgan mahsulot
//  ham o'z qatorida turadi — qoldig'i nol bo'lgani holda, va bu
//  to'g'ri: «davr ichida nima o'tdi» degan savolga javob kerak.
//
//  Qator ochilganda esa konver ro'yxati BO'SH chiqadi: u HOZIR javonda
//  turganini o'qiydi va o'sha konver allaqachon ketgan. Ilgari o'sha
//  joyda bitta «—» turardi va u hech narsa aytmasdi — mudir
//  «qanday qilib qo'shilgan, konver raqami ham yo'q» degan savol bilan
//  qolardi. Endi SABABI yoziladi: bo'sh katak bu yerda javob emas,
//  savol (xom ashyodagi «bo'sh qator savol, yo'q qator yolg'on» bilan
//  bir xil qoida).
//
//  Qaysi konver ekani «Harakat» tabida turadi, shuning uchun izohda
//  o'sha yo'l ko'rsatiladi — lekin faqat tarixi ochiq xodimga:
//  savdoga ko'rinmaydigan tabga yo'llash javobsiz savol bo'lardi.
function yoqIzoh(r) {
  const kirdi = Number(r.kirdi) || 0, chiqdi = Number(r.chiqdi) || 0;
  const sabab = kirdi && chiqdi ? 'oraliqda kirib, chiqib ketgan'
              : chiqdi          ? 'oraliqda chiqib ketgan'
              : kirdi           ? "kirgani keyin bekor qilingan yoki boshqa omborga ko'chgan"
              :                   '';
  return `<span class="muted">Hozir omborda yo'q${sabab ? ' \u2014 ' + sabab : ''}.${
    canLedger ? ' Qaysi konver ekani \u00ab<a href="#" onclick="event.preventDefault();'
      + 'event.stopPropagation();go(\'moves\')">Harakat</a>\u00bb tabida.' : ''}</span>`;
}

function drawStockRow(r) {
  const k = rowKey(r);
  const open = openRows.has(k);
  const units = openRows.get(k);
  return `
    <tr onclick="toggleRow('${k}',${r.product_id})">
      <td class="s-name"><b>${esc(r.product)}</b></td>
      <td class="s-type muted">${esc(r.product_type || '')}</td>
      <td class="s-color muted">${esc(r.color || '\u2014')}</td>
      <td class="s-fabric muted">${esc(r.fabric || '\u2014')}</td>
      ${!aylKor() ? '' : `
      <td class="s-in">${r.kirdi ? `<b>${r.kirdi}</b>`
        : '<span class="muted">&mdash;</span>'}</td>
      <td class="s-out">${r.chiqdi ? `<b>${r.chiqdi}</b>`
        : '<span class="muted">&mdash;</span>'}</td>`}
      <!--  ★ QOLDIQ — javonda JISMONAN turgani, bronda turgani bilan
            birga: inventarizatsiyada aynan shu sanaladi. Oraliq
            tanlangan bo'lsa O'SHA KUNNING oxiridagi qoldiq
            (izoh: qoldiqVal) — ustun savolga ergashadi. -->
      <td class="s-qty"><b>${qoldiqVal(r)}</b> <span class="muted"
        style="font-size:11px">${esc(r.uom || '')}</span></td>
      ${!bronUstun() ? ''
      //  Bronda turgan mahsulot OMBORDA: u hali chiqib ketmagan,
      //  shuning uchun qoldiqdan AYRILMAYDI — yonida alohida
      //  ustunda turadi va sotish mumkin bo'lgani ikkovining
      //  ayirmasidan chiqadi. Sanoq varag'ida ham qoladi.
      : `<td class="s-bron">${r.bron
            ? `<b>${r.bron}</b>` : '<span class="muted">&mdash;</span>'}</td>`}
      ${isTM() ? ''
      //  Vitrinada narx va summa: u yerda nuqta hisobi yuritiladi.
      //  Narxi yo'q konverning summasi 0 emas, NOMA'LUM: nol raqam
      //  «bepul» degan ma'no beradi. Baza matn qaytaradi ("0.00"),
      //  shuning uchun Number bilan tekshiriladi.
      : `<td class="s-price">${price(r)}</td>
         <td class="s-amount">${Number(r.amount) ? `<b>${money(r.amount)}</b>`
            : '<span class="muted">\u2014</span>'}</td>`}
    </tr>
    ${!open ? '' : `<tr class="more"><td colspan="${ustunSoni()}"
      style="background:var(--bg);padding:10px 14px">
      ${units === undefined ? `<span class="muted">Yuklanmoqda\u2026</span>`
      : !units.length ? yoqIzoh(r)
      : units.map(u => {
          // Yorliq bosilsa oyna ochiladi: ko'chirish va/yoki sonini
          // to'g'rilash — qaysinisi huquqda bor bo'lsa.
          const ochiladi = (canMove && !u.reserved_qty) || canCount;
          return `<span class="tag" style="margin:2px 6px 2px 0${
            ochiladi ? ';cursor:pointer' : ''}"
            title="${esc(u.customer_name || whName)} \u00b7 ${d8(u.fg_on)} \u00b7 ${
              u.days_in_stock} kun"
            ${ochiladi ? `onclick="event.stopPropagation();openMove(${u.id},'${
                esc(u.conveyor_no)}',${u.qty},${u.reserved_qty || 0})"` : ''}
            >${esc(u.conveyor_no)}${u.qty > 1 ? ` \u00d7${u.qty}` : ''}${
              u.reserved_qty ? ` \u00b7 ${u.reserved_qty} bron` : ''}</span>`;
        }).join('') + ((canMove || canCount)
        ? `<div class="muted" style="font-size:12px;margin-top:6px">Konver
             raqamini bosing \u2014 ${[canMove ? "boshqa omborga ko'chirish" : '',
               canCount ? "sonini to'g'rilash (sanoq)" : '',
               canFixQty ? 'bekor qilish' : '']
               .filter(Boolean).join(', ')}</div>` : '')}
    </td></tr>`}`;
}

async function toggleRow(k, productId) {
  if (openRows.has(k)) { openRows.delete(k); return drawStock(); }
  const r = stock.rows.find(x => rowKey(x) === k);
  openRows.set(k, undefined);
  drawStock();
  const p = wq(new URLSearchParams({ product_id: productId }));
  if (r.color)  p.set('color', r.color);
  if (r.fabric) p.set('fabric', r.fabric);
  if (stock.from) p.set('from', stock.from);
  if (stock.to)   p.set('to', stock.to);
  const d = await App.api('/api/warehouse/fg/units?' + p);
  openRows.set(k, d.rows);
  drawStock();
}

// ═══════════════════════════════════════════ BOSHQA OMBORGA KO'CHIRISH
//
//  Vitrinaga mahsulot shu yerdan chiqariladi. Konverning bir qismi ham
//  ko'chadi: 10 talikdan 3 tasi vitrinaga qo'yiladi, 7 tasi omborda
//  qoladi — shunda konver ikkita qator bo'ladi, raqami bir xil.
function openMove(id, no, qty, bron) {
  const other = targets.filter(t => t.code !== (WH || 'TM'));
  //  Ko'chirish faqat bo'sh konverda: bron qo'yilgani mijozniki bo'lib
  //  turibdi. Sonini to'g'rilash esa ikkalasida ham ochiq.
  const koch = canMove && !bron && other.length;
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeMove()">
      <div class="modal" style="max-width:430px">
        <div class="row" style="justify-content:space-between;margin-bottom:16px">
          <h1 style="margin:0">${esc(no)}</h1>
          <button onclick="closeMove()">Yopish</button></div>

        ${koch ? `<div class="stack">
          <div><label>Qayerga ko'chirish</label>
            <select id="mvTo">${other.map(t =>
              `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join('')}</select></div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Soni (bor: ${qty})</label>
              <input id="mvQty" type="number" min="1" max="${qty}" value="${qty}"></div>
            <div style="flex:1"><label>Sana</label>
              <input id="mvOn" type="date" value="${isoDay(new Date())}"></div>
          </div>
          <div><label>Izoh</label><input id="mvNote" placeholder="ixtiyoriy"></div>
          <button class="primary" onclick="doMove(${id})">Ko'chirish</button>
        </div>` : bron && canMove
          ? `<p class="muted">${bron} tasi bronda — ko'chirish uchun avval
               savdo bronni olishi kerak.</p>` : ''}

        <!--  Kiritishda adashish bo'ladi: 2 talik mahsulot 4 ta bo'lib
              yozilib ketadi. Soni tarixga tegadigan maydon (hisobot,
              qoldiq, ishbay oylik shundan) — shuning uchun faqat
              boshqaruvchida. -->
        ${canCount ? `<div class="stack" style="${koch
            ? 'margin-top:20px;border-top:1px solid var(--line);padding-top:18px' : ''}">
          <div><label>Sonini to'g'rilash — sanoq</label>
            <div class="row" style="gap:10px">
              <input id="fxQty" type="number" min="1" value="${qty}" style="max-width:110px">
              <button onclick="doFixQty(${id}, ${qty})">Saqlash</button>
            </div></div>
          <!--  ★ SABAB MAJBURIY: soni qoldiqqa ham, jamlanma
                hisobotga ham tegadi va «nega 4 emas, 2 ta» degan savol
                keyin beriladi. Javobi HUJJATDA (SN26-0001) va audit
                jurnalida qoladi.
                ★ SANA — SANOQ KUNI: javon ertalab sanaladi,
                kompyuterga esa kechqurun yoki ertasiga yoziladi. -->
          <div class="row" style="gap:12px">
            <div><label>Sanoq kuni</label>
              <input id="fxOn" type="date" value="${isoDay(new Date())}"
                max="${isoDay(new Date())}" style="max-width:150px"></div>
            <div style="flex:1"><label>Sabab</label>
              <input id="fxNote" placeholder="masalan: sanoq — javonda 2 ta"></div>
          </div>
          <p class="muted" style="font-size:12px;margin:0">Hozir <b>${qty}</b> ta${
            bron ? `, shundan <b>${bron}</b> tasi bronda` : ''}. Qoldiq va
            hisobotlar darrov to'g'rilanadi. Javonda <b>umuman yo'q</b>
            konver bu yerdan bekor qilinmaydi — u sanoq xatosi emas,
            zarar.</p>
        </div>` : ''}

        <!--  Butunlay noto'g'ri kiritilgan konver. Jurnaldagi «×» bilan
              bir xil yo'l — lekin omborga tushgan konver jurnaldan
              chiqib ketadi va u yerdan topilmasdi. Bronda turgani va
              chiqib ketgani bekor qilinmaydi (tekshiruv serverda). -->
        ${canFixQty ? `<div class="stack" style="margin-top:20px;
            border-top:1px solid var(--line);padding-top:18px">
          <div><label>Noto'g'ri kiritilgan</label>
            <button class="danger" onclick="doCancel(${id}, '${esc(no)}', ${qty})">
              Konverni bekor qilish</button></div>
          <p class="muted" style="font-size:12px;margin:0">Qoldiqdan ham,
            jurnaldan ham chiqadi. Tarixi o'chmaydi — konver «bekor qilingan»
            bo'lib qoladi.</p>
        </div>` : ''}
      </div></div>`;
}

//  Bekor qilish jurnaldagi bilan bitta yo'l: `PATCH /api/units/:id` ga
//  `status: 'cancelled'`. Qoldiq server tomonda qayta hisoblanadi.
async function doCancel(id, no, qty) {
  if (!confirm(`${no} (${qty} ta) bekor qilinsinmi?\n\n` +
               `Ombor qoldig'idan chiqadi va jurnalda «bekor qilingan» ` +
               `bo'lib qoladi.`)) return;
  try {
    await App.api('/api/units/' + id, { method: 'PATCH',
      body: JSON.stringify({ status: 'cancelled' }) });
    closeMove();
    toast(`${no} bekor qilindi`);
    await loadStock();
  } catch (e) { toast(e.message, true); }
}

//  Soni jurnaldagi tahrir bilan bir xil yo'ldan o'tadi (`PATCH /api/units/:id`):
//  qoldiq, jamlanma hisobot va audit o'sha yerda birga yangilanadi.
async function doFixQty(id, eski) {
  const n = Number($('fxQty').value);
  if (!Number.isInteger(n) || n < 1) return toast('Soni noto\'g\'ri', true);
  if (n === eski) return closeMove();
  const sabab = $('fxNote')?.value.trim();
  if (!sabab) return toast('Sabab yozilmagan', true);
  if (!confirm(`Soni ${eski} \u2192 ${n} qilib to'g'rilansinmi?`)) return;
  try {
    const r = await App.api('/api/warehouse/fg/count', { method: 'POST',
      body: JSON.stringify({ unit_id: id, to_qty: n, note: sabab,
                             on: $('fxOn')?.value || null }) });
    closeMove();
    toast(`${r.doc_no} · soni ${n} ta qilib to'g'rilandi`);
    await loadStock();
  } catch (e) { toast(e.message, true); }
}
const closeMove = () => { $('modalRoot').innerHTML = ''; };

// ══════════════════════════════════════ SANOQ — QOLDIQNI TO'G'RILASH
//
//  ★ ZAVOD QARORI (2026-10): sanoqda farq IKKI tomonga chiqadi — kam
//  ham, ko'p ham — va tuzatadigan joy mudirda bo'lishi kerak.
//  Inventarizatsiyada sanaladigan raqam «Qoldiq» ustuni, ya'ni savol
//  uning ekranida beriladi; javob esa boshqa odamda turardi.
//
//  ★ VARAQ KONVER BO'YICHA, mahsulot bo'yicha emas. Tayyor mahsulot
//  qoldig'i KONVERLARDAN hisoblanadi va javondagi mahsulotning
//  ustida o'z raqami yozib qo'yilgan — mudir «Penal 10 ta» emas,
//  «K26-0041 ×4» ni sanaydi. Mahsulot bo'yicha so'ralsa farq qaysi
//  konverniki ekani noma'lum qolardi va tizim taxmin qilishi kerak
//  bo'lardi.
//
//  Ro'yxat EKRANDAGI filtr bilan bir xil (qidiruv va turlar), lekin
//  SANA oralig'isiz: sanoq «javonda hozir nima turibdi» degan savol,
//  oraliq esa boshqa savol (izoh: `davrKor`).
//
//  ★ SANOQDA soni oldindan HOZIRGISI bo'lib turadi, nol emas: varaq
//  yuzta qatorli va bo'sh qoldirilgani «nol sanadim» deb o'qilsa
//  bitta tasodifiy bosish butun javonni nolga tushirardi. Farqi yo'q
//  qator serverda baribir o'tkazib yuboriladi.
let szRows = [], szQ = '', szTarix = [];

async function sanoqOch() {
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeMove()">
      <div class="modal" style="max-width:860px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Sanoq — qoldiqni to'g'rilash</h1>
          <button onclick="closeMove()">Yopish</button></div>
        <p class="muted">Yuklanmoqda…</p>
      </div></div>`;
  const p = wq(new URLSearchParams());
  const q = $('sQ')?.value.trim(); if (q) p.set('q', q);
  if (sel.type.size) p.set('product_type', [...sel.type].join(','));
  let d;
  try {
    //  Varaq va TARIX birga o'qiladi: ikkita so'rov ketma-ket
    //  yuborilsa oyna bir marta bo'sh, keyin to'la chizilardi.
    const [u, t] = await Promise.all([
      App.api('/api/warehouse/fg/units?' + p),
      App.api('/api/warehouse/fg/counts?' + wq(new URLSearchParams({ limit: 20 })))
        .catch(() => ({ rows: [] })),
    ]);
    d = u; szTarix = t.rows || [];
  } catch (e) { closeMove(); return toast(e.message, true); }
  szRows = d.rows.map(r => ({ ...r, to_qty: Number(r.qty) }));
  szQ = '';
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeMove()">
      <div class="modal" style="max-width:860px">
        <div class="row" style="justify-content:space-between;margin-bottom:14px">
          <h1>Sanoq — qoldiqni to'g'rilash</h1>
          <button onclick="closeMove()">Yopish</button></div>
        ${!szRows.length ? `<p class="muted">Javonda konver yo'q.</p>` : `
        <div class="row" style="gap:12px;align-items:flex-end;margin-bottom:12px">
          <!--  ★ SANOQ KUNI, standarti bugun: javon ertalab sanaladi,
                kompyuterga esa kechqurun yoki ertasiga yoziladi —
                «qachon sanadik» degan savolga yozilgan vaqt emas,
                o'sha KUN javob beradi. Kelajakdagi sana serverda rad
                etiladi: sanoq bo'lib o'tgan ish. -->
          <div><label>Sanoq kuni</label>
            <input id="szOn" type="date" value="${isoDay(new Date())}"
              max="${isoDay(new Date())}" style="max-width:150px"></div>
          <div style="flex:1;min-width:200px"><label>Sabab</label>
            <input id="szNote" placeholder="masalan: oylik sanoq"></div>
          <div style="flex:1;min-width:160px"><label>Qidiruv</label>
            <input id="szFind" placeholder="konveyer №, mahsulot, rang"
              oninput="sanoqFind(this.value)"></div>
        </div>
        <!--  ★ SABAB MAJBURIY: soni qoldiqqa ham, jamlanma hisobotga
              ham tegadi va «nega o'zgardi» degan savol keyin
              beriladi (xom ashyodagi sanoq bilan bir xil qoida). -->
        <p class="muted" style="margin-bottom:12px">Javondagi donani sanab,
          «Sanoqda» katagiga yozing — farqi borlari saqlanadi.
          Konverning soni to'g'rilanadi, ya'ni qoldiq, jamlanma hisobot
          va oraliq oxiriga ham o'zi to'g'rilanadi: javonda hech qachon
          o'sha dona turmagan edi. Javonda <b>umuman yo'q</b> konver bu
          yerdan bekor qilinmaydi — u sanoq xatosi emas, zarar.</p>
        <div id="szBody" style="max-height:340px;overflow:auto"></div>
        <button class="primary" id="szSave" style="margin-top:14px"
          onclick="sanoqSaqla()">To'g'rilash</button>
        <div id="szMsg"></div>`}
        ${sanoqTarix()}
      </div></div>`;
  if (szRows.length) sanoqChiz();
}

//  ★ OXIRGI SANOQLAR OYNANING O'ZIDA. «Qachon sanadik» degan savol
//  aynan shu yerda beriladi: mudir varaqni ochganda bugun allaqachon
//  sanalganini ko'rishi kerak, aks holda o'sha javonni ikkinchi marta
//  sanab, ikkinchi hujjat yozardi va tarixda bitta farq ikkita qator
//  bo'lib turardi.
//
//  Alohida tab qilinmadi: savol faqat sanoq payti beriladi va tab
//  qolgan kun bo'yi bo'sh turardi (tsex ekranidagi «javob ish
//  qilayotgan joyida bo'lsin» bilan bir xil sabab).
function sanoqTarix() {
  if (!szTarix.length) return '';
  return `<div style="margin-top:20px;border-top:1px solid var(--line);
      padding-top:14px">
    <div class="muted" style="font-size:12px;margin-bottom:8px">Oxirgi
      sanoqlar — ${esc(stock?.warehouse?.name || '')}</div>
    <div style="max-height:200px;overflow:auto">
    <table><thead><tr><th>Hujjat</th><th>Sanoq kuni</th><th>Konveyer №</th>
      <th class="num">Edi</th><th class="num">Bo'ldi</th>
      <th>Kim · sabab</th></tr></thead>
    <tbody>${szTarix.map(r => `<tr>
      <td><b>${esc(r.doc_no)}</b></td>
      <td>${d8(r.counted_on)}</td>
      <td>${esc(r.conveyor_no)}${r.product
        ? ` <span class="muted" style="font-size:12px">${esc(r.product)}</span>` : ''}</td>
      <td class="num muted">${r.was_qty}</td>
      <td class="num"><b>${r.qty}</b> <span class="${r.farq > 0 ? '' : 'late'}"
        >${r.farq > 0 ? '+' : ''}${r.farq}</span></td>
      <td class="muted" style="font-size:12px">${esc(r.by_name || '—')}${
        r.note ? ' · ' + esc(r.note) : ''}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

const sanoqKor = () => {
  const q = szQ.toLowerCase();
  return szRows.filter(r => !q
    || [r.conveyor_no, r.product, r.color, r.fabric]
         .some(v => String(v || '').toLowerCase().includes(q)));
};
function sanoqFind(v) { szQ = String(v || '').trim(); sanoqChiz(); }

function sanoqChiz() {
  const kor = sanoqKor();
  const farqli = szRows.filter(r => Number(r.to_qty) !== Number(r.qty)).length;
  $('szBody').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span class="muted" style="font-size:12px">${kor.length} ta konver${
        szRows.length !== kor.length ? ` (jami ${szRows.length})` : ''
      } · farqi bori <b>${farqli}</b></span></div>
    <table><thead><tr><th>Konveyer №</th><th>Mahsulot</th>
      <th class="num">Hozir</th><th class="num">Sanoqda</th>
      <th class="num">Farq</th></tr></thead>
    <tbody>${kor.map(r => {
      const i = szRows.indexOf(r);
      const farq = Number(r.to_qty) - Number(r.qty);
      return `<tr data-i="${i}">
        <td><b>${esc(r.conveyor_no)}</b>${r.reserved_qty
          ? ` <span class="muted">${r.reserved_qty} bron</span>` : ''}</td>
        <td>${esc(r.product)}<span class="muted" style="font-size:12px">${
          [r.color, r.fabric].filter(Boolean).map(v => ' · ' + esc(v)).join('')
        }</span></td>
        <td class="num">${r.qty}</td>
        <td class="num"><input type="number" min="1" step="1"
          value="${r.to_qty}" style="max-width:84px;text-align:right"
          oninput="sanoqSon(${i}, this.value)"></td>
        <td class="num${farq ? ' late' : ''}">${
          farq ? (farq > 0 ? '+' : '') + farq : '—'}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

//  Chizish qayta chaqirilmaydi: katakdagi kursor yo'qolib ketardi.
//  Faqat «Farq» ustuni yangilanadi — saqlashda baribir SERVER qayta
//  hisoblaydi (materiallar.html dagi sanoq bilan bir xil idiom).
function sanoqSon(i, v) {
  szRows[i].to_qty = v === '' ? Number(szRows[i].qty) : Number(v);
  const tr = $('szBody').querySelector(`tbody tr[data-i="${i}"]`);
  if (tr) {
    const farq = Number(szRows[i].to_qty) - Number(szRows[i].qty);
    const td = tr.lastElementChild;
    td.textContent = farq ? (farq > 0 ? '+' : '') + farq : '—';
    td.className = 'num' + (farq ? ' late' : '');
  }
}

async function sanoqSaqla() {
  const items = szRows
    .filter(r => Number.isFinite(Number(r.to_qty))
              && Number(r.to_qty) !== Number(r.qty))
    .map(r => ({ unit_id: r.id, to_qty: Number(r.to_qty) }));
  if (!items.length) return toast("Farqi bor qator yo'q", true);
  const sabab = $('szNote').value.trim();
  if (!sabab) return toast('Sabab yozilmagan', true);
  if (!confirm(`${items.length} ta konverning soni to'g'rilansinmi?`)) return;
  try {
    const r = await App.api('/api/warehouse/fg/count', { method: 'POST',
      body: JSON.stringify({ note: sabab, on: $('szOn').value || null, items }) });
    closeMove();
    toast(`${r.doc_no} · ${r.saved} ta konver to'g'rilandi`);
    await loadStock();
  } catch (e) { toast(e.message, true); }
}



async function doMove(id) {
  const body = { unit_id: id, to_code: $('mvTo').value,
                 qty: Number($('mvQty').value) || null,
                 moved_on: $('mvOn').value || null,
                 note: $('mvNote').value.trim() || null };
  try {
    const r = await App.api('/api/warehouse/fg/transfer',
      { method: 'POST', body: JSON.stringify(body) });
    closeMove();
    toast(`${r.qty} ta \u2192 ${r.to}`);
    await loadStock();
  } catch (e) { toast(e.message, true); }
}

let t1 = null;
const debStock = () => { clearTimeout(t1); t1 = setTimeout(loadStock, 350); };
function clearStock() {
  ['sQ', 'sFrom', 'sTo'].forEach(i => { if ($(i)) $(i).value = ''; });
  sel.type.clear();
  faktOnly = false;
  loadStock();
}

//  Belgi SERVERGA bormaydi: qoldiq so'rovi LIMITsiz va qatorlarning
//  HAMMASI sahifada turadi (saralash bilan bir xil sabab) — ya'ni
//  javob bosilgan zahoti chiqadi. Yig'indi ham o'zgarmaydi: u
//  `v_fg_units` dan keladi, u esa allaqachon faqat javondagini
//  sanaydi — yashirilayotgan qatorlar unga baribir nol qo'shardi.
function faktSet(v) {
  faktOnly = !!v;
  if ($('sQ')) stock.q = $('sQ').value;
  drawStock();
}

//  Qog'ozdagi sarlavha filtrni MATN qilib yozadi: qaysi ombor, qaysi
//  oraliq, qidiruv va tanlangan turlar. Ro'yxat qisqarib turgan bo'lsa
//  varaqda nega qisqa ekani ko'rinib tursin — aks holda «mahsulot
//  yetishmayapti» degan savol qolardi (qarzdorlik bilan bir xil).
function stockFilterText() {
  const d = stock;
  const bits = [whName || 'T/M ombor'];
  //  Aylanma chizilmagan varaqda oraliq YOZILMAYDI: u faqat kirdi va
  //  chiqdi ustunlariga tegishli edi, qoldiq esa bugungi holat —
  //  sanani yozib qo'yish varaqni o'sha kunniki qilib ko'rsatardi.
  if (aylKor() && (d.from || d.to))
    bits.push(`Harakat sanasi: ${d.from ? d8(d.from) : 'boshidan'} — ${
      d.to ? d8(d.to) : 'bugungacha'}`);
  else if (aylKor()) bits.push('Harakat sanasi: butun davr');
  else bits.push('Faqat javonda turganlari — holat: bugun');
  if (sel.type.size) bits.push(`Turi: ${[...sel.type].join(', ')}`);
  if (d.q) bits.push(`Qidiruv: ${d.q}`);
  return bits.join('  ·  ');
}

//  ★ CHOP ETISH. Qog'ozda kartochkalar chizilmaydi (`@media print`:
//  `.grid`), lekin yig'indi YO'QOLMAYDI — u jadvalning «JAMI»
//  qatorida turadi. Shuning uchun ikkinchi jadval yozilmadi
//  (qarzdorlik hisoboti bilan bir xil qoida va bir xil sabab).
function printStock() {
  const now = new Date();
  const kun = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()}`;
  const soat = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  //  Kim chop etgani ham yoziladi: javon oldida ikkita varaq yonma-yon
  //  tursa qaysi birini kim olgani savol bo'lardi. Ism BAZADAN keladi
  //  (sessiyadagi xodim), kodga yozilmaydi (4-qoida).
  const xodim = App.me()?.name ? ` · ${esc(App.me().name)}` : '';
  const qator = korinadigan(stock.rows).length;
  $('printHead').innerHTML = `
    <h1>${faktOnly ? 'Sanoq varag\'i' : 'Ombor qoldig\'i'} · ${esc(FIRMA)}</h1>
    <div class="meta">${esc(stockFilterText())}</div>
    <div class="meta">${qator} ta qator · chop etildi ${kun} ${soat}${xodim}</div>`;
  window.print();
}
function period2(days) {
  $('sFrom').value = isoDay(new Date(Date.now() - days * 864e5));
  $('sTo').value = isoDay(new Date());
  loadStock();
}
//  Excelga konverlar ro'yxati tushadi, jamlanma emas: faylni ochgan odam
//  uni o'zi istagancha yig'a oladi, ajrata olmaydi.
const exportStock = () => App.download('/api/units/stock/export?' + stockParams(),

async function loadStock() {
  const q = stockParams();
