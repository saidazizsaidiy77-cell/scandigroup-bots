<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T/M ombor · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>T/M ombor</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div id="body"></div>

<script>
// ============================================================================
//  TAYYOR MAHSULOT OMBORI — QABUL QILISH
//
//  Qadoqlash tsexi «T/M omborga jo'natdim» deydi; mahsulot hali o'sha
//  yerda, qadoqlash tsexining javobgarligida turadi. Ombor mudiri uni
//  ko'zi bilan ko'rib «qabul qildim» deydi — faqat shundan keyin:
//    · ombor qoldig'iga tushadi
//    · ishlab chiqarish jurnalidan chiqadi
//
//  Ikki bosqich tsexlar orasidagi bilan bir xil sababdan: bitta tugma
//  bitta sana beradi, ikkita tugma esa ikkita — va ular orasidagi farq
//  mahsulot qancha kutib turganini ko'rsatadi.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let rows = [], canAccept = false;
const picked = new Set();

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// Necha kun kutib turganini ko'rsatamiz: uzoq turgani ombor bilan
// qadoqlash orasida uzilish borligini bildiradi.
function waited(d) {
  if (d == null) return '';
  if (d === 0) return `<span class="tag">bugun</span>`;
  return `<span class="tag ${d > 2 ? 'bad' : 'warn'}">${d} kun kutmoqda</span>`;
}

function draw() {
  if (!rows.length) {
    $('body').innerHTML = `<div class="card"><h2>Qabul qilinadigan mahsulot yo'q</h2>
      <p class="muted" style="margin-top:8px">Qadoqlash tsexi «T/M omborga jo'natdim»
      deganda mahsulot shu yerda paydo bo'ladi.</p></div>`;
    return;
  }
  const sel = rows.filter(r => picked.has(r.id)).length;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="row" style="gap:10px">
          <h2 style="margin:0">Qabul qilish</h2>
          <span class="muted" style="font-size:13px">${rows.length} ta</span>
        </div>
        ${canAccept && rows.length > 1 ? `<button ${sel ? 'class="primary"' : ''}
          onclick="bulk()">${sel ? `${sel} tasini qabul qilish` : 'Hammasini tanlash'}</button>` : ''}
      </div>
      <table class="board">
        <thead><tr>
          <th class="c-sel"></th><th class="c-no">Konveyer &#8470;</th>
          <th class="c-name">Nomi</th><th class="c-type">Turi</th>
          <th class="c-qty num">Soni</th><th class="c-due">Kutmoqda</th><th class="c-act"></th>
        </tr></thead>
        <tbody>${rows.map(r => `
          <tr>
            <td class="c-sel">${canAccept ? `<input type="checkbox" style="width:auto"
              ${picked.has(r.id) ? 'checked' : ''} onchange="pick(${r.id},this.checked)">` : ''}</td>
            <td class="c-no"><b>${esc(r.conveyor_no)}</b></td>
            <td class="c-name">${esc(r.product)}${r.color
              ? `<div class="muted" style="font-size:12px">${esc(r.color)}</div>` : ''}</td>
            <td class="c-type muted">${esc(r.product_type || '')}</td>
            <td class="c-qty num">${r.qty}</td>
            <td class="c-due">${waited(r.days_waiting)}${r.sent_by
              ? `<div class="muted" style="font-size:12px">${esc(r.sent_by)}</div>` : ''}</td>
            <td class="c-act">${canAccept
              ? `<button class="primary" onclick="accept([${r.id}])">Qabul qildim</button>`
              : ''}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function pick(id, on) { on ? picked.add(id) : picked.delete(id); draw(); }

async function accept(ids) {
  try {
    await App.api('/api/units/stock/accept', {
      method: 'POST', body: JSON.stringify({ items: ids }) });
    toast(ids.length === 1 ? 'Qabul qilindi' : `${ids.length} ta mahsulot qabul qilindi`);
    picked.clear();
    await load();
  } catch (e) { toast(e.message, true); }
}

function bulk() {
  const sel = rows.filter(r => picked.has(r.id)).map(r => r.id);
  if (!sel.length) { rows.forEach(r => picked.add(r.id)); return draw(); }
  accept(sel);
}

async function load() {
  rows = await App.api('/api/units/stock/inbox');
  draw();
}

App.start(async () => {
  canAccept = App.can('warehouse.move', 'production.manage');
  await load();
}, 'warehouse.view', 'production.view');
</script>
</body>
</html>
