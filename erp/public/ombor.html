<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T/M ombor · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>T/M ombor</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div class="row" id="tabs" style="margin-bottom:16px;gap:8px;flex-wrap:wrap"></div>
<div id="body"></div>
<div id="modalRoot"></div>

<script>
// ============================================================================
//  TAYYOR MAHSULOT OMBORI — QABUL QILISH
//
//  Qadoqlash tsexi «T/M omborga jo'natdim» deydi; mahsulot hali o'sha
//  yerda, qadoqlash tsexining javobgarligida turadi. Ombor mudiri uni
//  ko'zi bilan ko'rib «qabul qildim» deydi — faqat shundan keyin:
//    · ombor qoldig'iga tushadi
//    · ishlab chiqarish jurnalidan chiqadi
//
//  Ikki bosqich tsexlar orasidagi bilan bir xil sababdan: bitta tugma
//  bitta sana beradi, ikkita tugma esa ikkita — va ular orasidagi farq
//  mahsulot qancha kutib turganini ko'rsatadi.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Telefonda — qabul qilish, kompyuterda — qoldiq. Mudir telefonni
// omborning eshigida, mahsulot kelganda ochadi: unga kerakli birinchi
// ekran «qabul qildim» tugmasi. Stol ustidagi kompyuterda esa u qoldiqni
// ko'radi — nimadan nechta borligini.
const isPhone = window.matchMedia('(max-width: 620px)').matches;

//  Qaysi ombor ochilgan — manzilda (`?w=VITR-ABU`). Ko'rsatilmasa T/M
//  ombor: eski havolalar va telefondagi yorliqlar shundan buzilmaydi.
//  Kod har so'rovga qo'shiladi, shunda qoldiq, tarix va Excel bitta
//  ombor haqida gapiradi.
const WH = new URLSearchParams(location.search).get('w') || '';
const wq = (p) => { if (WH) p.set('w', WH); return p; };
let whName = '';
let canMove = false, targets = [];
//  Huquqlar App.start() ICHIDA o'qiladi: undan oldin sessiya hali
//  yuklanmagan va App.can() hamma narsaga «yo'q» deydi.
//
//  canAccept — qabul qilish ombor mudirining ishi; savdoda bu huquq
//  yo'q, shuning uchun unga tab umuman ko'rsatilmaydi: tugmasi
//  ishlamaydigan ro'yxat «nega bosilmayapti» degan savol tug'diradi.
//
//  canLedger — kirim/chiqim tarixi omborni yurituvchi va rahbariyat
//  uchun. Savdoga qoldiq yetarli: unga nima sotishga tayyor turgani
//  kerak, o'sha mahsulot omborga qachon kirgani emas.
let rows = [], tab = 'stock', canAccept = false, canLedger = false;
const picked = new Set();
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const d8 = v => !v ? '—' : (s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`)(String(v).slice(0,10));
const money = v => v == null ? '' : Number(v).toLocaleString('ru-RU');

// Kirganda qoldiq ochiladi — «nimadan nechta bor» kunlik savol.
// Qabul qilish yonida nechta kutayotgani turadi, aks holda ombor
// qoldiqni ochib, kutayotgan mahsulotni ko'rmay qolishi mumkin.
const ALL_TABS = [['stock', 'Qoldiq'], ['inbox', 'Qabul qilish'], ['moves', 'Harakat']];
//  «Qabul qilish» faqat T/M omborda: ishlab chiqarish vitrinaga
//  to'g'ridan-to'g'ri topshirmaydi, mahsulot u yerga T/M ombordan
//  ko'chiriladi.
const isTM = () => !WH || WH === 'TM';
const tabs = () => ALL_TABS.filter(([k]) => (k !== 'inbox' || (canAccept && isTM()))
                                         && (k !== 'moves' || canLedger));
function drawTabs() {
  // Bitta tab — tab emas: tanlash imkoni yo'q qator faqat joy egallaydi.
  const T = tabs();
  if (T.length < 2) { $('tabs').innerHTML = ''; return; }
  $('tabs').innerHTML = T.map(([k, t]) =>
    `<button ${k === tab ? 'class="primary"' : ''} onclick="go('${k}')">${t}${
      k === 'inbox' && rows.length ? ` <b>${rows.length}</b>` : ''}</button>`).join('');
}
async function go(k) {
  tab = k; drawTabs();
  $('body').innerHTML = `<p class="muted">Yuklanmoqda…</p>`;
  if (k === 'inbox') return load();
  if (k === 'stock') return loadStock();
  return loadMoves();
}

//  Sahifa sarlavhasi ombor nomi bilan almashadi: uchta vitrina va T/M
//  ombor bitta sahifadan ochiladi va qaysi birida turganini ko'rish
//  kerak — brauzer tabida ham.
function setTitle(name) {
  if (!name || name === whName) return;
  whName = name;
  document.querySelector('.top h1').textContent = name;
  document.title = name + ' \u00b7 ZELTA';
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// Necha kun kutib turganini ko'rsatamiz: uzoq turgani ombor bilan
// qadoqlash orasida uzilish borligini bildiradi.
function waited(d) {
  if (d == null) return '';
  if (d === 0) return `<span class="tag">bugun</span>`;
  return `<span class="tag ${d > 2 ? 'bad' : 'warn'}">${d} kun kutmoqda</span>`;
}

function draw() {
  if (!rows.length) {
    $('body').innerHTML = `<div class="card"><h2>Qabul qilinadigan mahsulot yo'q</h2>
      <p class="muted" style="margin-top:8px">Qadoqlash tsexi «T/M omborga jo'natdim»
      deganda mahsulot shu yerda paydo bo'ladi.</p></div>`;
    return;
  }
  const sel = rows.filter(r => picked.has(r.id)).length;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <div class="row" style="gap:10px">
          <h2 style="margin:0">Qabul qilish</h2>
          <span class="muted" style="font-size:13px">${rows.length} ta</span>
        </div>
        ${canAccept && rows.length > 1 ? `<button ${sel ? 'class="primary"' : ''}
          onclick="bulk()">${sel ? `${sel} tasini qabul qilish` : 'Hammasini tanlash'}</button>` : ''}
      </div>
      <table class="board">
        <thead><tr>
          <th class="c-sel"></th><th class="c-no">Konveyer &#8470;</th>
          <th class="c-name">Nomi</th><th class="c-type">Turi</th>
          <th class="c-qty num">Soni</th><th class="c-due">Kutmoqda</th><th class="c-act"></th>
        </tr></thead>
        <tbody>${rows.map(r => `
          <tr>
            <td class="c-sel">${canAccept ? `<input type="checkbox" style="width:auto"
              ${picked.has(r.id) ? 'checked' : ''} onchange="pick(${r.id},this.checked)">` : ''}</td>
            <td class="c-no"><b>${esc(r.conveyor_no)}</b></td>
            <td class="c-name">${esc(r.product)}${r.color
              ? `<div class="muted" style="font-size:12px">${esc(r.color)}</div>` : ''}</td>
            <td class="c-type muted">${esc(r.product_type || '')}</td>
            <td class="c-qty num">${r.qty}</td>
            <td class="c-due">${waited(r.days_waiting)}${r.sent_by
              ? `<div class="muted" style="font-size:12px">${esc(r.sent_by)}</div>` : ''}</td>
            <td class="c-act">${canAccept
              ? `<button class="primary" onclick="accept([${r.id}])">Qabul qildim</button>`
              : ''}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function pick(id, on) { on ? picked.add(id) : picked.delete(id); draw(); }

async function accept(ids) {
  try {
    await App.api('/api/units/stock/accept', {
      method: 'POST', body: JSON.stringify({ items: ids }) });
    toast(ids.length === 1 ? 'Qabul qilindi' : `${ids.length} ta mahsulot qabul qilindi`);
    picked.clear();
    await load();
  } catch (e) { toast(e.message, true); }
}

function bulk() {
  const sel = rows.filter(r => picked.has(r.id)).map(r => r.id);
  if (!sel.length) { rows.forEach(r => picked.add(r.id)); return draw(); }
  accept(sel);
}

async function load() {
  rows = await App.api('/api/units/stock/inbox');
  drawTabs();          // qabul qilingach tabdagi raqam ham kamayadi
  draw();
}

// ═══════════════════════════════════════════════════════════ QOLDIQ
//
//  Ikki qavat, chunki ikki xil savol beriladi:
//
//    1. «Nimadan nechta bor?» — mahsulot turi, rangi, matosi bo'yicha
//       jamlanma jadval. Ombor mudiri kunda shuni ochadi.
//    2. «Qaysi biri?» — qatorni bosganda o'sha rang-matodagi KONVER
//       raqamlari chiqadi. Shikoyat kelganda javob shu yerdan topiladi.
//
//  Sana oralig'i omborga QABUL QILINGAN kun bo'yicha: «shu oraliqda
//  kirgan va hozir ham turganlari».
let stock = null;
const openRows = new Map();   // kalit → konverlar (bir marta yuklanadi)

const rowKey = r => `${r.product_id}|${r.color || ''}|${r.fabric || ''}`;

function stockParams() {
  const p = wq(new URLSearchParams());
  const q = $('sQ')?.value.trim();     if (q) p.set('q', q);
  const f = $('sFrom')?.value;         if (f) p.set('from', f);
  const t = $('sTo')?.value;           if (t) p.set('to', t);
  return p.toString();
}

function drawStock() {
  const d = stock;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div style="flex:1;min-width:180px"><label>Qidiruv</label>
          <input id="sQ" placeholder="maxsulot, rang, mato, konveyer \u2116"
                 value="${esc(d.q || '')}" oninput="debStock()"></div>
        <div><label>Omborga kirgan, dan</label>
          <input id="sFrom" type="date" value="${d.from || ''}" onchange="loadStock()"></div>
        <div><label>gacha</label>
          <input id="sTo" type="date" value="${d.to || ''}" onchange="loadStock()"></div>
        <button onclick="period2(30)">30 kun</button>
        <button onclick="clearStock()">Tozalash</button>
        <button onclick="exportStock()">Excelga yuklash</button>
        ${App.can('production.units', 'production.manage')
          ? `<button onclick="location.href='/qoldiq.html'">Fayldan kiritish</button>` : ''}
      </div>
    </div>

    <div class="grid g3" style="margin-top:16px">
      <div class="card"><h2>Omborda</h2>
        <div class="kpi">${d.total.units}<small> konver</small></div></div>
      <div class="card"><h2>Jami</h2>
        <div class="kpi">${d.total.by_uom && d.total.by_uom.length
          ? d.total.by_uom.map(x => `${x.qty}<small> ${esc(x.uom)}</small>`).join(' \u00b7 ')
          : d.total.qty}</div></div>
      <div class="card"><h2>Summa</h2>
        <div class="kpi">${d.total.amount ? '$' + money(d.total.amount) : '\u2014'}</div></div>
    </div>

    ${!d.rows.length ? `<div class="card" style="margin-top:16px"><h2>Ombor bo'sh</h2>
      <p class="muted" style="margin-top:8px">${d.q || d.from || d.to
        ? 'Tanlangan shart bo\'yicha mahsulot topilmadi.'
        : 'Qabul qilingan mahsulot shu yerda turadi.'}</p></div>`
    : `<div class="card" style="margin-top:16px">
      <div style="overflow:auto;max-height:64vh">
      <table class="stock">
        <thead><tr>
          <th class="s-type">Turi</th><th class="s-name">Mahsulot</th>
          <th class="s-color">Rang</th><th class="s-fabric">Mato</th>
          <th class="s-qty">Soni</th><th class="s-units">Konver</th>
          <th class="s-days">Kun</th>
        </tr></thead>
        <tbody>${d.rows.map(r => drawStockRow(r)).join('')}</tbody>
      </table></div></div>`}`;
}

//  Qator + (ochilgan bo'lsa) uning konverlari. Konverlar ostidagi qator
//  jadvalning o'zida turadi — alohida oyna ochilsa mudir qaysi qatordan
//  kelganini yo'qotadi.
function drawStockRow(r) {
  const k = rowKey(r);
  const open = openRows.has(k);
  const units = openRows.get(k);
  return `
    <tr onclick="toggleRow('${k}',${r.product_id})">
      <td class="s-type muted">${esc(r.product_type || '')}</td>
      <td class="s-name"><b>${esc(r.product)}</b></td>
      <td class="s-color muted">${esc(r.color || '\u2014')}</td>
      <td class="s-fabric muted">${esc(r.fabric || '\u2014')}</td>
      <td class="s-qty"><b>${r.qty}</b> <span class="muted"
        style="font-size:11px">${esc(r.uom || '')}</span></td>
      <td class="s-units muted">${r.units}</td>
      <td class="s-days ${r.oldest_days > 60 ? 'bad' : 'muted'}">${r.oldest_days ?? ''}</td>
    </tr>
    ${!open ? '' : `<tr class="more"><td colspan="7" style="background:var(--bg);padding:10px 14px">
      ${units === undefined ? `<span class="muted">Yuklanmoqda\u2026</span>`
      : !units.length ? `<span class="muted">\u2014</span>`
      : units.map(u => `<span class="tag" style="margin:2px 6px 2px 0${
          canMove && !u.order_item_id ? ';cursor:pointer' : ''}"
          title="${esc(u.customer_name || whName)} \u00b7 ${d8(u.fg_on)} \u00b7 ${
            u.days_in_stock} kun${canMove && !u.order_item_id
              ? ' \u00b7 bosib boshqa omborga ko\'chiriladi' : ''}"
          ${canMove && !u.order_item_id
            ? `onclick="event.stopPropagation();openMove(${u.id},'${
                esc(u.conveyor_no)}',${u.qty})"` : ''}
          >${esc(u.conveyor_no)}${u.qty > 1 ? ` \u00d7${u.qty}` : ''}${
            u.order_item_id ? ' \u00b7 band' : ''}</span>`).join('') + (canMove
        ? `<div class="muted" style="font-size:12px;margin-top:6px">Konver
             raqamini bosing \u2014 boshqa omborga ko'chiriladi</div>` : '')}
    </td></tr>`}`;
}

async function toggleRow(k, productId) {
  if (openRows.has(k)) { openRows.delete(k); return drawStock(); }
  const r = stock.rows.find(x => rowKey(x) === k);
  openRows.set(k, undefined);
  drawStock();
  const p = wq(new URLSearchParams({ product_id: productId }));
  if (r.color)  p.set('color', r.color);
  if (r.fabric) p.set('fabric', r.fabric);
  if (stock.from) p.set('from', stock.from);
  if (stock.to)   p.set('to', stock.to);
  const d = await App.api('/api/warehouse/fg/units?' + p);
  openRows.set(k, d.rows);
  drawStock();
}

// ═══════════════════════════════════════════ BOSHQA OMBORGA KO'CHIRISH
//
//  Vitrinaga mahsulot shu yerdan chiqariladi. Konverning bir qismi ham
//  ko'chadi: 10 talikdan 3 tasi vitrinaga qo'yiladi, 7 tasi omborda
//  qoladi — shunda konver ikkita qator bo'ladi, raqami bir xil.
function openMove(id, no, qty) {
  const other = targets.filter(t => t.code !== (WH || 'TM'));
  if (!other.length) return toast('Ko\'chiradigan boshqa ombor yo\'q', true);
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeMove()">
      <div class="modal" style="max-width:420px">
        <div class="row" style="justify-content:space-between;margin-bottom:16px">
          <h1 style="margin:0">${esc(no)}</h1>
          <button onclick="closeMove()">Yopish</button></div>
        <div class="stack">
          <div><label>Qayerga</label>
            <select id="mvTo">${other.map(t =>
              `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join('')}</select></div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Soni (bor: ${qty})</label>
              <input id="mvQty" type="number" min="1" max="${qty}" value="${qty}"></div>
            <div style="flex:1"><label>Sana</label>
              <input id="mvOn" type="date" value="${isoDay(new Date())}"></div>
          </div>
          <div><label>Izoh</label><input id="mvNote" placeholder="ixtiyoriy"></div>
          <button class="primary" onclick="doMove(${id})">Ko'chirish</button>
        </div>
      </div></div>`;
}
const closeMove = () => { $('modalRoot').innerHTML = ''; };

async function doMove(id) {
  const body = { unit_id: id, to_code: $('mvTo').value,
                 qty: Number($('mvQty').value) || null,
                 moved_on: $('mvOn').value || null,
                 note: $('mvNote').value.trim() || null };
  try {
    const r = await App.api('/api/warehouse/fg/transfer',
      { method: 'POST', body: JSON.stringify(body) });
    closeMove();
    toast(`${r.qty} ta \u2192 ${r.to}`);
    await loadStock();
  } catch (e) { toast(e.message, true); }
}

let t1 = null;
const debStock = () => { clearTimeout(t1); t1 = setTimeout(loadStock, 350); };
function clearStock() { ['sQ','sFrom','sTo'].forEach(i => { if ($(i)) $(i).value = ''; }); loadStock(); }
function period2(days) {
  $('sFrom').value = isoDay(new Date(Date.now() - days * 864e5));
  $('sTo').value = isoDay(new Date());
  loadStock();
}
//  Excelga konverlar ro'yxati tushadi, jamlanma emas: faylni ochgan odam
//  uni o'zi istagancha yig'a oladi, ajrata olmaydi.
const exportStock = () => App.download('/api/units/stock/export?' + stockParams(),
  `tm-ombor-${isoDay(new Date())}.csv`);

async function loadStock() {
  const q = stockParams();
  const focus = document.activeElement?.id;
  openRows.clear();
  const d = await App.api('/api/warehouse/fg/summary' + (q ? '?' + q : ''));
  const p = new URLSearchParams(q);
  stock = { ...d, q: p.get('q'), from: p.get('from'), to: p.get('to') };
  if (d.warehouse) setTitle(d.warehouse.name);
  drawStock();
  if (focus && $(focus)) { $(focus).focus(); if ($(focus).setSelectionRange)
    $(focus).setSelectionRange(9999, 9999); }
}

// ═══════════════════════════════════════════════════════════ HARAKAT
//
//  Kirim — ombor qabul qilgani, chiqim — mijozga chiqqani. Chiqim savdo
//  moduli ulanmaguncha bo'sh keladi; ko'rinish shundan qat'i nazar tayyor
//  turadi, savdo ulanganda o'zi to'ladi.
let moves = null;

function drawMoves() {
  const d = moves;
  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div><label>Sanadan</label>
          <input id="mFrom" type="date" value="${d.from}" onchange="loadMoves()"></div>
        <div><label>Sanagacha</label>
          <input id="mTo" type="date" value="${d.to}" onchange="loadMoves()"></div>
        <button onclick="period(0)">Bugun</button>
        <button onclick="period(7)">7 kun</button>
        <button onclick="period(30)">30 kun</button>
      </div>
    </div>

    <div class="grid g3" style="margin-top:16px">
      <div class="card"><h2>Kirim</h2><div class="kpi" style="color:var(--ok)">${d.kirim}<small> dona</small></div></div>
      <div class="card"><h2>Chiqim</h2><div class="kpi">${d.chiqim}<small> dona</small></div></div>
      <div class="card"><h2>Farqi</h2><div class="kpi">${d.kirim - d.chiqim}<small> dona</small></div></div>
    </div>

    ${!d.rows.length ? `<div class="card" style="margin-top:16px"><h2>Harakat yo'q</h2>
      <p class="muted" style="margin-top:8px">Tanlangan oraliqda omborga kirim ham,
      undan chiqim ham bo'lmagan.</p></div>`
    : `<div class="card" style="margin-top:16px">
      <table class="board"><thead><tr>
        <th>Sana</th><th>Amal</th><th class="c-no">Konveyer &#8470;</th>
        <th class="c-name">Nomi</th><th class="c-qty num">Soni</th><th>Mijoz</th>
      </tr></thead>
      <tbody>${d.rows.map(r => `
        <tr>
          <td>${d8(r.on_date)}</td>
          <td><span class="tag ${r.kind === 'kirim' ? 'ok' : ''}">${r.kind}</span></td>
          <td class="c-no"><b>${esc(r.conveyor_no)}</b></td>
          <td class="c-name">${esc(r.product)}<div class="muted"
            style="font-size:12px">${esc(r.product_type || '')}</div></td>
          <td class="c-qty num">${r.qty}</td>
          <td class="muted">${esc(r.customer_name)}</td>
        </tr>`).join('')}</tbody></table></div>`}`;
}

function period(days) {
  const to = new Date();
  const from = new Date(Date.now() - days * 864e5);
  $('mFrom').value = isoDay(from);
  $('mTo').value = isoDay(to);
  loadMoves();
}

async function loadMoves() {
  const p = wq(new URLSearchParams());
  p.set('from', $('mFrom')?.value || isoDay(new Date(Date.now() - 7 * 864e5)));
  p.set('to', $('mTo')?.value || isoDay(new Date()));
  moves = await App.api('/api/units/stock/moves?' + p);
  drawMoves();
}

App.start(async () => {
  canAccept = App.can('warehouse.move', 'production.manage');
  canMove = App.can('warehouse.move', 'warehouse.manage', 'production.manage');
  // Ko'chiriladigan omborlar ro'yxati bir marta o'qiladi: har konver
  // uchun so'rov yuborilsa, ro'yxat ochilganda o'nlab so'rov ketardi.
  if (canMove) {
    try { targets = (await App.api('/api/warehouse/targets')).rows; }
    catch { targets = []; }
  }
  canLedger = App.can('warehouse.move', 'warehouse.manage',
                      'production.manage', 'production.reports');
  // Telefonda mudir eshik oldida turadi — birinchi ekran qabul qilish
  if (isPhone && canAccept && isTM()) tab = 'inbox';
  // Qabul qilish ro'yxati tabda raqam bo'lib turishi uchun oldindan
  // o'qiladi — ochilmasa ham mudir kutayotgan borligini ko'radi.
  if (canAccept && isTM()) rows = await App.api('/api/units/stock/inbox');
  drawTabs();
  await (tab === 'inbox' ? draw() : loadStock());
}, 'warehouse.view', 'production.view');
</script>
