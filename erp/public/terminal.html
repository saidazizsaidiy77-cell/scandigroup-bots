<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bo'lim terminali · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1 id="ttl">Bo'lim terminali</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<!-- 1 · Bo'lim tanlash -->
<section id="scPick" class="card" style="max-width:520px;margin:0 auto">
  <h2>Bo'limni tanlang</h2>
  <div class="stack">
    <div><label>Tsex</label><select id="selShop" onchange="fillSections()"></select></div>
    <div><label>Bo'lim</label><select id="selSection"></select></div>
    <div><label>Smena</label>
      <select id="selShift"><option value="1">1-smena</option><option value="2">2-smena</option></select></div>
    <button class="primary" onclick="openSection()">Boshlash</button>
  </div>
</section>

<!-- 2 · Ish ekrani -->
<section id="scWork" class="hide">
  <div class="grid g2">
    <div class="card">
      <h2>Mahsulot</h2>
      <select id="selProduct" onchange="renderQueue()"></select>
      <p class="muted" style="margin-top:10px;font-size:13px" id="queueInfo"></p>

      <div class="counter" id="cnt">0</div>
      <div class="pad">
        <button onclick="bump(1)">+1</button>
        <button onclick="bump(5)">+5</button>
        <button onclick="bump(10)">+10</button>
        <button onclick="bump(-1)">−1</button>
        <button onclick="setCnt(0)">C</button>
        <button class="primary" onclick="submitOk()">Yozish</button>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <h2>Brak</h2>
        <div class="stack">
          <div><label>Sabab</label><select id="selDefect"></select></div>
          <div><label>Kelib chiqqan bo'lim (ixtiyoriy)</label><select id="selOrigin"></select></div>
          <div class="row">
            <input id="defQty" type="number" min="1" value="1" style="width:110px">
            <button class="danger" style="flex:1" onclick="submitDefect()">Brak yozish</button>
          </div>
        </div>
      </div>

      <!-- Bo'yoqlash tsexi uchun: kamera partiyasi -->
      <div class="card hide" id="cardPaint">
        <h2>Kamera partiyasi</h2>
        <div class="stack">
          <div class="row">
            <select id="selChamber" style="flex:1"></select>
            <input id="batchQty" type="number" min="1" value="20" style="width:110px">
          </div>
          <button onclick="startBatch()">Partiyani boshlash</button>
          <div id="batchList"></div>
        </div>
      </div>

      <div class="card">
        <h2>To'xtash</h2>
        <div id="dtIdle" class="stack">
          <select id="selDowntime"></select>
          <button onclick="startDowntime()">To'xtashni boshlash</button>
        </div>
        <div id="dtActive" class="hide stack">
          <p><span class="tag bad">TO'XTAB TURIBDI</span> <span class="muted" id="dtSince"></span></p>
          <button class="primary" onclick="stopDowntime()">Ishni davom ettirish</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Shu smenadagi yozuvlar</h2>
    <table><tbody id="logBody"></tbody></table>
  </div>
</section>

<script>
const api = App.api;
const $ = id => document.getElementById(id);
const show = (...ids) => ['scPick','scWork'].forEach(s =>
  $(s).classList.toggle('hide', !ids.includes(s)));

let ref = null, me = null, sec = null, ctx = null, shiftNo = 1, cnt = 0, log = [], dt = null;

function toast(msg, bad){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  if (bad) t.style.borderColor = 'var(--bad)';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

async function boot(user){
  me = user;
  ref = await api('/api/ref');
  // Usta faqat o'z tsexini ko'radi (worker_roles.scope_shop_id)
  const scope = me.scope_shop_ids || [];
  const shops = scope.length ? ref.shops.filter(s => scope.includes(s.id)) : ref.shops;
  $('selShop').innerHTML = shops.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  fillSections();
  show('scPick');
}

function fillSections(){
  const shopId = +$('selShop').value;
  $('selSection').innerHTML = ref.sections.filter(s => s.shop_id === shopId)
    .map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

async function openSection(){
  shiftNo = +$('selShift').value;
  ctx = await api('/api/section/' + $('selSection').value + '/context');
  sec = ctx.section;
  $('ttl').textContent = sec.shop + ' · ' + sec.name;

  // Umumiy tsexda ikkala yo'nalish mahsuloti chiqadi — yo'nalish nomi ko'rsatiladi.
  $('selProduct').innerHTML = ctx.products.length
    ? ctx.products.map(p => `<option value="${p.id}">${
        sec.is_shared ? p.line_name + ' · ' : ''}${p.name}</option>`).join('')
    : '<option value="">— marshrutda mahsulot yo\'q —</option>';
  $('selDefect').innerHTML = ref.defectReasons
    .map(r => `<option value="${r.code}">${r.name}</option>`).join('');
  $('selDowntime').innerHTML = ref.downtimeReasons
    .map(r => `<option value="${r.code}">${r.name}</option>`).join('');
  $('selOrigin').innerHTML = '<option value="">— aniqlanmagan —</option>' +
    ref.sections.map(s => `<option value="${s.id}">${s.shop} · ${s.name}</option>`).join('');

  // Partiya paneli faqat bo'yoqlash (batch) tsexida
  $('cardPaint').classList.toggle('hide', sec.kind !== 'batch');
  $('selChamber').innerHTML = ref.chambers
    .map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  renderBatches();

  dt = ctx.openDowntime; renderDowntime(); renderQueue();
  setCnt(0); log = []; renderLog();
  show('scWork');
}

function renderQueue(){
  const p = ctx.products.find(x => x.id === +$('selProduct').value);
  $('queueInfo').textContent = p
    ? `Marshrut qadami ${p.step_no} · oldida navbat: ${p.queue_qty} dona` : '';
}

const setCnt = v => { cnt = Math.max(0, v); $('cnt').textContent = cnt; };
const bump  = v => setCnt(cnt + v);

async function submitOk(){
  if (!cnt) return toast('Miqdor 0', true);
  const product_id = +$('selProduct').value;
  if (!product_id) return toast('Mahsulot tanlanmagan', true);
  try{
    const r = await api('/api/flow', {method:'POST', body: JSON.stringify({
      section_id: sec.id, product_id, shift_no: shiftNo, qty_ok: cnt })});
    log.unshift({id: r.id, t:'ok', qty: cnt, name: $('selProduct').selectedOptions[0].text});
    renderLog(); toast(cnt + ' dona yozildi'); setCnt(0);
  }catch(e){ toast(e.message, true); }
}

async function submitDefect(){
  const qty = +$('defQty').value, product_id = +$('selProduct').value;
  if (!qty || !product_id) return toast('Ma\'lumot to\'liq emas', true);
  try{
    const r = await api('/api/flow', {method:'POST', body: JSON.stringify({
      section_id: sec.id, product_id, shift_no: shiftNo,
      qty_defect: qty, defect_reason: $('selDefect').value,
      origin_section_id: $('selOrigin').value || null })});
    log.unshift({id: r.id, t:'bad', qty, name: $('selDefect').selectedOptions[0].text});
    renderLog(); toast('Brak yozildi');
  }catch(e){ toast(e.message, true); }
}

async function startBatch(){
  const product_id = +$('selProduct').value;
  if (!product_id) return toast('Mahsulot tanlanmagan', true);
  try{
    await api('/api/paint/start', {method:'POST', body: JSON.stringify({
      section_id: sec.id, chamber_id: +$('selChamber').value, product_id,
      qty: +$('batchQty').value, shift_no: shiftNo })});
    ctx = await api('/api/section/' + sec.id + '/context');
    renderBatches(); toast('Partiya boshlandi');
  }catch(e){ toast(e.message, true); }
}

async function finishBatch(id){
  const repaint = prompt('Qayta bo\'yash kerak bo\'lgan dona soni:', '0');
  if (repaint === null) return;
  await api('/api/paint/' + id + '/finish',
    {method:'POST', body: JSON.stringify({repaint_qty: +repaint || 0})});
  ctx = await api('/api/section/' + sec.id + '/context');
  renderBatches(); toast('Partiya yakunlandi');
}

function renderBatches(){
  const b = ctx.openBatches || [];
  $('batchList').innerHTML = b.length ? `<table><tbody>${b.map(x => `
    <tr><td>${x.chamber || '—'}</td><td>${x.product}</td><td class="num">${x.qty}</td>
        <td class="num"><button onclick="finishBatch(${x.id})">Yakunlash</button></td></tr>`).join('')}
    </tbody></table>` : '<p class="muted" style="font-size:13px">Ochiq partiya yo\'q</p>';
}

async function startDowntime(){
  dt = await api('/api/downtime/start', {method:'POST', body: JSON.stringify({
    section_id: sec.id, reason_code: $('selDowntime').value, shift_no: shiftNo })});
  renderDowntime();
}
async function stopDowntime(){
  await api('/api/downtime/' + dt.id + '/stop', {method:'POST', body:'{}'});
  dt = null; renderDowntime(); toast('To\'xtash yakunlandi');
}
function renderDowntime(){
  $('dtIdle').classList.toggle('hide', !!dt);
  $('dtActive').classList.toggle('hide', !dt);
  if (dt) $('dtSince').textContent =
    new Date(dt.started_at).toLocaleTimeString('uz-UZ', {hour:'2-digit',minute:'2-digit'}) + ' dan';
}

async function undo(id){
  await api('/api/flow/' + id, {method:'DELETE'});
  log = log.filter(x => x.id !== id); renderLog(); toast('Bekor qilindi');
}

function renderLog(){
  $('logBody').innerHTML = log.length ? log.map(x => `
    <tr><td><span class="tag ${x.t === 'ok' ? 'ok' : 'bad'}">${x.t === 'ok' ? 'OK' : 'BRAK'}</span></td>
        <td>${x.name}</td><td class="num">${x.qty}</td>
        <td class="num"><button onclick="undo(${x.id})">Bekor</button></td></tr>`).join('')
    : '<tr><td class="muted">Hozircha yozuv yo\'q</td></tr>';
}

App.start(boot, 'production.entry');
</script>
</body>
</html>
