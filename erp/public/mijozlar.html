<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mijozlar · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Mijozlar</h1></div>
  <div class="row"><button class="primary" onclick="openForm()">Mijoz qo'shish</button>
    <button onclick="openImport()">Ro'yxatni import qilish</button>
    <span class="row" id="erpUser"></span></div>
</div>

<div class="grid g2" style="margin-top:0">
  <div class="card">
    <h2>Kanal kesimi</h2>
    <table><thead><tr><th>Kanal</th><th class="num">Mijoz</th>
      <th class="num">Dona</th><th class="num">Summa, $</th></tr></thead>
      <tbody id="tCh"></tbody></table>
  </div>
  <div class="card">
    <h2>Respublika kesimi</h2>
    <table><thead><tr><th>Respublika</th><th class="num">Mijoz</th>
      <th class="num">Dona</th><th class="num">Summa, $</th></tr></thead>
      <tbody id="tCo"></tbody></table>
  </div>
  <div class="card">
    <h2>Region kesimi</h2>
    <table><thead><tr><th>Region</th><th>Respublika</th><th class="num">Mijoz</th>
      <th class="num">Dona</th><th class="num">Summa, $</th></tr></thead>
      <tbody id="tRg"></tbody></table>
  </div>
  <div class="card">
    <h2>Savdo menejeri kesimi</h2>
    <table><thead><tr><th>Menejer</th><th class="num">Mijoz</th>
      <th class="num">Zakaz</th><th class="num">Summa, $</th></tr></thead>
      <tbody id="tMg"></tbody></table>
  </div>
</div>

<div class="card" style="margin-top:16px">
  <!-- Ro'yxat yopiq turadi: sahifa kesimlar bilan ochiladi, ismlar
       ro'yxati kerak bo'lganda ochiladi. Qidiruvga yozilsa o'zi ochiladi. -->
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="row" style="gap:10px">
      <h2 style="margin:0">Ro'yxat</h2>
      <button id="btnList" onclick="toggleList()">Ko'rsatish</button>
    </div>
    <input id="fQ" placeholder="ism, region yoki telefon" style="max-width:280px" oninput="onSearch()">
  </div>
  <div id="listWrap" hidden style="overflow-x:auto"><table>
    <!-- Ustunlar soni qator bilan bir xil bo'lishi kerak: «Menejer»
         sarlavhasi yetishmasdi va jadval bir katakka siljib turardi. -->
    <thead><tr><th>Mijoz nomi</th><th>Respublika</th><th>Region</th><th>Tel raqami</th>
      <th>Kanali</th><th>Menejer</th>
      <th class="num">Zakaz</th><th class="num">Dona</th><th class="num">Summa, $</th>
      <th class="num">Qarzi, $</th><th></th></tr></thead>
    <tbody id="tB"></tbody>
  </table></div>
</div>

<div id="modalRoot"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (v) => {
  const x = Number(v) || 0;
  const [i, f] = (Math.abs(x) < 1e15 ? x.toFixed(2) : String(x)).split('.');
  const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return f && f !== '00' ? `${grouped}.${f}` : grouped;
};
// Respublika → region ro'yxati. Region matn maydoni, ro'yxat faqat taklif —
// yangi shahar qo'shish uchun kod o'zgartirish shart emas.
const GEO = {
  "O'zbekiston": ['Toshkent shahri','Toshkent viloyati','Andijon','Buxoro',"Farg'ona",
    'Jizzax','Xorazm','Namangan','Navoiy','Qashqadaryo',"Qoraqalpog'iston",'Samarqand',
    'Sirdaryo','Surxondaryo'],
  "Qozog'iston": ['Almati','Ostona','Shimkent','Qarag\'anda','Aqto\'be','Taraz',
    'Pavlodar','O\'skemen','Atirau','Qostanay','Qizilo\'rda','Aqtau','Turkiston'],
  "Qirg'iziston": ['Bishkek','Osh','Jalolobod','Karakol','Talas','Naryn','Batken'],
  'Tojikiston': ['Dushanbe','Xujand','Boxtar','Kulob',"Xorug'"],
  'Ozarbayjon': ['Boku','Ganja','Sumqayit','Mingachevir','Lankaran','Naxchivan'],
};
const COUNTRIES = Object.keys(GEO);

let customers = [], channels = [], managers = [];

async function load(){
  const [c, s] = await Promise.all([
    App.api('/api/units/customers'), App.api('/api/units/customers/stats')]);
  customers = c.customers; channels = c.channels; managers = c.managers;

  $('tCh').innerHTML = s.byChannel.length ? s.byChannel.map(r =>
    `<tr><td>${esc(r.channel_name)}</td><td class="num">${r.customers}</td>
      <td class="num">${r.qty}</td><td class="num">${money(r.amount)}</td></tr>`).join('')
    : '<tr><td class="muted" colspan="4">Mijoz kiritilmagan</td></tr>';
  $('tCo').innerHTML = s.byCountry.length ? s.byCountry.map(r =>
    `<tr><td>${esc(r.country)}</td><td class="num">${r.customers}</td>
      <td class="num">${r.qty}</td><td class="num">${money(r.amount)}</td></tr>`).join('')
    : '<tr><td class="muted" colspan="4">Mijoz kiritilmagan</td></tr>';
  // Region bitta qator: qaysi davlatlardan ekani yonida kulrang yoziladi.
  $('tRg').innerHTML = s.byRegion.length ? s.byRegion.map(r =>
    `<tr><td><b>${esc(r.region)}</b></td>
      <td class="muted" style="font-size:12px">${esc(r.countries || '')}</td>
      <td class="num">${r.customers}</td><td class="num">${r.qty}</td>
      <td class="num">${money(r.amount)}</td></tr>`).join('')
    : '<tr><td class="muted" colspan="5">Mijoz kiritilmagan</td></tr>';
  $('tMg').innerHTML = s.byManager.length ? s.byManager.map(r =>
    `<tr><td>${esc(r.manager_name)}</td><td class="num">${r.customers}</td>
      <td class="num">${r.orders}</td><td class="num">${money(r.amount)}</td></tr>`).join('')
    : '<tr><td class="muted" colspan="4">Mijoz kiritilmagan</td></tr>';
  render();
}

// Qidiruvga yozilsa ro'yxat o'zi ochiladi — yopiq ekranda qidirish
// natijasiz ko'rinib qolmasin.
function onSearch(){
  if ($('fQ').value.trim()) $('listWrap').hidden = false;
  render();
}

function toggleList(){
  $('listWrap').hidden = !$('listWrap').hidden;
  render();
}

function render(){
  const q = $('fQ').value.trim().toLowerCase();
  const rows = customers.filter(c => !q ||
    [c.name, c.country, c.region, c.phone, c.channel_name, c.manager_name]
      .some(v => (v || '').toLowerCase().includes(q)));
  $('tB').innerHTML = rows.length ? rows.map(c => `
    <tr>
      <td><strong>${esc(c.name)}</strong></td>
      <td class="muted">${c.country ? esc(c.country) : '—'}</td>
      <td class="muted">${c.region ? esc(c.region) : '—'}</td>
      <td class="muted">${c.phone ? esc(c.phone) : '—'}</td>
      <td>${c.channel_name ? `<span class="tag">${esc(c.channel_name)}</span>` : '<span class="muted">—</span>'}</td>
      <td class="muted">${c.manager_name ? esc(c.manager_name) : '<span class="tag warn">biriktirilmagan</span>'}</td>
      <td class="num">${c.orders}</td><td class="num">${c.qty}</td>
      <td class="num">${money(c.amount)}</td>
      <!-- Qarz — BALANS (boshlang'ich qarz + chiqib ketgan mahsulot),
           faqat boshlang'ich qarz emas: mijozga mahsulot chiqqani
           ustunda ko'rinmasa, ro'yxat «qarzi yo'q» deb turardi. -->
      <td class="num">${Number(c.balance)
        ? `<b>${money(c.balance)}</b>${Number(c.opening_debt)
            ? `<div class="muted" style="font-size:11px">bosh. ${money(c.opening_debt)}</div>`
            : ''}`
        : '<span class="muted">—</span>'}</td>
      <td class="num"><button onclick="openForm(${c.id})">✎</button></td>
    </tr>`).join('')
    : '<tr><td class="muted" colspan="11">Mijoz topilmadi</td></tr>';
  $('btnList').textContent = $('listWrap').hidden
    ? `Ko'rsatish (${rows.length})` : `Yashirish (${rows.length})`;
}

//  Kiritilayotgan raqam qaysi tomon ekanini aytadi. «-400» ni yozgan odam
//  uni haqdor deb tushunganini shu yerda ko'radi.
function debtSide() {
  const v = Number($('cDebt').value);
  $('cDebtHint').innerHTML = !$('cDebt').value || !v
    ? "Haqdor bo'lsa minus bilan yozing: <b>-400</b> \u2014 biz mijozga qarzdormiz"
    : v > 0 ? `<b>${money(v)} $ qarzdor</b> \u2014 mijoz korxonaga qarzdor`
            : `<b>${money(-v)} $ haqdor</b> \u2014 korxona mijozga qarzdor`;
}

function openForm(id){
  const c = id ? customers.find(x => x.id === id) : null;
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal" style="max-width:520px">
        <div class="row" style="justify-content:space-between;margin-bottom:18px">
          <h1>${c ? 'Mijozni tahrirlash' : 'Yangi mijoz'}</h1>
          <button onclick="close_()">Yopish</button></div>
        <div class="stack">
          <div><label>Mijoz nomi</label><input id="cName" value="${esc(c?.name || '')}"></div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Respublika</label>
              <select id="cCountry" onchange="fillRegions()">
                ${COUNTRIES.map(k => `<option ${(c?.country || COUNTRIES[0]) === k ? 'selected' : ''}
                  >${esc(k)}</option>`).join('')}
              </select></div>
            <div style="flex:1"><label>Region</label>
              <input id="cRegion" list="regionList" value="${esc(c?.region || '')}"
                     placeholder="shahar / viloyat">
              <datalist id="regionList"></datalist></div>
          </div>
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Tel raqami</label>
              <input id="cPhone" value="${esc(c?.phone || '')}" placeholder="+998..."></div>
            <div style="flex:1"><label>Savdo menejeri</label>
              <select id="cManager"><option value="">— biriktirilmagan —</option>
                ${managers.map(m => `<option value="${m.id}"
                  ${c?.manager_id === m.id ? 'selected' : ''}>${esc(m.name)}${
                    m.is_sales ? '' : ' ·'}</option>`).join('')}
              </select></div>
          </div>
          <div><label>Kanali</label>
            <select id="cChannel"><option value="">—</option>
              ${channels.map(ch => `<option value="${ch.code}"
                ${c?.channel === ch.code ? 'selected' : ''}>${esc(ch.name)}</option>`).join('')}
            </select></div>
          <!-- Boshlang'ich qarzdorlik: tizim ishga tushgan kundagi qarz.
               Bir marta kiritiladi, keyin kassa moduli undan davom etadi.
               Maydon ISHORALI: musbat — mijoz bizga qarzdor, manfiy —
               biz mijozga (oldindan to'lov). Ikkita maydon qilinmadi:
               bittasi to'ldirilib ikkinchisi unutilsa qarz ikki xil
               joyda yotib qolardi. Qaysi tomon ekani yozayotganda
               ostida chiqadi. -->
          <div class="row" style="gap:12px">
            <div style="flex:1"><label>Boshlang'ich qarz, $</label>
              <input id="cDebt" type="number" step="0.01" placeholder="—"
                     oninput="debtSide()" value="${c?.opening_debt ?? ''}"></div>
            <div style="flex:1"><label>Qarz sanasi</label>
              <input id="cDebtOn" type="date"
                     value="${(c?.opening_debt_on || '').slice(0, 10)}"></div>
          </div>
          <p class="muted" style="font-size:12px;margin:-6px 0 0" id="cDebtHint"></p>
          <div><label>Izoh</label><input id="cNote"></div>
          <button class="primary" onclick="save(${id || 'null'})">Saqlash</button>
        </div>
      </div></div>`;
  fillRegions();
  debtSide();
}

// Region ro'yxati respublikaga qarab o'zgaradi. Maydon matnli — ro'yxatda
// yo'q shaharni ham yozish mumkin.
function fillRegions(){
  const list = GEO[$('cCountry').value] || [];
  $('regionList').innerHTML = list.map(r => `<option value="${esc(r)}">`).join('');
}

function openImport(){
  $('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)close_()">
      <div class="modal" style="max-width:680px">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h1>Ro'yxatni import qilish</h1><button onclick="close_()">Yopish</button></div>
        <p class="muted" style="margin-bottom:8px">Zavod ro'yxatini Excel yoki CSV
          faylda bering — ustunlar tartibi muhim emas, sarlavhasiga qarab
          o'qiladi: <code>Mijoz</code>, <code>Tel</code>, <code>Region</code>,
          <code>Kanal</code>, <code>Menejer</code>, <code>Qarzdor</code>,
          <code>Haqdor</code>, <code>Qarz sanasi</code>.</p>
        <p class="muted" style="margin-bottom:8px;font-size:13px">
          <b>Qarzdor</b> — mijozning bizga qarzi, <b>Haqdor</b> — bizning
          mijozga qarzimiz (oldindan to'lov). Ikkovi alohida ustun; bitta
          ustunda minus bilan yozilgani ham o'qiladi. <b>Qarz sanasi</b> —
          shu qarz qaysi kun holatiga; bo'sh qolsa hisobotda eng boshida
          turadi.</p>
        <div class="row" style="gap:10px;margin-bottom:16px">
          <button class="primary" onclick="$('impFile').click()">Fayl tanlash</button>
          <button onclick="ctemplate()">Namuna fayl</button>
          <input id="impFile" type="file" accept=".xlsx,.csv,.txt" style="display:none"
                 onchange="cpick(this)">
        </div>
        <div id="impOut"></div>

        <p class="muted" style="margin:18px 0 14px;font-size:13px">Yoki qo'lda:
          har qator bitta mijoz, maydonlar nuqtali vergul bilan ajratiladi:<br>
          <code>Mijoz nomi ; Respublika ; Region ; Tel raqami ; Kanal ; Savdo menejeri</code></p>
        <p class="muted" style="margin-bottom:14px;font-size:13px">Respublika bo'sh
          qoldirilsa O'zbekiston deb olinadi.</p>
        <p class="muted" style="margin-bottom:14px;font-size:13px">Kanal kodlari:
          ${channels.map(c => esc(c.code)).join(' · ')}</p>
        <p class="muted" style="margin-bottom:14px;font-size:13px">Savdo menejeri —
          xodim ismi, aynan ro'yxatdagidek. Bo'sh qoldirilsa biriktirilmaydi.
          Hozir bor: ${managers.map(m => esc(m.name)).join(' · ')}</p>
        <textarea id="imp" rows="10" style="width:100%;font:13px ui-monospace,monospace;
          background:var(--surface-2);color:var(--text);border:1px solid var(--line);
          border-radius:10px;padding:12px"
          placeholder="Sardor Alimov ; O'zbekiston ; Toshkent shahri ; +998901112233 ; B2B ; Pulatov Soyibjon
Mebel Savdo MCHJ ; Qozog'iston ; Almati ; +77015554433 ; EXPORT ; Jomonqulov Shamshod"></textarea>
        <button class="primary" style="width:100%;margin-top:14px" onclick="runImport()">Import qilish</button>
      </div></div>`;
}

// ────────────────────────────────────────────────── FAYLDAN
//  Qo'lda kiritish ustunlar TARTIBIGA bog'liq: zavodning Excel'i esa o'z
//  tartibida keladi va uni qayta chizish 200 qatorda bir soat. Fayl esa
//  sarlavhasiga qarab o'qiladi.
//
//  Ikki bosqich, qoldiq yuklash bilan bir xil sababdan: avval nima
//  kirishini ko'rsatadi, xato bo'lsa hech narsa saqlanmaydi.
let cpicked = null;

function ctemplate() {
  //  Qarzdor va haqdor ALOHIDA ustun: zavod ro'yxati shunday yuritiladi
  //  va minus qo'yishni hech kim unutmaydi. Ikkalasi ham o'qiladi.
  const head = ['Mijoz nomi', 'Tel raqami', 'Davlat', 'Region', 'Kanal',
                'Savdo menejeri', 'Qarzdor', 'Haqdor', 'Qarz sanasi', 'Izoh'];
  const rows = [
    ['Sardor Alimov', '+998901112233', "O'zbekiston", 'Toshkent shahri', 'B2C',
     '', '', '', '', ''],
    ['Mebel Savdo MCHJ', '+77015554433', 'Qozog\'iston', 'Almati', 'EXPORT',
     '', '1250', '', '01.09.2026', ''],
    ['Oq Saroy mebel', '+998907778899', "O'zbekiston", 'Samarqand', 'B2B',
     '', '', '400', '01.09.2026', 'oldindan to\'lagan'],
  ];
  const csv = '\uFEFF' + [head, ...rows].map(r => r.join(';')).join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'),
                          { href: url, download: 'mijozlar-namuna.csv' });
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function cpick(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  cpicked = file;
  $('impOut').innerHTML = `<p class="muted">Tekshirilmoqda\u2026</p>`;
  try { cshow(await App.upload('/api/import/customers', file), file.name); }
  catch (e) { $('impOut').innerHTML =
    `<p class="tag bad" style="display:block">${esc(e.message)}</p>`; }
}

function cshow(r, filename) {
  const bad = r.rows.filter(x => x.errors.length);
  $('impOut').innerHTML = `
    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <b>${esc(filename)}</b>
        <span class="muted" style="font-size:13px">${r.total} qator \u00b7
          ${r.updates} tasi mavjud mijoz</span>
      </div>
      ${r.unknown.length ? `<p class="muted" style="font-size:12px;margin-bottom:10px">
        Tanilmagan ustunlar (o'qilmaydi): ${esc(r.unknown.join(', '))}</p>` : ''}
      ${(r.matched_managers || []).length ? `
        <p class="muted" style="font-size:12px;margin-bottom:10px">
          Xodim to'liq ismi bo'yicha topildi: ${esc(r.matched_managers.join(' · '))}</p>` : ''}
      ${(r.missing_managers || []).length ? `
        <p class="tag bad" style="display:block;margin-bottom:10px">
          Bu savdo xodimlari ro'yxatda yo'q:
          <b>${esc(r.missing_managers.join(', '))}</b><br>
          Avval <b>Xodimlar</b> sahifasidan qo'shing, keyin faylni qayta tanlang.
        </p>` : ''}
      ${bad.length ? `
        <div style="max-height:30vh;overflow:auto;margin-bottom:10px">
          <table><tbody>${bad.map(x => `
            <tr><td style="width:70px" class="muted">${x.line}-qator</td>
                <td>${esc(x.errors.join(' \u00b7 '))}</td></tr>`).join('')}</tbody></table>
        </div>
        <p class="muted" style="font-size:13px">${r.bad} ta qatorda xato bor.
          Faylni tuzatib qaytadan tanlang \u2014 xato qator bo'lsa hech narsa
          saqlanmaydi.</p>`
      : `<p class="muted" style="font-size:13px;margin-bottom:12px">Hamma qator to'g'ri.${
          r.updates ? ` Mavjud ${r.updates} ta mijozning faqat bo'sh maydonlari
          to'ldiriladi \u2014 yozilgani o'chmaydi.` : ''}</p>
        <button class="primary" id="cSave" onclick="csave()" style="width:100%"
          >${r.total} ta mijozni saqlash</button>`}
    </div>`;
}

async function csave() {
  $('cSave').disabled = true;
  try {
    const r = await App.upload('/api/import/customers?save=1', cpicked);
    close_(); await load();
    alert(`${r.saved} ta mijoz kiritildi.` +
          (r.updated ? ` Shundan ${r.updated} tasi yangilandi.` : ''));
  } catch (e) {
    alert(e.message);
    const b = $('cSave'); if (b) b.disabled = false;
  }
}

async function runImport(){
  const unknown = new Set();
  const items = $('imp').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [name, country, region, phone, channel, manager] =
      l.split(';').map(x => (x || '').trim());
    const m = manager
      ? managers.find(w => w.name.toLowerCase() === manager.toLowerCase()) : null;
    if (manager && !m) unknown.add(manager);
    return { name, country: country || null, region: region || null,
             phone: phone || null, channel: channel ? channel.toUpperCase() : null,
             manager_id: m ? m.id : null };
  }).filter(x => x.name);
  if (!items.length) return alert('Qator topilmadi');
  // Nomi topilmagan menejer jim o'tkazib yuborilsa, mijoz menejersiz kirib
  // qolardi va menejer hisobotidan tushib qolardi. Shuning uchun to'xtatamiz.
  if (unknown.size) return alert('Bu xodimlar ro\'yxatda yo\'q:\n\n' +
    [...unknown].join('\n') +
    '\n\nAvval Xodimlar sahifasida qo\'shing, keyin qayta import qiling.');
  try{
    const r = await App.api('/api/units/customers',
      { method:'POST', body: JSON.stringify({ items }) });
    close_(); await load();
    alert(`${r.saved.length} ta mijoz kiritildi.`);
  }catch(e){ alert(e.message); }
}

const close_ = () => { $('modalRoot').innerHTML = ''; };

async function save(id){
  const body = {
    name: $('cName').value.trim(),
    country: $('cCountry').value || null,
    region: $('cRegion').value.trim() || null,
    manager_id: $('cManager').value || null,
    phone: $('cPhone').value.trim() || null,
    channel: $('cChannel').value || null,
    note: $('cNote').value.trim() || null,
    opening_debt: $('cDebt').value === '' ? null : Number($('cDebt').value),
    opening_debt_on: $('cDebtOn').value || null,
  };
  if (!body.name) return alert('Mijoz nomi majburiy');
  try{
    await App.api(id ? '/api/units/customers/' + id : '/api/units/customers',
      { method: id ? 'PATCH' : 'POST', body: JSON.stringify(body) });
    close_(); load();
  }catch(e){ alert(e.message); }
}

App.start(load, 'production.view');
</script>
</body>
</html>
