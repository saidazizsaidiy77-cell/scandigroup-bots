<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konver · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
/*  Uchta yig'indi — sarlavhadagi bitta gap: nechtasi hali tsexda,
    nechtasi javonda, nechtasi mijozda. Kartochka bo'lib turadi, chunki
    savolning javobi shu uch raqam; qatorlar esa tafsilot. */
.k-sum{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin-bottom:16px}
.k-sum .b{background:var(--surface-2);border-radius:var(--radius);padding:12px 14px}
.k-sum .t{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted)}
.k-sum .n{font-size:24px;font-weight:600;margin-top:4px}
/*  Joy — javobning O'ZI, shuning uchun qalin. Yonidagi mayda yozuv
    uni to'ldiradi (sana, zakaz), almashtirmaydi. */
.k-joy{font-weight:600}
/*  Sarfni chop etish: qog'ozga FAQAT sarf kartochkasi chiqadi —
    qidiruv va joylar jadvali u varaqning savoli emas. */
@media print{
  body.sarfp #qCard, body.sarfp #body>.card:not(#sarfCard){display:none!important}
}
</style>
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Konver</h1></div>
  <span class="row" id="erpUser"></span>
</div>
<div id="erpNav"></div>

<div class="card" id="qCard" style="margin-bottom:16px">
  <!--  BITTA katak: savol ham bitta — «shu raqam qayerda». Filtr
        ro'yxati qo'shilmadi, u boshqa savolga javob beradi va u
        jurnalda allaqachon bor. -->
  <label>Konveyer raqami</label>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <input id="q" placeholder="S26-474" style="max-width:260px"
      onkeydown="if(event.key==='Enter')qidir()">
    <button class="primary" onclick="qidir()">Qidirish</button>
  </div>
  <div class="hint">Raqam bo'yicha: nechta yasalgan, hozir qayerda va
    kimga chiqib ketgan</div>
</div>

<div id="body"></div>

<script>
// ============================================================================
//  KONVER PASPORTI — bitta raqam, butun tarix
//
//  Zavodning eng ko'p beriladigan savoli: «S26-474 qayerda?». Javobi
//  esa bitta joyda emas edi — konver BO'LINADI va bo'laklari uch xil
//  joyda turadi: bir qismi tsexda, bir qismi javonda, bir qismi
//  allaqachon mijozda. Buni bilish uchun jurnalni, ombor qoldig'ini va
//  buyurtmalar ro'yxatini birin-ketin ochib chiqish kerak edi.
//
//  ★ HOLAT SAHIFADA HISOBLANMAYDI: `joy` ustunini SERVER beradi
//  (buyurtmalar ro'yxatidagi `HOLAT` bilan bir xil qoida) — ikki joyda
//  yozilgan shart bir kun ajralib ketardi va ekran jurnaldagidan
//  boshqa javob berib qolardi.
//
//  Narx YO'Q: ishlab chiqarish jurnali bilan bir xil qoida — u savdo
//  va kassaniki.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const d8 = v => !v ? '' : (s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`)(String(v).slice(0,10));

async function qidir() {
  const no = $('q').value.trim();
  if (!no) return;
  history.replaceState(null, '', '?no=' + encodeURIComponent(no));
  $('body').innerHTML = `<p class="muted">Yuklanmoqda…</p>`;
  try {
    chiz(await App.api('/api/units/track?no=' + encodeURIComponent(no)));
  } catch (e) {
    $('body').innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`;
  }
}

function chiz(d) {
  //  Topilmagani ham JAVOB: raqam noto'g'ri yozilgani yoki konver
  //  hali ochilmagani — ikkalasida ham keyingi qadam bitta.
  if (!d.found) {
    $('body').innerHTML = `<div class="card">
      <h2 style="margin-bottom:6px">${esc(d.conveyor_no)} — topilmadi</h2>
      <p class="muted" style="font-size:13px">Bunday raqamli konver yo'q.
        Raqamni tekshiring: harfi ham muhim (S — stul, K — korpus,
        C — stol, MT — matras).</p></div>`;
    return;
  }
  const u = d.uom || 'dona';
  $('body').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px;
        margin-bottom:14px">
        <div>
          <h2 style="margin:0">${esc(d.conveyor_no)}</h2>
          <div style="margin-top:4px">${esc(d.product)}
            <span class="muted">· ${esc(d.product_type || '')}</span></div>
          <div class="muted" style="font-size:13px;margin-top:2px">${
            [d.color, d.fabric].filter(Boolean).map(esc).join(' · ')
            || 'rangi tanlanmagan'}</div>
        </div>
        <div class="muted" style="font-size:13px;text-align:right">
          Boshlangan<div style="font-size:15px;color:var(--text)">${
            d8(d.started_on) || '—'}</div></div>
      </div>

      <!--  Yig'indi TO'RTTA raqam va ular bir-birini to'ldiradi:
            jami = tsexda + omborda + chiqdi. Bo'sh bo'lgani ham
            yoziladi (nol), chunki bo'sh katak savol qoldirardi. -->
      <div class="k-sum">
        <div class="b"><div class="t">Jami yasalgan</div>
          <div class="n">${d.total} <span class="muted"
            style="font-size:14px">${esc(u)}</span></div></div>
        <div class="b"><div class="t">Ishlab chiqarishda</div>
          <div class="n">${d.tsexda}</div></div>
        <div class="b"><div class="t">Omborda</div>
          <div class="n">${d.omborda}</div></div>
        <div class="b"><div class="t">Mijozga chiqdi</div>
          <div class="n">${d.chiqdi}</div></div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:10px">Qayerda turibdi</h2>
      <div class="tbox"><table>
        <thead><tr><th>Joy</th><th class="num">Soni</th>
          <th>Hujjat</th><th>Sana</th></tr></thead>
        <tbody>${d.rows.map(qator).join('')}</tbody></table></div>
    </div>
    <div class="card" id="sarfCard" style="margin-top:16px"></div>`;
  sarf(d);
}

// ============================================================================
//  ★ XOM ASHYO SARFI (zavod qarori, 2026-10). Sarf ▣ oynasidan yoziladi,
//  lekin uni TEKSHIRADIGAN joy yo'q edi: oyna bitta BO'LAKNI ko'rsatadi,
//  konver esa bo'linadi. Ro'yxat RAQAMNING hamma qatori bo'yicha
//  (`GET /api/materials/conveyor`) va pastda material bo'yicha jami.
//  Narx faqat server bergan holda (narx huquqi) — pasportning o'zida pul yo'q.
const n3 = (v) => Number(v || 0).toLocaleString('ru-RU', { maximumFractionDigits: 3 });
const n2 = (v) => Number(v || 0).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let SARF = null;
async function sarf(d) {
  const el = $('sarfCard');
  if (!App.can('materials.view', 'materials.manage', 'materials.request',
               'production.manage', 'production.view', 'production.entry')) {
    el.remove(); return;
  }
  el.innerHTML = `<p class="muted">Xom ashyo yuklanmoqda…</p>`;
  try { SARF = await App.api('/api/materials/conveyor?no=' + encodeURIComponent(d.conveyor_no)); }
  catch (e) { el.innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  SARF.product = `${d.product}${d.product_type ? ' · ' + d.product_type : ''}`;
  SARF.total = d.total; SARF.uom = d.uom || 'dona';
  const narx = SARF.narx;
  const ok = SARF.rows.filter((r) => r.status === 'ok');
  //  Material bo'yicha jami — tekshiruvning savoli «nima, qancha ketdi».
  const jam = new Map();
  for (const r of ok) {
    const j = jam.get(r.material_id) || { material: r.material, code: r.code,
      uom: r.uom, qty: 0, sum: 0, narxsiz: false };
    j.qty += Number(r.qty);
    if (r.price == null) j.narxsiz = true; else j.sum += Number(r.qty) * Number(r.price);
    jam.set(r.material_id, j);
  }
  const jami = [...jam.values()].reduce((s, j) => s + j.sum, 0);
  const sum = (r) => r.price == null ? '<span class="muted">—</span>'
                                     : n2(Number(r.qty) * Number(r.price));
  el.innerHTML = `
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;
      margin-bottom:10px">
      <h2 style="margin:0">Xom ashyo sarfi</h2>
      ${SARF.rows.length ? `<button class="no-print" onclick="sarfChop()">Chop etish</button>` : ''}
    </div>
    <div id="sarfHead" class="print-only print-head"></div>
    ${!SARF.rows.length
      ? `<p class="muted" style="font-size:13px">Bu konverga hali xom ashyo
           biriktirilmagan. Sarf tsex ekranidagi ▣ tugmasidan yoziladi.</p>`
      : `<div class="tbox"><table>
        <thead><tr><th>Sana</th><th>Material</th><th class="num">Soni</th>
          <th class="num">Donaga</th><th>Ombor · bo'lim</th><th>Kim</th>
          ${narx ? '<th class="num">Narx, $</th><th class="num">Summa, $</th>' : ''}</tr></thead>
        <tbody>${SARF.rows.map((r) => `<tr${r.status !== 'ok'
            ? ' style="opacity:.5;text-decoration:line-through" title="bekor qilingan"' : ''}>
          <td>${d8(r.moved_on)}</td>
          <td>${esc(r.material)}${r.code ? ` <span class="muted">${esc(r.code)}</span>` : ''}</td>
          <td class="num">${n3(r.qty)} <span class="muted">${esc(r.uom || '')}</span></td>
          <td class="num">${r.unit_qty ?? '<span class="muted">—</span>'}</td>
          <td>${esc(r.warehouse || '')}${r.section ? ` <span class="muted">· ${esc(r.section)}</span>` : ''}</td>
          <td>${esc(r.worker || '')}</td>
          ${narx ? `<td class="num">${r.price == null ? '<span class="muted">—</span>' : n2(r.price)}</td>
                    <td class="num">${sum(r)}</td>` : ''}</tr>`).join('')}</tbody></table></div>
      <h3 style="margin:14px 0 8px;font-size:14px">Material bo'yicha jami</h3>
      <div class="tbox"><table>
        <thead><tr><th>Material</th><th class="num">Soni</th>
          ${narx ? '<th class="num">Summa, $</th>' : ''}</tr></thead>
        <tbody>${[...jam.values()].map((j) => `<tr>
          <td>${esc(j.material)}${j.code ? ` <span class="muted">${esc(j.code)}</span>` : ''}</td>
          <td class="num">${n3(j.qty)} <span class="muted">${esc(j.uom || '')}</span></td>
          ${narx ? `<td class="num">${n2(j.sum)}${j.narxsiz
            ? ' <span class="late" title="ba\'zi qatorda narx yo\'q">*</span>' : ''}</td>` : ''}</tr>`).join('')}
        ${narx ? `<tr><td><b>Jami</b></td><td></td><td class="num"><b>${n2(jami)}</b></td></tr>
          <tr><td colspan="3" class="muted" style="font-size:12px">Donaga: ${
            SARF.total ? n2(jami / SARF.total) : '—'} $ (${SARF.total} ${esc(SARF.uom)})
            · narx — manba omborning o'rtacha kirim narxi</td></tr>` : ''}
        </tbody></table></div>`}`;
}

//  Varaq o'zi aytsin: qaysi konver, qaysi mahsulot, kim va qachon
//  chop etdi (qarzdorlik hisoboti bilan bir xil idiom).
function sarfChop() {
  const now = new Date();
  const ikki = (n) => String(n).padStart(2, '0');
  const xodim = App.me()?.name ? ` \u00b7 ${esc(App.me().name)}` : '';
  $('sarfHead').innerHTML = `
    <h1>Xom ashyo sarfi \u00b7 ${esc(SARF.conveyor_no)}</h1>
    <div class="meta">${esc(SARF.product)} \u00b7 ${SARF.total} ${esc(SARF.uom)}</div>
    <div class="meta">chop etildi ${ikki(now.getDate())}.${ikki(now.getMonth() + 1)}.${
      now.getFullYear()} ${ikki(now.getHours())}:${ikki(now.getMinutes())}${xodim}</div>`;
  document.body.classList.add('sarfp');
  window.print();
  document.body.classList.remove('sarfp');
}

function qator(r) {
  //  Hujjat ustuni har holatda BOSHQA savolga javob beradi va shu
  //  sababdan bitta ustun: chiqib ketganida «qaysi yuk xati bilan»,
  //  omborda turganida «kim kutmoqda», tsexda esa «jo'natilganmi».
  const hujjat =
    r.status === 'shipped'
      ? (r.order_id && r.order_status !== 'shipped'
          //  ★ BUYURTMA HALI CHIQMAGAN, konver esa «chiqib ketgan»:
          //  yuk xati yo'q, qarz bor. Javob ham, tugma ham shu yerda.
          ? `<a href="/buyurtmalar.html?id=${r.order_id}" target="_blank"
               >${esc(r.order_no)}</a>
             <span class="tag warn" title="Qarzga yozilgan, yuk xati yo'q"
               >buyurtma chiqmagan</span>${canFix ? `
             <button title="Mahsulot boshqa buyurtma bilan chiqqan"
               style="padding:4px 9px;font-size:12px"
               onclick="biriktir(${r.id}, '${esc(r.conveyor_no)}', ${r.qty})"
               >+ hujjat</button>
             <button title="Chiqim adashib yozilgan — mahsulot omborda"
               style="padding:4px 9px;font-size:12px"
               onclick="omborga(${r.id}, '${esc(r.conveyor_no)}', ${r.qty})"
               >↩ omborga</button>` : ''}`
        : r.order_id
          ? `<a href="/yukxati.html?id=${r.order_id}" target="_blank"
               >${esc(r.order_no || 'yuk xati')}</a>`
          //  ★ EGASIZ CHIQQAN KONVERDA — TUZATISH TUGMASI. Bo'sh
          //  katak bu yerda javob emas, savol: mahsulot zavoddan
          //  chiqqan, lekin hujjati ham, mijozi ham yo'q — ya'ni
          //  foyda-zararda turadi, mijozning qarzida esa yo'q.
          //  Tugma faqat `sales.fix` da (administrator): yopilgan
          //  hujjatga tegadigan har yo'l bilan bir xil qoida.
          : r.order_no ? esc(r.order_no)
          : canFix && !r.customer
            ? `<button title="Buyurtmaga biriktirish"
                 style="padding:4px 9px;font-size:12px"
                 onclick="biriktir(${r.id}, '${esc(r.conveyor_no)}', ${r.qty})"
                 >+ hujjat</button>
               <button title="Chiqim adashib yozilgan — mahsulot omborda"
                 style="padding:4px 9px;font-size:12px"
                 onclick="omborga(${r.id}, '${esc(r.conveyor_no)}', ${r.qty})"
                 >↩ omborga</button>`
            : `<span class="muted">hujjat yo'q</span>`)
    : r.booked
      ? (r.bron || []).map((b) => `${esc(b.customer)} — ${b.qty} ta${
          b.order_no ? ` <span class="muted">${esc(b.order_no)}</span>` : ''}`)
          .join('<br>')
    : r.status === 'production' && r.handover_on
      ? `<span class="tag warn">jo'natilgan</span>`
    : r.is_stock ? `<span class="muted">zahira</span>` : '';

  const sana = r.status === 'shipped' ? r.ship_on
             : r.status === 'fg'      ? r.fg_on : null;
  return `<tr${r.status === 'cancelled' ? ' style="opacity:.55"' : ''}>
    <td class="k-joy">${esc(r.joy)}</td>
    <td class="num">${r.qty}</td>
    <td>${hujjat}</td>
    <td>${d8(sana) || '<span class="muted">—</span>'}</td></tr>`;
}

//  ★ BIRIKTIRISH IKKI SAVOL SO'RAYDI: qaysi hujjat va NEGA. Sabab
//  majburiy (yopilgan hujjatga tegadigan har yo'l bilan bir xil
//  idiom) va tekshiruvlar SERVERDA: buyurtma chiqib ketganmi, shu
//  mahsulotning qatori bormi, narx aniqmi.
//
//  Qator O'ZI tenglashmaydi: yuk xatida 6 turgan joyda 29 chiqib
//  ketgan bo'lishi mumkin — uni buyurtma ekranidagi ✕ tenglashtiradi
//  va u sonini OLDIN aytadi. Shuning uchun javobda keyingi qadam
//  yozilib turadi.
async function biriktir(id, nomer, qty) {
  let rows = [];
  try { rows = (await App.api('/api/sales/units/' + id + '/attach-candidates')).rows; }
  catch (e) { /* ro'yxat bo'lmasa ham qo'lda yozish qoladi */ }
  //  Nomzodlar ro'yxati — shu mahsulotdan yuk xatidagidan KAM chiqqan
  //  buyurtmalar, chiqqan kuni yaqini tepada. Qo'lda yozish ham qoladi:
  //  taklif to'liq bo'lmasligi mumkin.
  const el = document.createElement('div');
  el.id = 'bxOyna';
  el.innerHTML = `<div class="overlay" onclick="if(event.target===this)bxYop()">
    <div class="modal" style="max-width:760px">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h1 style="margin:0">${esc(nomer)} — buyurtmaga biriktirish</h1>
        <button onclick="bxYop()">Orqaga</button></div>
      <p class="muted" style="margin-bottom:14px">${qty} ta zavoddan chiqqan,
        lekin mijozi va hujjati yozilmagan. Pastda shu mahsulotdan yuk
        xatidagidan KAM chiqqan buyurtmalar — chiqqan kuni yaqini tepada.</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Zakaz</th><th>Mijoz</th><th>Chiqqan</th>
          <th class="num">Yuk xatida</th><th class="num">Chiqqani</th>
          <th class="num">Yetishmaydi</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.map((r) => `<tr>
          <td><a href="/yukxati.html?id=${r.id}" target="_blank">${esc(r.order_no)}</a></td>
          <td>${esc(r.customer || '')}</td>
          <td>${d8(r.shipped_on) || '—'}</td>
          <td class="num">${r.item_qty}</td>
          <td class="num">${r.chiqdi}</td>
          <td class="num"><b class="${r.kam === qty ? '' : 'muted'}">${r.kam}</b></td>
          <td class="num"><button class="primary"
            onclick="bxOl(${id}, '${esc(nomer)}', '${esc(r.order_no)}')">Biriktirish</button></td>
        </tr>`).join('')
          : `<tr><td colspan="7" class="muted">Shu mahsulotdan kam chiqqan
              buyurtma topilmadi — zakaz raqamini pastda qo'lda yozing.</td></tr>`}</tbody>
      </table></div>
      <div class="row" style="gap:8px;margin-top:16px">
        <input id="bxNo" placeholder="Zakaz raqami, masalan Z26-0891" style="max-width:260px">
        <button onclick="bxOl(${id}, '${esc(nomer)}', $('bxNo').value)">Biriktirish</button>
      </div>
    </div></div>`;
  document.body.appendChild(el);
}

//  Egasiz chiqim umuman bo'lmagan bo'lsa — mahsulot javonda turibdi.
async function omborga(id, nomer, qty) {
  const sabab = prompt(nomer + ' — ' + qty + ' ta T/M omborga qaytariladi '
    + '(chiqim adashib yozilgan, mahsulot javonda).\n\nSababi:');
  if (!sabab || !sabab.trim()) return;
  try {
    await App.api('/api/sales/units/' + id + '/unship',
      { method: 'POST', body: { note: sabab.trim() } });
    await qidir();
  } catch (e) { alert(e.message); }
}

function bxYop() { $('bxOyna')?.remove(); }

async function bxOl(id, nomer, no) {
  no = String(no || '').trim();
  if (!no) return alert('Zakaz raqami yozilmagan');
  const sabab = prompt(nomer + ' → ' + no + ' ga biriktirilsin. Sababi:');
  if (!sabab || !sabab.trim()) return;
  try {
    const r = await App.api('/api/sales/units/' + id + '/attach', {
      method: 'POST',
      body: { order_no: no, note: sabab.trim() },
    });
    bxYop();
    alert(nomer + ' → ' + r.order_no + ' · ' + (r.customer || '')
      + '\n' + r.qty + ' ta, ' + r.unit_price + ' $'
      + '\n\nYuk xatining qatori chiqqan donaga to\'g\'ri kelmasa, '
      + 'buyurtma ekranidagi ✕ bilan tenglashtiring.');
    await qidir();
  } catch (e) { alert(e.message); }
}

let canFix = false;
App.start(async () => {
  canFix = App.can('sales.fix');
  const no = new URLSearchParams(location.search).get('no');
  if (no) { $('q').value = no; await qidir(); }
  else $('q').focus();
}, 'production.view', 'production.entry', 'warehouse.view', 'sales.view');
</script>
</body>
</html>
