<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kassa · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
/*  Maydonlar bir xil kenglikdagi panjarada va TEPADAN tekislanadi: sana
    katagi ochilma ro'yxatdan bir necha piksel baland va pastdan
    tekislansa sarlavhalar siljib qolardi. */
.fields{display:grid;gap:14px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.fields .wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:17px}

/*  ORDER — bankdagi to'lov topshiriqnomasiga o'xshash oyna: tepada
    hujjat nomi va kassa, ostida maydonlar, pastda dollardagi summa.
    Kassir qog'ozdagi hujjatni to'ldirgandek to'ldiradi. */
.ord-head{text-align:center;padding:2px 0 16px;border-bottom:1px solid var(--line);
  margin-bottom:18px}
.ord-head .t{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted)}
.ord-head .n{font-size:18px;font-weight:600;margin-top:5px}
.ord-sum{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  flex-wrap:wrap}
.ord-sum .big{font-size:26px;font-weight:600}
</style>
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1 id="title">Kassa</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div id="kpis" class="grid" style="margin-bottom:16px"></div>
<div class="row" id="btnBar" style="gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
<div class="row" id="tabs" style="margin-bottom:16px;gap:8px;flex-wrap:wrap"></div>
<div id="body"></div>
<div id="modalRoot"></div>

<script>
// ============================================================================
//  BITTA KASSANING ICHI
//
//  Manzil kassani aytadi: `/kassa.html?a=MAIN`. `a=me` — xodimning O'Z
//  qo'lidagi pul: menejer uchun bu uning yagona «kassasi», kassir uchun
//  esa oddiy qo'ldagi pul.
//
//  Uchta tab bitta savolning uch tomoni: bu yerga nima KELDI, bu yerdan
//  nima KETDI, va hammasi birga. Yo'nalish SHU joyga nisbatan — menejerdan
//  kassaga o'tgan pul menejerda chiqim, kassada kirim, va ikkalasi ham
//  to'g'ri.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const d8 = v => !v ? '—'
  : (s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`)(String(v).slice(0,10));
//  So'm butun sanaladi, dollar tiyinigacha.
const uzs = v => (Number(v) || 0).toLocaleString('ru-RU', { maximumFractionDigits: 0 });
const usd = v => (Number(v) || 0).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const A = new URLSearchParams(location.search).get('a') || 'me';
const isMe = () => A === 'me';
let refs = null, here = null, ops = [], tab = 'in', boss = false;
const f = { from: '', to: '', q: '' };

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// ─────────────────────────────────────────────────────────── SARLAVHA
function drawHead() {
  here.title = isMe() ? 'Mening pulim' : here.name;
  $('title').textContent = here.title;
  document.title = here.title + ' · ZELTA';
  $('kpis').innerHTML = [
    ["So'm", uzs(here.uzs), 'naqd so\'m'],
    ['Dollar', usd(here.usd), 'naqd dollar'],
    ['Jami', usd(here.total_usd) + ' $', 'kirgan kurs bilan'],
  ].map(([t, v, s]) => `<div class="card"><h2>${t}</h2><div class="kpi">${v}</div>
      <div class="muted" style="font-size:13px">${s}</div></div>`).join('');

  //  Kirim har doim bor. Chiqim va ko'chirish faqat KASSADA va faqat
  //  kassirda: menejer o'z qo'lidagi pulni faqat kassirga topshiradi,
  //  uni o'zi sarflay olmaydi.
  const btn = [['in', isMe() ? 'Mijozdan pul olindi' : 'Kirim']];
  if (!isMe() && boss) btn.push(['out', 'Chiqim'], ['move', "Ko'chirish / valyuta"]);
  $('btnBar').innerHTML = btn.map(([k, t], i) =>
    `<button ${i === 0 ? 'class="primary"' : ''} onclick="openForm('${k}')">${t}</button>`).join('')
    + (!isMe() && boss ? `<button class="ic" title="Boshlang'ich qoldiq"
         onclick="openOpening()" style="margin-left:6px">✎ Boshlang'ich qoldiq</button>` : '');

  $('tabs').innerHTML = [['in', 'Kirim'], ['out', 'Chiqim'], ['all', 'Hammasi']]
    .map(([k, t]) => `<button ${k === tab ? 'class="primary"' : ''}
      onclick="go('${k}')">${t}</button>`).join('');
}

async function go(k) { tab = k; drawHead(); await loadOps(); }

// ───────────────────────────────────────────────────────────── LENTA
async function loadOps() {
  const q = new URLSearchParams({ a: A });
  if (tab !== 'all') q.set('dir', tab);
  Object.entries(f).forEach(([k, v]) => v && q.set(k, v));
  ops = (await App.api('/api/cash/ops?' + q)).rows;
  drawOps();
}
function setF(k, v) { f[k] = v; loadOps(); }
function clearF() { Object.keys(f).forEach(k => f[k] = ''); loadOps(); }

//  «Kim» ustuni — SHU joyga nisbatan ikkinchi tomon: kirimda kimdan
//  keldi, chiqimda kimga ketdi. Ikkala ustunni chiqarish qatorni
//  cho'zardi va har qatorda bittasi baribir «Asosiy kassa» bo'lardi.
const other = o => (o.to_kind === 'account' && o.to_name === here.name)
  || (o.to_kind === 'worker' && isMe()) ? o.from_name : o.to_name;
const kirimmi = o => (isMe() ? o.to_kind === 'worker' : o.to_kind === 'account')
  && (isMe() || o.to_name === here.name);

function drawOps() {
  const bor = f.from || f.to || f.q;
  $('body').innerHTML = `<div class="card" style="margin-bottom:16px">
    <div class="fields">
      <div><label>Sanadan</label>
        <input type="date" value="${esc(f.from)}" onchange="setF('from', this.value)"></div>
      <div><label>Sanagacha</label>
        <input type="date" value="${esc(f.to)}" onchange="setF('to', this.value)"></div>
      <div><label>Qidiruv</label>
        <input value="${esc(f.q)}" placeholder="P26-0001 yoki nom"
          onchange="setF('q', this.value)"></div>
      <div>${bor ? `<label>&nbsp;</label>
        <button style="width:100%" onclick="clearF()">Tozalash</button>` : ''}</div>
    </div></div>
    <div class="card">
    ${ops.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>№</th><th>Sana</th><th>Kim</th><th class="num">Summa</th>
        <th class="num">$</th><th>Izoh</th>${boss ? '<th></th>' : ''}</tr></thead>
      <tbody>${ops.map(o => `<tr${o.status === 'cancelled' ? ' style="opacity:.5"' : ''}>
        <td><b>${esc(o.doc_no)}</b>${o.status === 'cancelled'
          ? ' <span class="tag warn">bekor</span>' : ''}</td>
        <td class="muted">${d8(o.op_date)}</td>
        <td>${kirimmi(o) ? '' : '<span class="muted">→ </span>'}${esc(other(o) || '')}${
          o.expense_group ? `<div class="muted" style="font-size:11.5px">${
            esc(o.expense_group)}${o.pl_month
              ? ' · ' + String(o.pl_month).slice(0, 7) : ''}</div>` : ''}</td>
        <td class="num">${o.currency === 'UZS'
          ? `${uzs(o.amount)} <span class="muted" style="font-size:11px">so'm</span>`
          : `${usd(o.amount)} <span class="muted" style="font-size:11px">$</span>`}</td>
        <td class="num"><b>${kirimmi(o) ? '' : '&minus;'}${usd(o.amount_usd)}</b>${o.rate
          ? `<div class="muted" style="font-size:11px">${uzs(o.rate)}</div>` : ''}</td>
        <td class="muted" style="font-size:12.5px">${esc(o.note || '')}${o.order_no
          ? ` <span class="tag">${esc(o.order_no)}</span>` : ''}</td>
        ${boss ? `<td class="num">${o.status === 'ok'
          ? `<button class="ic" title="Bekor qilish" onclick="cancelOp(${o.id})">×</button>`
          : ''}</td>` : ''}
      </tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">${tab === 'in' ? 'Kirim' : tab === 'out' ? 'Chiqim' : 'Harakat'} yo'q.</p>`}
    </div>`;
}

async function cancelOp(id) {
  if (!confirm('Operatsiya bekor qilinsinmi? Tarixda qoladi, qoldiqdan chiqadi.')) return;
  try { await App.api('/api/cash/ops/' + id, { method: 'PATCH' }); toast('Bekor qilindi'); reload(); }
  catch (e) { toast(e.message, true); }
}

async function reload() {
  const d = await App.api('/api/cash/list');
  boss = d.boss;
  here = isMe() ? d.me : d.rows.find(a => a.code === A);
  if (!here) { $('body').innerHTML = `<div class="card"><h2>Kassa topilmadi</h2></div>`; return; }
  drawHead();
  await loadOps();
}
</script>
<script src="/kassa-form.js"></script>
</body>
</html>
