<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kassa · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
/*  Maydonlar bir xil kenglikdagi panjarada va TEPADAN tekislanadi: sana
    katagi ochilma ro'yxatdan bir necha piksel baland va pastdan
    tekislansa sarlavhalar siljib qolardi. */
.fields{display:grid;gap:14px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.fields .wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:17px}

/*  ORDER — bankdagi to'lov topshiriqnomasiga o'xshash oyna: tepada
    hujjat nomi va kassa, ostida maydonlar, pastda dollardagi summa.
    Kassir qog'ozdagi hujjatni to'ldirgandek to'ldiradi. */
.ord-head{text-align:center;padding:2px 0 16px;border-bottom:1px solid var(--line);
  margin-bottom:18px}
.ord-head .t{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted)}
.ord-head .n{font-size:18px;font-weight:600;margin-top:5px}
.ord-sum{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  flex-wrap:wrap}
.ord-sum .big{font-size:26px;font-weight:600}

/*  TANLASH RO'YXATI — qidirilgani SHU YERDA ko'rinib turadi.
    Ilgari ostida ochilma turardi: odam nomni yozib, topilganini
    ko'rish uchun yana ro'yxatni ochishi kerak edi — bitta tanlov
    uchun ikkita harakat. */
.pick{border:1px solid var(--line);border-radius:10px;overflow:hidden;
  max-height:232px;overflow-y:auto;background:var(--surface-2)}
.pick button{display:block;width:100%;text-align:left;border:0;border-radius:0;
  background:transparent;padding:10px 12px;font-size:14px;color:var(--text);
  border-bottom:1px solid var(--line);cursor:pointer}
.pick button:last-child{border-bottom:0}
.pick button:hover{background:var(--surface)}
.pick button.on{background:var(--accent);color:#fff;font-weight:600}
.pick .none{padding:10px 12px;font-size:13px;color:var(--muted)}
</style>
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1 id="title">Kassa</h1>
    <span id="titleTag"></span></div>
  <div class="row" id="erpUser"></div>
</div>

<div id="kpis" class="grid" style="margin-bottom:16px"></div>
<div class="row" id="btnBar" style="gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
<div class="row" id="tabs" style="margin-bottom:16px;gap:8px;flex-wrap:wrap"></div>
<div id="body"></div>
<div id="modalRoot"></div>

<script>
// ============================================================================
//  BITTA KASSANING ICHI
//
//  Manzil kassani aytadi: `/kassa.html?a=MAIN`. `a=me` — xodimning O'Z
//  qo'lidagi pul: menejer uchun bu uning yagona «kassasi», kassir uchun
//  esa oddiy qo'ldagi pul.
//
//  Uchta tab bitta savolning uch tomoni: bu yerga nima KELDI, bu yerdan
//  nima KETDI, va hammasi birga. Yo'nalish SHU joyga nisbatan — menejerdan
//  kassaga o'tgan pul menejerda chiqim, kassada kirim, va ikkalasi ham
//  to'g'ri.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const d8 = v => !v ? '—'
  : (s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`)(String(v).slice(0,10));
//  So'm butun sanaladi, dollar tiyinigacha.
const uzs = v => (Number(v) || 0).toLocaleString('ru-RU', { maximumFractionDigits: 0 });
const usd = v => (Number(v) || 0).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const A = new URLSearchParams(location.search).get('a') || 'me';
const isMe = () => A === 'me';
//  `a=w12` — kassir ochgan XODIMNING qo'lidagi pul. Uchinchi joy: pul
//  korxonaniki, lekin kassada emas. Sahifa u yerda faqat O'QIYDI —
//  pul berish ham, qabul qilish ham kassaning o'z oynasidan bo'ladi,
//  chunki ikkinchi tomoni baribir kassa.
const W = /^w\d+$/.test(A) ? Number(A.slice(1)) : null;
const isAcc = () => !isMe() && !W;
let refs = null, here = null, ops = [], tab = 'in', boss = false;
const f = { from: '', to: '', q: '' };

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// ─────────────────────────────────────────────────────────── SARLAVHA
function drawHead() {
  here.title = isMe() ? 'Mening pulim' : here.name;
  //  Xodimning qo'lidagi pul kassa EMAS — sarlavha buni aytib turishi
  //  kerak, aks holda ekranda «Bahrom» degan kassa turgandek bo'lardi.
  $('titleTag').innerHTML = W ? `<span class="tag">qo'ldagi pul</span>` : '';
  $('title').textContent = here.title;
  document.title = here.title + ' · ZELTA';
  //  Kassaning O'Z valyutasi birinchi turadi: bank hisob raqamida
  //  oldi-berdi so'mda bo'ladi va ko'z avval o'sha raqamni qidiradi.
  //  Ro'yxatning o'zi o'zgarmaydi — faqat tartibi.
  const somOldin = here.main_ccy === 'UZS';
  const kpi = [
    ["So'm", uzs(here.uzs), 'naqd so\'m'],
    ['Dollar', usd(here.usd), 'naqd dollar'],
  ];
  $('kpis').innerHTML = (somOldin ? kpi : [kpi[1], kpi[0]])
    .concat([['Jami', usd(here.total_usd) + ' $', 'kirgan kurs bilan']])
    .map(([t, v, s]) => `<div class="card"><h2>${t}</h2><div class="kpi">${v}</div>
      <div class="muted" style="font-size:13px">${s}</div></div>`).join('');

  //  Kirim har doim bor. Chiqim va ko'chirish faqat KASSADA va faqat
  //  kassirda: menejer o'z qo'lidagi pulni faqat kassirga topshiradi,
  //  uni o'zi sarflay olmaydi.
  //  «Xodimdan qabul qilish» faqat qo'lida korxona puli bor xodim
  //  bo'lganda chiqadi (`refs.workers` — shularning ro'yxati): topshiradigan
  //  odam yo'q bo'lsa tugma ham kerak emas.
  //  Menejer mijozdan pul oladi, podotchyot olgan xodim esa sarfini
  //  yozadi — ikkalasi ham «o'z puli» sahifasida, lekin bir xil odam
  //  emas. Shuning uchun tugma huquqqa qarab chiqadi: savdo huquqi
  //  yo'q tsex boshlig'iga «Mijozdan pul olindi» degan tugma
  //  ko'rsatish xato bo'lardi.
  const savdo = App.can('sales.view', 'sales.manage');
  const btn = [];
  if (isAcc() || (isMe() && savdo)) btn.push(['in', isMe() ? 'Mijozdan pul olindi' : 'Kirim']);
  //  Qo'lida pul bo'lgan xodim sarfini o'zi yozadi — podotchyot shu
  //  bilan yopiladi (izoh: sql/cash.sql).
  //  Belgisi bor YOKI qo'lida pul turgan odam sarfini yozadi: belgi
  //  kelajak haqida, qo'lidagi pul esa bugungi haqiqat (izoh:
  //  modules/cash.js).
  //  ★ Inkassatorda tugma YO'Q: uning qo'lidagi pul mijozdan
  //  yig'ilgan va uning bitta yo'li bor — kassaga topshiriladi
  //  (izoh: sql/cash.sql, `can_spend_cash`).
  if (isMe() && refs.my && (refs.my.hold || refs.my.puli) && refs.my.sarflaydi)
    btn.push(['spend', 'Harajat yozish']);
  //  ★ KASSIR XODIMNING QO'LIDAGI PULDAN HAM HARAJAT YOZADI.
  //
  //  Podotchyotni xodimning O'ZI yopishi — asosiy yo'l. Lekin hamma
  //  xodim dasturga kirmaydi: u chekni kassirning qo'liga beradi va
  //  o'sha pul qo'lida osilib qolardi. Kassir sahifasida faqat
  //  «Boshlang'ich qoldiq» turardi, ya'ni pulni faqat TUZATIB qo'yish
  //  mumkin edi — bu esa harajatni foyda-zarardan yashirib yuborardi.
  //
  //  Bu yerda turishining sababi: harajatning ikkinchi tomoni KASSA
  //  EMAS, harajat moddasi. Berish va qabul qilish kassaning oynasida,
  //  chunki u yerda ikkinchi tomoni baribir kassa — bu esa unday emas.
  //  Belgisi olib tashlangan xodimda bu tugma ham chiqmaydi: pul
  //  baribir o'sha qo'ldan chiqadi va server rad etadi.
  if (W && boss && here.can_spend_cash !== false)
    btn.push(['spend', 'Harajat yozish']);
  if (isAcc() && boss) {
    if ((refs.workers || []).length) btn.push(['take', 'Xodimdan qabul qilish']);
    //  Berish va qabul qilish yonma-yon turadi — bitta ishning ikki
    //  tomoni. Chiqimning ichida ham qolaveradi, lekin kassir buni
    //  kuniga bir necha marta qiladi va har safar guruh tanlab
    //  o'tirmasin (izoh: kassa-form.js, FORMS.give).
    btn.push(['give', 'Xodimga podotchyot']);
    btn.push(['out', 'Chiqim'], ['move', "Ko'chirish / valyuta"]);
  }
  //  Boshlang'ich qoldiq kassada ham, xodimning qo'lida ham bor: tizim
  //  ishga tushgan kuni pul ikkala joyda turgan edi. Yozadigan odam
  //  bitta — kassir (`cash.manage`).
  //  ★ TUGMA YO'Q BO'LSA SABABI YOZILADI. Qo'lida pul turgan odam
  //  «Harajat yozish» tugmasini topolmay, uni kassirdan so'rab
  //  yurardi — ekran esa nima yetishmayotganini aytmasdi. Bo'sh joy
  //  savol, sababi yozilgan joy javob.
  const puli = Number(here.total_usd || 0) !== 0;
  const ozim = isMe() && refs.my && !refs.my.hold && !refs.my.puli;
  //  Tugma yo'qligining IKKINCHI sababi: pul bor, lekin u sarflanmaydi.
  //  Bo'sh joy savol, sababi yozilgan joy javob.
  const faqatKassaga = isMe() && refs.my && refs.my.sarflaydi === false;
  $('btnBar').innerHTML = btn.map(([k, t], i) =>
    `<button ${i === 0 ? 'class="primary"' : ''} onclick="openForm('${k}')">${t}</button>`).join('')
    + (!isMe() && boss ? `<button class="ic" title="Boshlang'ich qoldiq"
         onclick="openOpening()">✎ Boshlang'ich qoldiq</button>` : '')
    + (ozim ? `<span class="muted" style="font-size:13px"
        >Qo'lingizda korxona puli yo'q — podotchyot berilsa bu yerda
         «Harajat yozish» tugmasi chiqadi.</span>` : '')
    + (faqatKassaga ? `<span class="muted" style="font-size:13px"
        >Qo'lingizdagi pul faqat asosiy kassaga topshiriladi —
         kassir qabul qilganda hisobingiz yopiladi.</span>` : '');

  $('tabs').innerHTML = [['in', 'Kirim'], ['out', 'Chiqim'], ['all', 'Hammasi']]
    .map(([k, t]) => `<button ${k === tab ? 'class="primary"' : ''}
      onclick="go('${k}')">${t}</button>`).join('');
}

async function go(k) { tab = k; drawHead(); await loadOps(); }

// ───────────────────────────────────────────────────────────── LENTA
async function loadOps() {
  const q = new URLSearchParams({ a: A });
  if (tab !== 'all') q.set('dir', tab);
  Object.entries(f).forEach(([k, v]) => v && q.set(k, v));
  ops = (await App.api('/api/cash/ops?' + q)).rows;
  drawOps();
}
function setF(k, v) { f[k] = v; loadOps(); }
function clearF() { Object.keys(f).forEach(k => f[k] = ''); loadOps(); }

//  «Kim» ustuni — SHU joyga nisbatan ikkinchi tomon: kirimda kimdan
//  keldi, chiqimda kimga ketdi. Ikkala ustunni chiqarish qatorni
//  cho'zardi va har qatorda bittasi baribir «Asosiy kassa» bo'lardi.
const other = o => (o.to_kind === 'account' && o.to_name === here.name)
  || (o.to_kind === 'worker' && isMe()) ? o.from_name : o.to_name;
const kirimmi = o => (isMe() ? o.to_kind === 'worker' : o.to_kind === 'account')
  && (isMe() || o.to_name === here.name);

function drawOps() {
  const bor = f.from || f.to || f.q;
  $('body').innerHTML = `<div class="card" style="margin-bottom:16px">
    <div class="fields">
      <div><label>Sanadan</label>
        <input type="date" value="${esc(f.from)}" onchange="setF('from', this.value)"></div>
      <div><label>Sanagacha</label>
        <input type="date" value="${esc(f.to)}" onchange="setF('to', this.value)"></div>
      <div><label>Qidiruv</label>
        <input value="${esc(f.q)}" placeholder="P26-0001 yoki nom"
          onchange="setF('q', this.value)"></div>
      <div>${bor ? `<label>&nbsp;</label>
        <button style="width:100%" onclick="clearF()">Tozalash</button>` : ''}</div>
    </div></div>
    <div class="card">
    ${ops.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>№</th><th>Sana</th><th>Kim</th><th class="num">Summa</th>
        <th class="num">$</th><th>Izoh</th>${boss ? '<th></th>' : ''}</tr></thead>
      <tbody>${ops.map(o => `<tr${o.status === 'cancelled' ? ' style="opacity:.5"' : ''}>
        <td><b>${esc(o.doc_no)}</b>${o.status === 'cancelled'
          ? ' <span class="tag warn">bekor</span>' : ''}</td>
        <td class="muted">${d8(o.op_date)}</td>
        <td>${kirimmi(o) ? '' : '<span class="muted">→ </span>'}${esc(other(o) || '')}${
          o.expense_group ? `<div class="muted" style="font-size:11.5px">${
            esc(o.expense_group)}${o.pl_month
              ? ' · ' + String(o.pl_month).slice(0, 7) : ''}</div>` : ''}</td>
        <td class="num">${o.currency === 'UZS'
          ? `${uzs(o.amount)} <span class="muted" style="font-size:11px">so'm</span>`
          : `${usd(o.amount)} <span class="muted" style="font-size:11px">$</span>`}</td>
        <td class="num"><b>${kirimmi(o) ? '' : '&minus;'}${usd(o.amount_usd)}</b>${o.rate
          ? `<div class="muted" style="font-size:11px">${uzs(o.rate)}</div>` : ''}</td>
        <td class="muted" style="font-size:12.5px">${esc(o.note || '')}${o.order_no
          ? ` <span class="tag">${esc(o.order_no)}</span>` : ''}</td>
        ${boss ? `<td class="num">${o.status === 'ok'
          ? `<button class="ic" title="Bekor qilish" onclick="cancelOp(${o.id})">×</button>`
          : ''}</td>` : ''}
      </tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">${tab === 'in' ? 'Kirim' : tab === 'out' ? 'Chiqim' : 'Harakat'} yo'q.</p>`}
    </div>`;
}

async function cancelOp(id) {
  if (!confirm('Operatsiya bekor qilinsinmi? Tarixda qoladi, qoldiqdan chiqadi.')) return;
  try { await App.api('/api/cash/ops/' + id, { method: 'PATCH' }); toast('Bekor qilindi'); reload(); }
  catch (e) { toast(e.message, true); }
}

async function reload() {
  //  Ro'yxatlar ham qayta o'qiladi: xodim pulni topshirgach uning qo'lida
  //  hech narsa qolmaydi va u «Xodimdan qabul qilish» ro'yxatidan
  //  chiqishi kerak — aks holda kassir yo'q pulni ikkinchi marta
  //  qabul qilib qo'yardi.
  const [d, r] = await Promise.all([
    App.api('/api/cash/list'), App.api('/api/cash/refs')]);
  refs = r;
  boss = d.boss;
  here = isMe() ? d.me
       : W ? (d.workers || []).find(w => w.id === W)
       : d.rows.find(a => a.code === A);
  if (!here) { $('body').innerHTML = `<div class="card"><h2>${
    W ? 'Xodim topilmadi' : 'Kassa topilmadi'}</h2></div>`; return; }
  drawHead();
  await loadOps();
}
</script>
<script src="/kassa-form.js"></script>
</body>
</html>
