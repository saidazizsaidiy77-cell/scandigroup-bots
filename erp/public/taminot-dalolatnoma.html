<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solishtirma dalolatnoma · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/yukxati.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top no-print">
  <div class="brand"><span class="dot"></span><h1>Solishtirma dalolatnoma</h1></div>
  <div class="row"><span class="row" id="erpUser"></span></div>
</div>

<div class="card no-print">
  <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
    <div style="flex:1;min-width:240px"><label>Ta'minotchi</label>
      <input id="fQ" placeholder="nomi bo'yicha qidirish" oninput="royxat()"></div>
    <div style="flex:1;min-width:240px"><label>&nbsp;</label>
      <select id="fS" onchange="load()"></select></div>
    <div><label>Sanadan</label><input id="fFrom" type="date" onchange="load()"></div>
    <div><label>Sanagacha</label><input id="fTo" type="date" onchange="load()"></div>
    <button onclick="davr('oy')">Shu oy</button>
    <button onclick="davr('yil')">Shu yil</button>
    <button onclick="davr('hammasi')">Hammasi</button>
    <button class="primary" onclick="window.print()">Chop etish</button>
  </div>
</div>

<div id="body" style="margin-top:16px"><p class="muted">Ta'minotchini tanlang</p></div>

<script>
//  ═══════════ SOLISHTIRMA DALOLATNOMA — TA'MINOTCHI ═══════════════
//
//  Ta'minotchi bilan yuzma-yuz o'tirib solishtiriladigan hujjat:
//  oraliq boshidagi qarz, davr ichidagi har harakat va oxiriga
//  qolgani. Mijozникиси bilan ATAYLAB bir xil shaklda (`dalolatnoma
//  .html`) — ikkalasi bitta ko'z bilan o'qiladi va bittasida bo'lgan
//  narsa ikkinchisida bo'lmasa shakl buzilardi.
//
//  ★ TOMONI MIJOZNIKIGA TESKARI, va aynan shu yerda adashish oson.
//  Ta'minotchi PASSIV hisob:
//
//      HAQDOR (kredit)  qarzimiz OSHADI  — kelgan mol, boshlang'ich
//      QARZDOR (debet)  qarzimiz KAMAYADI — to'lov
//
//          boshiga + haqdor − qarzdor = oxiriga
//
//  Shuning uchun ustun tartibi ham teskari: avval HAQDOR. Mijozlar
//  dalolatnomasiga o'rgangan ko'z bu yerda tomonni teskari o'qib
//  qo'yardi, shuning uchun har kartochkaning ostida kim kimga
//  qarzdorligi yozilib turadi.
//
//  Qarzdorlik hisobotidan farqi — u BARCHA ta'minotchini bitta
//  jadvalda ko'rsatadi, bu esa BITTA ta'minotchining har qatorini
//  hujjat qilib beradi. To'lov qatori bosilsa chiqim orderi alohida
//  oynada ochiladi: dalolatnoma ochiq qolsin, solishtirish
//  to'xtamasin.
//
//  Yonida yugurib boradigan QOLDIQ ustuni: solishtirishda odam
//  qatorma-qator yuradi va har qatordan keyin qancha qolganini
//  ko'rishi kerak, oxirgi raqamni emas.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const money = v => (Number(v) || 0).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const d8 = (s) => !s ? '' : new Date(s).toLocaleDateString('ru-RU',
  { day: '2-digit', month: '2-digit', year: '2-digit' });
const isoDay = (d) => d.toISOString().slice(0, 10);
const FIRMA = 'ZELTA PREMIUM';

let hammasi = [], d = null;

//  Saldo QAYSI TOMONDA ekani yozib turadi. Musbat — BIZ qarzdormiz
//  (odatiy hol: mol olindi, puli berilmadi), manfiy — ta'minotchi
//  bizga qarzdor (oldindan to'lov).
const tomon = (v) => !Number(v) ? 'qarz yo\'q'
  : Number(v) < 0 ? "ta'minotchi qarzdor" : 'korxona qarzdor';

function davr(k) {
  const now = new Date();
  if (k === 'oy') {
    $('fFrom').value = isoDay(new Date(now.getFullYear(), now.getMonth(), 1));
    $('fTo').value = isoDay(now);
  } else if (k === 'yil') {
    $('fFrom').value = `${now.getFullYear()}-01-01`;
    $('fTo').value = isoDay(now);
  } else { $('fFrom').value = ''; $('fTo').value = ''; }
  load();
}

//  Ro'yxat qidiruv bilan: zavodda o'ttizdan ortiq ta'minotchi bor va
//  yo'nalishi bo'yicha ham qidiriladi («MDF» deb yozilsa hammasi
//  chiqadi) — mijozlar dalolatnomasidagi region bilan bir xil idiom.
function royxat() {
  const q = ($('fQ').value || '').trim().toLowerCase();
  const bor = $('fS').value;
  const ro = hammasi.filter(s => !q || s.name.toLowerCase().includes(q)
    || (s.category_name || '').toLowerCase().includes(q)
    || (s.region || '').toLowerCase().includes(q));
  $('fS').innerHTML = `<option value="">— ta'minotchini tanlang —</option>` +
    ro.map(s => `<option value="${s.id}"${String(s.id) === bor ? ' selected' : ''}>${
      esc(s.name)}${s.category_name ? ' · ' + esc(s.category_name) : ''}</option>`).join('');
}

function draw() {
  if (!d) return $('body').innerHTML = `<p class="muted">Ta'minotchini tanlang</p>`;
  let qoldiq = Number(d.opening);
  //  To'lov — CHIQIM orderi (`kind=supplier`), kirim hujjati esa
  //  faqat RAQAM bo'lib yoziladi: uning alohida sahifasi yo'q va u
  //  xom ashyo modulining ichida ochiladi. Raqamning o'zi yetarli —
  //  solishtirishda savol «qaysi hujjat bilan keldi» bo'ladi.
  const link = (r) => r.kind === 'payment' && r.op_id
    ? `<a href="/kassa-orderi.html?id=${r.op_id}&amp;kind=supplier" target="_blank"
         >${esc(r.doc_no || 'chiqim orderi')}</a>`
    : r.doc_no ? `<span class="tag">${esc(r.doc_no)}</span>`
    : `<span class="muted">&mdash;</span>`;

  $('body').innerHTML = `
    <div class="card">
      <div style="text-align:center;padding-bottom:14px;border-bottom:2px solid var(--text)">
        <div style="font-weight:600;letter-spacing:.08em">${esc(FIRMA)}</div>
        <div style="font-size:19px;font-weight:600;margin-top:6px">
          Solishtirma dalolatnoma</div>
        <div class="muted" style="font-size:13px">${esc(d.supplier.name)} · ${
          d.from ? d8(d.from) + ' — ' + d8(d.to) : 'butun davr'}</div>
      </div>

      <div class="grid g3" style="margin-top:16px">
        <div class="card"><h2>Davr boshiga</h2>
          <div class="kpi">${money(Math.abs(d.opening))}<small> $</small></div>
          <p class="muted" style="font-size:12px;margin-top:6px">${tomon(d.opening)}</p></div>
        <!--  HAQDOR oldinda: ta'minotchida qarzimiz avval OSHADI
              (mol keldi), keyin to'lov bilan kamayadi. -->
        <div class="card"><h2>Haqdor</h2>
          <div class="kpi">${money(d.total.credit)}<small> $</small></div>
          <p class="muted" style="font-size:12px;margin-top:6px">kelgan mol —
            qarzimiz oshdi</p></div>
        <div class="card"><h2>Qarzdor</h2>
          <div class="kpi">${money(d.total.debit)}<small> $</small></div>
          <p class="muted" style="font-size:12px;margin-top:6px">to'lovlar —
            qarzimiz kamaydi</p></div>
        <div class="card"><h2>Davr oxiriga</h2>
          <div class="kpi">${money(Math.abs(d.closing))}<small> $</small></div>
          <p class="muted" style="font-size:12px;margin-top:6px">${tomon(d.closing)}</p></div>
      </div>

      <div style="overflow-x:auto;margin-top:16px"><table>
        <thead><tr><th>Sana</th><th>Hujjat</th><th>Izoh</th>
          <th class="num">Haqdor</th><th class="num">Qarzdor</th>
          <th class="num">Qoldiq</th></tr></thead>
        <tbody>
          <tr><td class="muted">${d.from ? d8(d.from) : ''}</td><td></td>
            <td><b>Davr boshiga</b></td><td></td><td></td>
            <td class="num"><b>${money(qoldiq)}</b></td></tr>
          ${d.rows.map(r => {
            qoldiq += Number(r.credit) - Number(r.debit);
            return `<tr>
              <td>${d8(r.on_date)}</td>
              <td>${link(r)}</td>
              <td class="muted">${esc(r.note)}</td>
              <td class="num">${Number(r.credit) ? money(r.credit) : ''}</td>
              <td class="num">${Number(r.debit) ? money(r.debit) : ''}</td>
              <td class="num">${money(qoldiq)}</td></tr>`;
          }).join('')}
          <tr><td></td><td></td><td><b>Davr oxiriga</b></td>
            <td class="num"><b>${money(d.total.credit)}</b></td>
            <td class="num"><b>${money(d.total.debit)}</b></td>
            <td class="num"><b>${money(d.closing)}</b></td></tr>
        </tbody></table></div>

      ${!d.rows.length ? `<p class="muted" style="margin-top:12px">
        Tanlangan oraliqda harakat bo'lmagan.</p>` : ''}

      <!--  Ustunlar nimani anglatishi QOG'OZDA ham yoziladi: hujjat
            ta'minotchining qo'liga beriladi va u bizning ichki
            atamalarimizni bilmaydi. -->
      <p class="muted" style="font-size:12px;margin-top:14px">
        Haqdor — bizning qarzimiz oshgani (kelgan mol) &middot;
        Qarzdor — qarzimiz kamaygani (to'lov) &middot;
        musbat qoldiq korxona qarzdorligini anglatadi</p>

      <!--  Imzo joylari: dalolatnoma ikki tomon qo'l qo'yadigan
            hujjat, shuning uchun qog'ozda ikkala tomon ham turadi. -->
      <div style="display:flex;gap:40px;margin-top:40px">
        <div style="flex:1;border-top:1px solid var(--text);padding-top:6px">
          <div class="muted" style="font-size:12px">${esc(FIRMA)} — imzo, muhr</div></div>
        <div style="flex:1;border-top:1px solid var(--text);padding-top:6px">
          <div class="muted" style="font-size:12px">${
            esc(d.supplier.name)} — imzo</div></div>
      </div>
    </div>`;
}

async function load() {
  const id = $('fS').value;
  if (!id) { d = null; return draw(); }
  const q = new URLSearchParams({ from: $('fFrom').value || '', to: $('fTo').value || '' });
  d = await App.api(`/api/purchasing/debts/${id}?${q}`);
  draw();
}

App.start(async () => {
  hammasi = (await App.api('/api/purchasing/suppliers')).suppliers || [];
  royxat();
  davr('yil');
}, 'purchasing.view', 'purchasing.manage');
</script>
</body>
</html>
