<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savdo paneli · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app.js"></script>
<script src="/panel.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Savdo paneli</h1></div>
  <div class="row"><span class="row" id="erpUser"></span></div>
</div>

<!--  ★ ORALIQ BITTA VA BUTUN EKRANGA TEGISHLI. Har kartochkaning o'z
      filtri bo'lsa ekrandagi raqamlar bir-biriga to'g'ri kelmay
      qolardi: biri sentabrniki, ikkinchisi yilniki bo'lib turardi. -->
<div class="card" style="margin-bottom:16px">
  <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div style="width:170px"><label>Sanadan</label>
      <input id="dan" type="date" onchange="load()"></div>
    <div style="width:170px"><label>Sanagacha</label>
      <input id="gacha" type="date" onchange="load()"></div>
    <div class="row" style="gap:8px" id="tez"></div>
  </div>
  <p class="muted" style="font-size:12px;margin-top:10px">
    Oraliq faqat <b>chiqib ketgan</b> savdoga tegishli. «Zavodda turgan»
    va «mijozlar qarzi» — <b>bugungi</b> holat: ular oraliq bilan
    o'lchanmaydi.</p>
</div>

<div class="grid g3" id="kpis"></div>

<div class="card" style="margin-top:16px">
  <h2>Oylar bo'yicha chiqib ketgan savdo</h2>
  <div id="oylar"></div>
</div>

<div class="grid g2" style="margin-top:16px">
  <div class="card"><h2>Yo'nalish bo'yicha</h2><div id="kanal"></div></div>
  <div class="card" id="cardMgr"><h2>Menejerlar</h2><div id="menejer"></div></div>
</div>

<div class="grid g2" style="margin-top:16px">
  <div class="card"><h2>Ko'p sotilgan mahsulot</h2><div id="mahsulot"></div></div>
  <div class="card"><h2>Zavodda turgan buyurtmalar</h2><div id="holat"></div></div>
</div>

<div class="card" style="margin-top:16px">
  <h2>Eng katta qarzdorlar</h2>
  <div id="qarz"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = Panel.esc;

//  Tez tanlash: direktorning savoli ko'pincha «shu oy» yoki «shu yil»
//  bo'ladi va sanani ikki katakka qo'lda terish ortiqcha ish.
const TEZ = [['Shu oy', 'oy'], ['Shu chorak', 'chorak'],
             ['Shu yil', 'yil'], ['12 oy', '12']];

function tezQoy(k) {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const kun = (x) => `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`;
  let dan;
  if (k === 'oy')    dan = new Date(d.getFullYear(), d.getMonth(), 1);
  if (k === 'chorak') dan = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  if (k === 'yil')   dan = new Date(d.getFullYear(), 0, 1);
  if (k === '12')    dan = new Date(d.getFullYear(), d.getMonth() - 11, 1);
  $('dan').value = kun(dan);
  $('gacha').value = kun(d);
  load();
}

$('tez').innerHTML = TEZ.map(([t, k]) =>
  `<button onclick="tezQoy('${k}')">${t}</button>`).join('');

const HOLAT = {
  draft: 'Boshlanmagan', new: 'Boshlanmagan', waiting: 'Ishlab chiqarilmoqda',
  ready: 'Tayyor', to_ship: 'Mijozga chiqarilsin',
};

async function load() {
  const q = new URLSearchParams();
  if ($('dan').value)   q.set('from', $('dan').value);
  if ($('gacha').value) q.set('to', $('gacha').value);
  let d;
  try { d = await App.api('/api/sales/dashboard?' + q); }
  catch (e) { $('kpis').innerHTML =
    `<p class="tag bad" style="white-space:normal">${esc(e.message)}</p>`; return; }

  //  Sana katagi bo'sh bo'lsa server tanlagan oraliq yozib qo'yiladi:
  //  ekranda ko'rinmaydigan filtr «nega bu raqam» degan savol
  //  qoldirardi.
  if (!$('dan').value)   $('dan').value = d.dan;
  if (!$('gacha').value) $('gacha').value = d.gacha;

  const k = d.kpi;
  Panel.kpi($('kpis'), [
    { name: 'Chiqib ketdi', value: Panel.pul(k.chiqdi),
      hint: Panel.son(k.chiqdi_soni) + ' ta buyurtma · oraliq bo\'yicha' },
    { name: 'Zavodda turibdi', value: Panel.pul(k.zavodda),
      hint: Panel.son(k.zavodda_soni) + ' ta buyurtma · bugungi holat' },
    { name: 'Mijozlar qarzi', value: Panel.pul(k.qarz),
      hint: 'bugungi holat' },
    { name: 'Kechikkan', value: Panel.son(k.kechikkan) + ' ta',
      tone: Number(k.kechikkan) ? 'bad' : '',
      hint: 'chiqish sanasi o\'tib ketgan' },
  ]);

  Panel.bars($('oylar'), { rows: d.oylar });
  //  Yo'nalish va menejer — mahsulot emas, shuning uchun tur
  //  chizilmaydi (`tur: null`).
  Panel.rank($('kanal'), { rows: d.kanal, hint: 'orders', tur: null });
  //  ★ MAHSULOTNING TURI YOZILADI: zavodda bitta nom ikki guruhda
  //  uchraydi («Barocco» ham sp, ham penal) va faqat nomi ko'rinsa
  //  ro'yxatda ikkita bir xil qator turardi.
  Panel.rank($('mahsulot'), { rows: d.mahsulot, hint: 'qty' });

  //  ★ DOIRASI BOR MENEJERGA BU BLOK CHIZILMAYDI: ro'yxatda baribir
  //  bitta ism turadi va «kim ko'p sotdi» degan savol u yerda yo'q.
  $('cardMgr').hidden = !!d.ozi;
  if (!d.ozi) Panel.rank($('menejer'),
    { rows: d.menejer, hint: 'orders', tur: null });

  Panel.share($('holat'), {
    rows: d.holat.map((r) => ({ name: HOLAT[r.status] || r.status,
                                amount: r.amount, orders: r.orders })),
  });

  $('qarz').innerHTML = d.qarz.length ? `<table><thead><tr>
      <th>Mijoz</th><th>Menejer</th><th>Oxirgi buyurtma</th>
      <th class="num">Qarzi</th></tr></thead><tbody>
    ${d.qarz.map((r) => `<tr>
      <td><b>${esc(r.name)}</b></td>
      <td class="muted">${esc(r.manager_name || '—')}</td>
      <td class="muted">${r.last_order_on ? esc(r.last_order_on) : '—'}</td>
      <td class="num">${esc(Panel.pul(r.balance, true))}</td></tr>`).join('')}
    </tbody></table>`
    : '<p class="muted" style="font-size:13px">Qarzdor yo\'q.</p>';
}

App.start(() => tezQoy('12'), 'sales.view', 'sales.manage');
</script>
</body>
</html>
