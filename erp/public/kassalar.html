<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank va kassa · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
/*  XODIMLAR QO'LIDAGI PUL — jadval, lekin pul ro'yxati bo'lib
    o'qiladi. Beshta ustun keng ekranda bir-biridan uzoqlashib,
    ismning javobi ekranning narigi chekkasida qolardi; ustiga
    ko'pchilikning katagi bo'sh bo'lib, jadval siyrak ko'rinardi.
    Shuning uchun uch ustun: kim · nimasi bor · jami. */
.hands{max-width:760px}
.hands table{font-size:15px}
.hands th{font-size:11px;letter-spacing:.07em;padding-top:16px}
.hands td{padding:15px 18px}
/*  Kartochkaning o'z ichki bo'shlig'i nol (jadval chetigacha
    cho'ziladi), style.css esa chetki katakning tashqi bo'shlig'ini
    olib tashlaydi — kartochka ODATDA o'zi bo'shliq beradi. Ikkovi
    qo'shilib raqamni chegaraga qisib qo'yardi, «JAMI $» sarlavhasi
    esa chetdan kesilib turardi. Shuning uchun chekka shu yerda
    qaytariladi. */
.hands th:first-child,.hands td:first-child{padding-left:20px}
.hands th:last-child,.hands td:last-child{padding-right:20px}
.hands .who{font-weight:600;overflow-wrap:anywhere}
.hands .when{font-size:12.5px;color:var(--muted);margin-top:3px}
.hands .parts{font-size:13px;color:var(--muted);white-space:nowrap}
.hands .sum{font-size:17px;font-weight:600;white-space:nowrap}
.hands .zero{color:var(--muted);font-weight:400}
@media (max-width:640px){
  /*  Telefonda o'rtadagi ustun qatorni siqib qo'yadi — u tafsilot,
      javob esa «jami» da. Tafsilot ismning ostiga tushadi. */
  .hands .parts{display:none}
  .hands td{padding:13px 14px}
  .hands th:first-child,.hands td:first-child{padding-left:14px}
  .hands th:last-child,.hands td:last-child{padding-right:14px}
}
</style>
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Bank va kassa</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div id="body"></div>

<script>
// ============================================================================
//  KASSALAR RO'YXATI
//
//  Zavodda ikkita pul joyi bor — ASOSIY KASSA (naqd) va BANK HISOB
//  RAQAMI — va ular bir-biriga o'xshamaydi: birida pul sanaladi,
//  ikkinchisida ko'chma. Shuning uchun bo'limga kirilganda avval SHU
//  ro'yxat chiqadi, kassa tanlangach uning ichi ochiladi. Omborlar
//  sahifasi bilan bir xil idiom.
//
//  Ro'yxat kodda emas, bazada (`cash_accounts`): yangi hisob raqami
//  ochilsa shu sahifaga tegilmaydi.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d8 = v => !v ? '—'
  : (s => `${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`)(String(v).slice(0,10));
const uzs = v => (Number(v) || 0).toLocaleString('ru-RU', { maximumFractionDigits: 0 });
const usd = v => (Number(v) || 0).toLocaleString('ru-RU',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function draw(d) {
  const card = (href, nom, izoh, b, tag) => `
    <a class="card" href="${href}" style="text-decoration:none;color:inherit;display:block">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <h2 style="margin:0">${esc(nom)}</h2>
        <span class="tag${tag === 'ok' ? ' ok' : ''}">${
          tag === 'ok' ? 'naqd' : tag}</span>
      </div>
      <!--  Katta raqam — SHU kassaning o'z valyutasida: bank hisob
            raqamida oldi-berdi so'mda bo'ladi va dollarga aylantirilgan
            raqamni bank ko'chirmasi bilan solishtirib bo'lmasdi.
            Ostida ikkalasi ham turadi, ya'ni hech narsa yashirilmaydi. -->
      <div class="kpi" style="margin-top:10px">${b.main_ccy === 'UZS'
        ? `${uzs(b.uzs)}<small> so'm</small>`
        : `${usd(b.total_usd)}<small> $</small>`}</div>
      <div class="muted" style="font-size:13px;margin-top:4px">${b.main_ccy === 'UZS'
        ? `${usd(b.usd)} $ · jami ${usd(b.total_usd)} $`
        : `${uzs(b.uzs)} so'm · ${usd(b.usd)} $`}</div>
      <p class="muted" style="font-size:12.5px;margin-top:10px">${esc(izoh)}</p>
    </a>`;

  const setka = (ichi) => `<div class="grid"
    style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${ichi}</div>`;

  //  ★ UCHINCHI JOY — XODIMLARNING QO'LIDAGI PUL.
  //
  //  Kassaning yonida turadi, lekin kassa EMAS: pul korxonaniki,
  //  ammo javonda emas, odamning cho'ntagida. Kassir uchun bu kundalik
  //  savol («Bahromda nima bor»), tizim ishga tushganda esa yagona joy
  //  bo'lib qoladi — boshlang'ich qoldiq aynan shu qatordan yoziladi.
  //  Ro'yxatda qo'lida puli borlar va belgisi bor xodimlar turadi
  //  (izoh: modules/cash.js).
  //
  //  O'ZI ham shu ro'yxatda: alohida «Mening qo'limdagi pul»
  //  kartochkasi kassirda baribir nol bo'lib turardi — uning puli
  //  kassada, qo'lida emas. Qo'liga pul olsa qatorda o'zi chiqadi.
  const xodimlar = d.workers || [];

  //  Kassalar KARTOCHKA, xodimlar esa RO'YXAT. Kassa ikkita va
  //  har biri o'z joyi — qoldig'i yirik raqam bo'lib turishi kerak.
  //  Xodim esa o'ntacha va ko'pchiligining qo'lida nol turadi:
  //  o'nta kartochka butun ekranni egallab, javobi bor bittasi
  //  ularning orasida yo'qolib ketardi.
  //  Tafsilot faqat QO'SHIMCHA gap aytganda yoziladi. Faqat dollari
  //  bo'lgan odamning yonida «630,00 $ · 630,00 $» turardi — bir xil
  //  raqam ikki marta, ko'z esa farqini qidirib qolardi. So'm bo'lsa
  //  boshqa: jami uni KURS bilan aylantirgan, ya'ni tafsilot qo'lida
  //  aslida nima turganini aytadi.
  //  Hech kimda so'm bo'lmasa ustunning o'zi chizilmaydi: bo'sh
  //  ustun sarlavhasi «bu yerda nimadir bo'lishi kerak edi» degan
  //  savol qoldirardi, holbuki javob yo'qligi emas — so'm yo'qligi.
  const somli = xodimlar.some(w => Number(w.uzs));
  const pul = (w) => {
    const som = Number(w.uzs), dol = Number(w.usd);
    if (!som) return '';
    return [`${uzs(som)} so'm`, dol ? `${usd(dol)} $` : '']
      .filter(Boolean).join(' \u00b7 ');
  };

  $('body').innerHTML = setka(
      d.rows.map(a => card(a.href, a.name,
        a.last_on ? `oxirgi harakat ${d8(a.last_on)}` : 'harakat yo\'q',
        a, a.kind === 'bank' ? 'hisob raqami' : 'ok')).join('')
    + (d.boss ? '' : card(d.me.href, 'Mening pulim',
        "kassirga topshirilmagani", d.me, "qo'ldagi pul")))
    + (xodimlar.length ? `
      <h2 style="margin:26px 0 12px">Xodimlar qo'lidagi pul</h2>
      <div class="card hands" style="padding:0;overflow:hidden">
      <table>
        <thead><tr><th>Xodim</th>${somli
          ? '<th class="num">Qo\'lida</th>' : ''}
          <th class="num">Jami $</th></tr></thead>
        <tbody>${xodimlar.map(w => {
          const jami = Number(w.total_usd) || 0;
          return `
          <tr class="click" onclick="location.href='${w.href}'">
            <td><div class="who">${esc(w.name)}</div>
              <div class="when">${w.last_on
                ? `oxirgi harakat ${d8(w.last_on)}` : 'harakat yo\'q'}</div></td>
            ${somli ? `<td class="num parts">${pul(w) || ''}</td>` : ''}
            <!--  Jami — qo'lidagi pulning to'la javobi: so'mi ham,
                  dollari ham kirgan kursi bilan qo'shilgani. -->
            <td class="num"><span class="sum${jami ? '' : ' zero'}"
              >${usd(jami)} $</span></td></tr>`;
        }).join('')}</tbody>
      </table></div>` : '');
}

App.start(async () => {
  const d = await App.api('/api/cash/list');
  //  Menejerda kassa yo'q — uning yagona «joyi» o'z qo'lidagi pul.
  //  Bitta qatorli ro'yxat ortiqcha bosish bo'lardi (omborlar bilan
  //  bir xil qoida).
  if (!d.rows.length) { location.replace(d.me.href); return; }
  draw(d);
}, 'cash.view', 'cash.entry', 'cash.manage');
</script>
</body>
</html>
