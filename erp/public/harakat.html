<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">

<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Bo'limlar aro harakat</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div class="row" id="tabs" style="margin-bottom:16px;gap:8px;flex-wrap:wrap"></div>
<div id="body"></div>

<script>
// ============================================================================
//  BO'LIM BOSHLIG'INING KUNLIK EKRANI
//
//  Ikki ko'rinish, bitta sahifada — ikkalasi ham bir xil savolning ikki
//  tomoni: "hozir nima qayerda" va "bugun nima qilindi".
//
//    Bo'limlar          — konverlar o'z bo'limlarida turadi, bitta bosishda
//                         keyingisiga o'tadi. Keyingi bo'lim nomi tugmaning
//                         o'zida yozilgan, marshrut yodlanmaydi.
//    Bugungi harakatlar — kim, qachon, qaysi konverni, qayerdan qayerga.
//                         Nazorat shu yerdan: jurnalni 500 qator bo'ylab
//                         ko'zdan kechirish bilan nazorat qilib bo'lmaydi.
//
//  Tsexdan tsexga o'tkazishni QABUL QILUVCHI tomon bosadi (server qoidasi:
//  modules/units.js, moveOne). Shuning uchun bo'limlar ro'yxatida ikki
//  bo'lak: yuqorida menga kelayotganlar, pastda mening bo'limlarimdagilar.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const d8 = v => !v ? '\u2014'
  : (x => `${x.slice(8,10)}.${x.slice(5,7)}.${x.slice(2,4)}`)(String(v).slice(0,10));

let tab = 'board', canMove = false, canPlan = false, canXom = false;
let data = null, shopId = null;
const picked = new Set();
//  Qaysi konverning buyurtmalari ochilgan. Qiymat `undefined` — so'rov
//  ketdi, javob hali kelmadi («Yuklanmoqda…»).
const openBron = new Map();

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// Lenta nazorat uchun — unda tsex ustasining ishi yo'q, va uning
// huquqi ham yetmaydi (production.view). Bitta ko'rinish qolsa
// tugmalar umuman chizilmaydi: tanlov yo'q joyda tanlov ko'rsatilmaydi.
function drawTabs() {
  const tabs = [['board', "Bo'limlar"]];
  if (App.can('production.view')) tabs.push(['feed', 'Bugungi harakatlar']);
  $('tabs').innerHTML = tabs.length < 2 ? '' : tabs.map(([k, t]) =>
    `<button ${k === tab ? 'class="primary"' : ''} onclick="go('${k}')">${t}</button>`).join('');
}

async function go(k) {
  tab = k; drawTabs();
  $('body').innerHTML = `<p class="muted">Yuklanmoqda…</p>`;
  return k === 'board' ? loadBoard() : loadFeed();
}

// ═══════════════════════════════════════════════════════ 1. BO'LIMLAR
//
// Muddat — faqat KUN SONI. Sananing o'zi ko'rsatilmaydi: usta "27-sentabr"
// dan foyda ko'rmaydi, u "uch kun qoldi" deb o'ylaydi va ishini shunga
// qarab tartiblaydi. Sana jurnalda turibdi, kerak bo'lsa o'sha yerda.
//
// Kechikkan konver minus bilan va qizil: "-3 kun" — o'tib ketgan kun soni
// darrov ko'rinadi va ro'yxatning boshiga chiqadi.
//
// Qaysi sana olinishi konver turgan tsexga bog'liq (server: /board):
// korpusdagiga «Lak tsehi», bo'yoqlashdagiga «Qadoqlash», qadoqlashdagiga
// «T/M ombor» sanasi. Ya'ni jurnaldagi sana bilan bir xil, boshqa hisob emas.
//  Sana katagi. Korpusda u BO'SH tug'iladi va boshliq o'zi qo'yadi,
//  shuning uchun bo'sh katak bu yerda «—» emas, «qo'yish» taklifi:
//  bo'sh chiziqcha unutilgandek turardi va hech kim bosmasdi.
function due(u) {
  if (u.waiting) return `<span class="tag">zahira</span>`;
  const tug = (ich, cls) => canPlan
    ? `<button class="ic ${cls || ''}" style="font:inherit;padding:2px 8px"
         title="Muddatni qo'yish" onclick="askPlan(${u.id}, event)">${ich}</button>`
    : ich;
  if (u.days_left == null)
    return tug(canPlan ? '+ muddat' : '<span class="muted">—</span>');
  const d = u.days_left;
  const t = d < 0 ? `<span class="tag bad">&minus;${-d} kun</span>`
    : d === 0     ? `<span class="tag warn">Bugun</span>`
    : `<span class="tag ${d <= 2 ? 'warn' : 'ok'}">${d} kun</span>`;
  return tug(t);
}

//  ── MUDDATNI QO'YISH ──────────────────────────────────────────────────
//
//  Bitta sana so'raladi: «qachon topshiriladi». Qaysi ustunga
//  yozilishini SERVER hal qiladi (lak, qadoqlash yoki ombor) — ekranda
//  boshliqqa ustun nomi emas, savolning javobi kerak.
function askPlan(id, ev) {
  if (ev) ev.stopPropagation();
  const u = unitById(id);
  if (!u) return;
  const bor = u.due_on ? String(u.due_on).slice(0, 10) : '';
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="planBox" onclick="if(event.target===this)closePlan()">
      <div class="modal" style="max-width:360px">
        <h2 style="margin-bottom:4px">${esc(u.conveyor_no)}</h2>
        <p class="muted" style="font-size:13px;margin-bottom:16px">${esc(u.product)} ·
          ${rangMato(u)} ·
          ${esc(u.due_shop || 'T/M ombor')}ga qachon topshiriladi?</p>
        <label>Sana</label>
        <input id="planVal" type="date" value="${bor}" style="font-size:18px">
        <button class="primary" style="width:100%;margin-top:16px"
          onclick="okPlan(${id})">Saqlash</button>
        ${bor ? `<button style="width:100%;margin-top:8px"
          onclick="okPlan(${id}, true)">Sanani olib tashlash</button>` : ''}
        <button style="width:100%;margin-top:8px" onclick="closePlan()">Bekor qilish</button>
      </div>
    </div>`);
}

const closePlan = () => $('planBox')?.remove();

async function okPlan(id, ochir) {
  const v = ochir ? null : ($('planVal').value || null);
  if (!ochir && !v) return toast('Sana tanlanmadi', true);
  closePlan();
  try {
    await App.api(`/api/units/${id}/plan`,
      { method: 'POST', body: JSON.stringify({ due_on: v }) });
    toast(ochir ? 'Sana olib tashlandi' : 'Muddat qo\'yildi');
    await loadBoard();
  } catch (e) { toast(e.message, true); }
}

// Ustaning ekranida ortiqcha narsa yo'q. Zakaz raqami, mijoz, qancha kun
// turgani — bularning hammasi ish uchun kerak emas va faqat
// chalkashtiradi; kerak bo'lsa jurnalda turibdi. Rang esa ish uchun
// KERAK va shuning uchun qoldirildi — izohi `rangMato()` da.
// Tsexdan tsexga o'tish ikki bosqich:
//   1. jo'natuvchi «... tsexiga jo'natish» tugmasini bosadi — mahsulot
//      joyidan qimirlamaydi, faqat topshirishga qo'yilgani belgilanadi;
//   2. qabul qiluvchi tsex uni o'ziga oladi.
// Shunday qilinganda «men topshirgandim / menga kelmagan» degan bahs
// o'rniga ikkita sana turadi, va oradagi farq — yotib qolgan vaqt.
//  ── RANG VA MATO ────────────────────────────────────────
//
//  ★ KONVERNING RANGI TSEX EKRANIDA HAM TURADI (zavod qarori, 2026-09).
//
//  Ilgari bu ekranda rang ataylab chiqarilmagandi: ustaning ishi bitta —
//  keyingi bo'limga o'tkazish, va rang unga ta'sir qilmasdi. LAK tsexida
//  esa rang ishning O'ZI: boshliq qaysi bo'yoq ekanini bilmasa konverni
//  kabinaga umuman bera olmaydi. U buni jurnaldan qidirib yurardi —
//  jurnal esa o'n olti ustunli hisobot va telefonda o'qib bo'lmaydi.
//
//  Ustun QO'SHILMADI: telefonda qator panjaraga aylanadi (`.board`,
//  style.css) va yettinchi ustunga joy yo'q. Shuning uchun rang mahsulot
//  nomining OSTIDA turadi — «N buyurtmada» soni katagining ichida turgani
//  bilan bir xil idiom.
//
//  Rangi yo'q konverda ham qator YOZILADI. Ishlab chiqarishdagi konver
//  RANGSIZ tug'iladi (rang mijoz aytganda ma'lum bo'ladi), ya'ni bo'shlik
//  bu yerda oddiy hol emas, SAVOL: bo'sh qator savol, yo'q qator esa
//  yolg'on bo'lardi — boshliq rangni ko'rmay, yozilishi unutilgan deb
//  o'ylardi.
const rangMato = (u) => {
  const v = [u.color, u.fabric].filter(Boolean).map(esc);
  return v.length ? v.join(' · ')
    : '<span style="opacity:.6">rangi tanlanmagan</span>';
};

function row(u, mine, isExit) {
  // Chiqish bo'limida oldinda tsex yo'q — oldinda T/M ombor turadi, va u
  // ham xuddi tsexdek qabul qiladi. Shuning uchun bu yerda ham jo'natish.
  const leaves = (u.next_shop_id && u.next_shop_id !== shopId) || (mine && isExit);
  const act = !canMove ? ''
    : !u.on_route
      ? `<span class="tag bad">marshrutda yo'q</span>`
    : mine && leaves
      ? (u.sent
          ? `<span class="tag warn">jo'natilgan</span>
             <button class="ic" title="Jo'natishni qaytarib olish"
               onclick="unsend(${u.id})">&#8629;</button>`
          : `<button class="primary" onclick="send1(${u.id})">${
              isExit ? 'T/M omborga' : esc(u.next_shop_name) + 'ga'} jo'natish</button>`)
    : !u.next_section_id && !isExit
      ? `<span class="muted" style="font-size:12px">marshrut tugadi</span>`
      : `<button class="primary" onclick="move(${u.id})">${
          mine ? '→ ' : 'Qabul qildim → '}${esc(u.next_section)}</button>`;
  //  ★ XOM ASHYO — O'TKAZISH TUGMASINING YONIDA (zavod qarori,
  //  2026-09). Boshliq materialni konverga shu yerda biriktiradi:
  //  sarfni faqat tsexda turgan odam biladi va u kun bo'yi AYNAN shu
  //  ekranda turadi. Alohida sahifa qilinsa u ikki ekran orasida
  //  yurardi va ko'pincha umuman yozmasdi — yozilmagan sarf esa
  //  tannarxni butunlay yo'qotadi.
  //
  //  Kichik tugma (`.ic`), o'tkazish esa katta bo'lib qolaveradi:
  //  boshliq kuniga o'nlab marta o'tkazadi va bir-ikki marta material
  //  biriktiradi — ikkinchi katta tugma birinchisining joyini
  //  torraytirardi (jo'natishni qaytarish tugmasi bilan bir xil sabab).
  //  FAQAT O'Z bo'limidagi konverda: kelayotgan konver hali qabul
  //  qilinmagan va unga material sarflanmaydi.
  const xom = canXom && mine
    ? `<button class="ic" title="Xom ashyo biriktirish"
         onclick="xomOch(${u.id}, event)">&#9635;</button>` : '';
  const sel = canMove && u.on_route && (u.next_section_id || (mine && leaves))
    && !(mine && leaves && u.sent)
    ? `<input type="checkbox" style="width:auto" ${picked.has(u.id) ? 'checked' : ''}
         onchange="pick(${u.id},this.checked)">` : '';
  //  Buyurtmaga olingan konver BOSILADI: ostida kim, nechta va qachonga
  //  kutayotgani chiqadi. Savdo ekrani tsex boshlig'iga ochilmaydi va
  //  ochilishi ham kerak emas — u yerda narx va mijoz balansi turadi.
  //
  //  YANGISI oltin nuqta bilan ajraladi (`new_bron`): «6 buyurtmada»
  //  yozuvining o'zi yetarli emas — u har kuni turadi va ko'z unga
  //  o'rganib qoladi, bugun biriktirilgani esa sezilmay qolardi.
  //  Qator ochilishi bilan belgi o'chadi, ya'ni boshliq ko'rgan narsa
  //  ikkinchi marta e'tibor talab qilmaydi.
  return `<tr${u.booked_qty ? ` onclick="toggleBron(${u.id}, event)"
      style="cursor:pointer"` : ''}>
    <td class="c-sel">${sel}</td>
    <td class="c-no"><b>${esc(u.conveyor_no)}</b></td>
    <td class="c-name">${esc(u.product)}<div class="muted"
      style="font-size:11.5px">${rangMato(u)}</div></td>
    <td class="c-type muted">${esc(u.product_type || '')}</td>
    <!--  Soni — JISMONAN nechta; ostida nechtasi mijozga va'da
          qilingani. Alohida ustun qilinmadi: telefonda qator panjaraga
          aylanadi va yettinchi ustunga joy yo'q. -->
    <td class="c-qty num">${u.qty}${u.booked_qty ? `<div class="${
      u.new_bron ? 'new-bron' : 'muted'}"
      style="font-size:11.5px">${u.booked_qty} buyurtmada</div>` : ''}</td>
    <td class="c-due">${due(u)}${mine ? '' :
      `<div class="muted" style="font-size:12px">${esc(u.shop)} · ${esc(u.section)}</div>`}</td>
    <td class="c-act">${act}${xom}</td></tr>${openBron.has(u.id) ? bronRow(u) : ''}`;
}

//  ── KONVERNI KIM KUTMOQDA ─────────────────────────────────────────────
//
//  Alohida oyna emas, qatorning OSTIDA: boshliq ro'yxatdan chiqmasdan
//  ko'radi va joyiga qaytadi. Ma'lumot `/:id/bron` dan — jurnalda ham
//  shu yo'l ishlatiladi, ikkinchi so'rov yozilmadi.
//
//  Narx yo'q: ishlab chiqarish ekranida pul turmaydi.
function toggleBron(id, ev) {
  if (ev && ev.target.closest('button, input, a')) return;
  if (openBron.has(id)) { openBron.delete(id); return drawBoard(); }
  openBron.set(id, undefined);
  drawBoard();
  App.api('/api/units/' + id + '/bron')
    .then(d => { if (openBron.has(id)) { openBron.set(id, d); drawBoard(); } })
    .catch(() => { openBron.delete(id); drawBoard(); });
}

function bronRow(u) {
  const d = openBron.get(u.id);
  const inner = d === undefined
    ? '<span class="muted">Yuklanmoqda…</span>'
    : !d.rows.length
      ? `<span class="muted">Buyurtma yo'q — ${u.qty} tasi ham bo'sh</span>`
      : `<div class="muted" style="font-size:12px;margin-bottom:8px">${
           d.reserved} tasi buyurtmada${d.free ? `, ${d.free} tasi bo'sh` : ''}</div>
         ${d.rows.map(x => `
           <div style="display:flex;justify-content:space-between;gap:12px;
                padding:6px 0;flex-wrap:wrap">
             <div><strong>${esc(x.customer_name)}</strong>${x.region
               ? ` <span class="muted" style="font-size:12px">${esc(x.region)}</span>` : ''}
               <span class="muted" style="font-size:12px"> · ${esc(x.order_no)}</span></div>
             <div style="white-space:nowrap"><b>${x.qty}</b> ta
               <span class="muted" style="font-size:12px;margin-left:8px">${
                 x.due_on ? d8(x.due_on) : 'muddatsiz'}</span></div>
           </div>`).join('')}`;
  return `<tr class="bron"><td colspan="7"
    style="background:var(--bg);padding:10px 14px">${inner}</td></tr>`;
}

const HEAD = `<thead><tr>
    <th class="c-sel"></th>
    <th class="c-no">Konveyer &#8470;</th><th class="c-name">Nomi</th>
    <th class="c-type">Turi</th><th class="c-qty num">Soni</th>
    <th class="c-due">Topshirishga qolgan</th><th class="c-act"></th>
  </tr></thead>`;

// Bo'sh bo'lim ham ko'rsatiladi: usta o'z tsexining hamma bo'limini bir
// ro'yxatda ko'rib tursin, va bo'shligi ham ma'lumot — u yerda ish yo'q.
// Yashirilsa ro'yxat har kuni boshqacha bo'lib, o'rganish qiyinlashadi.
function block(title, units, mine, note, hideEmpty, isExit) {
  if (!units.length && hideEmpty) return '';
  const leaves = (u) => (u.next_shop_id && u.next_shop_id !== shopId) || (mine && isExit);
  const ids = units.filter(u => u.on_route && !(mine && leaves(u) && u.sent) &&
      (u.next_section_id || (mine && leaves(u))))
    .map(u => u.id);
  const sel = ids.filter(id => picked.has(id)).length;
  return `<div class="card" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;margin-bottom:10px;
      flex-wrap:wrap;gap:8px">
      <div class="row" style="gap:10px">
        <h2 style="margin:0">${esc(title)}</h2>
        <span class="muted" style="font-size:13px">${units.length} ta${
          note ? ' · ' + esc(note) : ''}</span>${(() => {
          //  Bo'limda nechta yangi buyurtma borligi SARLAVHADA: telefonda
          //  bir bo'limga o'nlab qator tushadi va ularni birma-bir
          //  ko'zdan kechirish kerak bo'lardi. Boshliq ekranni ochishi
          //  bilan qaysi bo'limda yangilik borligini ko'radi.
          const n = units.filter(u => u.new_bron).length;
          return n ? `<span class="tag yangi">${n} ta yangi buyurtma</span>` : '';
        })()}
      </div>
      ${canMove && ids.length > 1 ? `<button ${sel ? 'class="primary"' : ''}
        onclick="bulk([${ids}])">${sel ? `${sel} tasini o'tkazish` : 'Hammasini tanlash'}</button>` : ''}
    </div>
    ${units.length
      ? `<table class="board">${HEAD}<tbody>${
          units.map(u => row(u, mine, isExit)).join('')}</tbody></table>`
      : `<p class="muted" style="font-size:13px">Bo'sh — bu bo'limda mahsulot yo'q</p>`}
  </div>`;
}

function drawBoard() {
  if (!data.shop) {
    $('body').innerHTML = `<div class="card"><h2>Tsex biriktirilmagan</h2>
      <p class="muted" style="margin-top:8px">Sizning rolingizga tsex biriktirilmagan.
      Administrator Xodimlar bo'limidan biriktirib beradi.</p></div>`;
    return;
  }
  const head = data.shops.length > 1
    ? `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:16px">${
        data.shops.map(s => `<button ${s.id === shopId ? 'class="primary"' : ''}
          onclick="goShop(${s.id})">${esc(s.name)}</button>`).join('')}</div>`
    : `<h2 style="margin-bottom:12px">${esc(data.shop.name)}</h2>`;

  $('body').innerHTML = head
    // Kiritilgan, lekin hali konveyerga chiqmagan konverlar. Hech bir
    // bo'limda turmagani uchun ustunlarga tushmaydi — ekranning
    // tepasida turadi, aks holda boshliq uni umuman topa olmaydi.
    + block('Boshlanmagan', data.unstarted || [], true,
        'konveyerga chiqarish', true, false)
    + block('Qabul qilish', data.inbox, false,
        'oldingi tsex topshirishga tayyorladi', true, false)
    + data.sections.map(sc => block(sc.name, sc.units, true,
        sc.is_exit ? 'T/M omborga chiqish' : '', false, sc.is_exit)).join('');
}

function pick(id, on) { on ? picked.add(id) : picked.delete(id); drawBoard(); }
function goShop(id) { shopId = id; picked.clear(); openBron.clear(); loadBoard(); }

// Bitta ro'yxatda ikki xil amal bo'lishi mumkin: o'z tsexidan chiqmaydigan
// konver O'TKAZILADI, chiqadigani esa JO'NATILADI. Tanlangan qatorlar shu
// ikkiga ajratilib, har biri o'z yo'liga yuboriladi.
function kindOf(id) {
  // Boshlanmagan konver har doim O'TKAZILADI: u marshrutning birinchi
  // bo'limiga chiqadi, ya'ni hech qayerga topshirilmaydi.
  if ((data.unstarted || []).some(u => u.id === id)) return 'move';
  for (const sc of data.sections)
    for (const u of sc.units)
      if (u.id === id)
        return ((u.next_shop_id && u.next_shop_id !== shopId) || sc.is_exit) ? 'send' : 'move';
  return 'move';                       // qabul qilish ro'yxatidagilar
}

//  ★ QABUL QILGAN TSEX O'ZIDAN KEYINGISIGA MUDDAT QO'YADI.
//
//  Boshqa tsexdan kelgan konverni olayotgan boshliq o'sha zahoti «men
//  buni qachon topshiraman» degan savolga javob beradi: lak tsexi
//  qadoqlashga, qadoqlash esa T/M omborga. Aks holda sana faqat
//  birinchi tsexda qo'yilardi va zanjirning o'rtasi ko'rinmasdi.
//
//  Sanasi marshrutdan o'zi chiqadigan tsexda (stul) so'ralmaydi —
//  belgi tsexda (`shops.plan_auto`, izoh: sql/register.sql).
const qabulmi = (id) => (data.inbox || []).some(u => u.id === id);

async function apply(ids, qty, planOn) {
  const send = ids.filter(id => kindOf(id) === 'send');
  const move = ids.filter(id => kindOf(id) !== 'send');

  const qabul = move.filter(qabulmi);
  if (qabul.length && planOn === undefined && data.shop && !data.shop.plan_auto)
    return askAccept(ids, qty);

  try {
    if (move.length)
      await App.api('/api/units/move', {
        method: 'POST', body: JSON.stringify({
          items: move.map(id => ({
            unit_id: id,
            ...(qty == null ? {} : { qty }),
            //  Sana faqat QABUL qilinayotganlarga: o'z tsexi ichidagi
            //  harakatga reja qo'yilmaydi.
            ...(planOn && qabulmi(id) ? { plan_on: planOn } : {}),
          })) }) });
    if (send.length)
      await App.api('/api/units/handover', {
        method: 'POST', body: JSON.stringify({
          items: send.map(id => ({
            unit_id: id, ...(qty == null ? {} : { qty }) })) }) });
    toast(ids.length === 1
      ? (send.length ? "Jo'natildi" : "O'tkazildi")
      : `${ids.length} ta konver yuborildi`);
    picked.clear();
    await loadBoard();
  } catch (e) { toast(e.message, true); }
}

const move  = id => askQty(id);
//  ★ JO'NATISHDA HAM SON SO'RALADI (zavod qarori, 2026-09): tsex o'n
//  talikning to'rttasini tayyorlab, qolganini ertaga beradi —
//  qadoqlash T/M omborga topshirganda ham shunday. Ilgari jo'natish
//  HAMMASINI belgilardi va qabul qiluvchi ro'yxatda o'n ta ko'rib,
//  qo'lida to'rttasini sanardi. Oyna o'sha — savol boshqa.
const send1 = id => askQty(id);

//  Qabul qilishdan oldingi bitta savol: keyingi tsexga qachon
//  topshiriladi. Qaysi ustunga yozilishini SERVER hal qiladi — ekranda
//  boshliqqa ustun nomi emas, savolning javobi kerak.
function askAccept(ids, qty) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="accBox" onclick="if(event.target===this)closeAcc()">
      <div class="modal" style="max-width:360px">
        <h2 style="margin-bottom:4px">Qabul qilish</h2>
        <p class="muted" style="font-size:13px;margin-bottom:16px">
          ${ids.length > 1 ? ids.length + ' ta konver' : 'Konver'} sizning
          tsexingizga o'tadi. Keyingi tsexga qachon topshirasiz?</p>
        <label>Topshirish sanasi</label>
        <input id="accVal" type="date" style="font-size:18px">
        <button class="primary" style="width:100%;margin-top:16px"
          onclick="okAcc([${ids}], ${qty == null ? 'null' : qty})">Qabul qildim</button>
        <button style="width:100%;margin-top:8px" onclick="closeAcc()">Bekor qilish</button>
      </div>
    </div>`);
  setTimeout(() => $('accVal')?.focus(), 50);
}

const closeAcc = () => $('accBox')?.remove();

function okAcc(ids, qty) {
  const v = $('accVal').value;
  if (!v) return toast('Sana tanlanmadi', true);
  closeAcc();
  apply(ids, qty, v);
}

// ─────────────────────────────────────────── NECHTASI O'TADI
//
//  Konver — 10 ta stul emas, 10 ta stulning BIR PARTIYASI. Zavod uni
//  butunligicha ko'chirmaydi: uchtasi zborkaga o'tadi, yettitasi shkurkada
//  qoladi. Shuning uchun bitta konverni o'tkazayotganda soni so'raladi.
//
//  Bittalik konverda so'ralmaydi: tanlov yo'q joyda savol berish —
//  ustaning kuniga o'nlab marta bosadigan tugmasini sekinlashtirish.
//
//  Ko'p tanlab bir yo'la o'tkazishda ham so'ralmaydi: u yerda har konver
//  uchun alohida son kerak bo'lardi, ya'ni ro'yxatning o'zi. Guruh bilan
//  o'tkazish — "hammasi o'tdi" degani.
function unitById(id) {
  for (const u of (data.unstarted || [])) if (u.id === id) return u;
  for (const u of data.inbox) if (u.id === id) return u;
  for (const sc of data.sections) for (const u of sc.units) if (u.id === id) return u;
  return null;
}

//  Oynaning sarlavhasida QAYERGA ketayotgani turadi: jo'natishda bu
//  keyingi TSEX yoki T/M ombor, o'tkazishda esa keyingi BO'LIM.
function qayerga(u) {
  if (kindOf(u.id) !== 'send') return u.next_section || 'keyingi bosqich';
  return u.next_shop_id && u.next_shop_id !== shopId
    ? (u.next_shop_name || 'keyingi tsex') : 'T/M ombor';
}

function askQty(id) {
  const u = unitById(id);
  if (!u || u.qty <= 1) return apply([id]);
  const max = u.qty;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="qtyBox" onclick="if(event.target===this)closeQty()">
      <div class="modal" style="max-width:360px">
        <h2 style="margin-bottom:4px">${esc(u.conveyor_no)}</h2>
        <p class="muted" style="font-size:13px;margin-bottom:16px">${esc(u.product)} ·
          ${rangMato(u)} ·
          bu yerda <b>${max} ta</b> → ${esc(qayerga(u))}</p>
        <label>Nechtasi ${kindOf(id) === 'send' ? "jo'natiladi" : "o'tadi"}?</label>
        <div class="row" style="gap:8px;margin-bottom:14px">
          <button onclick="stepQty(-1)" style="width:52px;font-size:20px">−</button>
          <input id="qtyVal" type="number" inputmode="numeric" min="1" max="${max}"
                 value="${max}" style="text-align:center;font-size:22px;flex:1">
          <button onclick="stepQty(1)" style="width:52px;font-size:20px">+</button>
        </div>
        <div class="row" style="gap:8px;margin-bottom:16px">
          <button onclick="setQty(1)" style="flex:1">1 ta</button>
          ${max > 3 ? `<button onclick="setQty(${Math.floor(max / 2)})"
            style="flex:1">${Math.floor(max / 2)} ta</button>` : ''}
          <button onclick="setQty(${max})" style="flex:1">Hammasi</button>
        </div>
        <button class="primary" style="width:100%" onclick="okQty(${id},${max})">${
          kindOf(id) === 'send' ? "Jo'natish" : "O'tkazish"}</button>
        <button style="width:100%;margin-top:8px" onclick="closeQty()">Bekor qilish</button>
      </div>
    </div>`);
  setTimeout(() => $('qtyVal')?.select(), 50);
}

const closeQty = () => $('qtyBox')?.remove();
function setQty(n) { $('qtyVal').value = n; }
function stepQty(d) {
  const el = $('qtyVal');
  const n = Math.min(Number(el.max), Math.max(1, (Number(el.value) || 1) + d));
  el.value = n;
}
function okQty(id, max) {
  const n = Number($('qtyVal').value);
  if (!Number.isInteger(n) || n < 1 || n > max)
    return toast(`1 dan ${max} gacha son kiriting`, true);
  closeQty();
  // Hammasi bo'lsa son yuborilmaydi — eskicha, butun konver o'tadi
  apply([id], n === max ? null : n);
}

// ═══════════════════════════════════ KONVERGA XOM ASHYO BIRIKTIRISH
//
//  Boshliqning savoli bitta: «shu konverga qaysi materialdan qancha
//  ketdi». Oyna shuning uchun UCH bo'lakdan iborat — qayerdan
//  (ombor), nima biriktirilgan (bekor qilish bilan) va nima
//  qo'shiladi.
//
//  ★ OCHILMA EMAS, QIDIRUV. Zavodda to'qqiz yuz material bor va
//  telefondagi ochilmada ularni aylantirib topib bo'lmaydi. Qidiruv
//  ikki ro'yxat ustida ishlaydi va tartib JAVOBNI oldinga chiqaradi:
//  avval SHU OMBORDA turgani (qoldig'i bilan), keyin spravochnikning
//  qolgani. Omborda turgani odatda o'ntacha bo'ladi — boshliq
//  ko'pincha birinchi ro'yxatdan topadi va hech narsa yozmaydi ham.
let xomUnit = null, xomWh = null, xomStock = [], xomAll = [], xomQator = [];

async function xomOch(id, ev) {
  if (ev) ev.stopPropagation();
  const u = unitById(id);
  if (!u) return;
  xomUnit = id; xomQator = [];
  document.body.insertAdjacentHTML('beforeend', `
    <div class="overlay" id="xomBox" onclick="if(event.target===this)xomYop()">
      <div class="modal" style="max-width:520px">
        <h2 style="margin-bottom:4px">${esc(u.conveyor_no)}</h2>
        <p class="muted" style="font-size:13px;margin-bottom:14px">${esc(u.product)}
          · ${u.qty} dona · ${esc(u.section || '')}</p>
        <div id="xomBody" class="muted">Yuklanmoqda…</div>
        <button style="width:100%;margin-top:14px" onclick="xomYop()">Yopish</button>
      </div>
    </div>`);
  try {
    const d = await App.api('/api/materials/unit/' + id);
    if (!$('xomBox')) return;
    xomWh = d.warehouses[0] ? d.warehouses[0].id : null;
    //  Spravochnik bir marta o'qiladi va oyna qayta ochilganda
    //  ikkinchi marta so'ralmaydi: ro'yxat kun davomida o'zgarmaydi.
    if (!xomAll.length) xomAll = (await App.api('/api/materials')).rows;
    await xomQoldiq();
    xomChiz(d);
  } catch (e) {
    if ($('xomBody')) $('xomBody').innerHTML =
      `<span class="tag bad">${esc(e.message)}</span>`;
  }
}

const xomYop = () => { $('xomBox')?.remove(); };

//  Qoldiq OMBOR bo'yicha: ombor almashsa raqamlar ham almashadi —
//  «Arra omborida 40 list» degan javob lak omborida boshqa.
async function xomQoldiq() {
  xomStock = xomWh
    ? (await App.api('/api/materials/stock?warehouse_id=' + xomWh)).rows : [];
}

function xomChiz(d) {
  if (!$('xomBody')) return;
  const w = d.warehouses;
  //  Ombor ro'yxati SERVER tartibida: eng to'g'risi — konver turgan
  //  bo'limning ombori — birinchi turadi (izoh: modules/materials.js).
  //  Bitta bo'lsa ochilma chizilmaydi: tanlov yo'q joyda tanlov
  //  ko'rsatilmaydi.
  const joy = (x) => [x.section, x.shop].filter(Boolean).join(' · ');
  $('xomBody').innerHTML = `
    ${w.length === 0
      ? `<p class="tag bad">Sizga biriktirilgan xom ashyo ombori yo'q</p>`
      : w.length === 1
        ? `<p class="muted" style="font-size:13px">Ombor: <b>${esc(w[0].name)}</b>${
            joy(w[0]) ? ' · ' + esc(joy(w[0])) : ''}</p>`
        : `<label>Ombor</label>
           <select id="xomWh" onchange="xomWhChange()">${w.map((x) =>
             `<option value="${x.id}"${x.id === xomWh ? ' selected' : ''}>${
               esc(x.name)}${joy(x) ? ' · ' + esc(joy(x)) : ''}</option>`).join('')}</select>`}

    ${d.rows.length ? `
      <div style="margin-top:14px;font-size:12px;letter-spacing:.04em;
        text-transform:uppercase;color:var(--muted)">Biriktirilgan</div>
      <div style="margin-top:6px">${d.rows.map((r) => `
        <div class="row" style="justify-content:space-between;gap:10px;
          padding:7px 0;border-bottom:1px solid var(--line)${
          r.status === 'ok' ? '' : ';opacity:.45;text-decoration:line-through'}">
          <div><b>${esc(r.material)}</b>
            <div class="muted" style="font-size:11.5px">${esc(r.warehouse || '')}${
              r.worker ? ' · ' + esc(r.worker) : ''}</div></div>
          <div class="row" style="gap:8px;align-items:center">
            <span>${son(r.qty)} <span class="muted">${esc(r.uom)}</span></span>
            ${r.status === 'ok'
              ? `<button class="ic" title="Bekor qilish"
                   onclick="xomBekor(${r.id})">&times;</button>` : ''}
          </div></div>`).join('')}</div>` : ''}

    <div style="margin-top:16px">
      <label>Material qo'shish</label>
      <input id="xomQ" placeholder="nomi bo'yicha qidiring"
        oninput="xomTop()" autocomplete="off">
      <div id="xomList" style="margin-top:6px"></div>
    </div>
    <div id="xomRows" style="margin-top:10px"></div>
    <button class="primary" id="xomSave" style="width:100%;margin-top:12px"
      onclick="xomSaqla()" hidden>Saqlash</button>`;
  xomTop(); xomRowsChiz();
}

async function xomWhChange() {
  xomWh = Number($('xomWh').value) || null;
  await xomQoldiq();
  xomTop();
}

const son = (v) => {
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : String(n).replace(/\.?0+$/, '');
};

//  Qidiruv: avval omborda turgani (qoldig'i bilan), keyin
//  spravochnikning qolgani. Ro'yxat o'ttizta bilan cheklanadi —
//  telefonda undan uzuni baribir o'qilmaydi va qidiruvni
//  aniqlashtirish kerak.
function xomTop() {
  const q = ($('xomQ')?.value || '').trim().toLowerCase();
  const bor = new Map(xomStock.map((r) => [r.material_id, r]));
  const mos = (nom) => !q || String(nom).toLowerCase().includes(q);
  const tanlangan = new Set(xomQator.map((r) => r.id));

  const birinchi = xomStock.filter((r) => mos(r.material) && !tanlangan.has(r.material_id))
    .map((r) => ({ id: r.material_id, name: r.material, uom: r.uom_name || r.uom,
                   qoldiq: r.qty }));
  const qolgan = xomAll.filter((m) => mos(m.name) && !bor.has(m.id) && !tanlangan.has(m.id))
    .map((m) => ({ id: m.id, name: m.name, uom: m.uom_name || m.uom, qoldiq: null }));

  //  Qidiruv yozilmaguncha butun spravochnik chiqarilmaydi: omborda
  //  turgani odatda o'ntacha va javob ko'pincha o'sha yerda.
  const royxat = q ? [...birinchi, ...qolgan].slice(0, 30) : birinchi.slice(0, 30);
  if (!$('xomList')) return;
  $('xomList').innerHTML = royxat.length
    ? royxat.map((m) => `
        <button style="width:100%;text-align:left;margin-bottom:4px;
          display:flex;justify-content:space-between;gap:10px"
          onclick="xomQosh(${m.id})">
          <span>${esc(m.name)}</span>
          <span class="${Number(m.qoldiq) < 0 ? 'tag bad' : 'muted'}"
            style="font-size:12px">${
            m.qoldiq == null ? esc(m.uom)
              : `${son(m.qoldiq)} ${esc(m.uom)}`}</span></button>`).join('')
    : `<p class="muted" style="font-size:13px">${q
        ? 'Topilmadi' : 'Bu omborda material yo\'q — nomini yozib qidiring'}</p>`;
}

function xomQosh(id) {
  const st = xomStock.find((r) => r.material_id === id);
  const m = st || xomAll.find((x) => x.id === id);
  if (!m) return;
  xomQator.push({ id, name: st ? st.material : m.name,
                  uom: m.uom_name || m.uom, qty: '' });
  $('xomQ').value = '';
  xomTop(); xomRowsChiz();
}

function xomRowsChiz() {
  if (!$('xomRows')) return;
  $('xomRows').innerHTML = xomQator.map((r, i) => `
    <div class="row" style="gap:8px;align-items:center;margin-bottom:6px">
      <div style="flex:1"><b>${esc(r.name)}</b>
        <span class="muted" style="font-size:12px"> ${esc(r.uom)}</span></div>
      <input type="number" min="0" step="0.001" value="${r.qty}"
        style="width:110px;text-align:right;font-size:17px"
        oninput="xomQty(${i}, this.value)" placeholder="soni">
      <button class="ic" onclick="xomOchir(${i})">&times;</button>
    </div>`).join('');
  $('xomSave').hidden = !xomQator.length;
}

const xomQty = (i, v) => { xomQator[i].qty = v; };
const xomOchir = (i) => { xomQator.splice(i, 1); xomTop(); xomRowsChiz(); };

async function xomSaqla() {
  const items = xomQator
    .map((r) => ({ material_id: r.id, qty: Number(r.qty) || 0 }))
    .filter((x) => x.qty > 0);
  if (!items.length) return toast('Soni yozilmadi', true);
  try {
    const r = await App.api('/api/materials/unit/' + xomUnit + '/consume', {
      method: 'POST', body: JSON.stringify({ warehouse_id: xomWh, items }) });
    toast(`${r.saved} ta material biriktirildi`);
    const id = xomUnit;
    xomYop();
    xomOch(id);
  } catch (e) { toast(e.message, true); }
}

async function xomBekor(id) {
  try {
    await App.api('/api/materials/consume/' + id + '/cancel', { method: 'POST' });
    toast('Bekor qilindi');
    const u = xomUnit;
    xomYop();
    xomOch(u);
  } catch (e) { toast(e.message, true); }
}

async function unsend(id) {
  try {
    await App.api('/api/units/handover', {
      method: 'POST', body: JSON.stringify({ items: [id], undo: true }) });
    toast('Jo\'natish qaytarib olindi');
    await loadBoard();
  } catch (e) { toast(e.message, true); }
}

function bulk(ids) {
  const sel = ids.filter(id => picked.has(id));
  if (!sel.length) { ids.forEach(id => picked.add(id)); return drawBoard(); }
  apply(sel);
}

async function loadBoard() {
  data = await App.api('/api/units/board' + (shopId ? '?shop_id=' + shopId : ''));
  if (data.shop) shopId = data.shop.id;
  drawBoard();
}

// ═══════════════════════════════════════════ 2. BUGUNGI HARAKATLAR
//
// Kun xronologik lenta bo'lib turadi va anomaliya ko'zga tashlanadi: kim
// umuman kiritmagan, kim o'ttizta konverni bir daqiqada "o'tkazgan", kim
// ko'p qaytargan. Bo'lim boshlig'iga faqat o'z tsexi ko'rinadi.
let feed = null, timer = null;
const deb = () => { clearTimeout(timer); timer = setTimeout(loadFeed, 350); };

function feedParams() {
  const p = new URLSearchParams();
  for (const [k, id] of [['from','fFrom'], ['to','fTo'],
                         ['shop_id','fShop'], ['worker_id','fWorker']]) {
    const v = $(id)?.value;
    if (v) p.set(k, v);
  }
  const c = $('fConv')?.value.trim();
  if (c) p.set('conveyor_no', c);
  return p.toString();
}

const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
const MO = ['yanvar','fevral','mart','aprel','may','iyun',
            'iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function dayTitle(iso) {
  const d = new Date(iso);
  if (isoDay(d) === isoDay(new Date())) return 'Bugun, ' + d.getDate() + '-' + MO[d.getMonth()];
  return `${d.getDate()}-${MO[d.getMonth()]}, ${WD[d.getDay()]}`;
}

// Bitta qatorning ma'nosi: o'tkazishmi, qabul qilishmi yoki yangi yozuvmi.
// Uchalasi bitta jadvalda saqlangani uchun farqni shu yerda ajratamiz.
function what(m) {
  if (m.kind === 'handover')
    return `<span class="tag warn">keyingi tsexga jo'natdi</span>
            <span class="muted" style="font-size:12px">${esc(m.section)}dan</span>`;
  if (!m.from_section)
    return `<span class="tag">${m.is_opening ? "boshlang'ich qoldiq" : 'yangi konver'}</span>
            <span class="arw">→</span> ${esc(m.section)}`;
  const crossed = m.from_shop_id && m.from_shop_id !== m.shop_id;
  return `${esc(m.from_section)} <span class="arw">→</span> ${esc(m.section)}` +
    (crossed ? ` <span class="tag ok">qabul qildi · ${esc(m.from_shop)}dan</span>` : '');
}

function drawFeed() {
  const d = feed;
  const days = [...new Set(d.moves.map(m => String(m.moved_on).slice(0, 10)))];
  const people = new Set(d.moves.map(m => m.worker));
  const defects = d.moves.reduce((n, m) => n + (m.qty_defect || 0), 0);
  const today = isoDay(new Date());

  $('body').innerHTML = `
    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div><label>Sanadan</label>
          <input id="fFrom" type="date" value="${d.from || today}" onchange="loadFeed()"></div>
        <div><label>Sanagacha</label>
          <input id="fTo" type="date" value="${d.to || today}" onchange="loadFeed()"></div>
        <div style="flex:1;min-width:150px"><label>Tsex</label>
          <select id="fShop" onchange="loadFeed()">
            <option value="">Hammasi</option>
            ${d.shops.map(s => `<option value="${s.id}"
              ${String(d.shop_id) === String(s.id) ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
          </select></div>
        <div style="flex:1;min-width:150px"><label>Xodim</label>
          <select id="fWorker" onchange="loadFeed()">
            <option value="">Hammasi</option>
            ${d.workers.map(w => `<option value="${w.id}"
              ${String(d.worker_id) === String(w.id) ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}
          </select></div>
        <div style="flex:1;min-width:140px"><label>Konveyer &#8470;</label>
          <input id="fConv" placeholder="K26-0041" value="${esc(d.conveyor_no || '')}"
                 oninput="deb()"></div>
        <button onclick="feedToday()">Bugun</button>
        <button onclick="exportFeed()">Excelga yuklash</button>
      </div>
    </div>

    <div class="grid g3" style="margin-top:16px">
      <div class="card"><h2>Harakatlar</h2><div class="kpi">${d.moves.length}</div></div>
      <div class="card"><h2>Kiritgan xodimlar</h2><div class="kpi">${people.size}</div></div>
      <div class="card"><h2>Brak</h2><div class="kpi">${defects}<small> dona</small></div></div>
    </div>

    ${!d.moves.length ? `<div class="card" style="margin-top:16px"><h2>Yozuv yo'q</h2>
      <p class="muted" style="margin-top:8px">Tanlangan kunda hech kim ma'lumot
      kiritmagan.</p></div>` : days.map(day => {
      const rows = d.moves.filter(m => String(m.moved_on).slice(0, 10) === day);
      return `<div class="card" style="margin-top:16px">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0">${esc(dayTitle(day))}</h2>
          <span class="muted" style="font-size:13px">${rows.length} ta yozuv</span>
        </div>
        <table class="feed"><tbody>${rows.map(m => `
          <tr>
            <td>${hhmm(m.moved_at)}</td>
            <td class="who">${esc(m.worker)}<div class="muted"
                style="font-size:12px;font-weight:400">${esc(m.shop)}</div></td>
            <td><b>${esc(m.conveyor_no)}</b>
                <div class="muted" style="font-size:12px">${esc(m.product)}${
                  m.qty > 1 ? ' · ' + m.qty + ' dona' : ''}</div></td>
            <td>${what(m)}${m.qty_defect
                ? ` <span class="tag bad">brak ${m.qty_defect}${
                    m.defect_reason ? ' · ' + esc(m.defect_reason) : ''}</span>` : ''}</td>
          </tr>`).join('')}</tbody></table>
      </div>`;
    }).join('')}`;
}

function feedToday() {
  const t = isoDay(new Date());
  $('fFrom').value = $('fTo').value = t;
  loadFeed();
}

async function loadFeed() {
  const q = feedParams();
  const focus = document.activeElement?.id;
  const caret = focus === 'fConv' ? $('fConv').selectionStart : null;
  feed = await App.api('/api/units/feed' + (q ? '?' + q : ''));
  // Filtr qiymatlari qayta chizilganda yo'qolmasin
  const p = new URLSearchParams(q);
  Object.assign(feed, {
    from: p.get('from'), to: p.get('to'), shop_id: p.get('shop_id'),
    worker_id: p.get('worker_id'), conveyor_no: p.get('conveyor_no'),
  });
  drawFeed();
  if (focus && $(focus)) {
    $(focus).focus();
    if (caret != null) $(focus).setSelectionRange(caret, caret);
  }
}

const exportFeed = () => {
  const q = feedParams();
  App.download('/api/units/feed/export' + (q ? '?' + q : ''),
               `harakatlar-${$('fFrom').value || isoDay(new Date())}.csv`);
};

//  Sahifa ikki xil odam uchun ochiq:
//    · tsex boshlig'i (`production.entry`) — konverni o'zi o'tkazadi;
//    · rahbariyat (`production.reports`) — faqat qaraydi.
//
//  `canMove` ikkinchisiga false bo'ladi, ya'ni o'tkazish, jo'natish va
//  qaytarish tugmalari umuman chizilmaydi. Tekshiruv serverda ham bor:
//  tugmani yashirish himoya emas.
//
//  `production.view` YETMAYDI — u savdoda ham bor, zavod bo'limlaridagi
//  yuklama esa uning ishi emas (CLAUDE.md, «Kim nima ko'radi»).
App.start(async () => {
  canMove = App.can('production.entry');
  //  Korpusda muddatni BOSHLIQ qo'yadi (izoh: sql/register.sql) —
  //  shuning uchun sana katagi bosiladigan bo'ladi.
  canPlan = App.can('production.plan', 'production.units', 'production.manage');
  //  Sarfni yozish huquqi — `materials.request` («talabnoma yozish va
  //  sarfni yozish»). Tsex boshlig'ida u allaqachon bor; huquqi
  //  yo'q xodimda tugma umuman chizilmaydi.
  canXom = App.can('materials.request', 'materials.manage', 'production.manage');
  drawTabs();
  await loadBoard();
}, 'production.entry', 'production.reports');
</script>
