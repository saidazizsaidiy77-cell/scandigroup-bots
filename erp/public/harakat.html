<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bo'limlar aro harakat · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1 id="ttl">Bo'limlar aro harakat</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div class="row" id="shopBar" style="margin-bottom:16px;gap:8px;flex-wrap:wrap"></div>

<div id="body"></div>
<div id="modalRoot"></div>

<script>
// ============================================================================
//  BO'LIM BOSHLIG'INING KUNLIK EKRANI
//
//  Jurnal — 16 ustunli hisobot, uni telefonda o'qib bo'lmaydi. Bu esa ish
//  quroli: konverlar o'z bo'limlarida turadi, bitta bosishda keyingisiga
//  o'tadi. Keyingi bo'lim nomi tugmaning o'zida yozilgan — marshrutni
//  boshliq yodlab yurmaydi.
//
//  Tsexdan tsexga o'tkazishni QABUL QILUVCHI tomon bosadi (server qoidasi:
//  modules/units.js, moveOne). Shuning uchun bu yerda ikki ro'yxat:
//    · yuqorida — menga kelayotganlar, "Qabul qildim" tugmasi bilan;
//    · pastda   — mening bo'limlarimdagilar.
//  Tsexning oxirgi bo'limidagi birlikda tugma yo'q: u topshirishga tayyor,
//  uni keyingi tsex o'ziga oladi.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let data = null, shopId = null, canMove = false;
const picked = new Set();

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2600);
}

// Muddat. Reja — boshliq qo'ygan sana, taxmin — marshrut va bo'lim
// tezligidan hisoblangan. Ikkalasi ham yo'q bo'lsa bo'sh: o'ylab topilgan
// sana bo'sh katakdan yomonroq.
function due(u) {
  if (u.waiting) return `<span class="tag">zahira</span>`;
  if (u.days_left == null) return `<span class="muted">—</span>`;
  const d = u.days_left;
  const cls = d < 0 ? 'bad' : d <= 2 ? 'warn' : 'ok';
  const txt = d < 0 ? `${-d} kun kechikdi`
            : d === 0 ? 'Bugun oxirgi kun'
            : `${d} kun qoldi`;
  const src = u.next_shop_src === 'taxmin'
    ? ` <span class="muted" style="font-size:11px">taxmin</span>` : '';
  return `<span class="tag ${cls}">${txt}</span>${src}`;
}

function row(u, mine) {
  const leaves = u.next_shop_id && u.next_shop_id !== shopId;
  const act = !canMove ? ''
    : mine && leaves
      ? `<span class="muted" style="font-size:12px">${esc(u.next_shop_name)} qabul qiladi</span>`
      : !u.next_section_id
        ? `<span class="muted" style="font-size:12px">marshrut tugadi</span>`
        : `<button class="primary" onclick="move(${u.id})">${
            mine ? '→ ' : 'Qabul qildim → '}${esc(u.next_section)}</button>`;
  const sel = canMove && (!mine || !leaves) && u.next_section_id
    ? `<input type="checkbox" style="width:auto" data-pick="${u.id}"
         ${picked.has(u.id) ? 'checked' : ''} onchange="pick(${u.id},this.checked)">` : '';
  return `<tr>
    <td style="width:28px">${sel}</td>
    <td><b>${esc(u.conveyor_no)}</b>${u.order_no
        ? `<div class="muted" style="font-size:12px">${esc(u.order_no)}</div>` : ''}</td>
    <td>${esc(u.product)}${u.color
        ? `<div class="muted" style="font-size:12px">${esc(u.color)}</div>` : ''}</td>
    <td class="num">${u.qty}</td>
    <td class="muted" style="font-size:13px">${
        mine ? `${u.days_here ?? 0} kun turibdi` : esc(u.shop) + ' · ' + esc(u.section)}</td>
    <td>${due(u)}</td>
    <td style="text-align:right">${act}</td></tr>`;
}

function block(title, units, mine, note) {
  if (!units.length) return '';
  const ids = units.filter(u => u.next_section_id && !(mine && u.next_shop_id !== shopId))
                   .map(u => u.id);
  const sel = ids.filter(id => picked.has(id)).length;
  return `<div class="card" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="row" style="gap:10px">
        <h2 style="margin:0">${esc(title)}</h2>
        <span class="muted" style="font-size:13px">${units.length} ta${
          note ? ' · ' + esc(note) : ''}</span>
      </div>
      ${canMove && ids.length > 1 ? `<button ${sel ? 'class="primary"' : ''}
        onclick="bulk([${ids}])">${sel ? `${sel} tasini o'tkazish` : 'Hammasini tanlash'}</button>` : ''}
    </div>
    <table><tbody>${units.map(u => row(u, mine)).join('')}</tbody></table>
  </div>`;
}

function draw() {
  if (!data.shop) {
    $('body').innerHTML = `<div class="card"><h2>Tsex biriktirilmagan</h2>
      <p class="muted" style="margin-top:8px">Sizning rolingizga tsex biriktirilmagan.
      Administrator Xodimlar bo'limidan biriktirib beradi.</p></div>`;
    return;
  }
  $('ttl').textContent = data.shop.name;
  document.title = data.shop.name + " · Bo'limlar aro harakat";

  $('shopBar').innerHTML = data.shops.length > 1
    ? data.shops.map(s => `<button ${s.id === shopId ? 'class="primary"' : ''}
        onclick="go(${s.id})">${esc(s.name)}</button>`).join('') : '';

  const total = data.sections.reduce((n, s) => n + s.units.length, 0);
  $('body').innerHTML =
    block('Qabul qilish', data.inbox, false, 'oldingi tsex topshirishga tayyorladi')
    + data.sections.map(sc => block(sc.name, sc.units, true,
        sc.is_exit ? 'chiqish nuqtasi' : '')).join('')
    + (!total && !data.inbox.length
        ? `<div class="card"><h2>Bo'sh</h2><p class="muted" style="margin-top:8px">
           Bu tsexda hozir birlik yo'q.</p></div>` : '');
}

function pick(id, on) { on ? picked.add(id) : picked.delete(id); draw(); }
function go(id) { shopId = id; picked.clear(); load(); }

async function send(items) {
  try {
    await App.api('/api/units/move', {
      method: 'POST', body: JSON.stringify({ items: items.map(id => ({ unit_id: id })) }) });
    toast(items.length === 1 ? "O'tkazildi" : `${items.length} ta birlik o'tkazildi`);
    picked.clear();
    await load();
  } catch (e) { toast(e.message, true); }
}

const move = id => send([id]);

function bulk(ids) {
  const sel = ids.filter(id => picked.has(id));
  if (!sel.length) { ids.forEach(id => picked.add(id)); return draw(); }
  send(sel);
}

async function load() {
  data = await App.api('/api/units/board' + (shopId ? '?shop_id=' + shopId : ''));
  if (data.shop) shopId = data.shop.id;
  draw();
}

App.start(async (me) => {
  canMove = App.can('production.entry');
  await load();
}, 'production.view', 'production.entry');
</script>
</body>
</html>
