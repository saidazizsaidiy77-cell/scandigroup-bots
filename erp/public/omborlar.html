<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omborlar · ZELTA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230c0d0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23c9a227%27/%3E%3C/svg%3E">
<!-- Telefonga o'rnatiladigan ilova: bosh ekranda ZELTA belgisi, brauzer
     paneli ko'rinmaydi. Oddiy havola bo'lib ochilishi ham buzilmaydi. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f2ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZELTA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span><h1>Omborlar</h1></div>
  <div class="row" id="erpUser"></div>
</div>

<div id="body"></div>

<script>
// ============================================================================
//  OMBORLAR RO'YXATI
//
//  Zavodda bitta ombor yo'q — har birining o'z mudiri va o'z qoldig'i bor.
//  Shuning uchun ombor bo'limiga kirilganda avval SHU ro'yxat chiqadi,
//  ombor tanlangach uning ichi ochiladi.
//
//  Ro'yxat kodda emas, bazada (`warehouses`, sql/warehouse.sql): yangi
//  ombor qo'shish uchun shu sahifaga tegilmaydi.
//
//  Hali ishlamaydigan ombor ro'yxatdan yashirilmaydi, «rejada» bo'lib
//  turadi: mudir xom ashyo omborini qidirib sahifalarni kezmasin, u
//  qayerda bo'lishini va hali tayyor emasligini birdan ko'rsin.
// ============================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => v == null ? '' : Number(v).toLocaleString('ru-RU');

//  ★ TURI BO'YICHA GURUHLAR, SARLAVHASI BILAN (zavod qarori,
//  2026-09). Ro'yxat o'n to'rtta kartochkaga yetdi va aralash turardi:
//  T/M ombor, keyin xom ashyo, keyin vitrinalar, keyin tsexnikilar —
//  mudir o'z javonini har safar ko'z bilan terib olardi.
//
//  Guruh SERVERDAN keladi (`guruh`, `guruh_nom`): qoida ikki joyda
//  yozilsa ertaga qo'shilgan ombor bir ekranda bir guruhda, boshqa
//  ekranda boshqasida turardi.
//
//  ★ TARTIB QOTIB TURADI (zavod qarori): qoldig'i bor ombor tepaga
//  CHIQARILMAYDI. Mudir kechagi kartochkani o'sha joyidan topsin —
//  ombor to'lgani sayin joyi o'zgaradigan ro'yxatda har safar
//  qidirishga to'g'ri kelardi. Bo'sh ombor ham o'z o'rnida qoladi.
function draw(rows) {
  //  Guruhlar SERVER tartibida ochiladi, oldindan sanab qo'yilmaydi:
  //  yangi tur qo'shilsa u o'zi paydo bo'ladi va bu kod o'zgarmaydi.
  const gr = [];
  for (const w of rows) {
    let g = gr.find(x => x.kod === w.guruh);
    if (!g) gr.push(g = { kod: w.guruh, nom: w.guruh_nom, rows: [] });
    g.rows.push(w);
  }
  $('body').innerHTML = gr.map(g => `
    <div class="muted" style="font-size:12px;letter-spacing:.06em;
      text-transform:uppercase;margin:26px 0 10px">${esc(g.nom || '')}</div>
    ${kartochkalar(g.rows)}`).join('');
}

function kartochkalar(rows) {
  return `
    <div class="grid g3" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${rows.map(w => w.href ? `
      <a class="card" href="${w.href}" style="text-decoration:none;color:inherit;display:block">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <h2 style="margin:0">${esc(w.name)}</h2>
          <span class="tag ok">ochiq</span>
        </div>
        <div class="kpi" style="margin-top:10px">${w.units}<small> ${
          esc(w.unit || 'konver')}</small></div>
        <!--  Xom ashyo omborida «dona» YO'Q: bittasi kg, bittasi list,
              bittasi rulon va ularni qo'shib bo'lmaydi (tayyor
              mahsulotdagi dona/komplekt bilan bir xil sabab). Qiymati
              esa bor — o'rtacha kirim narxidan. -->
        <div class="muted" style="font-size:13px;margin-top:2px">
          ${[w.qty == null ? '' : `${w.qty} dona`,
             w.amount ? `$${money(w.amount)}` : ''].filter(Boolean).join(' \u00b7 ')
            || '\u2014'}</div>
        ${w.note ? `<p class="muted" style="font-size:13px;margin-top:10px">${esc(w.note)}</p>` : ''}
      </a>` : `
      <div class="card" style="opacity:.62">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <h2 style="margin:0">${esc(w.name)}</h2>
          <span class="tag">rejada</span>
        </div>
        <div class="kpi" style="margin-top:10px">\u2014</div>
        ${w.note ? `<p class="muted" style="font-size:13px;margin-top:10px">${esc(w.note)}</p>` : ''}
      </div>`).join('')}
    </div>`;
}

App.start(async () => {
  const d = await App.api('/api/warehouse/list');
  // Bitta omborga kirish huquqi bo'lsa, ro'yxat ortiqcha bosish bo'ladi:
  // ombor mudiri har kuni bitta va o'sha sahifani ochadi. Ikkinchi ombor
  // ochilgan kuni ro'yxat o'zi qaytadi.
  if (d.rows.length === 1 && d.rows[0].href) {
    location.replace(d.rows[0].href);
    return;
  }
  draw(d.rows);
}, 'warehouse.view', 'production.view');
</script>
</body>
</html>
